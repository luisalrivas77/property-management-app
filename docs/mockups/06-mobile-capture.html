<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Mobile capture</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap"><style>
body{margin:0}
a{color:#1F6F54}a:hover{color:#14523E}
</style></head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #17201C; font-family: Manrope, system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; font-variant-numeric: tabular-nums">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 16px">
<button aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #2C3631; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</button>
<span style="font-weight: 700; font-size: 15px">Scan a document</span>
<button aria-label="Flash" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #2C3631; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M13 3 5 14h6l-1 7 8-11h-6z"></path></svg>
</button>
</div>

<div style="flex: 1; margin: 0 20px; border-radius: 16px; background: #2C3631; position: relative; display: flex; align-items: center; justify-content: center">
<div style="width: 250px; height: 330px; background: #F4F5F2; border-radius: 4px; transform: rotate(-3deg); box-sizing: border-box; padding: 22px 20px; display: flex; flex-direction: column; gap: 9px">
<span style="width: 110px; height: 10px; background: #9AA39E; border-radius: 2px"></span>
<span style="width: 70px; height: 6px; background: #C9CEC6; border-radius: 2px"></span>
<span style="width: 90px; height: 14px; background: #5A635E; border-radius: 2px; margin-top: 14px"></span>
<span style="width: 200px; height: 6px; background: #C9CEC6; border-radius: 2px; margin-top: 10px"></span>
<span style="width: 180px; height: 6px; background: #C9CEC6; border-radius: 2px"></span>
<span style="width: 190px; height: 6px; background: #C9CEC6; border-radius: 2px"></span>
<span style="width: 120px; height: 6px; background: #C9CEC6; border-radius: 2px"></span>
<span style="align-self: flex-end; width: 70px; height: 12px; background: #5A635E; border-radius: 2px; margin-top: 30px"></span>
</div>
<div style="position: absolute; inset: 40px 48px; border: 3px solid #7FD1AE; border-radius: 10px"></div>
<span style="position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: #1F6F54; color: #FFFFFF; font-size: 13px; font-weight: 700; border-radius: 20px; padding: 6px 12px; white-space: nowrap">Document found — hold still</span>
</div>

<div style="margin: 16px 12px 12px; background: #FFFFFF; color: #17201C; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="background: #3A4BA8; color: #FFFFFF; font-size: 11px; font-weight: 800; border-radius: 5px; padding: 3px 6px; letter-spacing: 0.04em">AI</span>
<span style="font-size: 13px; font-weight: 700; color: #3B4370">Recognized as an invoice</span>
</div>
<div style="display: flex; justify-content: space-between; gap: 12px">
<div>
<p style="margin: 0; font-weight: 800; font-size: 16px">Malerbetrieb [Name]</p>
<p style="margin: 2px 0 0; font-size: 13px; color: #5A635E">Rg. 2026-118 · 12.10.2026</p>
</div>
<p style="margin: 0; font-weight: 800; font-size: 18px">€480.00</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="font-size: 12px; font-weight: 700; border-radius: 6px; padding: 5px 8px; background: #E3F0EA; color: #14523E">Musterstraße 12, WE 3</span>
<span style="font-size: 12px; font-weight: 700; border-radius: 6px; padding: 5px 8px; background: #E3F0EA; color: #14523E">Erhaltungsaufwand</span>
<span style="font-size: 12px; font-weight: 700; border-radius: 6px; padding: 5px 8px; background: #F4F5F2; color: #3E4843">Matches debit on 12.10.</span>
</div>
<div style="display: flex; gap: 10px">
<button style="flex: 1; min-height: 48px; border-radius: 12px; border: 1px solid #C9CEC6; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 15px; color: #17201C; cursor: pointer">Edit</button>
<button style="flex: 2; min-height: 48px; border-radius: 12px; border: none; background: #1F6F54; font: inherit; font-weight: 700; font-size: 15px; color: #FFFFFF; cursor: pointer">File it</button>
</div>
</div>

</div>




</body></html>
