name: frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # §5: types.ts must match the committed openapi.json. (Regenerating openapi.json itself
      # needs the backend's `hausbuch openapi`, which lands with chunk 2.)
      - name: Generated API types are up to date
        run: |
          npm run gen:types
          git diff --exit-code -- src/api/types.ts
      - run: npm run build
