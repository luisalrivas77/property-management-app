# Done-criterion fixture: one month of the rental account (docs/phases/phase-2.md §13, §1 and
# the phase 2 row of ARCHITECTURE.md's delivery table: ">= 80 % auto-matched, zero
# allocation-sum errors, every statement reconciling to its balances").
#
# Synthetic, modelled on the real account's shape (a dedicated account for one ETW): rent in,
# Hausgeld out, annuity out, Grundsteuer quarterly, two insurances, one owner top-up, one repair
# invoice, one bank fee, one unknown line, the tenant's Nebenkosten back-payment and the
# Sondereigentumsverwaltung fee; 12 lines in May 2024. The annuity is phase 1's
# loan_schedule.yaml full_first_month (entry 1, due 1 May 2024: 900.00 interest, 500.00
# principal).
#
# The pipeline the test runs per line (pure rules only; no model call, so a line nothing
# matches is "no_match"; with the model it would be an LLM proposal, which D26 never
# auto-confirms in the first month, so the routing is review either way):
#   1. statements.window_sums + statements.reconcile on the balances below -> must be
#      reconciled, so the lines are matched at all (review_routing.yaml rule 1);
#   2. the first rule in `rules` (first_month: none; second_month: all) whose
#      matching.apply_rule returns a set; else
#   3. matching.match_owner_transfer, match_rent, match_loan, then match_document, the first
#      that returns a set;
#   4. allocations.check_sum(transaction.amount, set.allocations) on every set (zero errors);
#   5. review.route(RoutingInput(import_status=reconciled, auto_accept_llm=false, set)).
# first_month runs with no learned rules; second_month with the rules learned from the
# first month's answers: Luis confirmed every review line and kept "Künftig immer so
# zuordnen" ticked for the Hausgeld, both insurances, the bank fee, the NK back-payment and the
# SE-Verwaltung; he unticked it for the repair (a one-off) and the PayPal line (an unknown
# merchant). The bank fee rule is a purpose pattern (the line has no counterparty IBAN).
# The ">= 80 %" criterion is measured on the second month (D26): 10 of 12 auto-confirmed.
# expect per line and month: the routing decision and reason, the method of the set (null =
# nothing matched) and, for the second month, the allocations as (category, amount).

