        - {effective_from: 2024-01-01, cold_rent: "1150.00", operating_costs_prepayment: "250.00"}
  loans:
    - id: *L
      property_id: *P
      lender: Beispielbank AG
      account_iban_hmac: *H_LOAN
      terms:
        principal: "20000.00"
        nominal_rate: "0.05"
        monthly_payment: "1000.00"
        disbursed_on: 2025-01-01
        first_payment_on: 2025-02-01
        fixed_until: 2025-06-30
        follow_up_rate: "0.08"
  wirtschaftsplaene:
    - {document_id: *D_WP24, property_id: *P, valid_from: 2024-01-01, total: "380.00", umlagefaehig: "210.00", verwaltung: "50.00", ruecklage: "120.00"}

cases:
  - id: insurance_single_category
    description: The yearly building insurance, answered once in May 2024; the 2025 premium is higher and still needs no answer.
    answered:
      transaction: {id: 0000002a-0000-4000-8000-000000000601, booking_date: 2024-05-06, amount: "-312.40", counterparty_name: Beispiel Versicherung AG, counterparty_iban_hmac: *H_INS, purpose: Beitrag Wohngebaeude 2024}
      confirmed:
        transaction_id: 0000002a-0000-4000-8000-000000000601
        method: user
        confidence: "1.000"
        allocations:
          - {amount: "-312.40", category: insurance, property_id: *P, service_period_start: 2024-01-01, service_period_end: 2024-12-31, recurring: true}
    expect_rule:
      matcher: {counterparty_iban_hmac: *H_INS, amount_sign: debit}
      split_method: single_category
      category: insurance
      property_id: *P
      recurring: true
    rule_id: 0000002b-0000-4000-8000-000000000601
    next:
      transaction: {id: 0000002a-0000-4000-8000-000000000602, booking_date: 2025-05-06, amount: "-318.90", counterparty_name: Beispiel Versicherung AG, counterparty_iban_hmac: *H_INS, purpose: Beitrag Wohngebaeude 2025}
      expect:
        method: rule
        rule_id: 0000002b-0000-4000-8000-000000000601
        confidence: "1.000"
        question: null
        allocations:
          - {amount: "-318.90", category: insurance, property_id: *P, service_period_start: 2025-01-01, service_period_end: 2025-12-31, recurring: true}

  - id: hausgeld_by_wirtschaftsplan
    description: May's Hausgeld split by hand per the plan becomes a by_wirtschaftsplan rule; June's payment is split by the plan without a question.
    answered:
      transaction: {id: 0000002a-0000-4000-8000-000000000603, booking_date: 2024-05-02, amount: "-380.00", counterparty_name: WEG Lindenstrasse 12, counterparty_iban_hmac: *H_WEG, purpose: Hausgeld 05/2024 WE 3}
      confirmed:
        transaction_id: 0000002a-0000-4000-8000-000000000603
        method: user
        confidence: "1.000"
        allocations:
          - {amount: "-210.00", category: hausgeld_umlagefaehig, property_id: *P, document_id: *D_WP24, service_period_start: 2024-05-01, service_period_end: 2024-05-31, recurring: true}
          - {amount: "-50.00", category: hausgeld_verwaltung, property_id: *P, document_id: *D_WP24, service_period_start: 2024-05-01, service_period_end: 2024-05-31, recurring: true}
          - {amount: "-120.00", category: hausgeld_ruecklage, property_id: *P, document_id: *D_WP24, service_period_start: 2024-05-01, service_period_end: 2024-05-31, recurring: true}
    expect_rule:
      matcher: {counterparty_iban_hmac: *H_WEG, purpose_pattern: hausgeld, amount_sign: debit}
      split_method: by_wirtschaftsplan
      property_id: *P
      recurring: true
    rule_id: 0000002b-0000-4000-8000-000000000602
    next:
      transaction: {id: 0000002a-0000-4000-8000-000000000604, booking_date: 2024-06-03, amount: "-380.00", counterparty_name: WEG Lindenstrasse 12, counterparty_iban_hmac: *H_WEG, purpose: Hausgeld 06/2024 WE 3}
      expect:
        method: rule
        rule_id: 0000002b-0000-4000-8000-000000000602
        confidence: "1.000"
        question: null
        allocations:
          - {amount: "-210.00", category: hausgeld_umlagefaehig, property_id: *P, document_id: *D_WP24, service_period_start: 2024-06-01, service_period_end: 2024-06-30, recurring: true}
          - {amount: "-50.00", category: hausgeld_verwaltung, property_id: *P, document_id: *D_WP24, service_period_start: 2024-06-01, service_period_end: 2024-06-30, recurring: true}
          - {amount: "-120.00", category: hausgeld_ruecklage, property_id: *P, document_id: *D_WP24, service_period_start: 2024-06-01, service_period_end: 2024-06-30, recurring: true}

  - id: hausgeld_two_parts_as_last_split
    description: D51. The Hausverwaltung's Hausgeld split by hand into the two parts its purpose text states becomes an as_last_split rule; June's payment of the same amount gets the same two parts without a question.
    answered:
      transaction: {id: 0000002a-0000-4000-8000-000000000605, booking_date: 2024-05-02, amount: "-380.00", counterparty_name: Muster Hausverwaltung GmbH, counterparty_iban_hmac: *H_HV, purpose: "Hausgeld 05/2024 WE 3 Bewirtschaftung 260,00 Ruecklage 120,00"}
      confirmed:
        transaction_id: 0000002a-0000-4000-8000-000000000605
        method: user
        confidence: "1.000"
        allocations:
          - {amount: "-260.00", category: hausgeld_umlagefaehig, property_id: *P, service_period_start: 2024-05-01, service_period_end: 2024-05-31, recurring: true}
          - {amount: "-120.00", category: hausgeld_ruecklage, property_id: *P, service_period_start: 2024-05-01, service_period_end: 2024-05-31, recurring: true}
    expect_rule:
      matcher: {counterparty_iban_hmac: *H_HV, amount_sign: debit}
      split_method: as_last_split
      categories: [hausgeld_ruecklage, hausgeld_umlagefaehig]
      recurring: true
    rule_id: 0000002b-0000-4000-8000-000000000603
    next:
      transaction: {id: 0000002a-0000-4000-8000-000000000606, booking_date: 2024-06-03, amount: "-380.00", counterparty_name: Muster Hausverwaltung GmbH, counterparty_iban_hmac: *H_HV, purpose: "Hausgeld 06/2024 WE 3 Bewirtschaftung 260,00 Ruecklage 120,00"}
      expect:
        method: rule
        rule_id: 0000002b-0000-4000-8000-000000000603
        confidence: "1.000"
        question: null
        allocations:
          - {amount: "-260.00", category: hausgeld_umlagefaehig, property_id: *P, service_period_start: 2024-06-01, service_period_end: 2024-06-30, recurring: true}
          - {amount: "-120.00", category: hausgeld_ruecklage, property_id: *P, service_period_start: 2024-06-01, service_period_end: 2024-06-30, recurring: true}

  - id: hausgeld_three_parts_off_the_plan
    description: D51. Three Hausgeld parts that do not equal the plan in force (380.00) fit no Wirtschaftsplan rule; they become as_last_split, and the next 400.00 gets the same parts.
    answered:
      transaction: {id: 0000002a-0000-4000-8000-000000000607, booking_date: 2024-05-02, amount: "-400.00", counterparty_name: WEG Lindenstrasse 12, counterparty_iban_hmac: *H_WEG, purpose: Hausgeld 05/2024 WE 3}
      confirmed:
        transaction_id: 0000002a-0000-4000-8000-000000000607
        method: user
        confidence: "1.000"
        allocations:
          - {amount: "-230.00", category: hausgeld_umlagefaehig, property_id: *P, service_period_start: 2024-05-01, service_period_end: 2024-05-31, recurring: true}
          - {amount: "-50.00", category: hausgeld_verwaltung, property_id: *P, service_period_start: 2024-05-01, service_period_end: 2024-05-31, recurring: true}
          - {amount: "-120.00", category: hausgeld_ruecklage, property_id: *P, service_period_start: 2024-05-01, service_period_end: 2024-05-31, recurring: true}
    expect_rule:
      matcher: {counterparty_iban_hmac: *H_WEG, amount_sign: debit}
      split_method: as_last_split
      categories: [hausgeld_ruecklage, hausgeld_umlagefaehig, hausgeld_verwaltung]
      recurring: true
    rule_id: 0000002b-0000-4000-8000-000000000604
    next:
      transaction: {id: 0000002a-0000-4000-8000-000000000608, booking_date: 2024-06-03, amount: "-400.00", counterparty_name: WEG Lindenstrasse 12, counterparty_iban_hmac: *H_WEG, purpose: Hausgeld 06/2024 WE 3}
      expect:
        method: rule
        rule_id: 0000002b-0000-4000-8000-000000000604
        confidence: "1.000"
        question: null
        allocations:
          - {amount: "-230.00", category: hausgeld_umlagefaehig, property_id: *P, service_period_start: 2024-06-01, service_period_end: 2024-06-30, recurring: true}
          - {amount: "-50.00", category: hausgeld_verwaltung, property_id: *P, service_period_start: 2024-06-01, service_period_end: 2024-06-30, recurring: true}
          - {amount: "-120.00", category: hausgeld_ruecklage, property_id: *P, service_period_start: 2024-06-01, service_period_end: 2024-06-30, recurring: true}

no_rule:
  - id: loan_account_bank_fee_is_no_rule
    description: D38. A one-off fee debited by the loan account, answered as bank_fees; a rule would book the next annuity, principal included, as bank_fees.
    answered:
      transaction: {id: 0000002a-0000-4000-8000-000000000701, booking_date: 2025-03-10, amount: "-25.00", counterparty_name: Beispielbank AG, counterparty_iban_hmac: *H_LOAN, purpose: Entgelt Kontoauszug}
      confirmed:
        transaction_id: 0000002a-0000-4000-8000-000000000701
        method: user
        confidence: "1.000"
        allocations:
          - {amount: "-25.00", category: bank_fees, property_id: *P, loan_id: *L, recurring: false}

  - id: tenant_deposit_is_no_rule
    description: D38. The tenant's Kaution, answered as deposit_in; a rule would book every later rent from the same IBAN as deposit.
    answered:
      transaction: {id: 0000002a-0000-4000-8000-000000000702, booking_date: 2024-01-02, amount: "3450.00", counterparty_name: Mieterin Beispiel, counterparty_iban_hmac: *H_TENANT, purpose: Kaution}
      confirmed:
        transaction_id: 0000002a-0000-4000-8000-000000000702
        method: user
        confidence: "1.000"
        allocations:
          - {amount: "3450.00", category: deposit_in, property_id: *P, tenancy_id: *T, recurring: false}

  - id: owner_account_deposit_is_no_rule
    description: D38. A line from an owner's account answered as something other than an owner transfer.
    answered:
      transaction: {id: 0000002a-0000-4000-8000-000000000703, booking_date: 2024-02-01, amount: "500.00", counterparty_name: Max Beispiel, counterparty_iban_hmac: *H_OWNER, purpose: Ruecklage}
      confirmed:
        transaction_id: 0000002a-0000-4000-8000-000000000703
        method: user
        confidence: "1.000"
        allocations:
          - {amount: "500.00", category: other_income, property_id: *P, recurring: false}

  - id: tenant_split_is_no_rule
    description: D38, D51. A tenant's transfer split into rent and part of the Kaution; an as_last_split rule on the tenant's IBAN would run before the rent matcher on every later rent.
    answered:
      transaction: {id: 0000002a-0000-4000-8000-000000000704, booking_date: 2024-01-02, amount: "1900.00", counterparty_name: Mieterin Beispiel, counterparty_iban_hmac: *H_TENANT, purpose: Miete Januar und Kaution}
      confirmed:
        transaction_id: 0000002a-0000-4000-8000-000000000704
        method: user
        confidence: "1.000"
        allocations:
          - {amount: "1150.00", category: rent_cold, property_id: *P, unit_id: *U, tenancy_id: *T, service_period_start: 2024-01-01, service_period_end: 2024-01-31, recurring: true}
          - {amount: "750.00", category: deposit_in, property_id: *P, tenancy_id: *T, recurring: false}

  - id: loan_account_split_is_no_rule
    description: D38, D51. Two fees debited together by the loan account; a split rule there would run before the annuity matcher.
    answered:
      transaction: {id: 0000002a-0000-4000-8000-000000000705, booking_date: 2025-03-10, amount: "-50.00", counterparty_name: Beispielbank AG, counterparty_iban_hmac: *H_LOAN, purpose: Entgelte}
      confirmed:
        transaction_id: 0000002a-0000-4000-8000-000000000705
        method: user
        confidence: "1.000"
        allocations:
          - {amount: "-25.00", category: bank_fees, property_id: *P, recurring: false}
          - {amount: "-25.00", category: loan_fees, property_id: *P, loan_id: *L, recurring: false}

  - id: owner_account_split_is_no_rule
    description: D38, D51. A line from an owner's account split into a top-up and another income.
    answered:
      transaction: {id: 0000002a-0000-4000-8000-000000000706, booking_date: 2024-02-01, amount: "700.00", counterparty_name: Max Beispiel, counterparty_iban_hmac: *H_OWNER, purpose: Einlage}
      confirmed:
        transaction_id: 0000002a-0000-4000-8000-000000000706
        method: user
        confidence: "1.000"
        allocations:
          - {amount: "500.00", category: owner_transfer_in, recurring: false}
          - {amount: "200.00", category: other_income, property_id: *P, recurring: false}

  - id: loan_split_off_the_schedule_is_no_rule
    description: D51. Interest and repayment from an account that is no loan's, not equal to a schedule entry; copying the split would book next month's equal payment with this month's interest share, which the schedule changes every month.
    answered:
      transaction: {id: 0000002a-0000-4000-8000-000000000707, booking_date: 2025-03-15, amount: "-1000.00", counterparty_name: Beispiel Treuhand GmbH, counterparty_iban_hmac: *H_OTHER, purpose: Darlehen Rate Maerz}
      confirmed:
        transaction_id: 0000002a-0000-4000-8000-000000000707
        method: user
        confidence: "1.000"
        allocations:
          - {amount: "-80.00", category: loan_interest, property_id: *P, loan_id: *L, service_period_start: 2025-03-01, service_period_end: 2025-03-31, recurring: true}
          - {amount: "-920.00", category: loan_principal, property_id: *P, loan_id: *L, service_period_start: 2025-03-01, service_period_end: 2025-03-31, recurring: true}

  - id: rent_split_without_a_tenancy_is_no_rule
    description: D51, review F2. Rent and its prepayment from a payer that is no tenant's (yet), without a tenancy; as before D51 no rule is learned, so a rent rule cannot be keyed to an IBAN that may later become a tenant's.
    answered:
      transaction: {id: 0000002a-0000-4000-8000-000000000708, booking_date: 2024-02-01, amount: "1400.00", counterparty_name: Partei Beispiel, counterparty_iban_hmac: *H_OTHER, purpose: Miete Februar}
      confirmed:
        transaction_id: 0000002a-0000-4000-8000-000000000708
        method: user
        confidence: "1.000"
        allocations:
          - {amount: "1150.00", category: rent_cold, property_id: *P, service_period_start: 2024-02-01, service_period_end: 2024-02-29, recurring: true}
          - {amount: "250.00", category: operating_costs_prepayment, property_id: *P, service_period_start: 2024-02-01, service_period_end: 2024-02-29, recurring: true}
