# Done-criterion fixture: a review answer is never asked twice (docs/phases/phase-2.md §13, §8.1;
# ARCHITECTURE.md: "each answer can become a rule, so the same counterparty is never asked
# about twice").
#
# matching.infer_rule(transaction: MatchTransaction, confirmed: AllocationSet,
#                     context: MatchContext) -> MatchingRuleCreate | None
#   The rule a confirmed answer becomes when "Künftig immer so zuordnen" is ticked (the default
#   when the counterparty has an IBAN). Matcher: {counterparty_iban_hmac, amount_sign} of the
#   answered line; no IBAN -> null (the user then types a pattern; not in this fixture).
#   Split method from the confirmed allocations, never their amounts (D25):
#     the three hausgeld_* parts equal to the Wirtschaftsplan in force for the line's service
#       period -> by_wirtschaftsplan, property_id (the matcher also gets purpose_pattern
#       "hausgeld", so a special levy from the same WEG account is not split by the plan);
#     loan_interest + loan_principal equal to the schedule entry -> by_loan_schedule, loan_id;
#     rent_cold + operating_costs_prepayment of one tenancy -> by_rent_schedule, tenancy_id;
#     owner_transfer_in / _out -> owner_transfer;
#     one allocation -> single_category with its category and its property / tenancy / loan.
#   recurring: true when every confirmed allocation is recurring, else false (whatever the
#   split method; only single_category hits read it).
#   No single_category rule when the counterparty is an owner account, a tenant's or a loan
#   account (D38): apply_rule runs before the matchers, so an IBAN-only rule there would
#   pre-empt the exact rent / loan / owner split for every later line. -> null (no_rule below).
# Then the next line from the same counterparty goes through matching.apply_rule with the
# stored rule (id below) and must come back as a rule set with confidence 1, no question, and
# review.route must auto-confirm it (routing.rule_hit): nothing is asked.

ids:
  workspace: &W 0000000a-0000-4000-8000-000000000001
  property: &P 0000000b-0000-4000-8000-000000000001
  doc_wp_2024: &D_WP24 0000000d-0000-4000-8000-000000000203
  hmac_weg: &H_WEG "6666666666666666666666666666666666666666666666666666666666666666"
  hmac_insurer: &H_INS "7777777777777777777777777777777777777777777777777777777777777777"
  hmac_tenant: &H_TENANT "1111111111111111111111111111111111111111111111111111111111111111"
  hmac_owner: &H_OWNER "2222222222222222222222222222222222222222222222222222222222222222"
  hmac_loan: &H_LOAN "3333333333333333333333333333333333333333333333333333333333333333"
  unit: &U 0000000c-0000-4000-8000-000000000001
  tenancy: &T 0000000e-0000-4000-8000-000000000001
  loan: &L 0000000f-0000-4000-8000-000000000001

context:
  owner_account_hmacs: [*H_OWNER]
  tenancies:
    - id: *T
      property_id: *P
      unit_id: *U
      start_date: 2024-01-01
      tenant_iban_hmacs: [*H_TENANT]
      rent:
        - {effective_from: 2024-01-01, cold_rent: "1150.00", operating_costs_prepayment: "250.00"}
  loans:
    - id: *L
      property_id: *P
      lender: Beispielbank AG
      account_iban_hmac: *H_LOAN
      terms:
        principal: "20000.00"
        nominal_rate: "0.05"
        monthly_payment: "1000.00"
        disbursed_on: 2025-01-01
        first_payment_on: 2025-02-01
        fixed_until: 2025-06-30
        follow_up_rate: "0.08"
  wirtschaftsplaene:
    - {document_id: *D_WP24, property_id: *P, valid_from: 2024-01-01, total: "380.00", umlagefaehig: "210.00", verwaltung: "50.00", ruecklage: "120.00"}

cases:
  - id: insurance_single_category
    description: The yearly building insurance, answered once in May 2024; the 2025 premium is higher and still needs no answer.
    answered:
      transaction: {id: 0000002a-0000-4000-8000-000000000601, booking_date: 2024-05-06, amount: "-312.40", counterparty_name: Beispiel Versicherung AG, counterparty_iban_hmac: *H_INS, purpose: Beitrag Wohngebaeude 2024}
      confirmed:
        transaction_id: 0000002a-0000-4000-8000-000000000601
        method: user
        confidence: "1.000"
        allocations:
          - {amount: "-312.40", category: insurance, property_id: *P, service_period_start: 2024-01-01, service_period_end: 2024-12-31, recurring: true}
    expect_rule:
      matcher: {counterparty_iban_hmac: *H_INS, amount_sign: debit}
      split_method: single_category
      category: insurance
      property_id: *P
      recurring: true
    rule_id: 0000002b-0000-4000-8000-000000000601
    next:
      transaction: {id: 0000002a-0000-4000-8000-000000000602, booking_date: 2025-05-06, amount: "-318.90", counterparty_name: Beispiel Versicherung AG, counterparty_iban_hmac: *H_INS, purpose: Beitrag Wohngebaeude 2025}
      expect:
        method: rule
        rule_id: 0000002b-0000-4000-8000-000000000601
        confidence: "1.000"
        question: null
        allocations:
          - {amount: "-318.90", category: insurance, property_id: *P, service_period_start: 2025-01-01, service_period_end: 2025-12-31, recurring: true}

  - id: hausgeld_by_wirtschaftsplan
    description: May's Hausgeld split by hand per the plan becomes a by_wirtschaftsplan rule; June's payment is split by the plan without a question.
    answered:
      transaction: {id: 0000002a-0000-4000-8000-000000000603, booking_date: 2024-05-02, amount: "-380.00", counterparty_name: WEG Lindenstrasse 12, counterparty_iban_hmac: *H_WEG, purpose: Hausgeld 05/2024 WE 3}
      confirmed:
        transaction_id: 0000002a-0000-4000-8000-000000000603
        method: user
        confidence: "1.000"
        allocations:
          - {amount: "-210.00", category: hausgeld_umlagefaehig, property_id: *P, document_id: *D_WP24, service_period_start: 2024-05-01, service_period_end: 2024-05-31, recurring: true}
          - {amount: "-50.00", category: hausgeld_verwaltung, property_id: *P, document_id: *D_WP24, service_period_start: 2024-05-01, service_period_end: 2024-05-31, recurring: true}
          - {amount: "-120.00", category: hausgeld_ruecklage, property_id: *P, document_id: *D_WP24, service_period_start: 2024-05-01, service_period_end: 2024-05-31, recurring: true}
    expect_rule:
      matcher: {counterparty_iban_hmac: *H_WEG, purpose_pattern: hausgeld, amount_sign: debit}
      split_method: by_wirtschaftsplan
      property_id: *P
      recurring: true
    rule_id: 0000002b-0000-4000-8000-000000000602
    next:
      transaction: {id: 0000002a-0000-4000-8000-000000000604, booking_date: 2024-06-03, amount: "-380.00", counterparty_name: WEG Lindenstrasse 12, counterparty_iban_hmac: *H_WEG, purpose: Hausgeld 06/2024 WE 3}
      expect:
        method: rule
        rule_id: 0000002b-0000-4000-8000-000000000602
        confidence: "1.000"
        question: null
        allocations:
          - {amount: "-210.00", category: hausgeld_umlagefaehig, property_id: *P, document_id: *D_WP24, service_period_start: 2024-06-01, service_period_end: 2024-06-30, recurring: true}
          - {amount: "-50.00", category: hausgeld_verwaltung, property_id: *P, document_id: *D_WP24, service_period_start: 2024-06-01, service_period_end: 2024-06-30, recurring: true}
          - {amount: "-120.00", category: hausgeld_ruecklage, property_id: *P, document_id: *D_WP24, service_period_start: 2024-06-01, service_period_end: 2024-06-30, recurring: true}

no_rule:
  - id: loan_account_bank_fee_is_no_rule
    description: D38. A one-off fee debited by the loan account, answered as bank_fees; a rule would book the next annuity, principal included, as bank_fees.
    answered:
      transaction: {id: 0000002a-0000-4000-8000-000000000701, booking_date: 2025-03-10, amount: "-25.00", counterparty_name: Beispielbank AG, counterparty_iban_hmac: *H_LOAN, purpose: Entgelt Kontoauszug}
      confirmed:
        transaction_id: 0000002a-0000-4000-8000-000000000701
        method: user
        confidence: "1.000"
        allocations:
          - {amount: "-25.00", category: bank_fees, property_id: *P, loan_id: *L, recurring: false}

  - id: tenant_deposit_is_no_rule
    description: D38. The tenant's Kaution, answered as deposit_in; a rule would book every later rent from the same IBAN as deposit.
    answered:
      transaction: {id: 0000002a-0000-4000-8000-000000000702, booking_date: 2024-01-02, amount: "3450.00", counterparty_name: Mieterin Beispiel, counterparty_iban_hmac: *H_TENANT, purpose: Kaution}
      confirmed:
        transaction_id: 0000002a-0000-4000-8000-000000000702
        method: user
        confidence: "1.000"
        allocations:
          - {amount: "3450.00", category: deposit_in, property_id: *P, tenancy_id: *T, recurring: false}

  - id: owner_account_deposit_is_no_rule
    description: D38. A line from an owner's account answered as something other than an owner transfer.
    answered:
      transaction: {id: 0000002a-0000-4000-8000-000000000703, booking_date: 2024-02-01, amount: "500.00", counterparty_name: Max Beispiel, counterparty_iban_hmac: *H_OWNER, purpose: Ruecklage}
      confirmed:
        transaction_id: 0000002a-0000-4000-8000-000000000703
        method: user
        confidence: "1.000"
        allocations:
          - {amount: "500.00", category: other_income, property_id: *P, recurring: false}
