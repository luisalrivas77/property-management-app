# Rule fixture: deterministic matchers and the document match (hausbuch.rules.matching)
#
# match_owner_transfer(transaction: MatchTransaction, context: MatchContext) -> AllocationSet | None
# match_rent(transaction, context) -> AllocationSet | None
# match_loan(transaction, context) -> AllocationSet | None
# match_document(transaction, context) -> AllocationSet | None
# Spec: docs/phases/phase-2.md §8.1 steps 2-3, D27. Pure; no model; counterparties are compared
# by IBAN HMAC only (the matchers never see a plaintext IBAN). Each case names the one matcher
# it runs; expect null = that matcher does not match.
#
# All sets: transaction_id = the transaction's id; no tax year (the year an allocation counts
# in is an output of phase 3's tax rule set, from the transaction's dates, the service period
# and recurring: the §11 ten-day rule); allocation amounts signed like the transaction and
# summing to it exactly (allocation_sum.yaml); the service period from
# rules.periods.service_period(purpose, booking_date, recurring) (service_period.yaml).
# reasoning is free text and not compared; allocations are compared as a set (order free).
#
# owner transfer: counterparty_iban_hmac in context.owner_account_hmacs -> one allocation,
#   owner_transfer_in (credit) / owner_transfer_out (debit), no property (the account is the
#   property's, the owners' money is not split), recurring false; method matcher_owner, 1.0.
# rent: counterparty_iban_hmac in a tenancy's tenant_iban_hmacs. The rent in force is the
#   tenancy's latest rent row with effective_from <= the service period's start (the period is
#   computed with recurring = true). The period covers n whole months (1 when the purpose
#   states none: the booking month). Expected amount = n * (cold_rent + prepayment).
#   - amount == expected: two allocations, rent_cold = n * cold_rent and
#     operating_costs_prepayment = n * prepayment, with property, unit and tenancy, recurring
#     true; method matcher_rent, confidence 1.0, no question.
#   - a credit that differs from the expected amount (n months, not one) by at most 10 % of
#     it: the same two categories with the n-month prepayment in full and the cold rent
#     carrying the difference;
#     confidence 0.5 (below every threshold, so it goes to review) and the question, amounts
#     in German form (cents only when not .00):
#     "Mieter hat {paid} € statt {expected} € überwiesen. Mietminderung oder Teilzahlung?"
#   - any other amount (e.g. a Nebenkosten back-payment from the same tenant) -> null: it is
#     not rent, and the line goes on to the document match and the model.
# loan: counterparty_iban_hmac = a loan's account_iban_hmac (or the counterparty name contains
#   the lender's name, case-insensitively) and -amount == terms.monthly_payment. Split by the
#   schedule entry (rules.loan_schedule.build_schedule) whose due_on is nearest the booking date
#   within 10 days either side (D39; two equally near -> null):
#   loan_interest = -entry.interest, loan_principal = -entry.principal, with property and loan,
#   recurring true; method matcher_loan, 1.0. No entry within the window -> null.
#   The entry due on 1 July 2025 below still carries June's interest at the old 5 % (June
#   accrued before fixed_until), so a matcher that reads "the rate in force on the booking
#   date" gets it wrong; the follow-up rate's first entry is August's (rules.yaml).
# loan, interest only (added 2026-11-08): when no schedule entry fits, a loan with
#   terms.interest_only_before_first_payment (paid out in parts; until the first annuity the
#   bank debits interest only on what it has paid out, a different amount each month) books a
#   debit from that loan (as above: account HMAC or lender name) with
#   disbursed_on < booking_date < first_payment_on (both ends excluded) as ONE allocation,
#   loan_interest = the whole amount, with property and loan, recurring true; method
#   matcher_loan, 1.0, ONLY when the purpose states the interest and it equals the debit:
#   "Zinsen" (a whole word, case-insensitive; optional ":" and "EUR"/"€") followed by a
#   German amount (1.061,82 or 1061,82 or 944,63), exactly one distinct such amount, equal to
#   -amount; and no "Tilgung" amount above 0,00 in the purpose. Otherwise null (the line goes
#   on to the document match and the model, whose loan answer always goes to review, D40).
#   Service period: the range the purpose states as "Für dd.mm.yyyy - dd.mm.yyyy" (valid
#   dates, start <= end), else the booking month. A flag-off loan never books this way.
# document: a context document with a payment p where |amount| is within 0.01 of p.amount,
#   booking_date within 10 days of p.due_on (inclusive, either side), and the document's
#   iban_hmac equal to the counterparty's or its reference found in the purpose
#   (case-insensitive, whitespace-collapsed) -> one allocation of the document's category, the
#   document as Beleg (document_id), its property and its loan_id (a financing invoice, D35:
#   category loan_fees); recurring true when the document has
#   more than one payment (a Grundsteuerbescheid's installments), else false; method
#   document_match, confidence 0.95 (auto-confirm per thresholds.yaml).

ids:
  property: &P 0000000b-0000-4000-8000-000000000001
  unit: &U 0000000c-0000-4000-8000-000000000001
  tenancy: &T 0000000e-0000-4000-8000-000000000001
  loan: &L 0000000f-0000-4000-8000-000000000001
  loan_interest_only: &L_IO 0000000f-0000-4000-8000-000000000002
  doc_grundsteuer: &D_GS 0000000d-0000-4000-8000-000000000001
  doc_notary: &D_NOTARY 0000000d-0000-4000-8000-000000000002
  doc_grundschuld: &D_GRUNDSCHULD 0000000d-0000-4000-8000-000000000003
  hmac_tenant: &H_TENANT "1111111111111111111111111111111111111111111111111111111111111111"
  hmac_owner: &H_OWNER "2222222222222222222222222222222222222222222222222222222222222222"
  hmac_loan: &H_LOAN "3333333333333333333333333333333333333333333333333333333333333333"
  hmac_stadtkasse: &H_STADT "4444444444444444444444444444444444444444444444444444444444444444"
  hmac_notary: &H_NOTARY "5555555555555555555555555555555555555555555555555555555555555555"
  hmac_loan_interest_only: &H_LOAN_IO "6666666666666666666666666666666666666666666666666666666666666666"
  hmac_other: &H_OTHER "9999999999999999999999999999999999999999999999999999999999999999"

context:
  owner_account_hmacs: [*H_OWNER]
  tenancies:
    - id: *T
      property_id: *P
      unit_id: *U
      start_date: 2026-07-01
      tenant_iban_hmacs: [*H_TENANT]
      rent:
        - {effective_from: 2026-07-01, cold_rent: "1150.00", operating_costs_prepayment: "250.00"}
  loans:
    - id: *L
      property_id: *P
      lender: Beispielbank AG
      account_iban_hmac: *H_LOAN
      terms:   # = loan_schedule.yaml follow_up_rate_to_payoff (phase 1)
        principal: "20000.00"
        nominal_rate: "0.05"
        monthly_payment: "1000.00"
        disbursed_on: 2025-01-01
        first_payment_on: 2025-02-01
        fixed_until: 2025-06-30
        follow_up_rate: "0.08"
    - id: *L_IO
      property_id: *P
      lender: Musterkasse eG
      account_iban_hmac: *H_LOAN_IO
      terms:   # = loan_schedule.yaml interest_only_before_first_payment (phase 1)
        principal: "360000.00"
        nominal_rate: "0.036"
        monthly_payment: "1600.00"
        disbursed_on: 2026-06-30
        first_payment_on: 2026-12-30
        interest_only_before_first_payment: true
  documents:
    - id: *D_GS
      kind: grundsteuerbescheid
      category: grundsteuer
      property_id: *P
      payments:
        - {due_on: 2027-02-15, amount: "123.45"}
        - {due_on: 2027-05-15, amount: "123.45"}
        - {due_on: 2027-08-15, amount: "123.45"}
        - {due_on: 2027-11-15, amount: "123.45"}
      iban_hmac: *H_STADT
      reference: "47110815"
    - id: *D_NOTARY
      kind: invoice
      category: acquisition_cost
      property_id: *P
      payments:
        - {due_on: 2026-03-10, amount: "1234.56"}
      iban_hmac: *H_NOTARY
      reference: R 8817
    - id: *D_GRUNDSCHULD
      kind: invoice
      category: loan_fees
      property_id: *P
      loan_id: *L
      payments:
        - {due_on: 2026-03-20, amount: "612.88"}
      iban_hmac: *H_NOTARY
      reference: RE26/00001

cases:
  - id: rent_exact
    matcher: rent
    transaction: &TX_RENT
      id: 0000002a-0000-4000-8000-000000000001
      booking_date: 2027-01-04
      amount: "1400.00"
      counterparty_name: Erika Beispiel
      counterparty_iban_hmac: *H_TENANT
      purpose: Miete 01/2027
    expect:
      method: matcher_rent
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "1150.00", category: rent_cold, property_id: *P, unit_id: *U, tenancy_id: *T, service_period_start: 2027-01-01, service_period_end: 2027-01-31, recurring: true}
        - {amount: "250.00", category: operating_costs_prepayment, property_id: *P, unit_id: *U, tenancy_id: *T, service_period_start: 2027-01-01, service_period_end: 2027-01-31, recurring: true}

  - id: rent_short_by_20
    description: The tenant paid 1,380 instead of 1,400; proposed with the prepayment in full, to review with the difference as the question.
    matcher: rent
    transaction:
      <<: *TX_RENT
      id: 0000002a-0000-4000-8000-000000000002
      booking_date: 2027-02-03
      amount: "1380.00"
      purpose: Miete 02/2027
    expect:
      method: matcher_rent
      confidence: "0.500"
      question: Mieter hat 1.380 € statt 1.400 € überwiesen. Mietminderung oder Teilzahlung?
      allocations:
        - {amount: "1130.00", category: rent_cold, property_id: *P, unit_id: *U, tenancy_id: *T, service_period_start: 2027-02-01, service_period_end: 2027-02-28, recurring: true}
        - {amount: "250.00", category: operating_costs_prepayment, property_id: *P, unit_id: *U, tenancy_id: *T, service_period_start: 2027-02-01, service_period_end: 2027-02-28, recurring: true}

  - id: rent_two_months_one_transfer
    description: January and February paid together; one pair of allocations over the range.
    matcher: rent
    transaction:
      <<: *TX_RENT
      id: 0000002a-0000-4000-8000-000000000003
      booking_date: 2027-01-04
      amount: "2800.00"
      purpose: Miete 01/27-02/27
    expect:
      method: matcher_rent
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "2300.00", category: rent_cold, property_id: *P, unit_id: *U, tenancy_id: *T, service_period_start: 2027-01-01, service_period_end: 2027-02-28, recurring: true}
        - {amount: "500.00", category: operating_costs_prepayment, property_id: *P, unit_id: *U, tenancy_id: *T, service_period_start: 2027-01-01, service_period_end: 2027-02-28, recurring: true}

  - id: rent_two_months_short_by_20
    description: January and February paid together but 20 short; the 10 % band is measured against the two-month amount, so it is proposed with the question rather than not matched.
    matcher: rent
    transaction:
      <<: *TX_RENT
      id: 0000002a-0000-4000-8000-000000000009
      booking_date: 2027-01-04
      amount: "2780.00"
      purpose: Miete 01/27-02/27
    expect:
      method: matcher_rent
      confidence: "0.500"
      question: Mieter hat 2.780 € statt 2.800 € überwiesen. Mietminderung oder Teilzahlung?
      allocations:
        - {amount: "2280.00", category: rent_cold, property_id: *P, unit_id: *U, tenancy_id: *T, service_period_start: 2027-01-01, service_period_end: 2027-02-28, recurring: true}
        - {amount: "500.00", category: operating_costs_prepayment, property_id: *P, unit_id: *U, tenancy_id: *T, service_period_start: 2027-01-01, service_period_end: 2027-02-28, recurring: true}

  - id: annuity_at_fixed_rate_switch
    description: Entry 6 (due 1 July 2025), the last one at 5 %; loan_schedule.yaml follow_up_rate_to_payoff.
    matcher: loan
    transaction:
      id: 0000002a-0000-4000-8000-000000000004
      booking_date: 2025-07-01
      amount: "-1000.00"
      counterparty_name: Beispielbank AG
      counterparty_iban_hmac: *H_LOAN
      purpose: Darlehen 600123456 Rate
    expect:
      method: matcher_loan
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "-64.08", category: loan_interest, property_id: *P, loan_id: *L, service_period_start: 2025-07-01, service_period_end: 2025-07-31, recurring: true}
        - {amount: "-935.92", category: loan_principal, property_id: *P, loan_id: *L, service_period_start: 2025-07-01, service_period_end: 2025-07-31, recurring: true}

  - id: annuity_booked_the_day_before_its_due_date
    description: D39. The bank books the 1 July 2025 instalment on 30 June; it still gets entry 6 (July), not entry 5.
    matcher: loan
    transaction:
      id: 0000002a-0000-4000-8000-00000000000a
      booking_date: 2025-06-30
      amount: "-1000.00"
      counterparty_name: Beispielbank AG
      counterparty_iban_hmac: *H_LOAN
      purpose: Darlehen 600123456 Rate
    expect:
      method: matcher_loan
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "-64.08", category: loan_interest, property_id: *P, loan_id: *L, service_period_start: 2025-07-01, service_period_end: 2025-07-31, recurring: true}
        - {amount: "-935.92", category: loan_principal, property_id: *P, loan_id: *L, service_period_start: 2025-07-01, service_period_end: 2025-07-31, recurring: true}

  - id: owner_top_up
    matcher: owner_transfer
    transaction:
      id: 0000002a-0000-4000-8000-000000000005
      booking_date: 2027-01-15
      amount: "500.00"
      counterparty_name: Max Beispiel
      counterparty_iban_hmac: *H_OWNER
      purpose: Zuschuss Mietkonto
    expect:
      method: matcher_owner
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "500.00", category: owner_transfer_in, recurring: false}

  - id: grundsteuer_quarter_vs_bescheid
    description: The first quarterly installment of the Bescheid, by IBAN and reference.
    matcher: document
    transaction:
      id: 0000002a-0000-4000-8000-000000000006
      booking_date: 2027-02-15
      amount: "-123.45"
      counterparty_name: Stadtkasse Berlin
      counterparty_iban_hmac: *H_STADT
      purpose: Grundsteuer 47110815
    expect:
      method: document_match
      confidence: "0.950"
      question: null
      allocations:
        - {amount: "-123.45", category: grundsteuer, property_id: *P, document_id: *D_GS, service_period_start: 2027-02-01, service_period_end: 2027-02-28, recurring: true}

  - id: invoice_within_window
    description: One cent less than the invoice, ten days after its date (the window is inclusive), found by the reference only.
    matcher: document
    transaction: &TX_NOTARY
      id: 0000002a-0000-4000-8000-000000000007
      booking_date: 2026-03-20
      amount: "-1234.55"
      counterparty_name: Notarin Dr. Beispiel
      counterparty_iban_hmac: *H_OTHER
      purpose: Rechnung R 8817
    expect:
      method: document_match
      confidence: "0.950"
      question: null
      allocations:
        - {amount: "-1234.55", category: acquisition_cost, property_id: *P, document_id: *D_NOTARY, recurring: false}

  - id: invoice_outside_window
    description: Eleven days after the invoice date.
    matcher: document
    transaction:
      <<: *TX_NOTARY
      id: 0000002a-0000-4000-8000-000000000008
      booking_date: 2026-03-21
      amount: "-1234.56"
    expect: null

  - id: financing_invoice_books_loan_fees
    description: D35. The notary's Grundschuld bill is a financing cost; its payment is loan_fees on the loan, not an acquisition cost. Found by the notary's IBAN.
    matcher: document
    transaction:
      id: 0000002a-0000-4000-8000-000000000009
      booking_date: 2026-03-25
      amount: "-612.88"
      counterparty_name: Notarin Dr. Beispiel
      counterparty_iban_hmac: *H_NOTARY
      purpose: Kostenrechnung
    expect:
      method: document_match
      confidence: "0.950"
      question: null
      allocations:
        - {amount: "-612.88", category: loan_fees, property_id: *P, loan_id: *L, document_id: *D_GRUNDSCHULD, recurring: false}

  # --- interest only before the first annuity (added 2026-11-08) ---------------------------
  # Loan L_IO: paid out 30 June 2026, first annuity 30 December 2026, flag set. The purpose
  # texts are synthetic, shaped like the bank's "Rechnung Darl.-Leistung" debits.

  - id: interest_only_states_the_interest
    description: The debit equals the interest the purpose states; booked whole as loan_interest over the stated range.
    matcher: loan
    transaction: &TX_IO
      id: 0000002b-0000-4000-8000-000000000001
      booking_date: 2026-07-30
      amount: "-787.43"
      counterparty_name: Musterkasse eG
      counterparty_iban_hmac: *H_LOAN_IO
      purpose: "Rechnung Darl.-Leistung 7000000001 Für 01.07.2026 - 30.07.2026 Saldo: 262.477,00- Zinsen 787,43 20260730-XX001-00000000001"
    expect:
      method: matcher_loan
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "-787.43", category: loan_interest, property_id: *P, loan_id: *L_IO, service_period_start: 2026-07-01, service_period_end: 2026-07-30, recurring: true}

  - id: interest_only_thousands_separator
    description: After the second payout the stated interest has a thousands separator (1.061,82).
    matcher: loan
    transaction:
      <<: *TX_IO
      id: 0000002b-0000-4000-8000-000000000002
      booking_date: 2026-10-30
      amount: "-1061.82"
      purpose: "Rechnung Darl.-Leistung 7000000001 Für 01.10.2026 - 30.10.2026 Saldo: 354.000,00- Zinsen 1.061,82 20261030-XX001-00000000002"
    expect:
      method: matcher_loan
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "-1061.82", category: loan_interest, property_id: *P, loan_id: *L_IO, service_period_start: 2026-10-01, service_period_end: 2026-10-30, recurring: true}

  - id: interest_only_without_a_stated_range
    description: No "Für ... - ..." range in the purpose; the service period is the booking month.
    matcher: loan
    transaction:
      <<: *TX_IO
      id: 0000002b-0000-4000-8000-000000000003
      booking_date: 2026-08-31
      amount: "-810.00"
      purpose: "Darlehen 7000000001 Zinsen: 810,00 EUR"
    expect:
      method: matcher_loan
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "-810.00", category: loan_interest, property_id: *P, loan_id: *L_IO, service_period_start: 2026-08-01, service_period_end: 2026-08-31, recurring: true}

  - id: interest_only_tilgung_zero_is_still_interest_only
    description: A Tilgung of 0,00 stated beside the interest does not block the match.
    matcher: loan
    transaction:
      <<: *TX_IO
      id: 0000002b-0000-4000-8000-000000000004
      booking_date: 2026-09-30
      amount: "-787.43"
      purpose: "Rechnung Darl.-Leistung 7000000001 Für 31.08.2026 - 29.09.2026 Tilgung 0,00 Zinsen 787,43"
    expect:
      method: matcher_loan
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "-787.43", category: loan_interest, property_id: *P, loan_id: *L_IO, service_period_start: 2026-08-31, service_period_end: 2026-09-29, recurring: true}

  - id: interest_only_stated_interest_differs
    description: The purpose states 787,43 interest but 800.00 was debited; the rest is not explained, so no match.
    matcher: loan
    transaction:
      <<: *TX_IO
      id: 0000002b-0000-4000-8000-000000000005
      amount: "-800.00"
    expect: null

  - id: interest_only_states_a_repayment
    description: The purpose states a Tilgung above zero; even with the interest equal to the debit, the line is not interest only.
    matcher: loan
    transaction:
      <<: *TX_IO
      id: 0000002b-0000-4000-8000-000000000006
      purpose: "Rechnung Darl.-Leistung 7000000001 Für 01.07.2026 - 30.07.2026 Tilgung 500,00 Zinsen 787,43"
    expect: null

  - id: interest_only_two_stated_interest_amounts
    description: Two different interest amounts in the purpose; which one is meant is a person's call.
    matcher: loan
    transaction:
      <<: *TX_IO
      id: 0000002b-0000-4000-8000-000000000007
      purpose: "Darlehen 7000000001 Zinsen 787,43 Zinsen 12,00"
    expect: null

  - id: interest_only_purpose_states_no_interest
    description: A debit from the loan account in the interest-only time without a stated interest amount.
    matcher: loan
    transaction:
      <<: *TX_IO
      id: 0000002b-0000-4000-8000-000000000008
      purpose: "Darlehen 7000000001 Lastschrift"
    expect: null

  - id: interest_only_booked_before_the_payout
    description: Booked before disbursed_on (30 June 2026); there was no interest to pay yet.
    matcher: loan
    transaction:
      <<: *TX_IO
      id: 0000002b-0000-4000-8000-000000000009
      booking_date: 2026-06-15
      amount: "-100.00"
      purpose: "Darlehen 7000000001 Für 01.06.2026 - 15.06.2026 Zinsen 100,00"
    expect: null

  - id: interest_only_booked_on_the_payout_day
    description: Booked on disbursed_on itself; the window excludes it.
    matcher: loan
    transaction:
      <<: *TX_IO
      id: 0000002b-0000-4000-8000-00000000000a
      booking_date: 2026-06-30
      amount: "-100.00"
      purpose: "Darlehen 7000000001 Zinsen 100,00"
    expect: null

  - id: interest_only_booked_on_the_first_payment_day
    description: From first_payment_on only the schedule applies; a stated-interest debit that is not the annuity is not matched.
    matcher: loan
    transaction:
      <<: *TX_IO
      id: 0000002b-0000-4000-8000-00000000000b
      booking_date: 2026-12-30
      amount: "-1080.00"
      purpose: "Rechnung Darl.-Leistung 7000000001 Für 30.11.2026 - 29.12.2026 Zinsen 1.080,00"
    expect: null

  - id: interest_only_loan_first_annuity
    description: The first full annuity, split by schedule entry 1 (30 days of interest on the full principal, loan_schedule.yaml interest_only_before_first_payment).
    matcher: loan
    transaction:
      <<: *TX_IO
      id: 0000002b-0000-4000-8000-00000000000c
      booking_date: 2026-12-30
      amount: "-1600.00"
      purpose: "Rechnung Darl.-Leistung 7000000001 Zinsen 1.080,00 Tilgung 520,00"
    expect:
      method: matcher_loan
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "-1080.00", category: loan_interest, property_id: *P, loan_id: *L_IO, service_period_start: 2026-12-01, service_period_end: 2026-12-31, recurring: true}
        - {amount: "-520.00", category: loan_principal, property_id: *P, loan_id: *L_IO, service_period_start: 2026-12-01, service_period_end: 2026-12-31, recurring: true}

  - id: interest_only_flag_off
    description: Loan L has no flag; a stated-interest debit before its first payment (1 Feb 2025) is not matched.
    matcher: loan
    transaction:
      id: 0000002b-0000-4000-8000-00000000000d
      booking_date: 2025-01-15
      amount: "-55.00"
      counterparty_name: Beispielbank AG
      counterparty_iban_hmac: *H_LOAN
      purpose: "Darlehen 600123456 Für 01.01.2025 - 15.01.2025 Zinsen 55,00"
    expect: null

  - id: interest_only_not_from_the_loan_account
    description: Same text and amount, but neither the loan's account nor its lender.
    matcher: loan
    transaction:
      <<: *TX_IO
