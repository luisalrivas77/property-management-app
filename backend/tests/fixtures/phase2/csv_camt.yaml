  # --- Refused (statement.*): nothing is imported ----------------------------------------

  - id: amount_with_three_decimals
    input:
      media_type: text/csv
      text: |
        Auftragskonto;Buchungstag;Valutadatum;Buchungstext;Verwendungszweck;Beguenstigter/Zahlungspflichtiger;Kontonummer/IBAN;Betrag;Waehrung
        DE50100000000000000001;04.01.27;04.01.27;GUTSCHRIFT;Miete;Erika Beispiel;;1400,001;EUR
    error: statement.unparsable

  - id: amount_with_misplaced_thousands_dot
    input:
      media_type: text/csv
      text: |
        Auftragskonto;Buchungstag;Valutadatum;Buchungstext;Verwendungszweck;Beguenstigter/Zahlungspflichtiger;Kontonummer/IBAN;Betrag;Waehrung
