        Auftragskonto;Buchungstag;Betrag;Währung;Begünstigter/Zahlungspflichtiger;Kontonummer;BIC;Buchungstext;Verwendungszweck;Valutadatum;Gläubiger ID;Mandatsreferenz;Kundenreferenz (End-to-End)
        DE50100000000000000001;02.02.27;-410,00;EUR;WEG Lindenstraße 12;DE86100000000000001002;TSTBDEFFXXX;DAUERAUFTRAG;Hausgeld 02/2027 WE 3;;;;
        DE50100000000000000001;01.02.27;1400,00;EUR;Erika Beispiel;DE16100000000000001001;;GUTSCHRIFT;Miete Februar – 2027;01.02.27;;;
    expect:
      format: csv_camt
      account_iban: DE50100000000000000001
      opening_balance: null
      closing_balance: null
      line_count: 2
      total: "990.00"
      first_booking_on: 2027-02-01
      last_booking_on: 2027-02-02
      lines:
        - index: 0
          line:
            booking_date: 2027-02-02
            amount: "-410.00"
            counterparty_name: WEG Lindenstraße 12
            counterparty_iban: DE86100000000000001002
            purpose: Hausgeld 02/2027 WE 3
            booking_text: DAUERAUFTRAG
            raw: {BIC (SWIFT-Code): TSTBDEFFXXX}
        - index: 1
