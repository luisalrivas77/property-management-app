# Parser fixture: Sparkasse CSV-CAMT (hausbuch.services.bank.parse_statement, csv_camt)
#
# parse_statement(data: bytes, media_type) -> ParseOutcome(statement, balance_error=None)
# Spec: docs/phases/phase-2.md §7.1 (CSV-CAMT V2, the fallback format: `;`-separated,
# header row, dates dd.mm.yy, comma decimals, 17 columns, NO balances, so opening and
# closing are null and the import waits for a typed balance, D21), §12.
#
# Sample: bank_samples/csv_camt.csv is an ANONYMISED copy of Luis's real export (the same 22
# bookings as camt052.zip; newest first; every field quoted; Windows-1252; LF line ends).
# Synthetic values throughout; never put an original export here.
#
# Reading rules the cases pin:
#   - encoding: UTF-8 when valid (a BOM is dropped), else Windows-1252 (the real export;
#     §7.1 says ISO-8859-15, which differs only in a few symbols such as the euro sign)
#   - columns found by header name (any order); umlaut spellings and the short V1 names
#     (Kontonummer, BIC) accepted; Info is optional
#   - Info "Umsatz vorgemerkt" = pending: skipped, with one warning counting them
#   - Betrag: decimal comma, optional thousands dots, signed (debits negative), Decimal
#   - dates dd.mm.yy or dd.mm.yyyy; Valutadatum may be empty
#   - account_iban = Auftragskonto (every row the same); bank_reference is always null
#     (the CSV has no bank reference; Kundenreferenz (End-to-End) is end_to_end_ref)
#   - raw: the non-empty columns that are not stored in their own column, by header name;
#     never Auftragskonto or Kontonummer/IBAN


cases:

  - id: sparkasse_export
    description: The anonymised export; its 22 lines sum to the camt closing balance, -3.028,51 from 0,00.
    input: {file: csv_camt.csv, media_type: text/csv}
    expect:
      format: csv_camt
      account_iban: DE50100000000000000001
      opening_balance: null
      closing_balance: null
      line_count: 22
      total: "-3028.51"
      first_booking_on: 2026-04-01
      last_booking_on: 2026-11-06
      lines:
        - index: 0
          line:
            booking_date: 2026-11-06
            value_date: 2026-11-06
            amount: "458.98"
            counterparty_name: Partei I
            counterparty_iban: DE91100000000000001009
            purpose: Verwendungszweck 22
            booking_text: GUTSCHRIFT UEBERWEISUNG
            raw: {BIC (SWIFT-Code): TSTHDEFFXXX, Info: Umsatz gebucht}
        - index: 1
          description: A direct debit; the creditor id stays in raw.
          line:
            booking_date: 2026-11-04
            value_date: 2026-11-04
            amount: "-820.47"
            counterparty_name: Partei H
            counterparty_iban: DE21100000000000001008
            purpose: Verwendungszweck 21
            booking_text: FOLGELASTSCHRIFT
            mandate_ref: MANDAT-0002
            raw: {BIC (SWIFT-Code): TSTEDEFFXXX, Glaeubiger ID: DE98ZZZ09999999992, Info: Umsatz gebucht}
        - index: 5
          line:
            booking_date: 2026-10-30
            value_date: 2026-10-30
            amount: "-573.79"
            counterparty_name: Partei C
            counterparty_iban: DE16100000000000001001
            purpose: Verwendungszweck 17 Zeile 2 Zeile 3 Zeile 4 Zeile 5 Zeile 6
            booking_text: EINZUG RATE/ANNUITaeT
            end_to_end_ref: E2E-REF-0004
            raw: {BIC (SWIFT-Code): TSTADEFFXXX, Info: Umsatz gebucht}
        - index: 12
          description: No Verwendungszweck at all.
          line:
            booking_date: 2026-09-28
            value_date: 2026-09-28
            amount: "740.18"
            counterparty_name: Partei D
            counterparty_iban: DE32100000000000001004
            purpose: ""
            booking_text: GUTSCHRIFT UEBERWEISUNG
            raw: {BIC (SWIFT-Code): TSTDDEFFXXX, Info: Umsatz gebucht}
        - index: 13
          description: Booking and value date differ.
          line:
            booking_date: 2026-08-31
            value_date: 2026-08-30
            amount: "-1073.89"
            counterparty_name: Partei C
            counterparty_iban: DE16100000000000001001
            purpose: Verwendungszweck 9 Zeile 2 Zeile 3 Zeile 4 Zeile 5 Zeile 6
            booking_text: EINZUG RATE/ANNUITaeT
            end_to_end_ref: E2E-REF-0002
            raw: {BIC (SWIFT-Code): TSTADEFFXXX, Info: Umsatz gebucht}
        - index: 21
          description: The Rechnungsabschluss has no counterparty name.
          line:
            booking_date: 2026-04-01
            value_date: 2026-04-01
            amount: "136.69"
            counterparty_iban: DE64100000000000001010
            purpose: Verwendungszweck 1 Zeile 2
            booking_text: ABSCHLUSS
            raw: {BIC (SWIFT-Code): TSTIDEFFXXX, Info: Umsatz gebucht}

