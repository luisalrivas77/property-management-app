        "DE50100000000000000001";"05.01.27";"05.01.27";"LASTSCHRIFT";"Strom";"";"";"";"";"";"";"Stadtwerke";"DE86100000000000001002";"";"-45,00";"EUR";"Umsatz vorgemerkt"
        "DE50100000000000000001";"04.01.27";"04.01.27";"GUTSCHRIFT";"Miete 01/2027";"";"";"NOTPROVIDED";"";"";"";"Erika Beispiel";"DE16100000000000001001";"";"1400,00";"EUR";"Umsatz gebucht"
        "DE50100000000000000001";"04.01.27";"";"LASTSCHRIFT";"Versicherung";"";"";"";"";"";"";"Versicherung AG";"DE59100000000000001003";"";"-12,50";"EUR";"Umsatz vorgemerkt"
    expect:
