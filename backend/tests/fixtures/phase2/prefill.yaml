# Rule fixture: building a pre-fill proposal (hausbuch.rules.prefill.build_proposal)
#
# build_proposal(kind: ExtractionKind | None, extraction, context: PrefillContext)
#   -> list[ProposalRecord]
# Spec: docs/phases/phase-2.md §6.2 (what each kind proposes), §6.3, D14, D15. Pure: no I/O, no
# model. kind null = the classifier found nothing with a field set (a letter, "other"): the
# extraction is the typing fields only (title, document_date).
#
# extraction: per field either a full ExtractedValue or the shorthand {v, p, q} = a value cited
# on page p with quote q that passed every check (checks cited, value_in_quote, validates;
# confidence high). Fields not listed are ExtractedValue.missing().
#
# Records (key -> entity_type), created in this order when the kind proposes them:
#   typing (typing), property (property), correction:<field> (property), unit (unit),
#   price_split (price_split), ownership (ownership), cost:<kind> (acquisition_cost),
#   loan (loan), tenant:<n> (tenant), tenancy (tenancy), rent (rent_schedule),
#   deposit_received (deposit_received), link:property / link:loan / link:tenancy (link),
#   tax_input:private_cost:<category> (tax_input, D135).
# Fields are named by the *Create / *Patch field ("address.city" for a nested one). Not fields:
# what apply supplies itself: the document (Beleg, evidence, rent document_id), the id of a
# record created in the same apply, a split's source (purchase_contract), the property a
# unit / split / ownership / cost belongs to (the link:property record's target, or the property
# created in the same apply) and a tenancy's parties (tenant:1 primary, tenant:2 co_tenant).
#
# A field's ExtractedValue:
#   copied   the extraction field's ExtractedValue; a value may be mapped to the target type
#            (Wohnungseigentum -> etw, Notar -> notary, Barkaution -> cash_account) and keeps
#            its source, checks and confidence. A field the extraction did not state is proposed
#            as missing (value null) when the *Create model requires it, so the form asks.
#   derived  computed by code: source null, derived_from = the extraction fields it used,
#            checks [derived, validates], confidence = the lowest of its inputs' (a missing
#            input counts as low). building_share = (purchase_price - land_value) /
#            purchase_price, six places, half-up; monthly_payment = principal * (nominal_rate +
#            initial_repayment_rate) / 12, cents, half-up, only when the contract states no rate;
#            ownership shares from the clause ("je zur Hälfte" -> 1/2 each, in buyers order);
#            rent operating_costs_prepayment = Betriebskosten + Heizkosten when both are stated;
#            tenancy rent_model from rent_clause (Staffel -> staffel, Index -> index, none ->
#            fixed); tenancy unit_id = the unit matched by address and unit label (lease
#            unit, below; null when none or several match);
#            tenancy deposit_form = cash_account from [deposit_amount, deposit_clause] when the
#            amount is above 0 and the clause names no form or is missing (low confidence: the
#            clause was not understood), missing (value null) from the same inputs when the
#            amount is stated but not a number. A clause that names no form, with no positive
#            amount, is proposed as missing with its quote. "bar" counts only as a whole word
#            ("vereinbart" is not cash); Barzahlung, Bareinzahlung, Barsicherheit, Bargeld are.
#            D152 (11 Nov 2026): tenancy operating_costs_terms from operating_costs_clause
#            (a Pauschale, or no Abrechnung -> flat_rate; an Inklusiv- or Warmmiete ->
#            included, unless the lease also states an operating_costs_prepayment above 0;
#            a Vorauszahlung or Abschlag -> prepayment) and rent_due_day from rent_due_clause
#            (the day named, the n-th Werktag as day n, 1-28; tests/rules/
#            test_prefill_lease_terms.py has the wordings). Each derived from its clause
#            and keeping the clause's source (checks cited, derived and, with a value,
#            validates; the clause's confidence). A clause not stated: the field is not
#            proposed. A clause code cannot map: value null, confidence low, and a note on
#            the tenancy record ("nicht eindeutig" / "kein Tag"). On a tenancy that exists
#            (patch), a field is proposed only when its value is not null and differs from
#            the context's (operating_costs_terms, rent_due_day of ExistingTenancy, defaults
#            prepayment and 3), and current holds exactly those fields' stored values.
#   typing   type and subtype come from context.classification: value, no source, checks
#            [validates], the classifier's confidence. subtype only when the classifier gave one,
#            except on a financing bill (below, D138).
#            An invoice's tax_year is derived (D36): the year of due_on, else of document_date
#            (derived_from names the one used); neither stated -> not proposed.
#            D132 (10 Nov 2026): typing also carries the kind's hand-entry fields
#            (services.documents / rules.hand_fields HAND_FIELD_MAP) under their hand-field
#            names (amount_total, period_start, period_end, counterparty, reference, notes),
#            copied from the reading field each maps to, null when the reading holds none.
#            Left out: a hand field whose reading field another record proposes (an
#            invoice's amount_total in its cost record) or a new record's card asks for
#            (a new cost row's note <- reference; a new loan's lender and contract_number).
# Financing invoices (D35): an invoice whose subject or title, or a Bescheid whose title,
#   contains grundschuld, grundpfandrecht, hypothek or darlehen (casefolded, anywhere) proposes no cost:<kind> record (not create, patch or
#   unchanged) and, in typing, subtype financing_invoice (D138, 11 Nov 2026; before it, no
#   subtype) whatever the classifier said: a code value, no source, checks [validates],
#   confidence that of the subject or title naming the term (the higher when both do), else of
#   cost_lines when the lines alone make it a financing bill; typing's notes contain
#   "Geldbeschaffungskosten", plus "aus den Nebenkosten" when a cost row already has this
#   document as its Beleg; link:property as usual; link:loan when the property has exactly
#   one loan in the context. D135: plus tax_input:private_cost:loan_fees for the whole bill
#   (below) unless context.paid_from_rental_account.
# Cost lines (D135, 10 Nov 2026): an invoice's or Bescheid's cost_lines (items
#   "text | amount | code") are used when the value has the check validates and the lines
#   sum to amount_total within 0.01; otherwise the bill is booked whole, as above. Each line
#   that is not the Umsatzsteuer (code vat, or a text naming umsatzsteuer / mehrwertsteuer /
#   ust / mwst) takes, in this order: loan_fees when its text names a financing term;
#   acquisition_cost when it names a purchase term (auflassungsvormerkung,
#   eigentumsumschreibung, eintragung des eigentümers, eigentümerwechsel, kaufvertrag);
#   loan_fees when the bill is a financing bill (above) and no line names a purchase term;
#   else the line's own code. A line left without a category: the bill stays whole. The
#   Umsatzsteuer is shared over the categories by their net sums (largest remainder, cents);
#   the last category takes any cent between the lines and the total. Every line loan_fees:
#   the bill is a financing bill (subtype financing_invoice, the note). Otherwise:
#   - the acquisition_cost part is the cost:<kind> record, by the cost rules below, with
#     amount = that part (amount_total itself when it is the whole bill, else derived from
#     [cost_lines, amount_total]);
#   - link:property; link:loan as for a financing bill when a loan_fees part exists, its
#     notes containing "Darlehen" and "Kauf" (only the financing part concerns the loan);
#   - each deductible part (categories.TAX_TREATMENT deductible) is a create record
#     tax_input:private_cost:<category> {tax_year (the invoice tax year, D36), value.cost_class
#     (financing for loan_fees, else other; code), value.category (code), value.label (the
#     title, else the sender; copied), value.amount (the part, as above; the whole bill's
#     total copied)}, notes contain "anderen Konto" and "Mietkonto"; none when
#     context.paid_from_rental_account, then typing's notes contain "vom Mietkonto";
#   - typing's notes contain "aufgeteilt" when there are two parts or more, and "Nicht
#     vorgeschlagen" naming a part of an undecided category (renovation, other_expense).
#   The catalogue's invoices are not sorted.
#
# Matching existing records (casefold, whitespace collapsed; never by a tenant whose name was
# erased):
#   property  street + house_number + postal_code. Match -> mode unchanged when every compared
#             field equals the context's value, else patch with the differing fields; a
#             milestone date that differs (notarized_on, purchase_date) is never patched: it
#             gets its own record correction:<field>, mode correction (§6.5, routed through
#             correct_*). Fields the extraction does not state are not compared or proposed.
#             current = the context's values of the record's fields.
#   unit      label on the matched property: same rule, compared on what ExistingUnit holds
#             (label, mea); fields the context does not hold are not proposed for a match.
#             This is the Kaufvertrag's unit record: its label match stays exact (casefold,
#             whitespace collapsed).
#   lease unit (a tenancy's unit_id; added 7 Nov 2026) on the property found by address: by
#             key, not exact text. A label's key is its tokens: runs of letters or runs of
#             digits, casefolded, a number without leading zeros ("03" -> "3", "0" stays),
#             the filler words nr, no and nummer dropped; punctuation and brackets only
#             separate ("WE03" -> we 3; "Zimmer Nr. 1 (WE 3, Zimmer 1)" -> zimmer 1 we 3
#             zimmer 1). First the units whose key equals the label's: exactly one is the
#             unit. Else the units whose key occurs as a run of whole tokens inside the
#             label's key: exactly one is the unit ("Zimmer 1" is never inside "Zimmer 10").
#             Only a unit key with both a word and a number takes part in this second step
#             (from the review, 7 Nov 2026): a bare number ("1") is inside any label that
#             mentions that number for another reason ("Wohnung 1. OG"), and a bare word
#             ("EG", "Zimmer") says nothing about which one; those match only when equal.
#             A label that names a room (the word zimmer) never lands on a unit whose key
#             has no zimmer: a room lease read before the rooms exist must not be booked on
#             the flat, since a tenancy cannot be moved to another unit. A unit found this
#             second way is proposed at most at medium confidence (it was not an equal
#             label; tests/rules/test_prefill.py checks it). Several candidates, or none: no
#             unit (unit_id null, never a guess); the review then picks it. No label
#             stated: the property's only unit, else none.
#   cost      its kind: the first of sender, subject and title whose text names one
#             (grunderwerbsteuer, notar, grundbuch or amtsgericht, makler; that value's
#             quote kept), else the bill's lines when every purchase line names the land
#             register or a land-register entry (auflassungsvormerkung,
#             eigentumsumschreibung, eintragung des eigentümers; lines naming a financing
#             term ignored) -> land_registry, cost_lines' quote kept; else other (11 Nov
#             2026: a Grundbuch bill sent by a Landesjustizkasse names no kind in its
#             sender). Then checked in this order:
#             1. a row whose Beleg is this document (document_id = context.document_id; Luis
#                typed the cost and attached the invoice himself) -> that row is the target,
#                whatever its kind (kind is not compared or proposed): mode unchanged when
#                amount and note equal the extraction's (values = both), else patch with the
#                differing ones (amount and/or note). Never a second row for the same Beleg.
#             2. a row of that kind on the property without a Beleg (document_id null) ->
#                patch (amount, note; the apply attaches this document).
#             3. otherwise create (a row of that kind with a different Beleg is another bill:
#                two notary invoices are real).
#             current = the row's values of the record's fields (note null when it has none).
#             In 2, among several rows without a Beleg the one whose amount equals the
#             reading's within 0.01 wins, then the smallest id (D145: a second buyer's notice
#             fills the row the first one left waiting).
#             D145 (11 Nov 2026), one buyer's Grunderwerbsteuerbescheid: when the kind is
#             bescheid, the cost kind is real_estate_transfer_tax, the row found by 1 or 2 is a
#             real_estate_transfer_tax row too, and the amount read B is more than 0.01 below
#             the row's amount A, the row is never lowered alone: cost:real_estate_transfer_tax
#             patches it to B (fields as in 1 or 2; notes contain "nicht gesenkt") and
#             cost:real_estate_transfer_tax:other_notice creates the rest {kind (code,
#             real_estate_transfer_tax), amount = A - B derived from the fields B came from
#             ([amount_total], or [cost_lines, amount_total] for a part), note (code)
#             "Grunderwerbsteuer, weiterer Bescheid (z. B. des Miteigentümers)"}, notes
#             contain "anderen Käufers"; the apply creates it without a Beleg. B >= A (within
#             0.01) or no row: as above. Only while no notice has been processed: when the
#             property holds another real_estate_transfer_tax row (not the one found) with a
#             Beleg, or whose note is that label, the row is patched as in 1 or 2 (no
#             other_notice record).
#   loan      contract_number with whitespace removed, and lender -> patch with every stated
#             field except the two keys and signed_on (LoanPatch has none: a contract date is
#             set when the loan is created); current null (the context does not hold loan
#             terms). The one exception is interest_only_before_first_payment, which the
#             context does hold (ExistingLoan): proposed on a patch only when it would change
#             false to true (added 8 Nov 2026).
# Darlehensvertrag (added 8 Nov 2026, Luis's Sparkasse contract): a create proposes signed_on
#   and follow_up_rate (the Sollzins after the Zinsbindung) when stated, copied.
#   interest_only_before_first_payment = true, derived from [interest_only_clause], when the
#   clause is stated and says only interest is paid until repayment starts: it matches
#   "nur (die )?(soll)?zinsen", casefolded ("Bis zum Tilgungsbeginn sind nur die Sollzinsen
#   ... zu zahlen"). A clause that does not say so, or none: the field is not proposed (the
#   loan keeps its default, false). contract_number arrives without its label: the parser
#   removes it (extraction_parse.yaml).
#   tenant    exact full_name -> patch with the stated fields except full_name; current null.
#   linked property for costs and Bescheide without an address: the only property in the
#             context (with several, no link:property and no cost scope is proposed: not in
#             these cases).
# Kautionsnachweis (D42): with amount and received_on both stated and exactly one tenancy found,
#   a deposit_received record (amount, received_on copied; tenancy_id derived from [amount] when
#   the tenancy is the one whose deposit_amount equals the amount; when it is the workspace's
#   only tenancy, a code value: no source, checks [validates], confidence low) plus link:tenancy
#   (target = that tenancy). Several tenancies whose deposit_amount equals the amount, or none and not exactly
#   one tenancy: typing only, typing's notes contain "Mietverhältnis". A receipt already recorded
#   on that tenancy with the same amount and date: mode unchanged, target_id = the tenancy,
#   values and current = amount and received_on.
# Kaufvertrag: an ETW's floor_area_m2 is also proposed as the property's living_area_m2 (D139,
# 11 Nov 2026: in the create, or compared like every property field on a match, so a
# differing stored area is proposed for change); the unit keeps it as before. No price_split
# without land_value; ownership only when every buyer is an owner
# by name and the clause is understood; purchase_date null with the Übergang clause quoted in
# the property's notes when the contract ties it to the payment; no property label is proposed
# (PropertyCreate.label is the user's name for it).
# Zahlungsnachweis (phase 3 D143, 11 Nov 2026): a payment_proof is typed by code when it is
#   uploaded from a bill's „Zahlungsnachweis fehlt“ to-do (type other, subtype payment_proof,
#   never the classifier) and linked to that bill; context.proof_bill holds the bill: its id,
#   the acquisition cost rows that carry it as Beleg and its private_cost rows in force
#   ({id, tax_year, label, amount}). The bill's amount is its combined total: the sum of the
#   acquisition cost rows' amounts plus the private_cost rows' amounts (a bill split into a
#   purchase part and a part paid from another account was paid as one). Typing carries
#   the hand fields amount_total (<- amount) and counterparty (<- payee). The proof's amount
#   (its magnitude) matches when it equals the bill's amount within 0.01; then, with paid_on
#   stated, each private_cost row whose tax_year is not paid_on's year gets a record
#   private_cost_year:<n> (n from 1, rows by id) {entity_type tax_input, mode patch, target_id
#   the row, fields tax_year = paid_on's year derived from [paid_on, amount], current
#   {tax_year: the row's}}, notes contain "§11"; the apply withdraws the row and creates the
#   same value in the new year (append-only, D143). An acquisition cost row is never moved (it
#   has no year). An amount that does not match: no year record, typing's notes contain
#   "passt nicht"; an amount not read: no year record, typing's notes contain "nicht gelesen".
#   (Until D149 a proof without a proof_bill was typing only; see below.)
# Zahlungsnachweis, uploaded anywhere (phase 3 D149, 11 Nov 2026): the classifier types it
#   other / payment_proof too. Every payment_proof's typing gets tax_year = the year of paid_on,
#   else of document_date, derived from that field (the year the money left, §11 EStG; as D146
#   files a Grunderwerbsteuerbescheid). On the to-do path the typing's notes name the bill:
#   "Zahlungsnachweis für: <title> vom <date>, <amount>" plus " – Betrag passt" (or "passt
#   nicht") once compared. Without a proof_bill, context.proof_candidates holds the bills that
#   still wait for a proof (each an ExistingProofBill with title and document_date); none: typing
#   only, its notes contain "Keine Rechnung wartet". Otherwise a record link:document {entity_type
#   link, mode create, fields target_id} offers every candidate in options.target_id ({value: the
#   bill's id, label: "<title> vom <date>, <amount> – Betrag passt / passt zu einem Teil der
#   Rechnung / passt nicht"}), candidates by date then id. A candidate fits (rules.proof_match)
#   when the proof's magnitude is within 0.01 of its combined total or its private part alone
#   (whole), or of one of its acquisition cost rows (part: one buyer's Grunderwerbsteuer, D145),
#   or of one of its parts (part, D150): ExistingProofBill.parts, the amounts of the cost lines
#   the bill's reading states, used only when they sum to its combined total within 0.01 (a
#   credit line or one of 0.00 is no part).
#   Exactly one fits: target_id is its id derived from [amount], the notes name it, and a whole
#   fit proposes the year moves as on the to-do path; several or none: target_id null and the
#   notes ask to pick one or „keine dieser Rechnungen“.
#
# expect: keys = the exact set of record keys returned. records = the records checked in
# detail: entity_type, mode, target_id; values = every field of the record with its value (the
# record has exactly these fields); derived = the derived fields and their derived_from (every
# other field has none); current; notes_contain = substrings of the record's notes.
# The rule test runs every case a second time with each context list shuffled: same result.

ids:
  document: &DOC 0000000d-0000-4000-8000-000000000100
  property: &P 0000000b-0000-4000-8000-000000000001
  property_2: &P2 0000000b-0000-4000-8000-000000000002
  unit: &U 0000000c-0000-4000-8000-000000000001
  unit_2: &U2 0000000c-0000-4000-8000-000000000002
  unit_3: &U3 0000000c-0000-4000-8000-000000000003
  owner_1: &O1 00000010-0000-4000-8000-000000000001
  owner_2: &O2 00000010-0000-4000-8000-000000000002
  cost_grest: &C1 00000011-0000-4000-8000-000000000001
  cost_notary: &C2 00000011-0000-4000-8000-000000000002
  cost_grest_odd: &C3 00000011-0000-4000-8000-000000000003
  cost_grest_rest: &C4 00000011-0000-4000-8000-000000000004
  document_other: &DOC_OTHER 0000000d-0000-4000-8000-000000000101
  loan: &L 0000000f-0000-4000-8000-000000000001
  loan_2: &L2 0000000f-0000-4000-8000-000000000002
  tenant_1: &N1 00000012-0000-4000-8000-000000000001
  tenancy_1: &T1 00000013-0000-4000-8000-000000000001
  tenancy_2: &T2 00000013-0000-4000-8000-000000000002
  tenancy_3: &T3 00000013-0000-4000-8000-000000000003
