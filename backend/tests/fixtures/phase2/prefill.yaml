  # --- D147: a Gutachten (appraisal) proposes the shorter useful life (§7 Abs. 4 S. 2 EStG) ---
  # An appraisal is in the property group (address asked, link:property by address, else the
  # only property) and is also asked remaining_useful_life (decimal, years as written) and
  # valuation_date (the Stichtag). With the property found and a life above 0 read, a record
  # tax_input:useful_life (create) {tax_year, value.years}, both derived from
  # [remaining_useful_life, valuation_date]. The life counts from the handover (purchase_date):
  # a Stichtag before it takes off the whole calendar months between them (a month counts once
  # its day of the month is reached); rounded UP to whole years. A Stichtag on or after the
  # handover in the purchase year, or none: as read (rounded up), from the purchase year. A
  # Stichtag in a later year than the handover: as read, from the Stichtag's year (phase 3 D79
  # restarts the life in a row's first year). The record's note states the figure, the
  # Stichtag and how the years follow. Not shorter than the statutory life left on 1 January of
  # that year (services.tax_inputs' check: 12 / AfA rate of the build year, less the months
  # owned), or no life left: no record, a note on typing. No life read: nothing, no note.
  # Records: typing, link:property, tax_input:useful_life.

  - id: appraisal_stichtag_before_handover_rounded_up
    description: >-
      D147. A Restnutzungsdauer-Gutachten for the Lindenstraße flat (handover 01.05.2026): 24
      years at 15.03.2025; 13 whole months passed (the 1st of May is before the 15th), 288 - 13
      = 275 months, rounded up to 23 years from 2026.
    kind: general
    context:
      document_id: *DOC
      classification: &CL_GUTACHTEN {type: other, subtype: appraisal, contains_tenant_data: false, language: de, confidence: high}
      properties: [*PROP_LINDEN, *PROP_KASTANIEN]
    extraction:
      title: &GA_TITLE {v: Gutachten Restnutzungsdauer, p: 1, q: "Gutachten zum Nachweis einer kürzeren Nutzungsdauer"}
      document_date: &GA_DATE {v: "2025-04-02", p: 1, q: "Berlin, 02.04.2025"}
      street: &GA_STREET {v: Lindenstraße, p: 1, q: "Bewertungsobjekt: Lindenstraße 12, 10115 Berlin"}
      house_number: &GA_NUMBER {v: "12", p: 1, q: "Bewertungsobjekt: Lindenstraße 12, 10115 Berlin"}
      postal_code: &GA_PLZ {v: "10115", p: 1, q: "Bewertungsobjekt: Lindenstraße 12, 10115 Berlin"}
      remaining_useful_life: {v: "24", p: 4, q: "Restnutzungsdauer: 24 Jahre"}
      valuation_date: {v: "2025-03-15", p: 1, q: "Wertermittlungsstichtag: 15.03.2025"}
    expect:
      keys: [typing, link:property, tax_input:useful_life]
      records:
        - key: typing
          entity_type: typing
          mode: create
          values: {type: other, subtype: appraisal, title: Gutachten Restnutzungsdauer, document_date: "2025-04-02", amount_total: null, period_start: null, period_end: null, counterparty: null, reference: null, notes: null}
        - key: link:property
          entity_type: link
          mode: create
          target_id: *P
          values: {}
        - key: tax_input:useful_life
          entity_type: tax_input
          mode: create
          values: {tax_year: 2026, value.years: 23}
          derived: {tax_year: [remaining_useful_life, valuation_date], value.years: [remaining_useful_life, valuation_date]}
          notes_contain:
            - "Das Gutachten nennt 24 Jahre zum 15.03.2025; bis zur Übergabe am 01.05.2026 sind 1 Jahr und 1 Monat vergangen, daher 23 Jahre ab 2026."
            - aufgerundet
            - gesetzlichen 50 Jahre

