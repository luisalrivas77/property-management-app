  # --- Kautionsnachweis (D42) ------------------------------------------------------------

  - id: kautionsnachweis_tenancy_found_by_amount
    description: Two tenancies; the receipt's amount equals one tenancy's agreed Kaution, so it is that one.
    kind: deposit_record
    context:
      document_id: *DOC
      classification: &CL_DEPOSIT {type: letter, subtype: deposit_record, contains_tenant_data: true, language: de, confidence: high}
      properties: [*PROP_LINDEN, *PROP_KASTANIEN]
      units:
        - {id: *U, property_id: *P, label: WE 3}
        - {id: *U2, property_id: *P2, label: WE 3}
      tenancies:
        - {id: *T1, unit_id: *U, start_date: 2026-07-01, deposit_amount: "3450.00"}
        - {id: *T2, unit_id: *U2, start_date: 2024-02-01, deposit_amount: "2400.00"}
    extraction: &KAUTION
      title: {v: Kautionsnachweis Mietkautionskonto, p: 1, q: "Bestätigung Mietkautionskonto"}
      document_date: {v: "2026-07-03", p: 1, q: "Berlin, 03.07.2026"}
      amount: {v: "3450.00", p: 1, q: "Kautionsbetrag 3.450,00 EUR"}
      received_on: {v: "2026-07-02", p: 1, q: "eingegangen am 02.07.2026"}
    expect:
      keys: [typing, deposit_received, link:tenancy]
      records:
        - key: typing
          entity_type: typing
          mode: create
          values: {type: letter, subtype: deposit_record, title: Kautionsnachweis Mietkautionskonto, document_date: "2026-07-03"}
        - key: deposit_received
          entity_type: deposit_received
          mode: create
          values: {amount: "3450.00", received_on: "2026-07-02", tenancy_id: *T1}
          derived: {tenancy_id: [amount]}
        - key: link:tenancy
          entity_type: link
          mode: create
          target_id: *T1
          values: {}

  - id: kautionsnachweis_only_tenancy
    description: The first of three instalments matches no agreed Kaution; the workspace has one tenancy, so it is that one.
    kind: deposit_record
    context:
      document_id: *DOC
