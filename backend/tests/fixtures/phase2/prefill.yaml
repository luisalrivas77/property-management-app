# Rule fixture: building a pre-fill proposal (hausbuch.rules.prefill.build_proposal)
#
# build_proposal(kind: ExtractionKind | None, extraction, context: PrefillContext)
#   -> list[ProposalRecord]
# Spec: docs/phases/phase-2.md §6.2 (what each kind proposes), §6.3, D14, D15. Pure: no I/O, no
# model. kind null = the classifier found nothing with a field set (a letter, "other"): the
# extraction is the typing fields only (title, document_date).
#
# extraction: per field either a full ExtractedValue or the shorthand {v, p, q} = a value cited
# on page p with quote q that passed every check (checks cited, value_in_quote, validates;
# confidence high). Fields not listed are ExtractedValue.missing().
#
# Records (key -> entity_type), created in this order when the kind proposes them:
#   typing (typing), property (property), correction:<field> (property), unit (unit),
#   price_split (price_split), ownership (ownership), cost:<kind> (acquisition_cost),
#   loan (loan), tenant:<n> (tenant), tenancy (tenancy), rent (rent_schedule),
#   deposit_received (deposit_received), link:property / link:loan / link:tenancy (link).
# Fields are named by the *Create / *Patch field ("address.city" for a nested one). Not fields:
# what apply supplies itself: the document (Beleg, evidence, rent document_id), the id of a
# record created in the same apply, a split's source (purchase_contract), the property a
# unit / split / ownership / cost belongs to (the link:property record's target, or the property
# created in the same apply) and a tenancy's parties (tenant:1 primary, tenant:2 co_tenant).
#
# A field's ExtractedValue:
#   copied   the extraction field's ExtractedValue; a value may be mapped to the target type
#            (Wohnungseigentum -> etw, Notar -> notary, Barkaution -> cash_account) and keeps
#            its source, checks and confidence. A field the extraction did not state is proposed
#            as missing (value null) when the *Create model requires it, so the form asks.
#   derived  computed by code: source null, derived_from = the extraction fields it used,
#            checks [derived, validates], confidence = the lowest of its inputs' (a missing
#            input counts as low). building_share = (purchase_price - land_value) /
#            purchase_price, six places, half-up; monthly_payment = principal * (nominal_rate +
#            initial_repayment_rate) / 12, cents, half-up, only when the contract states no rate;
#            ownership shares from the clause ("je zur Hälfte" -> 1/2 each, in buyers order);
#            rent operating_costs_prepayment = Betriebskosten + Heizkosten when both are stated;
#            tenancy rent_model from rent_clause (Staffel -> staffel, Index -> index, none ->
#            fixed); tenancy unit_id = the unit matched by address and unit label (lease
#            unit, below; null when none or several match);
#            tenancy deposit_form = cash_account from [deposit_amount, deposit_clause] when the
#            amount is above 0 and the clause names no form or is missing (low confidence: the
#            clause was not understood), missing (value null) from the same inputs when the
#            amount is stated but not a number. A clause that names no form, with no positive
#            amount, is proposed as missing with its quote. "bar" counts only as a whole word
#            ("vereinbart" is not cash); Barzahlung, Bareinzahlung, Barsicherheit, Bargeld are.
#   typing   type and subtype come from context.classification: value, no source, checks
#            [validates], the classifier's confidence. subtype only when the classifier gave one.
#            An invoice's tax_year is derived (D36): the year of due_on, else of document_date
#            (derived_from names the one used); neither stated -> not proposed.
# Financing invoices (D35): an invoice whose subject or title, or a Bescheid whose title,
#   contains grundschuld, hypothek or darlehen (casefolded, anywhere) proposes no cost:<kind> record (not create, patch or
#   unchanged) and no subtype in typing, whatever the classifier said; typing's notes contain
#   "Geldbeschaffungskosten", plus "aus den Nebenkosten" when a cost row already has this
#   document as its Beleg; link:property as usual; link:loan when the property has exactly
#   one loan in the context.
#
# Matching existing records (casefold, whitespace collapsed; never by a tenant whose name was
# erased):
#   property  street + house_number + postal_code. Match -> mode unchanged when every compared
#             field equals the context's value, else patch with the differing fields; a
#             milestone date that differs (notarized_on, purchase_date) is never patched: it
#             gets its own record correction:<field>, mode correction (§6.5, routed through
#             correct_*). Fields the extraction does not state are not compared or proposed.
#             current = the context's values of the record's fields.
#   unit      label on the matched property: same rule, compared on what ExistingUnit holds
#             (label, mea); fields the context does not hold are not proposed for a match.
#             This is the Kaufvertrag's unit record: its label match stays exact (casefold,
#             whitespace collapsed).
#   lease unit (a tenancy's unit_id; added 7 Nov 2026) on the property found by address: by
#             key, not exact text. A label's key is its tokens: runs of letters or runs of
#             digits, casefolded, a number without leading zeros ("03" -> "3", "0" stays),
#             the filler words nr, no and nummer dropped; punctuation and brackets only
#             separate ("WE03" -> we 3; "Zimmer Nr. 1 (WE 3, Zimmer 1)" -> zimmer 1 we 3
#             zimmer 1). First the units whose key equals the label's: exactly one is the
#             unit. Else the units whose key occurs as a run of whole tokens inside the
#             label's key: exactly one is the unit ("Zimmer 1" is never inside "Zimmer 10").
#             Only a unit key with both a word and a number takes part in this second step
#             (from the review, 7 Nov 2026): a bare number ("1") is inside any label that
#             mentions that number for another reason ("Wohnung 1. OG"), and a bare word
#             ("EG", "Zimmer") says nothing about which one; those match only when equal.
#             A label that names a room (the word zimmer) never lands on a unit whose key
#             has no zimmer: a room lease read before the rooms exist must not be booked on
#             the flat, since a tenancy cannot be moved to another unit. A unit found this
#             second way is proposed at most at medium confidence (it was not an equal
#             label; tests/rules/test_prefill.py checks it). Several candidates, or none: no
#             unit (unit_id null, never a guess); the review then picks it. No label
#             stated: the property's only unit, else none.
#   cost      checked in this order:
#             1. a row whose Beleg is this document (document_id = context.document_id; Luis
#                typed the cost and attached the invoice himself) -> that row is the target,
#                whatever its kind (kind is not compared or proposed): mode unchanged when
#                amount and note equal the extraction's (values = both), else patch with the
#                differing ones (amount and/or note). Never a second row for the same Beleg.
#             2. a row of that kind on the property without a Beleg (document_id null) ->
#                patch (amount, note; the apply attaches this document).
#             3. otherwise create (a row of that kind with a different Beleg is another bill:
#                two notary invoices are real).
#             current = the row's values of the record's fields (note null when it has none).
#   loan      contract_number with whitespace removed, and lender -> patch with every stated
#             field except the two keys; current null (the context does not hold loan terms).
#   tenant    exact full_name -> patch with the stated fields except full_name; current null.
#   linked property for costs and Bescheide without an address: the only property in the
#             context (with several, no link:property and no cost scope is proposed: not in
#             these cases).
# Kautionsnachweis (D42): with amount and received_on both stated and exactly one tenancy found,
#   a deposit_received record (amount, received_on copied; tenancy_id derived from [amount] when
#   the tenancy is the one whose deposit_amount equals the amount; when it is the workspace's
#   only tenancy, a code value: no source, checks [validates], confidence low) plus link:tenancy
#   (target = that tenancy). Several tenancies whose deposit_amount equals the amount, or none and not exactly
#   one tenancy: typing only, typing's notes contain "Mietverhältnis". A receipt already recorded
#   on that tenancy with the same amount and date: mode unchanged, target_id = the tenancy,
#   values and current = amount and received_on.
# Kaufvertrag: no price_split without land_value; ownership only when every buyer is an owner
# by name and the clause is understood; purchase_date null with the Übergang clause quoted in
# the property's notes when the contract ties it to the payment; no property label is proposed
# (PropertyCreate.label is the user's name for it).
#
# expect: keys = the exact set of record keys returned. records = the records checked in
# detail: entity_type, mode, target_id; values = every field of the record with its value (the
# record has exactly these fields); derived = the derived fields and their derived_from (every
# other field has none); current; notes_contain = substrings of the record's notes.
# The rule test runs every case a second time with each context list shuffled: same result.

ids:
  document: &DOC 0000000d-0000-4000-8000-000000000100
  property: &P 0000000b-0000-4000-8000-000000000001
  property_2: &P2 0000000b-0000-4000-8000-000000000002
  unit: &U 0000000c-0000-4000-8000-000000000001
  unit_2: &U2 0000000c-0000-4000-8000-000000000002
  unit_3: &U3 0000000c-0000-4000-8000-000000000003
  owner_1: &O1 00000010-0000-4000-8000-000000000001
  owner_2: &O2 00000010-0000-4000-8000-000000000002
  cost_grest: &C1 00000011-0000-4000-8000-000000000001
  cost_notary: &C2 00000011-0000-4000-8000-000000000002
  document_other: &DOC_OTHER 0000000d-0000-4000-8000-000000000101
  loan: &L 0000000f-0000-4000-8000-000000000001
  loan_2: &L2 0000000f-0000-4000-8000-000000000002
  tenant_1: &N1 00000012-0000-4000-8000-000000000001
  tenancy_1: &T1 00000013-0000-4000-8000-000000000001
  tenancy_2: &T2 00000013-0000-4000-8000-000000000002

shared:
  classify_kaufvertrag: &CL_KV {type: contract, subtype: purchase_contract, contains_tenant_data: false, language: de, confidence: high}
  owners: &OWNERS
    - {id: *O1, full_name: Max Beispiel}
    - {id: *O2, full_name: Erika Beispiel}
  property_linden: &PROP_LINDEN
    id: *P
    kind: etw
    address: {street: Lindenstraße, house_number: "12", postal_code: "10115", city: Berlin}
    build_year: 1994
    notarized_on: 2026-03-10
    purchase_date: 2026-05-01
    purchase_price: "289000.00"
  property_kastanien: &PROP_KASTANIEN
    id: *P2
    kind: etw
    address: {street: Kastanienallee, house_number: "5", postal_code: "10435", city: Berlin}
    build_year: 1908
    notarized_on: 2019-06-03
    purchase_date: 2019-08-01
    purchase_price: "240000.00"
  kaufvertrag: &KV
    title: {v: Kaufvertrag Lindenstraße 12 WE 3, p: 1, q: "Kaufvertrag über Wohnungseigentum"}
    document_date: {v: "2026-03-12", p: 1, q: "Verhandelt zu Berlin am 12.03.2026"}
    property_kind: {v: Wohnungseigentum, p: 2, q: "Wohnungseigentum Nr. 3"}
    street: {v: Lindenstraße, p: 2, q: "Lindenstraße 12, 10115 Berlin"}
    house_number: {v: "12", p: 2, q: "Lindenstraße 12, 10115 Berlin"}
    postal_code: {v: "10115", p: 2, q: "Lindenstraße 12, 10115 Berlin"}
    city: {v: Berlin, p: 2, q: "Lindenstraße 12, 10115 Berlin"}
    notarized_on: {v: "2026-03-12", p: 1, q: "Verhandelt zu Berlin am 12.03.2026"}
    purchase_date: {v: "2026-05-01", p: 9, q: "Besitz, Nutzen und Lasten gehen am 01.05.2026 auf den Käufer über."}
    purchase_price: {v: "289000.00", p: 6, q: "Der Kaufpreis beträgt 289.000,00 €"}
    land_value: {v: "57800.00", p: 6, q: "Vom Kaufpreis entfallen 57.800,00 € auf Grund und Boden."}
    unit_label: {v: WE 3, p: 2, q: "Wohnungseigentum Nr. 3 (WE 3)"}
    mea: {v: {numerator: 85, denominator: 1000}, p: 2, q: "85/1000 Miteigentumsanteil"}
    floor_area_m2: {v: "68.40", p: 2, q: "Wohnfläche ca. 68,40 m²"}
    buyers: {v: [Max Beispiel, Erika Beispiel], p: 1, q: "Herr Max Beispiel und Frau Erika Beispiel"}
    ownership_clause: {v: je zur Hälfte, p: 1, q: "kaufen je zur Hälfte"}
  lease_linden: &LEASE
    title: {v: Mietvertrag Lindenstraße 12 WE 3, p: 1, q: "Mietvertrag für Wohnraum"}
    document_date: {v: "2026-06-10", p: 12, q: "Berlin, den 10.06.2026"}
    street: {v: Lindenstraße, p: 1, q: "Lindenstraße 12, 10115 Berlin, WE 3"}
    house_number: {v: "12", p: 1, q: "Lindenstraße 12, 10115 Berlin, WE 3"}
    postal_code: {v: "10115", p: 1, q: "Lindenstraße 12, 10115 Berlin, WE 3"}
    city: {v: Berlin, p: 1, q: "Lindenstraße 12, 10115 Berlin, WE 3"}
    unit_label: {v: WE 3, p: 1, q: "Lindenstraße 12, 10115 Berlin, WE 3"}
    tenant_1_full_name: {v: Lena Schmidt, p: 1, q: "Mieter: Lena Schmidt"}
    start_date: {v: "2026-07-01", p: 2, q: "Das Mietverhältnis beginnt am 01.07.2026."}
    signed_on: {v: "2026-06-10", p: 12, q: "Berlin, den 10.06.2026"}
    deposit_amount: {v: "3450.00", p: 5, q: "Kaution in Höhe von 3.450,00 €"}
    deposit_clause: {v: Barkaution, p: 5, q: "als Barkaution auf ein Mietkautionskonto"}
    cold_rent: {v: "1150.00", p: 3, q: "Nettokaltmiete 1.150,00 €"}
    operating_costs_prepayment: {v: "250.00", p: 3, q: "Vorauszahlung Betriebskosten 250,00 €"}

cases:
  - id: kaufvertrag_new_property
    kind: purchase_contract
    context:
      document_id: *DOC
      classification: *CL_KV
      owners: *OWNERS
    extraction: *KV
    expect:
      keys: [typing, property, unit, price_split, ownership, link:property]
      records:
        - key: typing
          entity_type: typing
          mode: create
          values: {type: contract, subtype: purchase_contract, title: Kaufvertrag Lindenstraße 12 WE 3, document_date: "2026-03-12"}
        - key: property
          entity_type: property
          mode: create
          values:
            kind: etw
            address.street: Lindenstraße
            address.house_number: "12"
            address.postal_code: "10115"
            address.city: Berlin
            build_year: null
            notarized_on: "2026-03-12"
            purchase_date: "2026-05-01"
            purchase_price: "289000.00"
        - key: unit
          entity_type: unit
          mode: create
          values: {label: WE 3, mea: {numerator: 85, denominator: 1000}, floor_area_m2: "68.40"}
        - key: price_split
          entity_type: price_split
          mode: create
          values: {building_share: "0.800000"}
          derived: {building_share: [purchase_price, land_value]}
        - key: ownership
          entity_type: ownership
          mode: create
          values:
            shares:
              - {owner_id: *O1, share: {numerator: 1, denominator: 2}}
              - {owner_id: *O2, share: {numerator: 1, denominator: 2}}
          derived: {shares: [buyers, ownership_clause]}
        - key: link:property
          entity_type: link
          mode: create
          values: {}

  - id: kaufvertrag_existing_property
    description: The flat was typed by hand with the wrong Urkundendatum; price and the rest match.
    kind: purchase_contract
    context:
      document_id: *DOC
      classification: *CL_KV
      owners: *OWNERS
      properties: [*PROP_LINDEN, *PROP_KASTANIEN]
      units:
        - {id: *U, property_id: *P, label: WE 3, mea: {numerator: 85, denominator: 1000}}
        - {id: *U2, property_id: *P2, label: WE 3}
    extraction: *KV
    expect:
      keys: [typing, property, correction:notarized_on, unit, price_split, ownership, link:property]
      records:
        - key: property
          entity_type: property
          mode: unchanged
          target_id: *P
          values:
            kind: etw
            address.street: Lindenstraße
            address.house_number: "12"
            address.postal_code: "10115"
            address.city: Berlin
            purchase_date: "2026-05-01"
            purchase_price: "289000.00"
          current:
            kind: etw
            address.street: Lindenstraße
            address.house_number: "12"
            address.postal_code: "10115"
            address.city: Berlin
            purchase_date: "2026-05-01"
            purchase_price: "289000.00"
        - key: correction:notarized_on
          entity_type: property
          mode: correction
          target_id: *P
          values: {notarized_on: "2026-03-12"}
          current: {notarized_on: "2026-03-10"}
        - key: unit
          entity_type: unit
          mode: unchanged
          target_id: *U
          values: {label: WE 3, mea: {numerator: 85, denominator: 1000}}
          current: {label: WE 3, mea: {numerator: 85, denominator: 1000}}
        - key: link:property
          entity_type: link
          mode: create
          target_id: *P
          values: {}

  - id: kaufvertrag_existing_property_street_abbreviated
    description: >-
      The flat was typed by hand as "Lindenstraße"; the contract's later pages write "Lindenstr."
      (added 7 Nov 2026, after Luis's real contract used both). The address still finds the
      flat, the stored spelling is not proposed for change, and with no unit label stated no
      unit is proposed for it.
    kind: purchase_contract
    context:
      document_id: *DOC
      classification: *CL_KV
      owners: *OWNERS
      properties: [*PROP_LINDEN, *PROP_KASTANIEN]
      units:
        - {id: *U, property_id: *P, label: WE 3, mea: {numerator: 85, denominator: 1000}}
    extraction:
      <<: *KV
      street: {value: Lindenstr., source: {page: 21, quote: "Lindenstr. 12, 10115 Berlin"}, checks: [cited, value_in_quote, validates], confidence: high}
      unit_label: {value: null, confidence: low}
    expect:
      keys: [typing, property, correction:notarized_on, price_split, ownership, link:property]
      records:
        - key: property
          entity_type: property
          mode: unchanged
          target_id: *P
          values:
            kind: etw
            address.street: Lindenstr.
            address.house_number: "12"
            address.postal_code: "10115"
            address.city: Berlin
            purchase_date: "2026-05-01"
            purchase_price: "289000.00"
          current:
            kind: etw
            address.street: Lindenstraße
            address.house_number: "12"
            address.postal_code: "10115"
            address.city: Berlin
            purchase_date: "2026-05-01"
            purchase_price: "289000.00"
        - key: link:property
          entity_type: link
          mode: create
          target_id: *P
          values: {}

  - id: kaufvertrag_other_house_number_is_another_property
    description: >-
      A contract for Lindenstraße 1-2 is not the flat at Lindenstraße 12 (review of the street
      fix, 7 Nov 2026): a hyphen or slash in a house number is significant, so a new property
      is proposed, visibly, instead of a silent match.
    kind: purchase_contract
    context:
      document_id: *DOC
      classification: *CL_KV
      owners: *OWNERS
      properties: [*PROP_LINDEN]
    extraction:
      <<: *KV
      house_number: {value: 1-2, source: {page: 2, quote: "Lindenstraße 1-2, 10115 Berlin"}, checks: [cited, value_in_quote, validates], confidence: high}
    expect:
      keys: [typing, property, unit, price_split, ownership, link:property]
      records:
        - key: property
          entity_type: property
          mode: create
          values:
            kind: etw
            address.street: Lindenstraße
            address.house_number: 1-2
            address.postal_code: "10115"
            address.city: Berlin
            build_year: null
            notarized_on: "2026-03-12"
            purchase_date: "2026-05-01"
            purchase_price: "289000.00"
        - key: link:property
          entity_type: link
          mode: create
          values: {}

  - id: kaufvertrag_existing_property_without_postal_code
    description: >-
      The contract names the flat by its land register entry and "Lindenstraße 12" but states
      no postal code (added 7 Nov 2026, after Luis's real contract): street and house number,
      plus the city when the document states one, find the flat when exactly one property fits.
    kind: purchase_contract
    context:
      document_id: *DOC
      classification: *CL_KV
      owners: *OWNERS
      properties: [*PROP_LINDEN, *PROP_KASTANIEN]
      units:
        - {id: *U, property_id: *P, label: WE 3, mea: {numerator: 85, denominator: 1000}}
    extraction:
      <<: *KV
      postal_code: {value: null, confidence: low}
    expect:
      keys: [typing, property, correction:notarized_on, unit, price_split, ownership, link:property]
      records:
        - key: property
          entity_type: property
          mode: unchanged
          target_id: *P
          values:
            kind: etw
            address.street: Lindenstraße
            address.house_number: "12"
            address.city: Berlin
            purchase_date: "2026-05-01"
            purchase_price: "289000.00"
          current:
            kind: etw
            address.street: Lindenstraße
            address.house_number: "12"
            address.city: Berlin
            purchase_date: "2026-05-01"
            purchase_price: "289000.00"
        - key: link:property
          entity_type: link
          mode: create
          target_id: *P
          values: {}

  - id: kaufvertrag_unverified_postal_code_does_not_decide
    description: >-
      A postal code the model wrote but its quote does not contain (checks without
      value_in_quote) neither finds nor blocks the match; the flat is found by street and
      house number, and the unverified code is shown as a change to decide, at low confidence.
    kind: purchase_contract
    context:
      document_id: *DOC
      classification: *CL_KV
      owners: *OWNERS
      properties: [*PROP_LINDEN, *PROP_KASTANIEN]
      units:
        - {id: *U, property_id: *P, label: WE 3, mea: {numerator: 85, denominator: 1000}}
    extraction:
      <<: *KV
      postal_code: {value: "10117", source: {page: 2, quote: "Lindenstraße 12 in Berlin"}, checks: [cited, validates], confidence: medium}
    expect:
      keys: [typing, property, correction:notarized_on, unit, price_split, ownership, link:property]
      records:
        - key: property
          entity_type: property
          mode: patch
          target_id: *P
          values: {address.postal_code: "10117"}
          current: {address.postal_code: "10115"}
        - key: link:property
          entity_type: link
          mode: create
          target_id: *P
          values: {}

  - id: kaufvertrag_without_postal_code_two_candidates_is_new
    description: >-
      Without a postal code or a city, two properties at "Lindenstraße 12" (in different
      towns) both fit: nothing is guessed, a new property is proposed, visibly.
    kind: purchase_contract
    context:
      document_id: *DOC
      classification: *CL_KV
      owners: *OWNERS
      properties:
        - *PROP_LINDEN
        - id: *P2
          kind: etw
          address: {street: Lindenstraße, house_number: "12", postal_code: "20095", city: Hamburg}
          build_year: 1960
          notarized_on: 2020-01-15
          purchase_date: 2020-03-01
          purchase_price: "199000.00"
    extraction:
      <<: *KV
      postal_code: {value: null, confidence: low}
      city: {value: null, confidence: low}
    expect:
      keys: [typing, property, unit, price_split, ownership, link:property]
      records:
        - key: property
          entity_type: property
          mode: create
          values:
            kind: etw
            address.street: Lindenstraße
            address.house_number: "12"
            address.postal_code: null
            address.city: null
            build_year: null
            notarized_on: "2026-03-12"
            purchase_date: "2026-05-01"
            purchase_price: "289000.00"
        - key: link:property
          entity_type: link
          mode: create
          values: {}

  - id: kaufvertrag_uebergang_by_payment
    description: Besitzübergang on the day the price is paid in full; no date to propose, the clause is quoted.
    kind: purchase_contract
    context:
      document_id: *DOC
      classification: *CL_KV
      owners: *OWNERS
    extraction:
      <<: *KV
      purchase_date:
        value: null
        source: {page: 9, quote: "Besitz, Nutzen und Lasten gehen mit dem Tag der vollständigen Kaufpreiszahlung auf den Käufer über."}
        checks: [cited]
        confidence: low
    expect:
      keys: [typing, property, unit, price_split, ownership, link:property]
      records:
        - key: property
          entity_type: property
