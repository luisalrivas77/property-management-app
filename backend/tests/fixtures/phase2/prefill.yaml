shared:
  classify_kaufvertrag: &CL_KV {type: contract, subtype: purchase_contract, contains_tenant_data: false, language: de, confidence: high}
  classify_payment_proof: &CL_PROOF {type: other, subtype: payment_proof, contains_tenant_data: false, language: de, confidence: high}
  proof_bill_two_parts: &PROOF_BILL
    document_id: *DOC_OTHER
    private_costs:
      - {id: *PC1, tax_year: 2026, label: Rechnung Hausmeisterdienst, amount: "357.00"}
      - {id: *PC2, tax_year: 2026, label: Rechnung Hausmeisterdienst, amount: "119.00"}
  owners: &OWNERS
    - {id: *O1, full_name: Max Beispiel}
    - {id: *O2, full_name: Erika Beispiel}
