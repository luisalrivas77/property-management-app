  # --- D139: a Wohnflächenberechnung (building_records) proposes the property's Wohnfläche ---
  # The reading asks `dwellings` (every Wohnung the document lists, `label | Wohnfläche | MEA |
  # Lage`). With the property found (as above), the household's row is: (a) the document's
  # only row; else (b) the one row whose MEA equals a known MEA of the flat (a unit's on the
  # property, or ExistingProperty.contract_mea from its Kaufvertrag reading), compared as
  # ratios; else (c) the one row whose label equals a unit's label or contract_unit_label
  # (casefold, whitespace collapsed). Found: a property record (patch when the stored
  # living_area_m2 is empty or differs, unchanged when equal), living_area_m2 derived from
  # [dwellings], its notes naming the row and "Zeile 13". Otherwise (two rows fit one key, or
  # none): a patch with living_area_m2 empty (null), current the stored area (null or not),
  # and every row offered in `options` ({value, label}: "WE 1 · EG links · MEA 62/1000 ·
  # 48,20 m²"), notes "Welche Wohnung ist Ihre?" (and "Ohne Klick bleibt" when an area is
  # stored: an empty field is not sent, so the stored area stays). Rows are never summed.
  # Records: typing, property, link:property.

  - id: building_records_single_dwelling_patch_on_empty
    description: D139 (a). A Wohnflächenberechnung of one flat at the Kastanienallee, whose area is empty; patch with its area.
    kind: general
    context:
      document_id: *DOC
      classification: &CL_WFB {type: other, subtype: building_records, contains_tenant_data: false, language: de, confidence: high}
      properties: [*PROP_LINDEN, *PROP_KASTANIEN]
    extraction:
      title: {v: Wohnflächenberechnung Kastanienallee 5, p: 1, q: "Wohnflächenberechnung"}
      document_date: {v: "2019-05-20", p: 1, q: "Berlin, 20.05.2019"}
      street: {v: Kastanienallee, p: 1, q: "Kastanienallee 5, 10435 Berlin"}
      house_number: {v: "5", p: 1, q: "Kastanienallee 5, 10435 Berlin"}
      postal_code: {v: "10435", p: 1, q: "Kastanienallee 5, 10435 Berlin"}
      dwellings: {v: ["Wohnung | 58,80 m² | unbekannt | unbekannt"], p: 1, q: "Wohnfläche gesamt 58,80 m²"}
    expect:
      keys: [typing, property, link:property]
      records:
        - key: property
          entity_type: property
          mode: patch
          target_id: *P2
          values: {living_area_m2: "58.80"}
          derived: {living_area_m2: [dwellings]}
          current: {living_area_m2: null}
          notes_contain: [die einzige Wohnung, Zeile 13, Mietspiegel]
        - key: link:property
          entity_type: link
          mode: create
          target_id: *P2
          values: {}

