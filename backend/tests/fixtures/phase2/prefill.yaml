  # --- Zahlungsnachweis (phase 3 D143) ---------------------------------------------------

  - id: payment_proof_moves_private_cost_to_paid_year
    description: >
      D143. A bill of 2026 (two private_cost parts, 357.00 + 119.00) paid on 08.01.2027 from a
      private account; the proof's 476.00 equals the bill, so both rows are proposed for 2027
      (Abflussprinzip, §11 EStG). The minus sign of the bank's amount does not matter.
    kind: payment_proof
    context:
      document_id: *DOC
      classification: *CL_PROOF
      properties: [*PROP_LINDEN]
      proof_bill: *PROOF_BILL
    extraction:
      title: {v: Überweisung Hausmeisterdienst, p: 1, q: "Überweisung"}
      document_date: {v: "2027-01-08", p: 1, q: "Ausgeführt am 08.01.2027"}
      paid_on: {v: "2027-01-08", p: 1, q: "Ausgeführt am 08.01.2027"}
