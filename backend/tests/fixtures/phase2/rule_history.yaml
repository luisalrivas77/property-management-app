    rules: [hausgeld, fee]
    transaction: *TX_FEE_NEW
    history:
      - *HG_MAR
      - {transaction_id: 0000002a-0000-4000-8000-000000000831, booking_date: 2026-02-03, amount: "-36.90", counterparty_iban_hmac: *H_HV, rows: [{category: hausgeld_verwaltung, status: confirmed}]}
