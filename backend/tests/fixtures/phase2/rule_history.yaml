    description: An insurer with one kind of payment; the premium went up and the rule still books it (unchanged behaviour).
    rules: [insurance]
    transaction:
      id: 0000002a-0000-4000-8000-000000000701
      booking_date: 2027-01-10
      amount: "-330.10"
      counterparty_name: Beispiel Versicherung AG
      counterparty_iban_hmac: *H_INS
      purpose: Beitrag Wohngebaeude 2027
    history:
      - {transaction_id: 0000002a-0000-4000-8000-000000000811, booking_date: 2025-01-10, amount: "-298.00", counterparty_iban_hmac: *H_INS, rows: [{category: insurance, status: confirmed}]}
      - {transaction_id: 0000002a-0000-4000-8000-000000000812, booking_date: 2026-01-10, amount: "-312.40", counterparty_iban_hmac: *H_INS, rows: [{category: insurance, status: confirmed}]}
    expect:
      method: rule
      rule_id: 0000002b-0000-4000-8000-000000000101
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "-330.10", category: insurance, property_id: *P, service_period_start: 2027-01-01, service_period_end: 2027-12-31, recurring: true}

