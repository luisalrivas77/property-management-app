    id: 0000002b-0000-4000-8000-000000000101
    workspace_id: *W
    created_at: 2026-02-01T10:00:00Z
    updated_at: 2026-02-01T10:00:00Z
    matcher: {counterparty_iban_hmac: *H_INS, amount_sign: debit}
    split_method: single_category
    category: insurance
    property_id: *P
    recurring: true
  hausgeld:
    id: 0000002b-0000-4000-8000-000000000102
    workspace_id: *W
    created_at: 2026-02-01T10:00:00Z
    updated_at: 2026-02-01T10:00:00Z
    matcher: {counterparty_iban_hmac: *H_HV, amount_sign: debit}
    split_method: single_category
    category: hausgeld_umlagefaehig
    property_id: *P
    recurring: true
  fee: &R_FEE
    id: 0000002b-0000-4000-8000-000000000103
    workspace_id: *W
    created_at: 2026-02-02T10:00:00Z
    updated_at: 2026-02-02T10:00:00Z
    matcher: {counterparty_iban_hmac: *H_HV, amount_sign: debit}
    split_method: single_category
    category: hausgeld_verwaltung
    property_id: *P
    recurring: true
  fee_same_amount_only:
    <<: *R_FEE
    id: 0000002b-0000-4000-8000-000000000104
