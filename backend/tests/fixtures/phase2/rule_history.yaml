  wirtschaftsplan:
    id: 0000002b-0000-4000-8000-000000000105
    workspace_id: *W
    created_at: 2026-02-01T09:00:00Z
    updated_at: 2026-02-01T09:00:00Z
    matcher: {counterparty_iban_hmac: *H_HV, purpose_pattern: hausgeld, amount_sign: debit}
    split_method: by_wirtschaftsplan
    property_id: *P

# History lines reused below. Booked in 2026, all from the Hausverwaltung unless named.
history:
  hausgeld_feb: &HG_FEB {transaction_id: 0000002a-0000-4000-8000-000000000801, booking_date: 2026-02-02, amount: "-380.00", counterparty_iban_hmac: *H_HV, rows: [{category: hausgeld_umlagefaehig, status: confirmed}]}
  fee_feb: &FEE_FEB {transaction_id: 0000002a-0000-4000-8000-000000000802, booking_date: 2026-02-03, amount: "-35.70", counterparty_iban_hmac: *H_HV, rows: [{category: hausgeld_verwaltung, status: confirmed}]}
  hausgeld_mar: &HG_MAR {transaction_id: 0000002a-0000-4000-8000-000000000803, booking_date: 2026-03-02, amount: "-380.00", counterparty_iban_hmac: *H_HV, rows: [{category: hausgeld_umlagefaehig, status: confirmed}]}
  fee_mar: &FEE_MAR {transaction_id: 0000002a-0000-4000-8000-000000000804, booking_date: 2026-03-03, amount: "-35.70", counterparty_iban_hmac: *H_HV, rows: [{category: hausgeld_verwaltung, status: confirmed}]}

cases:
