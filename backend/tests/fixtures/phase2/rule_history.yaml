    expect:
      method: rule
      rule_id: 0000002b-0000-4000-8000-000000000104
      confidence: "0.500"
      question: "Der Betrag weicht von der letzten Buchung ab (zuletzt 35,70 € als „Hausgeld, nicht umlagefähig (Verwaltung)“ gebucht). Stimmt die Zuordnung?"
      allocations:
        - {amount: "-36.90", category: hausgeld_verwaltung, property_id: *P, service_period_start: 2026-04-01, service_period_end: 2026-04-30, recurring: true}

