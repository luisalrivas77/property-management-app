    description: Two fee lines on one day; the higher transaction id is the latest (35.70), so 36.90 is a proposal.
    rules: [hausgeld, fee]
    transaction: *TX_FEE_NEW
    history:
      - *HG_MAR
      - {transaction_id: 0000002a-0000-4000-8000-000000000842, booking_date: 2026-03-03, amount: "-35.70", counterparty_iban_hmac: *H_HV, rows: [{category: hausgeld_verwaltung, status: confirmed}]}
      - {transaction_id: 0000002a-0000-4000-8000-000000000841, booking_date: 2026-03-03, amount: "-36.90", counterparty_iban_hmac: *H_HV, rows: [{category: hausgeld_verwaltung, status: confirmed}]}
    expect:
