# Rule fixture: learned rules checked against the ledger's own history (D49; refines D25).
#
# matching.rule_answer(rules: list[MatchingRule], transaction: MatchTransaction,
#                      context: MatchContext, history: list[HistoryLine])
#   -> AllocationSet | None
# Spec: docs/phases/phase-2.md §8.1 step 1, D49. A rule still stores no amount (D25); the
# reference amount is read from the ledger at match time. Luis's Hausverwaltung debits his
# rental account twice a month from one IBAN (Hausgeld and its management fee), which an
# IBAN + sign matcher cannot tell apart.
#
# Hits: matching.apply_rule for every rule, in the order given (oldest first). For a hit H
# with category set K (the distinct categories of its allocations):
#   history = the lines of `history` with the transaction's IBAN hash (never null) and sign,
#     other than the transaction itself, whose current rows (status superseded ignored) are
#     all confirmed; a line with any proposed row, or none, does not count. Each counts with
#     the set of its confirmed categories.
#   H stands when its split method checks the amount against a record itself
#     (by_wirtschaftsplan, by_loan_schedule, by_rent_schedule: apply_rule already returned
#     None for any other amount); otherwise (single_category, owner_transfer):
#     - single-kind (every history line has category set K) and the rule is not
#       same_amount_only -> stands at any amount (today's behaviour);
#     - mixed (a history line with another set), or same_amount_only -> stands only when
#       the amount equals the amount of the LATEST history line with set K (booking date,
#       then transaction id); else a near miss, distance |amount - that latest amount|, or
#       no distance when history has no line with set K.
#   Standing hits: all give the same split -> the first (the set apply_rule returned:
#     confidence 1, auto-confirm); they disagree -> null.
#   No standing hit: a proposal only when (i) the history is mixed (lines of two or more
#     category sets) and (ii) the near miss's set K has the latest amount STRICTLY closest to
#     the line's amount among the latest amounts of EVERY set in the history, sets without a
#     rule included (each set's latest line as above). Near misses of that set K must give the
#     same split, else null. The proposal: confidence 0.500 (below every threshold, so review)
#     and the question "Der Betrag weicht von der letzten Buchung ab (zuletzt <amount> als
#     „<label>“ gebucht). Stimmt die Zuordnung?" (amount without sign, cents only when not
#     .00; label = the category's German label, as frontend labels.ts).
#     Otherwise null and the line goes on through the order: a single-kind history (also for
#     a same_amount_only rule at another amount: the person said those amounts are something
#     else), a tie, a closer set no rule books, a rule whose set has no history line, or no
#     hit.
# The service runs the matchers before using a proposal (a matcher's answer wins over it);
# that order is not part of this pure fixture.
#
# as_last_split (D51): a rule learned from a split answer that no other split method fits
# (Luis's Hausgeld, split by hand into the parts its purpose text states). Its kind is
# rule.categories (the answer's category set; the rule stores no amount, D25). apply_rule
# copies the parts of the LATEST history line (as above: same IBAN hash and sign, current rows
# all confirmed; booking date, then transaction id) whose category set equals the kind AND
# whose booking date is on or before the line's own (a later line's split is never copied
# back onto an earlier line), when the line's amount equals that line's amount: each part's category, amount, property / unit
# / tenancy / loan and recurring, the service period from rules.periods.service_period for the
# new line, no Beleg; method rule, confidence 1.000, no question. Its hit therefore checks the
# amount itself and stands like by_wirtschaftsplan's. Any other amount, or no such line -> no
# hit, and never a proposal: the parts at another amount would have to be computed, and a
# split is only ever copied from the person's own answer (D40). History rows carry the parts
# (amount and scope) for this; the rows of other cases need only category and status.
# An older line imported after a newer one, with no line of the kind on or before it, is no
# hit and goes on through the order.

