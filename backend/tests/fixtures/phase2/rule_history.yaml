    expect:
      method: rule
      rule_id: 0000002b-0000-4000-8000-000000000103
      confidence: "0.500"
      question: "Der Betrag weicht von der letzten Buchung ab (zuletzt 35,70 € als „Hausgeld, nicht umlagefähig (Verwaltung)“ gebucht). Stimmt die Zuordnung?"
