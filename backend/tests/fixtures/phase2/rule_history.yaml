      booking_date: 2026-04-02
      amount: "-380.00"
      counterparty_name: Muster Hausverwaltung GmbH
      counterparty_iban_hmac: *H_HV
      purpose: Wohngeld 04/2026
    history: [*HG_FEB, *FEE_FEB, *HG_MAR, *FEE_MAR]
    expect:
      method: rule
      rule_id: 0000002b-0000-4000-8000-000000000102
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "-380.00", category: hausgeld_umlagefaehig, property_id: *P, service_period_start: 2026-04-01, service_period_end: 2026-04-30, recurring: true}

