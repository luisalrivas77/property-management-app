# Rule fixture: learned rules (hausbuch.rules.matching.apply_rule)
#
# apply_rule(rule: MatchingRule, transaction: MatchTransaction, context: MatchContext)
#   -> AllocationSet | None
# Spec: docs/phases/phase-2.md §8.1 step 1, D25 and phase 2 input point 5. A rule stores a
# matcher and a split method, never an amount, so a new Wirtschaftsplan or a rate change
# re-splits the next payment instead of being mis-split by an old answer.
#
# Hit: rule.enabled, and every matcher field that is set holds: counterparty_iban_hmac equal;
#   counterparty_name_pattern / purpose_pattern found (re.search, case-insensitive) in the
#   whitespace-collapsed text; amount_sign credit = amount > 0, debit = amount < 0.
#   A disabled rule or a miss -> null.
# Split by split_method; every set has method rule, rule_id = rule.id, confidence 1.0, no
# question; no tax year (the year an allocation counts in is an output of phase 3's tax rule
# set, not a stored fact); the service period from rules.periods.service_period:
#   single_category     one allocation of rule.category over the whole amount, with the rule's
#                       property / tenancy / loan; recurring = rule.recurring (copied from the
#                       answer the rule was learned from; a yearly premium is recurring).
#   by_loan_schedule    as matchers.yaml's loan matcher for rule.loan_id (the schedule entry due
#                       nearest the booking date within ±10 days, D39; recurring true); no entry, or -amount !=
#                       monthly_payment -> null.
#   by_wirtschaftsplan  the plan in force for rule.property_id = latest valid_from <= the
#                       service period's start (recurring true). -amount == plan.total ->
#                       hausgeld_umlagefaehig / _verwaltung / _ruecklage = -parts, the plan's
#                       document as Beleg, the property; recurring true. Any other amount -> null
#                       (the line goes to the model and review; never split by a plan whose total
#                       it does not equal).
#   by_rent_schedule    as matchers.yaml's rent matcher for rule.tenancy_id.
#   owner_transfer      as matchers.yaml's owner matcher.
#   as_last_split       (D51) copies the parts of the latest confirmed line from the same
#                       counterparty whose category set equals rule.categories, only when the
#                       line's amount equals that line's amount; read from the ledger's history
#                       (rule_history.yaml), never stored on the rule. apply_rule without that
#                       history (as here) -> null: nothing to copy, and nothing is computed.
#
# rejected: rule bodies that must fail MatchingRuleCreate validation because they try to store
# an amount (the "rule stores no amount" schema test; checked by tests/test_fixtures_valid.py).
#
# Phase 6 D160 (docs/phases/phase-6.md §5.4, §14), added by the phase 6 spec PR:
# - A name-pattern rule (counterparty_name_pattern from rules.matching.merchant_pattern, see
#   phase6/merchant_pattern.yaml) hits a private account's card line, which carries no IBAN;
#   apply_rule is unchanged, so these cases run today.
# - inferred: infer_rule(transaction, confirmed, context) on a private account. A single-category
#   answer of an hh_* code with a threshold, for a line without an IBAN, becomes
#   RuleMatcher(counterparty_name_pattern=merchant_pattern(name), amount_sign) with the answer's
#   category and recurring. No rule: on the rental account (unchanged), for a split, a
#   tax-relevant code, a transfer code. Refused: rule.too_broad when the same name was confirmed
#   under two categories (PayPal); rule.conflicts when the pattern hits a line confirmed under
#   another category. Pending phase 6 step 1.
#   Step 0 reading (D160 does not say how the two differ): history is the account's confirmed
#   lines the pattern hits. too_broad when those lines carry two or more categories among
#   themselves (the name alone does not tell the kind: the card asks for a purpose pattern);
#   conflicts when they carry one category other than the answer's (the card names the line).
#   too_broad is checked first.

ids:
  workspace: &W 0000000a-0000-4000-8000-000000000001
  property: &P 0000000b-0000-4000-8000-000000000001
  loan: &L 0000000f-0000-4000-8000-000000000001
  doc_wp_2026: &D_WP26 0000000d-0000-4000-8000-000000000011
  doc_wp_2027: &D_WP27 0000000d-0000-4000-8000-000000000012
  hmac_loan: &H_LOAN "3333333333333333333333333333333333333333333333333333333333333333"
  hmac_weg: &H_WEG "6666666666666666666666666666666666666666666666666666666666666666"
  hmac_insurer: &H_INS "7777777777777777777777777777777777777777777777777777777777777777"

context:
