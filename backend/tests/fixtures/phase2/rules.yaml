        principal: "20000.00"
        nominal_rate: "0.05"
        monthly_payment: "1000.00"
        disbursed_on: 2025-01-01
        first_payment_on: 2025-02-01
        fixed_until: 2025-06-30
        follow_up_rate: "0.08"
  wirtschaftsplaene:
    - {document_id: *D_WP26, property_id: *P, valid_from: 2026-01-01, total: "380.00", umlagefaehig: "210.00", verwaltung: "50.00", ruecklage: "120.00"}
    - {document_id: *D_WP27, property_id: *P, valid_from: 2027-01-01, total: "410.00", umlagefaehig: "230.00", verwaltung: "55.00", ruecklage: "125.00"}

rules:
  insurance: &R_INS
    id: 0000002b-0000-4000-8000-000000000001
    workspace_id: *W
    created_at: 2026-12-01T10:00:00Z
    updated_at: 2026-12-01T10:00:00Z
    matcher: {counterparty_iban_hmac: *H_INS, amount_sign: debit}
    split_method: single_category
    category: insurance
    property_id: *P
    recurring: true
  insurance_disabled:
    <<: *R_INS
    id: 0000002b-0000-4000-8000-000000000002
    enabled: false
  annuity:
    id: 0000002b-0000-4000-8000-000000000003
    workspace_id: *W
    created_at: 2025-03-01T10:00:00Z
    updated_at: 2025-03-01T10:00:00Z
    matcher: {counterparty_iban_hmac: *H_LOAN, amount_sign: debit}
    split_method: by_loan_schedule
    loan_id: *L
  hausgeld:
    id: 0000002b-0000-4000-8000-000000000004
    workspace_id: *W
    created_at: 2026-02-01T10:00:00Z
    updated_at: 2026-02-01T10:00:00Z
    matcher: {counterparty_iban_hmac: *H_WEG, purpose_pattern: hausgeld, amount_sign: debit}
    split_method: by_wirtschaftsplan
    property_id: *P
  hausgeld_as_last_split:
    id: 0000002b-0000-4000-8000-000000000005
    workspace_id: *W
    created_at: 2026-02-01T10:00:00Z
    updated_at: 2026-02-01T10:00:00Z
    matcher: {counterparty_iban_hmac: *H_WEG, amount_sign: debit}
    split_method: as_last_split
    categories: [hausgeld_ruecklage, hausgeld_umlagefaehig]
    recurring: true

  # Phase 6 D160: a name rule learned on a private account (no IBAN, no property)
  rewe_name:
    id: 0000002b-0000-4000-8000-000000000060
    workspace_id: *W
    created_at: 2026-02-01T10:00:00Z
    updated_at: 2026-02-01T10:00:00Z
    matcher: {counterparty_name_pattern: "^REWE SAGT DANKE", amount_sign: debit}
    split_method: single_category
    category: hh_groceries
    recurring: false

cases:
  - id: single_category
    description: The yearly premium; the year in the purpose becomes the service period.
    rule: insurance
    transaction: &TX_INS
      id: 0000002a-0000-4000-8000-000000000101
      booking_date: 2027-01-10
      amount: "-312.40"
      counterparty_name: Beispiel Versicherung AG
      counterparty_iban_hmac: *H_INS
      purpose: Beitrag Wohngebaeude 2027
    expect:
      method: rule
      rule_id: 0000002b-0000-4000-8000-000000000001
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "-312.40", category: insurance, property_id: *P, service_period_start: 2027-01-01, service_period_end: 2027-12-31, recurring: true}

  - id: loan_schedule_last_fixed_month
    rule: annuity
    transaction: &TX_LOAN
      id: 0000002a-0000-4000-8000-000000000102
      booking_date: 2025-07-01
      amount: "-1000.00"
      counterparty_name: Beispielbank AG
      counterparty_iban_hmac: *H_LOAN
      purpose: Darlehen 600123456 Rate
    expect:
      method: rule
      rule_id: 0000002b-0000-4000-8000-000000000003
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "-64.08", category: loan_interest, property_id: *P, loan_id: *L, service_period_start: 2025-07-01, service_period_end: 2025-07-31, recurring: true}
        - {amount: "-935.92", category: loan_principal, property_id: *P, loan_id: *L, service_period_start: 2025-07-01, service_period_end: 2025-07-31, recurring: true}

  - id: loan_schedule_after_rate_change
    description: Same rule, same payment, the month after the switch to 8 %; new amounts from the schedule.
    rule: annuity
    transaction:
      <<: *TX_LOAN
      id: 0000002a-0000-4000-8000-000000000103
      booking_date: 2025-08-01
    expect:
      method: rule
      rule_id: 0000002b-0000-4000-8000-000000000003
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "-96.28", category: loan_interest, property_id: *P, loan_id: *L, service_period_start: 2025-08-01, service_period_end: 2025-08-31, recurring: true}
        - {amount: "-903.72", category: loan_principal, property_id: *P, loan_id: *L, service_period_start: 2025-08-01, service_period_end: 2025-08-31, recurring: true}

  - id: wirtschaftsplan_current
    rule: hausgeld
    transaction: &TX_WEG
      id: 0000002a-0000-4000-8000-000000000104
      booking_date: 2026-12-01
      amount: "-380.00"
      counterparty_name: WEG Lindenstrasse 12
      counterparty_iban_hmac: *H_WEG
      purpose: Hausgeld 12/2026 WE 3
    expect:
      method: rule
      rule_id: 0000002b-0000-4000-8000-000000000004
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "-210.00", category: hausgeld_umlagefaehig, property_id: *P, document_id: *D_WP26, service_period_start: 2026-12-01, service_period_end: 2026-12-31, recurring: true}
        - {amount: "-50.00", category: hausgeld_verwaltung, property_id: *P, document_id: *D_WP26, service_period_start: 2026-12-01, service_period_end: 2026-12-31, recurring: true}
        - {amount: "-120.00", category: hausgeld_ruecklage, property_id: *P, document_id: *D_WP26, service_period_start: 2026-12-01, service_period_end: 2026-12-31, recurring: true}

  - id: wirtschaftsplan_new_plan
    description: The 2027 plan raised the Hausgeld; the same rule splits by the new plan.
    rule: hausgeld
    transaction:
      <<: *TX_WEG
      id: 0000002a-0000-4000-8000-000000000105
      booking_date: 2027-01-04
      amount: "-410.00"
      purpose: Hausgeld 01/2027 WE 3
    expect:
      method: rule
      rule_id: 0000002b-0000-4000-8000-000000000004
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "-230.00", category: hausgeld_umlagefaehig, property_id: *P, document_id: *D_WP27, service_period_start: 2027-01-01, service_period_end: 2027-01-31, recurring: true}
        - {amount: "-55.00", category: hausgeld_verwaltung, property_id: *P, document_id: *D_WP27, service_period_start: 2027-01-01, service_period_end: 2027-01-31, recurring: true}
        - {amount: "-125.00", category: hausgeld_ruecklage, property_id: *P, document_id: *D_WP27, service_period_start: 2027-01-01, service_period_end: 2027-01-31, recurring: true}

  - id: wirtschaftsplan_old_amount_after_new_plan
    description: January 2027 paid at the old 380.00 while the 2027 plan says 410.00; not split silently.
    rule: hausgeld
    transaction:
      <<: *TX_WEG
      id: 0000002a-0000-4000-8000-000000000106
      booking_date: 2027-01-04
      purpose: Hausgeld 01/2027 WE 3
    expect: null

  - id: as_last_split_without_history_is_no_split
    description: D51. The split is copied from the ledger's latest confirmed line of the rule's kind; without that history there is nothing to copy and no part is computed.
    rule: hausgeld_as_last_split
    transaction:
      <<: *TX_WEG
      id: 0000002a-0000-4000-8000-000000000108
      amount: "-300.00"
    expect: null

  - id: disabled_rule_ignored
    rule: insurance_disabled
    transaction:
      <<: *TX_INS
      id: 0000002a-0000-4000-8000-000000000107
    expect: null

  # --- Phase 6 D160 ------------------------------------------------------------------------

  - id: name_rule_hits_a_card_line
    description: a card line on a private account, no IBAN, booked by its name rule
    rule: rewe_name
    transaction:
      id: 0000002a-0000-4000-8000-000000000160
      booking_date: 2026-02-14
      amount: "-23.45"
      counterparty_name: "REWE SAGT DANKE. 5512//Musterstadt/DE"
      purpose: Kartenzahlung girocard
      booking_text: KARTENZAHLUNG
    expect:
      method: rule
      rule_id: 0000002b-0000-4000-8000-000000000060
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "-23.45", category: hh_groceries, recurring: false}

  # Step 0 finding: a Sparkasse card line's purpose ends with the card's expiry ("Debitk.1
  # 2028-12"), which today's period reading takes as a service period of December 2028. The
  # spec names no service period for a household line; read as none (a card's expiry is not a
  # period the payment is for). Pending step 1, which must not read the expiry.
  - id: name_rule_card_expiry_is_no_period
    description: the card's expiry in a Sparkasse card purpose is not a service period
    pending: "phase 6 step 1 (name-pattern rules, D160)"
    rule: rewe_name
    transaction:
      id: 0000002a-0000-4000-8000-000000000162
      booking_date: 2026-02-14
      amount: "-23.45"
      counterparty_name: "REWE SAGT DANKE. 5512//Musterstadt/DE"
      purpose: "2026-02-13T18:02 Debitk.1 2028-12"
      booking_text: KARTENZAHLUNG
    expect:
      method: rule
      rule_id: 0000002b-0000-4000-8000-000000000060
      confidence: "1.000"
      question: null
      allocations:
        - {amount: "-23.45", category: hh_groceries, recurring: false}

  - id: name_rule_misses_a_refund
    description: the rule is for debits; a refund from the same merchant is not booked by it
    rule: rewe_name
    transaction:
      id: 0000002a-0000-4000-8000-000000000161
      booking_date: 2026-02-16
      amount: "4.99"
      counterparty_name: "REWE SAGT DANKE. 5512//Musterstadt/DE"
      purpose: Gutschrift Pfand
    expect: null

rejected:
  - id: amount_in_matcher
    rule:
      matcher: {counterparty_iban_hmac: *H_WEG, amount: "380.00"}
      split_method: by_wirtschaftsplan
      property_id: *P
  - id: amount_on_rule
    rule:
      matcher: {counterparty_iban_hmac: *H_INS}
      split_method: single_category
      category: insurance
      amount: "312.40"
  - id: split_template_with_amounts
    rule:
      matcher: {counterparty_iban_hmac: *H_WEG}
      split_method: by_wirtschaftsplan
      property_id: *P
      split:
        - {category: hausgeld_umlagefaehig, amount: "210.00"}
        - {category: hausgeld_verwaltung, amount: "50.00"}
        - {category: hausgeld_ruecklage, amount: "120.00"}
  - id: as_last_split_with_amounts
    description: D51. An as_last_split rule names its kind (the category set), never the parts' amounts.
    rule:
      matcher: {counterparty_iban_hmac: *H_WEG, amount_sign: debit}
      split_method: as_last_split
      categories: [hausgeld_ruecklage, hausgeld_umlagefaehig]
      split:
        - {category: hausgeld_umlagefaehig, amount: "220.00"}
        - {category: hausgeld_ruecklage, amount: "80.00"}

# Phase 6 D160: what a confirmed answer on a private account becomes (header above).
inferred:
