  - id: missing_day_breaks_the_chain
    description: Two reports with the day between them left out; each report balances on its own, but the second's OPBD (136,69) is not the first's CLBD (-608,15).
    input:
      media_type: application/zip
      zip:
        - {name: 2026.04.01.xml, member: 2026.04.01.xml}
        - {name: 2026.07.01.xml, member: 2026.07.01.xml}
    expect:
      format: camt
      account_iban: DE50100000000000000001
      opening_balance: "0.00"
      closing_balance: "-471.46"
      balance_error: statement.chain_break
      line_count: 2
      total: "273.38"
      first_booking_on: 2026-04-01
      last_booking_on: 2026-07-01

  - id: reports_are_ordered_by_their_day
    description: Members named so their order in the archive is reversed; the reports still chain once ordered by CLBD date.
    input:
      media_type: application/zip
      zip:
        - {name: a.xml, member: 2026.07.01.xml}
        - {name: b.xml, member: 2026.06.30.xml}
        - {name: c.xml, member: 2026.04.01.xml}
    expect:
      format: camt
      account_iban: DE50100000000000000001
      opening_balance: "0.00"
      closing_balance: "-471.46"
      line_count: 5
      total: "-471.46"
      first_booking_on: 2026-04-01
      last_booking_on: 2026-07-01

  - id: the_same_day_twice_breaks_the_chain
    description: One day's report under two names.
    input:
      media_type: application/zip
      zip:
        - {name: 2026.04.01.xml, member: 2026.04.01.xml}
        - {name: copy.xml, member: 2026.04.01.xml}
    expect:
      format: camt
      account_iban: DE50100000000000000001
      opening_balance: "0.00"
      closing_balance: "136.69"
      balance_error: statement.chain_break
      line_count: 2
      total: "273.38"
      first_booking_on: 2026-04-01
      last_booking_on: 2026-04-01

  - id: report_sum_break
    description: A report whose CLBD is one cent off its OPBD plus its entries (a misread or edited file).
    input:
      file: camt052.zip
      member: 2026.04.01.xml
      media_type: application/xml
      replace: [['<Amt Ccy="EUR">136.69</Amt><CdtDbtInd>CRDT</CdtDbtInd><Dt><Dt>2026-04-01</Dt></Dt></Bal>', '<Amt Ccy="EUR">136.70</Amt><CdtDbtInd>CRDT</CdtDbtInd><Dt><Dt>2026-04-01</Dt></Dt></Bal>']]
    expect:
      format: camt
      account_iban: DE50100000000000000001
      opening_balance: "0.00"
      closing_balance: "136.70"
      balance_error: statement.report_unbalanced
      line_count: 1
      total: "136.69"
      first_booking_on: 2026-04-01
      last_booking_on: 2026-04-01

  # --- ZIP member rules (D34): the whole upload is rejected ---------------------------

  - id: zip_member_with_parent_path
    input: {media_type: application/zip, zip: [{name: ../2026.04.01.xml, member: 2026.04.01.xml}]}
    error: statement.archive_rejected

  - id: zip_member_in_a_folder
    input: {media_type: application/zip, zip: [{name: camt/2026.04.01.xml, member: 2026.04.01.xml}]}
    error: statement.archive_rejected

  - id: zip_member_with_backslash
    input: {media_type: application/zip, zip: [{name: 'camt\2026.04.01.xml', member: 2026.04.01.xml}]}
    error: statement.archive_rejected

  - id: zip_member_not_xml
    input:
      media_type: application/zip
      zip:
        - {name: 2026.04.01.xml, member: 2026.04.01.xml}
        - {name: readme.txt, text: hello}
    error: statement.archive_rejected

  - id: zip_with_401_members
    input: {media_type: application/zip, zip: [{name: day.xml, member: 2026.04.01.xml, repeat: 401}]}
    error: statement.archive_rejected

  - id: zip_with_400_members_is_read
    description: The limit itself is allowed; 400 copies of one day are then a chain break, not a rejection.
    input: {media_type: application/zip, zip: [{name: day.xml, member: 2026.04.01.xml, repeat: 400}]}
    expect:
      format: camt
      account_iban: DE50100000000000000001
      opening_balance: "0.00"
      closing_balance: "136.69"
      balance_error: statement.chain_break
      line_count: 400
      total: "54676.00"
      first_booking_on: 2026-04-01
      last_booking_on: 2026-04-01

  - id: zip_over_20_mib_uncompressed
    input:
      media_type: application/zip
      zip:
        - {name: 2026.04.01.xml, member: 2026.04.01.xml}
        - {name: big.xml, zeros: 20971521}
    error: statement.archive_rejected

  - id: zip_inside_zip
    description: A nested archive named like a report.
    input:
      media_type: application/zip
      zip:
        - name: inner.xml
          zip_of: [{name: 2026.04.01.xml, member: 2026.04.01.xml}]
    error: statement.archive_rejected

  - id: zip_corrupt
    input: {media_type: application/zip, text: "PK\x03\x04 not really an archive"}
    error: statement.archive_rejected

  # --- XML safety and content ---------------------------------------------------------

  - id: entity_declaration_refused
    description: An internal entity (the building block of entity-expansion attacks); refused, not expanded.
    input:
      media_type: application/xml
      text: |
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE Document [<!ENTITY a "aaaaaaaaaa"><!ENTITY b "&a;&a;&a;&a;&a;&a;&a;&a;&a;&a;">]>
        <Document xmlns="urn:iso:std:iso:20022:tech:xsd:camt.053.001.02"><BkToCstmrStmt><GrpHdr><MsgId>&b;</MsgId></GrpHdr></BkToCstmrStmt></Document>
    error: statement.entity_declared

  - id: external_entity_refused
    description: An external entity pointing at a local file; nothing is read.
    input:
      media_type: application/xml
      text: |
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE Document [<!ENTITY x SYSTEM "file:///etc/passwd">]>
        <Document xmlns="urn:iso:std:iso:20022:tech:xsd:camt.053.001.02"><BkToCstmrStmt><GrpHdr><MsgId>&x;</MsgId></GrpHdr></BkToCstmrStmt></Document>
    error: statement.entity_declared

  - id: entity_declaration_inside_a_zip
    input:
      media_type: application/zip
      zip:
        - name: 2026.04.01.xml
          text: |
            <?xml version="1.0"?>
            <!DOCTYPE Document [<!ENTITY x SYSTEM "http://example.invalid/x">]>
            <Document xmlns="urn:iso:std:iso:20022:tech:xsd:camt.052.001.08"><BkToCstmrAcctRpt>&x;</BkToCstmrAcctRpt></Document>
    error: statement.entity_declared

  - id: not_well_formed
    input:
      media_type: application/xml
      text: '<Document xmlns="urn:iso:std:iso:20022:tech:xsd:camt.053.001.02"><BkToCstmrStmt><Stmt></BkToCstmrStmt>'
    error: statement.unparsable

  - id: another_iso20022_message
    description: Mentions the root name but is not a camt.052/053 document.
    input:
      media_type: application/xml
      text: '<Document xmlns="urn:iso:std:iso:20022:tech:xsd:pain.001.001.09"><BkToCstmrStmt/></Document>'
    error: statement.unparsable

  - id: amount_with_a_decimal_comma
    input:
      file: camt052.zip
      member: 2026.04.01.xml
      media_type: application/xml
      replace: [['<Amt Ccy="EUR">136.69</Amt><CdtDbtInd>CRDT</CdtDbtInd><Sts>', '<Amt Ccy="EUR">136,69</Amt><CdtDbtInd>CRDT</CdtDbtInd><Sts>']]
    error: statement.unparsable

  - id: amount_with_three_decimals
    input:
      file: camt052.zip
      member: 2026.04.01.xml
      media_type: application/xml
      replace: [['<Amt Ccy="EUR">136.69</Amt><CdtDbtInd>CRDT</CdtDbtInd><Sts>', '<Amt Ccy="EUR">136.691</Amt><CdtDbtInd>CRDT</CdtDbtInd><Sts>']]
    error: statement.unparsable

  - id: not_euro
    input:
      file: camt052.zip
      member: 2026.04.01.xml
      media_type: application/xml
      replace: [['<Ccy>EUR</Ccy>', '<Ccy>CHF</Ccy>']]
    error: statement.unsupported_currency

  - id: unknown_format
    description: Neither camt, a ZIP nor CSV-CAMT.
    input: {media_type: text/plain, text: "Kontoauszug Nr. 1/2027\n"}
    error: statement.unknown_format

  - id: pdf_not_imported_yet
    description: PDF statements are read by the extraction job (step 1); step 3 has no import path for them.
    input: {media_type: application/pdf, text: "%PDF-1.7\n"}
    error: statement.unknown_format
