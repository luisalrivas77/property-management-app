      account_iban: DE50100000000000000001
      opening_balance: "0.00"
      closing_balance: "-3028.51"
      line_count: 22
      total: "-3028.51"
      first_booking_on: 2026-04-01
      last_booking_on: 2026-11-06
      lines:
