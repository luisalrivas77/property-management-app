      account_iban: DE50100000000000000001
      opening_balance: "5000.00"
      closing_balance: "5990.00"
      line_count: 2
      total: "990.00"
      first_booking_on: 2027-01-04
      last_booking_on: 2027-01-05
      warnings: [an entry that is not booked was skipped]
      lines:
        - index: 0
          line:
            booking_date: 2027-01-04
            value_date: 2027-01-04
            amount: "1400.00"
            counterparty_name: Erika Beispiel
            counterparty_iban: DE16100000000000001001
            purpose: Miete 01/2027
            booking_text: GUTSCHRIFT
