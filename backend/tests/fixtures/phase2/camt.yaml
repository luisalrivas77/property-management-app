# Parser fixture: camt.052 / camt.053 (hausbuch.services.bank.parse_statement, camt.read_camt)
#
# parse_statement(data: bytes, media_type) -> ParseOutcome(statement: ParsedStatement,
#                                                          balance_error: str | None)
# Spec: docs/phases/phase-2.md §7.1, D33 (camt.052 v08 is Sparkasse's primary export, format
# value `camt` for both roots) and D34 (a ZIP of daily reports: member rules and limits
# checked before any XML is parsed; per-report OPBD + Σ booked Ntry = CLBD and each OPBD =
# the previous report's CLBD, else the import goes to review; XML with entity resolution and
# network access off, a DOCTYPE refused).
#
# Samples: bank_samples/camt052.zip is an ANONYMISED copy of Luis's real export (17 daily
# reports, 22 entries, Apr-Nov 2026): names, IBANs, BICs, references, purpose texts and
# amounts replaced with synthetic values, balances recomputed (they reconcile and chain, and
# dip below zero, which exercises DBIT balances). Never put an original export here.
#
# Reading rules the cases pin:
#   - sign from CdtDbtInd: DBIT negative, for entries and balances; amounts are Decimal text
#   - only Sts BOOK entries become lines; a skipped entry adds one warning
#   - counterparty: Cdtr/CdtrAcct on a debit, Dbtr/DbtrAcct on a credit; an account with
#     only Othr/Id (the bank's own booking, e.g. ABSCHLUSS) has no IBAN
#   - bank_reference = AcctSvcrRef, else NtryRef; EndToEndId and MndtId from TxDtls/Refs
#   - purpose = every RmtInf/Ustrd, whitespace-collapsed, joined with one space
#   - booking_text = AddtlNtryInf
#   - raw: status, bank_transaction_code (from TxDtls; the entry-level BkTxCd is empty in
#     the real export), counterparty_bic, creditor_id (direct debits), report_id; never an
#     IBAN
#   - reports ordered by their CLBD date (the report's own day; each OPBD is dated the
#     previous report's day). opening = first OPBD (or PRCD), closing = last CLBD.
#     Two reports for one day are a chain break.
#
# Input: `file` under bank_samples/ (with `member`: that one member of the ZIP, uploaded as
# a single .xml), inline `text`, or a `zip` the test builds; `replace` pairs apply to the
# text of the file or of each of its members. Exactly one of `expect` / `error`.

cases:

  - id: sparkasse_zip_of_daily_reports
    description: The anonymised export as downloaded; 17 reports chain from 0,00 to -3.028,51.
    input: {file: camt052.zip, media_type: application/zip}
    expect:
