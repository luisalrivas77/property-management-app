  - id: second_download_differs_only_in_creation_time
    description: The real ZIP was downloaded twice and the files differ only in CreDtTm; the parse is identical (the db test checks a second import adds no line).
    input:
      file: camt052.zip
      media_type: application/zip
      replace: [["2026-11-06T20:55:37+01:00", "2026-11-07T08:12:03+01:00"]]
    expect:
      format: camt
      account_iban: DE50100000000000000001
      opening_balance: "0.00"
      closing_balance: "-3028.51"
      line_count: 22
      total: "-3028.51"
      first_booking_on: 2026-04-01
      last_booking_on: 2026-11-06

  - id: single_report_xml_without_zip
    description: One daily report uploaded on its own (three entries, the balance turns negative).
    input: {file: camt052.zip, member: 2026.06.30.xml, media_type: application/xml}
    expect:
      format: camt
      account_iban: DE50100000000000000001
      opening_balance: "136.69"
      closing_balance: "-608.15"
      line_count: 3
      total: "-744.84"
      first_booking_on: 2026-06-30
      last_booking_on: 2026-06-30

  - id: camt053_statement_root
    description: camt.053.001.02 (BkToCstmrStmt/Stmt) with the older shapes - Sts as text, PRCD as opening, Nm directly under Cdtr/Dbtr, BIC, NtryRef as reference, ValDt as DtTm, entry-level BkTxCd - and one pending entry, skipped.
    input:
      media_type: text/xml
      text: |
        <?xml version="1.0" encoding="UTF-8"?>
        <Document xmlns="urn:iso:std:iso:20022:tech:xsd:camt.053.001.02">
          <BkToCstmrStmt>
            <GrpHdr><MsgId>M-2027-01</MsgId><CreDtTm>2027-02-01T06:00:00</CreDtTm></GrpHdr>
            <Stmt>
              <Id>STMT-2027-01</Id>
              <Acct><Id><IBAN>DE50100000000000000001</IBAN></Id><Ccy>EUR</Ccy></Acct>
              <Bal><Tp><CdOrPrtry><Cd>PRCD</Cd></CdOrPrtry></Tp><Amt Ccy="EUR">5000.00</Amt><CdtDbtInd>CRDT</CdtDbtInd><Dt><Dt>2026-12-31</Dt></Dt></Bal>
              <Bal><Tp><CdOrPrtry><Cd>CLBD</Cd></CdOrPrtry></Tp><Amt Ccy="EUR">5990.00</Amt><CdtDbtInd>CRDT</CdtDbtInd><Dt><Dt>2027-01-31</Dt></Dt></Bal>
              <Ntry>
                <NtryRef>REF-0001</NtryRef>
                <Amt Ccy="EUR">1400.00</Amt><CdtDbtInd>CRDT</CdtDbtInd><Sts>BOOK</Sts>
                <BookgDt><Dt>2027-01-04</Dt></BookgDt><ValDt><Dt>2027-01-04</Dt></ValDt>
                <BkTxCd><Domn><Cd>PMNT</Cd><Fmly><Cd>RCDT</Cd><SubFmlyCd>ESCT</SubFmlyCd></Fmly></Domn></BkTxCd>
                <NtryDtls><TxDtls>
                  <Refs><EndToEndId>NOTPROVIDED</EndToEndId></Refs>
                  <RltdPties><Dbtr><Nm>Erika  Beispiel</Nm></Dbtr><DbtrAcct><Id><IBAN>DE16100000000000001001</IBAN></Id></DbtrAcct></RltdPties>
                  <RltdAgts><DbtrAgt><FinInstnId><BIC>TSTADEFFXXX</BIC></FinInstnId></DbtrAgt></RltdAgts>
                  <RmtInf><Ustrd>Miete 01/2027</Ustrd></RmtInf>
                </TxDtls></NtryDtls>
                <AddtlNtryInf>GUTSCHRIFT</AddtlNtryInf>
              </Ntry>
              <Ntry>
                <Amt Ccy="EUR">410.00</Amt><CdtDbtInd>DBIT</CdtDbtInd><Sts>BOOK</Sts>
                <BookgDt><Dt>2027-01-05</Dt></BookgDt><ValDt><DtTm>2027-01-05T10:00:00</DtTm></ValDt>
                <AcctSvcrRef>ACC-0002</AcctSvcrRef>
                <NtryDtls><TxDtls>
                  <RltdPties><Cdtr><Nm>WEG Lindenstrasse 12</Nm></Cdtr><CdtrAcct><Id><IBAN>DE86100000000000001002</IBAN></Id></CdtrAcct></RltdPties>
                  <RmtInf><Ustrd>Hausgeld</Ustrd><Ustrd>  01/2027  WE 3</Ustrd></RmtInf>
                </TxDtls></NtryDtls>
                <AddtlNtryInf>DAUERAUFTRAG</AddtlNtryInf>
              </Ntry>
              <Ntry>
                <Amt Ccy="EUR">99.00</Amt><CdtDbtInd>DBIT</CdtDbtInd><Sts>PDNG</Sts>
                <BookgDt><Dt>2027-01-31</Dt></BookgDt>
                <AcctSvcrRef>ACC-0003</AcctSvcrRef>
