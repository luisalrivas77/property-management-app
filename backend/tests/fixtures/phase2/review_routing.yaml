# Rule fixture: review routing (hausbuch.rules.review.route)
#
# route(item: RoutingInput) -> Routing(decision, reason)
# Spec: docs/phases/phase-2.md §8.1, §8.3, D21, D26, D52 and principle 3 (auto-accept only above a
# per-category threshold). Thresholds come from thresholds.yaml (rules.review.threshold).
# The first rule that applies decides:
#   1. import_status != reconciled -> import_review: the whole import goes to review and no
#      line of it is matched (phase 2 input point 3), whatever the line's set says.
#        unreconciled -> routing.import_unreconciled
#        imported     -> routing.import_pending_balance (no closing balance declared yet)
#        failed       -> routing.import_failed
#   2. allocation_set null -> review, routing.no_match
#   3. method rule, confidence 1.0 -> auto_confirm, routing.rule_hit
#   4. method matcher_*, confidence 1.0 -> auto_confirm, routing.deterministic
#   5. method matcher_* below 1.0 (an inexact match, e.g. rent short) -> review,
#      routing.below_threshold
#   6. method llm, a line of 0.00 (D52, 9 Nov 2026): exactly one allocation (its amount is
#      then 0.00, the sum being the line's amount), with no tenancy_id and no loan_id, and a
#      category outside ZERO_EXCLUDED -> auto_confirm, routing.zero_amount, whatever the
#      confidence and whether or not auto_accept_llm is on. ZERO_EXCLUDED = rent_cold,
#      operating_costs_prepayment, loan_interest, loan_principal, loan_disbursement,
#      hausgeld_umlagefaehig, hausgeld_verwaltung, hausgeld_ruecklage, owner_transfer_in,
#      owner_transfer_out, deposit_in, deposit_out, purchase_price, uncategorized (categories
#      other checks read or that need a person); a 0.00 set in one of them, or with a
#      tenancy or loan, goes on to rules 7 and 8 as before. Only rule 1 comes first.
#   7. method llm and not auto_accept_llm -> review, routing.llm_not_accepted (D26)
#   8. document_match and llm: if any allocation's category has threshold null -> review,
#      routing.never_auto; else confidence >= the highest threshold among the set's
#      categories -> auto_confirm, routing.above_threshold; else review,
#      routing.below_threshold. (A mixed set is as strict as its strictest category.)
#   9. method user: never routed (a user's set is confirmed by the user); not in this fixture.
#
# per_category: an LLM set of one allocation in that category, confidence 0.9, with
# auto_accept_llm true; the expected decision at that confidence (test_fixtures_valid.py checks
# it agrees with thresholds.yaml, and the rule test runs route on it).

tx: &TX 0000002a-0000-4000-8000-000000000201
rule_id: &R 0000002b-0000-4000-8000-000000000001

per_category:
  - {category: rent_cold, decision: auto_confirm}
  - {category: operating_costs_prepayment, decision: auto_confirm}
  - {category: operating_costs_settlement, decision: review}
  - {category: deposit_in, decision: review}
  - {category: deposit_out, decision: review}
  - {category: owner_transfer_in, decision: auto_confirm}
  - {category: owner_transfer_out, decision: auto_confirm}
  - {category: loan_interest, decision: auto_confirm}
  - {category: loan_principal, decision: auto_confirm}
  - {category: loan_fees, decision: review}
  - {category: loan_disbursement, decision: review}
  - {category: hausgeld_umlagefaehig, decision: auto_confirm}
  - {category: hausgeld_verwaltung, decision: auto_confirm}
  - {category: hausgeld_ruecklage, decision: auto_confirm}
  - {category: property_management, decision: auto_confirm}
  - {category: electricity, decision: auto_confirm}
  - {category: grundsteuer, decision: auto_confirm}
  - {category: insurance, decision: auto_confirm}
  - {category: repairs, decision: review}
  - {category: renovation, decision: review}
  - {category: purchase_price, decision: review}
  - {category: acquisition_cost, decision: review}
  - {category: professional_fees, decision: review}
  - {category: bank_fees, decision: auto_confirm}
  - {category: other_income, decision: review}
  - {category: other_expense, decision: review}
  - {category: uncategorized, decision: review}
  # Phase 6 (D159, D162, D165), added by the phase 6 spec PR; agrees with thresholds.yaml.
  - {category: hh_salary, decision: auto_confirm}
  - {category: hh_child_benefit, decision: auto_confirm}
  - {category: hh_tax_refund, decision: review}
  - {category: hh_capital_income, decision: review}
  - {category: hh_other_income, decision: review}
  - {category: hh_housing, decision: auto_confirm}
  - {category: hh_groceries, decision: auto_confirm}
  - {category: hh_family_child, decision: auto_confirm}
  - {category: hh_mobility, decision: auto_confirm}
  - {category: hh_insurance, decision: auto_confirm}
  - {category: hh_subscriptions, decision: auto_confirm}
  - {category: hh_leisure_travel, decision: auto_confirm}
  - {category: hh_health, decision: auto_confirm}
  - {category: hh_other, decision: review}
  - {category: hh_donation, decision: review}
  - {category: hh_household_services, decision: review}
  - {category: hh_childcare, decision: review}
  - {category: hh_property_cost, decision: review}
  - {category: hh_tax_payment, decision: review}
  - {category: internal_transfer_in, decision: review}
  - {category: internal_transfer_out, decision: review}
  - {category: hh_cash, decision: review}
  - {category: hh_credit_card, decision: review}
  - {category: hh_interest_fees, decision: review}  # D176 (3), step 2b
  # D159 amended 13 Nov 2026 (migration 0029)
  - {category: hh_personal_care, decision: auto_confirm}
  - {category: hh_clothing, decision: auto_confirm}
  - {category: hh_dining, decision: auto_confirm}
  - {category: hh_home, decision: auto_confirm}
  - {category: hh_electronics, decision: auto_confirm}
  - {category: hh_online_shopping, decision: auto_confirm}
  - {category: hh_fees, decision: auto_confirm}
  - {category: hh_gifts, decision: auto_confirm}
  - {category: hh_family_transfers, decision: review}
  - {category: hh_telecom, decision: auto_confirm}
  - {category: hh_work_education, decision: review}
  - {category: hh_sport, decision: auto_confirm}
  - {category: hh_travel, decision: auto_confirm}
  - {category: hh_investment, decision: review}
  - {category: hh_refund, decision: review}
  - {category: hh_fuel, decision: auto_confirm}  # D159 amended 14 Nov 2026 (migration 0031)
  - {category: security_purchase, decision: review}
  - {category: security_sale, decision: review}
  - {category: distribution, decision: review}
  - {category: capital_income_tax, decision: review}
  - {category: depot_fee, decision: review}

cases:
  - id: rule_hit
    item:
      import_status: reconciled
      allocation_set:
        transaction_id: *TX
        method: rule
        rule_id: *R
        confidence: "1.000"
        allocations:
          - {amount: "-312.40", category: insurance}
    expect: {decision: auto_confirm, reason: routing.rule_hit}

  - id: rule_hit_never_auto_category
    description: A learned rule auto-confirms even a category the model may never auto-confirm; the user answered it once.
    item:
      import_status: reconciled
      allocation_set:
        transaction_id: *TX
        method: rule
        rule_id: *R
        confidence: "1.000"
        allocations:
          - {amount: "-35.70", category: professional_fees, recurring: false}
    expect: {decision: auto_confirm, reason: routing.rule_hit}

  - id: deterministic_exact
    item:
      import_status: reconciled
      allocation_set:
        transaction_id: *TX
        method: matcher_rent
        confidence: "1.000"
        allocations:
          - {amount: "1150.00", category: rent_cold, recurring: true}
          - {amount: "250.00", category: operating_costs_prepayment, recurring: true}
    expect: {decision: auto_confirm, reason: routing.deterministic}

  - id: deterministic_inexact
    description: Rent short by 20 (matchers.yaml rent_short_by_20).
    item:
      import_status: reconciled
      allocation_set:
        transaction_id: *TX
        method: matcher_rent
        confidence: "0.500"
        question: Mieter hat 1.380 € statt 1.400 € überwiesen. Mietminderung oder Teilzahlung?
        allocations:
          - {amount: "1130.00", category: rent_cold, recurring: true}
          - {amount: "250.00", category: operating_costs_prepayment, recurring: true}
    expect: {decision: review, reason: routing.below_threshold}

  - id: document_match_above_threshold
    item:
      import_status: reconciled
      allocation_set:
        transaction_id: *TX
        method: document_match
        confidence: "0.950"
        allocations:
          - {amount: "-123.45", category: grundsteuer, recurring: true}
    expect: {decision: auto_confirm, reason: routing.above_threshold}

  - id: document_match_never_auto
    description: A Nebenkosten invoice is capitalized; never auto-confirmed.
    item:
      import_status: reconciled
      allocation_set:
        transaction_id: *TX
        method: document_match
        confidence: "0.950"
        allocations:
          - {amount: "-1234.55", category: acquisition_cost}
    expect: {decision: review, reason: routing.never_auto}

  - id: llm_not_accepted
    description: auto_accept_llm false (the default, D26) sends even a high-confidence answer to review.
    item:
      import_status: reconciled
      auto_accept_llm: false
      allocation_set:
        transaction_id: *TX
        method: llm
        confidence: "0.900"
        allocations:
          - {amount: "-89.00", category: insurance}
    expect: {decision: review, reason: routing.llm_not_accepted}

  - id: llm_high_accepted
    item:
      import_status: reconciled
      auto_accept_llm: true
      allocation_set:
        transaction_id: *TX
        method: llm
        confidence: "0.900"
        allocations:
          - {amount: "-89.00", category: insurance}
    expect: {decision: auto_confirm, reason: routing.above_threshold}

  - id: llm_medium_below_threshold
    item:
      import_status: reconciled
      auto_accept_llm: true
      allocation_set:
        transaction_id: *TX
        method: llm
        confidence: "0.600"
        allocations:
          - {amount: "-89.00", category: insurance}
    expect: {decision: review, reason: routing.below_threshold}

  - id: llm_mixed_set_strictest_category
    description: One part may auto-confirm, the other never; the set goes to review.
    item:
      import_status: reconciled
      auto_accept_llm: true
      allocation_set:
        transaction_id: *TX
        method: llm
        confidence: "0.900"
        allocations:
          - {amount: "-60.00", category: insurance}
          - {amount: "-29.00", category: other_expense}
    expect: {decision: review, reason: routing.never_auto}

  - id: no_match
    item:
      import_status: reconciled
      allocation_set: null
    expect: {decision: review, reason: routing.no_match}

  - id: import_unreconciled_blocks_an_exact_match
    description: Even a deterministic 1.0 match is not used while its import does not reconcile.
    item:
      import_status: unreconciled
      allocation_set:
        transaction_id: *TX
        method: matcher_rent
        confidence: "1.000"
        allocations:
          - {amount: "1150.00", category: rent_cold, recurring: true}
          - {amount: "250.00", category: operating_costs_prepayment, recurring: true}
    expect: {decision: import_review, reason: routing.import_unreconciled}

  - id: import_pending_balance
    description: A CSV import without a declared closing balance yet.
    item:
      import_status: imported
      allocation_set: null
    expect: {decision: import_review, reason: routing.import_pending_balance}

  - id: import_failed
    item:
      import_status: failed
      allocation_set: null
    expect: {decision: import_review, reason: routing.import_failed}

  # --- Lines of 0.00 (D52) ---------------------------------------------------------------

  - id: zero_bank_fee_llm_auto_confirms_without_the_setting
    description: The account's monthly 0.00 fee line; a learned rule cannot book a 0.00 line, so the model's answer is taken.
    item:
      import_status: reconciled
      auto_accept_llm: false
      allocation_set:
        transaction_id: *TX
        method: llm
        confidence: "0.600"
        allocations:
          - {amount: "0.00", category: bank_fees, recurring: true}
    expect: {decision: auto_confirm, reason: routing.zero_amount}

  - id: zero_rent_llm_still_review
    description: Rent is a category other checks read (the rent already booked for a month); a 0.00 rent answer keeps today's routing.
    item:
      import_status: reconciled
      auto_accept_llm: false
      allocation_set:
        transaction_id: *TX
        method: llm
        confidence: "0.900"
        allocations:
          - {amount: "0.00", category: rent_cold, recurring: true}
    expect: {decision: review, reason: routing.llm_not_accepted}

  - id: zero_loan_fees_with_a_loan_still_review
    description: A part scoped to a loan (D51 gives a model's loan part the one loan) is not taken unseen.
    item:
      import_status: reconciled
      auto_accept_llm: false
      allocation_set:
        transaction_id: *TX
        method: llm
        confidence: "0.900"
        allocations:
          - {amount: "0.00", category: loan_fees, loan_id: 0000002c-0000-4000-8000-000000000001}
    expect: {decision: review, reason: routing.llm_not_accepted}

  - id: zero_with_a_tenancy_still_review
    item:
      import_status: reconciled
      auto_accept_llm: false
      allocation_set:
        transaction_id: *TX
        method: llm
        confidence: "0.900"
        allocations:
          - {amount: "0.00", category: other_income, tenancy_id: 0000002d-0000-4000-8000-000000000001}
    expect: {decision: review, reason: routing.llm_not_accepted}

  - id: zero_uncategorized_still_review
    description: The model could not tell what the line is; a person decides.
    item:
      import_status: reconciled
      auto_accept_llm: true
      allocation_set:
        transaction_id: *TX
        method: llm
        confidence: "0.300"
        allocations:
          - {amount: "0.00", category: uncategorized}
    expect: {decision: review, reason: routing.never_auto}

  - id: zero_line_of_an_unreconciled_import
    description: Rule 1 still comes first.
    item:
      import_status: unreconciled
      auto_accept_llm: false
      allocation_set:
        transaction_id: *TX
        method: llm
        confidence: "0.900"
        allocations:
          - {amount: "0.00", category: bank_fees, recurring: true}
    expect: {decision: import_review, reason: routing.import_unreconciled}

  - id: nonzero_bank_fee_llm_without_the_setting_still_review
    description: D52 is only for 0.00; any other amount keeps D26.
    item:
      import_status: reconciled
      auto_accept_llm: false
      allocation_set:
        transaction_id: *TX
        method: llm
        confidence: "0.900"
        allocations:
          - {amount: "-4.95", category: bank_fees, recurring: true}
    expect: {decision: review, reason: routing.llm_not_accepted}

  # --- Phase 6 (docs/phases/phase-6.md §14, D159, D162, D168), added by the phase 6 spec PR.
  # route() reads no account purpose: a private line's set routes by the same rules. That the
  # model may answer only the permitted set of the account's purpose is the allocation
  # command's check (allocation.category_not_for_account, private_cost_link.yaml).

  - id: phase6_hh_groceries_llm_accepted
    description: A household spending answer of the model at 0.95 with auto_accept_llm on books like any recurring category (D159, threshold 0.9).
    item:
      import_status: reconciled
      auto_accept_llm: true
      allocation_set:
        transaction_id: *TX
        method: llm
        confidence: "0.950"
        allocations:
          - {amount: "-54.37", category: hh_groceries}
    expect: {decision: auto_confirm, reason: routing.above_threshold}

  - id: phase6_hh_donation_llm_never_auto
    description: A tax-relevant code never auto-confirms, whatever the confidence (D159); it proposes a return_input a person confirms.
    item:
      import_status: reconciled
      auto_accept_llm: true
      allocation_set:
        transaction_id: *TX
        method: llm
        confidence: "0.990"
        allocations:
          - {amount: "-50.00", category: hh_donation}
    expect: {decision: review, reason: routing.never_auto}

  - id: phase6_internal_transfer_llm_never_auto
    description: The model may propose a transfer code but only the transfer matcher books one (D40 extended, D162).
    item:
      import_status: reconciled
      auto_accept_llm: true
      allocation_set:
        transaction_id: *TX
        method: llm
        confidence: "0.900"
        allocations:
          - {amount: "500.00", category: internal_transfer_in}
    expect: {decision: review, reason: routing.never_auto}

  - id: phase6_zero_bank_fee_on_a_private_account
    description: The 0.00 account-fee line of a private account (bank_fees is reused for every bank kind) keeps D52 unchanged.
    item:
      import_status: reconciled
      auto_accept_llm: false
      allocation_set:
        transaction_id: *TX
        method: llm
        confidence: "0.600"
        allocations:
          - {amount: "0.00", category: bank_fees, recurring: true}
    expect: {decision: auto_confirm, reason: routing.zero_amount}
