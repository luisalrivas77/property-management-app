  # --- Loans and the §23 date --------------------------------------------------------------

  - id: fixed_rate_end_12_and_6_months
    description: >
      fixed until 31 Aug 2027: 12 months before is 31 Aug 2026 (past, not acknowledged, still
      open), 6 months before is 28 Feb 2027 (31 Feb does not exist)
    # horizon 10 Jan 2027 + 90 = 10 Apr 2027; floor 1 Jan 2026
    today: 2027-01-10
    facts:
      loans: [*loan_fixed]
    expect: [*fixed_12, *fixed_6]

  - id: special_termination_info
    description: >
      paid out 30 Jun 2017: §489 Abs. 1 Nr. 2 BGB notice is possible from 30 Jun 2027; the info
      card comes six months ahead, 30 Dec 2026, and is never mailed
    today: 2026-11-10
    facts:
      loans: [*loan_l3]
    expect: [*special_l3]

  - id: speculation_end_12_months_before
    description: >
      notarized 10 Feb 2017: tax-free from 11 Feb 2027 (10 years + 1 day); the info card is
      due 12 months before, 11 Feb 2026
    # tax_free_from = add_years(2017-02-10, 10) + 1 day = 2027-02-11; - 12 months = 2026-02-11.
    # Bought 1 Apr 2017: the checklist would list every year's Bescheid; muted here
    today: 2026-02-20
    facts:
      properties:
        - id: *P2
          label: Wohnung B
          purchase_date: 2017-04-01
          notarized_on: 2017-02-10
          checklist: {property_id: *P2, kind: efh, purchase_date: 2017-04-01}
      acks:
        - {reminder_key: checklist.due, scope_type: property, scope_id: *P2, action: muted,
           recorded_at: 2017-04-01T08:00:00Z}
    expect:
      - id: property.speculation_end:0000005b-0000-4000-8000-000000000002:2026-02-11
        kind: property.speculation_end
        scope: property
        scope_id: *P2
        due_on: 2026-02-11
        visible_from: 2026-02-11
        severity: info
        cleared_by: ack
        label_code: property.speculation_end
        label_args: {property: Wohnung B, tax_free_from: "2027-02-11"}
        email_leads: []

  # --- Tenancies ---------------------------------------------------------------------------

  - id: settlement_only_for_prepayment
    description: >
      three tenancies from 1 Jun 2026: the prepayment one's 2026 settlement is due 31 Dec 2027
      (§556 Abs. 3 S. 2 BGB), visible from 2 Oct 2027; flat_rate and included are silent
    # 31 Dec 2027 - 90 days = 2 Oct 2027 (-30 = 1 Dec, -30 = 1 Nov, -30 = 2 Oct); 2027's
