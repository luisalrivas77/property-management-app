cases:
  # --- Grundsteuer (D126) -----------------------------------------------------------------

  - id: grundsteuer_bescheid_expected_first_full_year
    description: >
      bought 1 May 2026: no Bescheid item for 2026 (the seller owes it), the 2027 item is due
      15 Jan 2027 and visible from 1 Jan 2027; no instalment without a Bescheid
    # horizon 20 Dec 2026 + 90 = 20 Mar 2027 -> checklist years 2026, 2027; 2027's item is
    # expected (15 Jan 2027 > today); visible 15 Jan - 14 = 1 Jan 2027
    today: 2026-12-20
    facts:
      properties: [*property]
    expect:
      - id: checklist.due:0000005b-0000-4000-8000-000000000001:2027-01-15
        kind: checklist.due
        scope: property
        scope_id: *P
        due_on: 2027-01-15
        visible_from: 2027-01-01
        severity: action
        cleared_by: auto
        label_code: checklist.due.grundsteuerbescheid
        label_args: {property: Wohnung A, year: 2027}
        email_leads: [14, 0]

  - id: grundsteuer_bescheid_present_silent
    description: >
      the Bescheid arrived on 12 Jan 2027 and is linked (tax year open): the 2027 item is
      present, so no checklist reminder (the instalments it starts are muted here, they are
      the next cases' subject)
    today: 2027-01-20
    facts:
      properties: [*property_with_bescheid]
      acks: [*mute_grundsteuer]
    expect: []

  - id: grundsteuer_quarters_without_schedule
    description: >
      Bescheid linked, no schedule row: the statutory quarters of §28 Abs. 1 GrStG from 2027;
      15 Feb is past and unpaid (still open), 15 May is within the horizon
    # horizon 20 Feb 2027 + 90 = 21 May 2027 -> 15 Feb, 15 May; 15 Aug is beyond; mode remind
    # (no row, no direct debit): visible due - 7
    today: 2027-02-20
    facts:
      properties: [*property_with_bescheid]
    expect: [*gs_q1_2027, *gs_q2_2027]

  - id: grundsteuer_dates_from_schedule
    description: a schedule row with two dates (15 Feb and 15 Aug) gives two reminders, no quarters
    # horizon 1 Jun 2027 + 90 = 30 Aug 2027; 15 Feb is unpaid (open), 15 Aug within
    today: 2027-06-01
    facts:
      properties:
        - <<: *property_with_bescheid
          grundsteuer_schedules:
            - id: *S27
              tax_year: 2027
              instalments:
                - {due_on: 2027-02-15, amount: "200.00"}
                - {due_on: 2027-08-15, amount: "200.00"}
    expect: [*gs_q1_2027, *gs_q3_2027]

  - id: grundsteuer_schedule_carried_to_next_year
    description: >
      the 2027 row (1 Mar and 1 Sep) is the latest with tax_year <= 2028, so 2028 repeats its
      days; both 2027 instalments were paid on their day
    # 2027: 1 Mar paid 1 Mar (-200.00), 1 Sep paid 1 Sep (-200.00): cleared. 2028: 1 Mar 2028
    # within the horizon (10 Feb 2028 + 90 = 10 May 2028), 1 Sep beyond; mode remind (two
    # transfers, no direct debit); visible 1 Mar 2028 - 7 = 23 Feb 2028 (2028 is a leap year)
    today: 2028-02-10
    facts:
      properties:
        - <<: *property_with_bescheid
          grundsteuer_schedules:
            - id: *S27
              tax_year: 2027
              instalments:
                - {due_on: 2027-03-01, amount: "200.00"}
                - {due_on: 2027-09-01, amount: "200.00"}
          grundsteuer_payments:
            - {id: *G1, booking_date: 2027-03-01, amount: "-200.00", direct_debit: false}
            - {id: *G2, booking_date: 2027-09-01, amount: "-200.00", direct_debit: false}
    expect:
      - id: grundsteuer.instalment:0000005b-0000-4000-8000-000000000001:2028-03-01
        kind: grundsteuer.instalment
        scope: property
        scope_id: *P
        due_on: 2028-03-01
        visible_from: 2028-02-23
        severity: action
        cleared_by: auto
        label_code: grundsteuer.instalment.remind
        label_args: {property: Wohnung A}
        email_leads: [7]

  - id: grundsteuer_remind_cleared_by_matching_debit
    description: >
      15 Feb is cleared by -100.00 booked 14 Feb (1 day, the instalment ± 0.01); 15 May is not
      cleared by -99.50 booked 14 May (0.50 off the instalment), so it stays open
    # horizon 20 May 2027 + 90 = 18 Aug 2027 -> 15 May (open) and 15 Aug
    today: 2027-05-20
    facts:
      properties:
        - <<: *property_with_bescheid
          grundsteuer_schedules: [*quarterly_2027]
          grundsteuer_payments:
            - {id: *G1, booking_date: 2027-02-14, amount: "-100.00", direct_debit: false}
            - {id: *G2, booking_date: 2027-05-14, amount: "-99.50", direct_debit: false}
    expect: [*gs_q2_2027, *gs_q3_2027]

  - id: grundsteuer_mode_inferred_after_direct_debit
    description: >
      15 Feb was cleared by a direct-debit line (PMNT/RDDT), so the next instalment is a
      "Lastschrift prüfen" reminder: visible on its day, mailed 3 days after if still open
    # horizon 10 May 2027 + 90 = 8 Aug 2027 -> 15 May only (15 Aug beyond)
    today: 2027-05-10
    facts:
      properties:
        - <<: *property_with_bescheid
          grundsteuer_schedules: [*quarterly_2027]
          grundsteuer_payments:
            - {id: *G1, booking_date: 2027-02-15, amount: "-100.00", direct_debit: true}
    expect: [*gs_q2_2027_sepa]

  - id: grundsteuer_transfer_clears_but_infers_nothing
    description: the same payment as a transfer (Überweisung) clears 15 Feb; 15 May still says "fällig"
    today: 2027-05-10
    facts:
      properties:
        - <<: *property_with_bescheid
          grundsteuer_schedules: [*quarterly_2027]
          grundsteuer_payments:
            - {id: *G1, booking_date: 2027-02-15, amount: "-100.00", direct_debit: false}
    expect: [*gs_q2_2027]

  - id: grundsteuer_mode_set_sepa
    description: the row says sepa_mandate; the reminder is visible from its due date
    # horizon 1 Feb 2027 + 90 = 2 May 2027 -> 15 Feb only
    today: 2027-02-01
    facts:
      properties:
        - <<: *property_with_bescheid
          grundsteuer_schedules: [{<<: *quarterly_2027, payment_mode: sepa_mandate}]
    expect:
      - <<: *gs_q1_2027
        visible_from: 2027-02-15
        label_code: grundsteuer.instalment.sepa_mandate
        email_leads: [-3]

  - id: grundsteuer_muted
    description: muted, unmuted, muted again; the latest row by recorded_at decides (muted)
    today: 2027-02-20
    facts:
      properties: [*property_with_bescheid]
      acks:
        - {reminder_key: grundsteuer.instalment, scope_type: property, scope_id: *P,
           action: muted, recorded_at: 2027-02-01T08:00:00Z}
        - {reminder_key: grundsteuer.instalment, scope_type: property, scope_id: *P,
           action: unmuted, recorded_at: 2027-01-10T08:00:00Z}
        - {reminder_key: grundsteuer.instalment, scope_type: property, scope_id: *P,
           action: muted, recorded_at: 2027-01-05T08:00:00Z}
    expect: []

  # --- Checklist ---------------------------------------------------------------------------

  - id: checklist_due_missing_fires
    description: >
      the 2026 Zinsbescheinigung (due 28 Feb 2027) and the 2027 Grundsteuerbescheid (due
      15 Jan 2027) are both missing on 1 Mar 2027
    # horizon 1 Mar 2027 + 90 = 30 May 2027; years 2026, 2027. 2027's Zinsbescheinigung is due
    # 28 Feb 2028 (beyond); special termination 20 Apr 2036 - 6 months = 20 Oct 2035 (beyond)
    today: 2027-03-01
    facts:
      properties:
        - <<: *property
          checklist:
            <<: *checklist
            loans: [{id: *L1, lender: Bank A, disbursed_on: 2026-04-20}]
      loans: [{id: *L1, lender: Bank A, disbursed_on: 2026-04-20}]
    expect:
      - id: checklist.due:0000005b-0000-4000-8000-000000000001:2027-01-15
        kind: checklist.due
        scope: property
        scope_id: *P
        due_on: 2027-01-15
        visible_from: 2027-01-01
        severity: action
        cleared_by: auto
        label_code: checklist.due.grundsteuerbescheid
        label_args: {property: Wohnung A, year: 2027}
        email_leads: [14, 0]
      - id: checklist.due:0000005f-0000-4000-8000-000000000001:2027-02-28
        kind: checklist.due
        scope: loan
        scope_id: *L1
        due_on: 2027-02-28
        visible_from: 2027-02-14
        severity: action
        cleared_by: auto
        label_code: checklist.due.zinsbescheinigung
        label_args: {lender: Bank A, year: 2026}
        email_leads: [14, 0]

  - id: checklist_present_silent
    description: >
      both documents are in: nothing from the checklist (the instalments the Bescheid starts
      are muted here, they are the Grundsteuer cases' subject)
    today: 2027-03-01
    facts:
      properties:
        - <<: *property
          checklist:
            <<: *checklist
            loans: [{id: *L1, lender: Bank A, disbursed_on: 2026-04-20}]
            documents:
              - *bescheid
              - {id: *D_ZB, type: zinsbescheinigung, tax_year: 2026,
                 received_at: 2027-02-10T09:00:00Z, links: [{target_type: loan, target_id: *L1}]}
      loans: [{id: *L1, lender: Bank A, disbursed_on: 2026-04-20}]
      acks: [*mute_grundsteuer]
    expect: []

  # --- Tax year ----------------------------------------------------------------------------

  - id: return_deadline_2026_on_2_aug_2027
    description: >
      31 Jul 2027 is a Saturday, so the 2026 return is due Monday 2 Aug 2027 (§108 Abs. 3 AO);
      visible 90 days before, from 4 May 2027
    # 2 Aug 2027 - 90 days: -2 = 31 Jul, -31 = 30 Jun, -30 = 31 May, -27 = 4 May (2+31+30+27)
    today: 2027-05-04
    facts:
      tax_years: [*return_2026]
    expect: [*return_deadline_2026]

  - id: questionnaire_open_from_jan_1
    description: >
      the 2026 questionnaire is incomplete on 1 Jan 2027; mailed 14 days later (15 Jan); the
      return deadline (2 Aug 2027) is beyond today + 90 = 1 Apr 2027
    today: 2027-01-01
    facts:
      tax_years: [{tax_year: 2026, questionnaire_complete: false}]
    expect:
      - id: tax.questionnaire_open:workspace:2027-01-01
        kind: tax.questionnaire_open
        scope: workspace
        due_on: 2027-01-01
        visible_from: 2027-01-01
        severity: action
        cleared_by: auto
        label_code: tax.questionnaire_open
        label_args: {year: 2026}
        email_leads: [-14]

