# Rule fixture: deadline reminders (hausbuch.rules.reminders.build_reminders)
#
# build_reminders(facts: ReminderFacts, today) -> list[Reminder]
# docs/phases/phase-5.md D122, D126, §6.1-§6.3, §12. Pure and order-independent: the rule test
# shuffles every list of the facts. The catalogue is §6.2's table; the fixture model checks
# each expected reminder against it (scope, leads, severity, how it clears, label arguments)
# and against its kind's due-date formula over the case's facts. Which instances exist is
# written out by hand per case, with the derivation in a comment.
#
# Output contract (step 0's reading of §6.2; each point a spec finding where §6 is silent):
# - An instance is returned while it is open (not cleared `auto`, not hidden by an ack) and
#   1 Jan of last year <= due_on <= today + 90 days (HORIZON_DAYS, the largest lead). A past
#   instance stays until it is cleared; the floor keeps a property bought years ago from
#   listing every old year (§6.2 does not bound the past).
# - Sorted by (due_on, id). id = "<key>:<scope_id or workspace>:<due_on>".
# - visible_from = due_on - in-app lead; email_leads in days before due_on (negative: after).
#
#   kind                         scope        in-app  email     severity cleared  label_args
#   grundsteuer.instalment       property     7 / 0   7 / -3    action   auto     property
#     (remind / sepa_mandate: label_code grundsteuer.instalment.remind / .sepa_mandate)
#   checklist.due                property|loan  14    14, 0     action   auto     property|lender, year
#     (label_code checklist.due.<item code>)
#   tax.return_deadline          workspace    90      60, 14    action   ack      year
#   tax.questionnaire_open       workspace    0       -14       action   auto     year
#   tax.wage_certificate_missing owner        0       0         action   auto     year
#   loan.fixed_rate_end          loan         0       0         action   ack      lender, fixed_until, months_before
#   loan.special_termination     loan         0       none      info     ack      lender
#   property.speculation_end     property     0       none      info     ack      property, tax_free_from
#   tenancy.settlement_deadline  tenancy      90      90, 30    action   ack      unit, year
#   tenancy.rent_missing         tenancy      0       0         action   auto     unit, month
#   bank.sync_stale              account      0       0         info     auto     account
#   Every other kind's label_code is its key.
#
# Due dates and conditions per kind:
# - grundsteuer.instalment (D126): only while the checklist's grundsteuerbescheid item for the
#   year is present (a Bescheid linked to the property or a unit), for every year from
#   year(purchase_date) + 1 (§9 Abs. 1, §10 Abs. 1 GrStG: the seller owes the purchase year).
#   Dates: the latest grundsteuer_schedule row with tax_year <= Y, its days carried into Y
#   (same day and month); else 15 Feb, 15 May, 15 Aug, 15 Nov (§28 Abs. 1 GrStG). Cleared by
#   a confirmed grundsteuer payment booked within ±10 days of due_on (and, with a schedule
#   row, |amount| = the instalment ± 0.01). Mode: the row's payment_mode; else sepa_mandate
#   once an earlier instalment was cleared by a direct-debit line, else remind.
# - checklist.due: build_checklist(property's facts, Y, today) for Y from year(purchase_date)
#   to year(today + 90); an item with a due_on and status missing, or expected (in-app from 14
#   days before). Step 3 (D126) gives the grundsteuerbescheid item applies = Y >= purchase
#   year + 1 and due_on = 15 Jan Y. Two dated items of one scope on one day would share an id
#   (spec finding; no such catalogue pair exists today).
# - tax.return_deadline: filing_deadline(Y) (§149 Abs. 2 AO, moved by §108 Abs. 3 AO) for every
#   listed tax year; 31 Jul 2027 is a Saturday, so 2026's is Monday 2 Aug 2027.
# - tax.questionnaire_open: 1 Jan Y+1 while the year's questionnaire is incomplete.
# - tax.wage_certificate_missing: 1 Mar Y+1 (§41b Abs. 1 S. 3 EStG: handed out by the end of
#   February) for an owner with Y in pay_years and not in wage_certificate_years.
# - loan.fixed_rate_end: fixed_until - 12 months and - 6 months (a day the month lacks -> its
#   last day).
# - loan.special_termination: add_years(disbursed_on, 10) - 6 months. §489 Abs. 1 Nr. 2 BGB
#   lets the borrower give notice once ten years have passed since full receipt, with six
#   months' notice; the date is when to start checking, six months ahead (§6.2's formula).
# - property.speculation_end: tax_free_from(notarized_on, latest rule set) - 12 months, while
#   still owned (§23 Abs. 1 Nr. 1 EStG; tax_free_from = notarized + 10 years + 1 day).
# - tenancy.settlement_deadline: 31 Dec Y+1 (§556 Abs. 3 S. 2 BGB) for each calendar year Y
#   the tenancy overlaps from the property's purchase year on, operating_costs_terms =
#   prepayment only (never flat_rate or included: D72, D91).
# - tenancy.rent_missing: for each full month M from max(tenancy start, purchase_date) whose
#   due_on = rent_due_day of M + 5 days: no rent payment's service period overlaps M, and there
#   is at least one non-owner account and every non-owner account has opening_balance_on <
#   due_on <= reconciled_until (the statements reach the date; otherwise the statement is not
#   in yet and nothing fires). label_args name the unit, never a tenant (D5).
# - bank.sync_stale: (last_sync_on, else connected_on) + 35 days, for an account with a
#   connection. Cleared auto by a newer success (the date moves).
# - acks: `done` hides the instance with that key, scope and due_on; `snoozed` hides it while
#   today < snoozed_until; the latest muted/unmuted row by recorded_at for the key and scope
#   decides whether every instance is hidden.
#
# Cases that do not test the checklist or the Grundsteuer kinds mute them for the property
# (the `quiet` acks), so a case's output shows only what it is about.

