  # account_purpose, default rental); a private line booked hh_property_cost with the property
  # and a bill is that bill's proof of payment (D143 widened to any own account): the bill's
  # payment_proof.missing ends, the figures stay, the line joins the line's sources ("the
  # Anlage V line's source list then holds the input, the bill and the bank line"), and it is
  # neither a cost nor a reason for tax.private_cost_paid_from_account (that warning is for a
  # rental-account line). add_allocations: rows appended to the merged facts' allocations
  # (tests/fixture_models_phase3.py), since YAML cannot extend an anchored list.
