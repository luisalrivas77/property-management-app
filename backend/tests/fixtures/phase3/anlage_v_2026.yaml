  # D150 (11 Nov 2026): a bill paid in parts. The notary bill's reading states two cost lines
  # (facts.bill_parts: 3,000.00 and 1,200.00) that sum to its one row of 4,200.00, as one
  # document holding both buyers' Grunderwerbsteuerbescheide is read as two lines while the
  # property has one row of the total. A linked proof of one line proves a part: the to-do
  # stays and says what is still missing (proof_rest); a proof of each line proves the bill
  # (their sum, as D143); an unlinked proof of one line is offered on the to-do (D149). The
  # figures never change.
  - id: notary_bill_parts_one_part_proven
    description: >
      case A, the notary bill read as two lines of 3,000.00 and 1,200.00, plus a payment
      proof of 3,000.00 linked to it → payment_proof.missing stays with proof_amount 3000.00
      and proof_rest 1200.00 (one part proven, the rest's proof missing); figures as in case A
    tax_year: 2026
    rule_set_year: 2026
    facts:
      <<: *facts
      bill_parts:
        *D_NOTAR: ["3000.00", "1200.00"]
      payment_proofs:
        - {proof_document_id: *D_PN, bill_document_id: *D_NOTAR, amount: "3000.00"}
    expect:
      <<: *expect_a
      warnings:
        - {code: hausgeld.abrechnung_pending}
        - {code: income.pre_handover, params: {amount: "850.00", count: "2"}}
        - {code: reduced_rent.no_market_rent}
        - {code: draft.open_lines_excluded, params: {count: "2", sum: "-89.90"}}
        - {code: draft.form_provisional}
        - {code: payment_proof.missing,
           params: {document: *D_NOTAR, source: acquisition_cost, kind: notary,
                    amount: "4200.00", proof_amount: "3000.00", proof_rest: "1200.00"}}

