# Done-criterion fixture: the hand-calculated Anlage V 2026 (hausbuch.rules.tax.draft.draft)
#
# draft(facts: DraftFacts, tax_year: int, rule_set: RuleSet) -> AnlageVDraft
# Spec: docs/phases/phase-3.md §14 (the facts and the expected draft), §5.11, D59, D60, D70.
# All synthetic: the flat, the bank, the IBANs and every amount are invented (public repo).
#
# Expectations are a projection of AnlageVDraft (tests/fixture_models_phase3.py DraftExpect):
#   lines        exactly the lines with a non-zero amount, a ticked box or the provisional flag;
#                the Z13 rows are `unit_rows`, not lines. Header fields are in `header`.
#   sources      the exact set per line, None = not asserted; every line but the totals and
#                results opens its sources (checked on load).
#   warnings     the exact multiset of codes; listed params must match.
#   totals, owners: checked on load against the lines (cents and the rounded euros of D60:
#                income down, costs up, totals from the rounded lines, owners by largest
#                remainder).
#
# Hand calculation, case A (cents → rounded euros):
#   income.rent_total   6 × 850.00                                   5,100.00 →  5,100
#   income.umlagen      6 × 180.00                                   1,080.00 →  1,080
#   income.total                                                     6,180.00 →  6,180
#   wk.afa              (300,000 + 25,000) × 0.72 × 2 % × 6/12       2,340.00 →  2,340
#   wk.interest         233.33 + 700.00 + 699.13 + 698.25 + 697.37
#                       + 696.48                                     3,724.56 →  3,725
#   wk.financing_costs  Notar Grundschuld                              480.00 →    480
#   wk.maintenance      painter 1,190.00 + tiles 4,760.00 (gross,
#                       elected erhaltung); provisional (Rücklage)   5,950.00 →  5,950
#   wk.allocable_costs  6 × 180.00 Hausgeld + 2 × 60.00 Grundsteuer  1,200.00 →  1,200
#   wk.non_allocable    6 × 40.00 + 6 × 25.00 + 9 × 4.90               434.10 →    435
#   wk.total                                                        14,128.66 → 14,130
#   result.surplus      6,180.00 − 14,128.66                        −7,948.66 → −7,950
#   owners A / B        ½ each                             −3,974.33 / −3,974.33 → −3,975 each
# Not on the form: the January 2027 rent booked 29 Dec (850.00 + 180.00, moved to 2027 by the
#   ten-day rule, D54); the seller's forwarded 2 × 425.00 before the handover (block, D63);
#   the deposit; owner transfer, loan payout, purchase price and the two acquisition_cost
#   payments (pass-through or capitalised via the property record, D55); Rücklage 600.00 and
#   Tilgung 1,508.77 (tracked); the two 0.00 rows (D70); two proposed lines (−89.90, open).
# Coverage: the December lines are confirmed, so their statements reconciled; the last
#   reconciled day is 30 Dec (the last bank-fee line), which leaves December not fully
#   covered: 5 of 6 months.

