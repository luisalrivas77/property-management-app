# Done-criterion fixture: the hand-calculated Anlage V 2026 (hausbuch.rules.tax.draft.draft)
#
# draft(facts: DraftFacts, tax_year: int, rule_set: RuleSet) -> AnlageVDraft
# Spec: docs/phases/phase-3.md §14 (the facts and the expected draft), §5.11, D59, D60, D70.
# All synthetic: the flat, the bank, the IBANs and every amount are invented (public repo).
#
# Expectations are a projection of AnlageVDraft (tests/fixture_models_phase3.py DraftExpect):
#   lines        exactly the lines with a non-zero amount, a ticked box or the provisional flag;
#                the Z13 rows are `unit_rows`, not lines. Header fields are in `header`.
#   sources      the exact set per line, None = not asserted; every line but the totals and
#                results opens its sources (checked on load).
#   warnings     the exact multiset of codes; listed params must match.
#   totals, owners: checked on load against the lines (cents and the rounded euros of D60:
#                income down, costs up, totals from the rounded lines, owners by largest
#                remainder).
#
# Hand calculation, case A (cents → rounded euros):
#   income.rent_total   6 × 850.00                                   5,100.00 →  5,100
#   income.umlagen      6 × 180.00                                   1,080.00 →  1,080
#   income.total                                                     6,180.00 →  6,180
#   wk.afa              (300,000 + 25,000) × 0.72 × 2 % × 6/12       2,340.00 →  2,340
#   wk.interest         233.33 + 700.00 + 699.13 + 698.25 + 697.37
#                       + 696.48                                     3,724.56 →  3,725
#   wk.financing_costs  Notar Grundschuld                              480.00 →    480
#   wk.maintenance      painter 1,190.00 + tiles 4,760.00 (gross,
#                       elected erhaltung); provisional (Rücklage)   5,950.00 →  5,950
#   wk.allocable_costs  6 × 180.00 Hausgeld + 2 × 60.00 Grundsteuer  1,200.00 →  1,200
#   wk.non_allocable    6 × 40.00 + 6 × 25.00 + 9 × 4.90               434.10 →    435
#   wk.total                                                        14,128.66 → 14,130
#   result.surplus      6,180.00 − 14,128.66                        −7,948.66 → −7,950
#   owners A / B        ½ each                             −3,974.33 / −3,974.33 → −3,975 each
# Not on the form: the January 2027 rent booked 29 Dec (850.00 + 180.00, moved to 2027 by the
#   ten-day rule, D54); the seller's forwarded 2 × 425.00 before the handover (block, D63; its
#   income.pre_handover warning is the one question about them, no income.other_review, D140);
#   the deposit; owner transfer, loan payout, purchase price and the two acquisition_cost
#   payments (pass-through or capitalised via the property record, D55); Rücklage 600.00 and
#   Tilgung 1,508.77 (tracked); the two 0.00 rows (D70); two proposed lines (−89.90, open).
# Coverage: the December lines are confirmed, so their statements reconciled; the last
#   reconciled day is 30 Dec (the last bank-fee line), which leaves December not fully
#   covered: 5 of 6 months.
#
# Proof of payment (D143, 11 Nov 2026; Luis: "each invoice should have its respective payment
# proof"). Every bill the draft counts needs a proof that it was paid; a bill without one STILL
# COUNTS, the draft only raises a to-do:
#   proven by the bank   a bill carried by a confirmed allocation (allocation.document_id): its
#                        bank line is the proof; an acquisition cost row whose paid_by is not
#                        empty; a private_cost row whose bill a bank line paid is not counted at
#                        all (D135, tax.private_cost_paid_from_account).
#   needs a proof        the document of an acquisition cost row (checked in the purchase year
#                        only, the year the Nebenkosten were paid), and the document of the
#                        private_cost rows in force in the tax year (a row the 15 % crossing
#                        moved into the AfA basis included). A row without a document is left
#                        to acquisition_cost_evidence and afa.cost_row_unpaid; a private cost
#                        without a document (trips, a membership) has no bill to prove.
#   facts.payment_proofs the payment_proof documents linked to a bill (document_link target
#                        document): {proof_document_id, bill_document_id, amount}, amount the
#                        proof's current reading (null: not read or no amount stated).
#   proven               when one proof's amount is null (the user saw the proof), or one
#                        proof's amount, or the sum of the proofs' amounts, equals the bill's
#                        amount within 0.01: an acquisition cost row's amount; for private costs
#                        the sum of value.amount (gross, before the share) of the bill's rows in
#                        force in every year. A part also counts as proven when a proof matches
#                        the bill's combined total (its acquisition cost rows plus its
#                        private_cost rows in force): a bill split into both is paid as one.
#   otherwise            payment_proof.missing (warning), one per bill and source, params:
#                        document (the bill's id), source (acquisition_cost | private_cost),
#                        kind (the row's AcquisitionCostKind) or label (the label of the bill's
#                        row with the lowest id), amount (the bill's amount as above), and
#                        proof_amount (the sum of the proofs' amounts) only when a proof exists
#                        and none matches ("Betrag passt nicht"). Refs: the bill and its rows.
#   facts.unlinked_proofs (D149) the payment_proof documents linked to no bill, of this
#                        property or of none: {proof_document_id, amount}. When exactly one
#                        with an amount fits a bill that raises payment_proof.missing (within
#                        0.01 of its combined total, of its private part alone, or of one of its
#                        acquisition cost rows; rules.proof_match), that warning also carries
#                        proof_offer (the proof's id) and proof_offer_amount (its amount).
#   facts.bill_parts     (D150) per bill, the amounts of the cost lines its current reading
#                        states. They are the bill's parts only when they sum to its combined
#                        total within 0.01 (a credit line or one of 0.00 is no part). A proof
#                        of one part fits the bill (part) for proof_offer; and when the bill is
#                        not proven but every linked proof's amount equals one of its parts and
#                        their sum is below the combined total, payment_proof.missing also
#                        carries proof_rest (the combined total minus that sum: "ein Teil ist
#                        nachgewiesen").
# Case A's notary bill (C2, D_NOTAR) is stored but no allocation paid it, so it raises the to-do.

