# Rule fixture: AfA linear (hausbuch.rules.tax.afa.afa)
#
# afa(facts: AfaFacts, tax_year: int, rule_set: RuleSet) -> AfaLine
# Spec: docs/phases/phase-3.md §5.2, D55. §7 Abs. 4 S. 1 Nr. 2 and Abs. 1 S. 4 EStG, §9a EStDV.
#   basis    = round((purchase_price + Σ cost_rows.amount) × split.building_share, 2)
#              (the Nebenkosten are split by the same share as the price)
#   rate     = rule_set.afa_rate(build_year): ≤ 1924 2.5 %, 1925–2022 2 %, ≥ 2023 3 %
#   months   = 12 − (purchase_date.month − 1) in the purchase year (the handover month counts
#              in full); 12 in every later year. (The year ownership ends: phase 4, Q11.)
#   additions = Σ additions with tax_year ≤ the tax year; each accrues from 1 January of its
#              year (R 7.4 Abs. 9 EStR, Q11). Additions are GROSS amounts: input VAT a
#              VAT-exempt landlord cannot deduct is part of the Herstellungskosten (§9b Abs. 1
#              EStG); only the 15 % test itself is net (§5.3). See limit_crossing_additions_gross.
#   amount   = round((basis + additions) × rate × months ÷ 12, 2), half-up
#   method_code (Z33) = 2 (laut Erläuterung) in the purchase year and in any year an addition
#              starts; else 1.
#   Without a selected split: amount, basis and rate null, method_code null, warning afa.no_split.
# Sources (asserted where listed): the property (price), the split and its evidence document,
#   every cost row and its document, the allocation of every addition counted.
# Warnings:
#   afa.cost_row_unpaid               a cost row whose paid_by is empty (info; it may have been
#                                     paid privately). params: kind, amount.
#   afa.acquisition_cost_without_row  a non-zero acquisition_cost allocation in no row's
#                                     paid_by; NOT added to the basis. params: amount.
#   afa.purchase_price_mismatch       only when at least one non-zero purchase_price allocation
#                                     exists and Σ |amount| ≠ purchase_price (info).
#                                     params: price, paid.
#   A 0.00 allocation raises neither of the last two (D70).
#   afa.useful_life_report            info, in every year a useful_life input governs (D79).
#                                     params: years, from_year.
#
# Shorter actual useful life (§7 Abs. 4 S. 2 EStG, D79; cases useful_life_*). facts.useful_lives
# lists the useful_life inputs in force ({tax_input_id, from_year, years, document_id}). The row
# governing a year is the one with the greatest from_year ≤ that year; without one the line is
# the statutory one above (method statutory). Under a governing row (method useful_life, rate
# null), walking the years from the purchase year:
#   book_value_start = basis + Σ additions of years ≤ the year − Σ AfA of earlier years
#   remaining_months  = years × 12, reset in a governing row's from_year (counted from the AfA
#                       start month in the purchase year, else from January), then − the
#                       months owned each year
#   amount            = round(book_value_start × months ÷ remaining_months, 2), half-up; the whole
#                       book value once months ≥ remaining; 0 once written off
#   Years before the first governing row keep the statutory amount.
#   method_code = 2 also in a governing row's from_year. Sources add the input and its
#   Gutachten in every year the row governs.
#
# A movable asset bought with the flat (D80; cases movable_*). facts.movable_assets lists the
# movable_asset inputs in force (see movable_asset.yaml). For one with in_purchase_price:
#   movable_deducted = round(amount × (purchase_price + Σ cost_rows) ÷ purchase_price, 2)
#   basis            = the basis above − movable_deducted: the kitchen takes its share of the
#                      Nebenkosten with it, and all of it leaves the building's share, never
#                      the land's. Every figure built on the basis follows (the statutory
#                      amount, the useful-life book value, the 15 % limit).
#   Sources add the movable_asset input. (A kitchen bought separately is refused by the
#   service for now, D80 review F1: it needs its own acquisition date.)

rule_set_year: 2026

ids:
  property: &P 0000000b-0000-4000-8000-000000000001
  split: &S 0000005a-0000-4000-8000-000000000001
  cost_grest: &C1 000000ac-0000-4000-8000-000000000001
  cost_notar: &C2 000000ac-0000-4000-8000-000000000002
  cost_grundbuch: &C3 000000ac-0000-4000-8000-000000000003
  doc_kaufvertrag: &D_KV 00000d0c-0000-4000-8000-000000000001
  doc_grest: &D_GREST 00000d0c-0000-4000-8000-000000000002
  doc_notar: &D_NOTAR 00000d0c-0000-4000-8000-000000000003
  doc_grundbuch: &D_GB 00000d0c-0000-4000-8000-000000000004
  alloc_grest: &A_GREST 000000a1-0000-4000-8000-000000000001
  alloc_notar: &A_NOTAR 000000a1-0000-4000-8000-000000000002
  alloc_grundbuch: &A_GB 000000a1-0000-4000-8000-000000000003
  alloc_price: &A_PP 000000a1-0000-4000-8000-000000000004
  alloc_broker: &A_BROKER 000000a1-0000-4000-8000-000000000005
  alloc_zero: &A_ZERO 000000a1-0000-4000-8000-000000000006
  alloc_balcony: &A_BALCONY 000000a1-0000-4000-8000-000000000007
  alloc_painter: &A_PAINTER 000000a1-0000-4000-8000-000000000008
  alloc_tiles: &A_TILES 000000a1-0000-4000-8000-000000000009
  alloc_roof: &A_ROOF 000000a1-0000-4000-8000-00000000000a
  alloc_dormer: &A_DORMER 000000a1-0000-4000-8000-00000000000b
  input_life_21: &UL21 00000071-0000-4000-8000-000000000001
  input_life_19: &UL19 00000071-0000-4000-8000-000000000002
  doc_gutachten: &D_GUT 00000d0c-0000-4000-8000-000000000005
  input_kitchen: &K 00000081-0000-4000-8000-000000000001
  doc_planner: &D_PLAN 00000d0c-0000-4000-8000-000000000006
  input_life_30: &UL30 00000071-0000-4000-8000-000000000003

bases:
  # The §14 flat: ETW completed 1998, handover 1 Jul 2026, price 300,000.00, three cost rows
  # (25,000.00), contract split 0.720000 → basis 234,000.00. Everything paid from the account.
  flat: &flat
    property_id: *P
    purchase_price: "300000.00"
    build_year: 1998
    purchase_date: 2026-07-01
    split: &split {id: *S, source: purchase_contract, building_share: "0.720000", evidence_document_id: *D_KV}
    cost_rows: &rows
      - {id: *C1, kind: real_estate_transfer_tax, amount: "19500.00", paid_on: 2026-04-20,
         document_id: *D_GREST, paid_by: [*A_GREST]}
      - {id: *C2, kind: notary, amount: "4200.00", paid_on: 2026-03-25, document_id: *D_NOTAR,
         paid_by: [*A_NOTAR]}
      - {id: *C3, kind: land_registry, amount: "1300.00", paid_on: 2026-05-12,
         document_id: *D_GB, paid_by: [*A_GB]}
    allocations: &evidence
      - {allocation_id: *A_GREST, booking_date: 2026-04-20, amount: "-19500.00", category: acquisition_cost}
      - {allocation_id: *A_NOTAR, booking_date: 2026-03-25, amount: "-4200.00", category: acquisition_cost}
      - {allocation_id: *A_GB, booking_date: 2026-05-12, amount: "-1300.00", category: acquisition_cost}
      - {allocation_id: *A_PP, booking_date: 2026-06-30, amount: "-300000.00", category: purchase_price}
  flat_sources: &flat_sources
    - {kind: property, id: *P}
    - {kind: price_split, id: *S}
    - {kind: document, id: *D_KV}
    - {kind: acquisition_cost, id: *C1}
    - {kind: acquisition_cost, id: *C2}
    - {kind: acquisition_cost, id: *C3}
    - {kind: document, id: *D_GREST}
    - {kind: document, id: *D_NOTAR}
    - {kind: document, id: *D_GB}
  # An old building: completed 1904 (statutory 2.5 %, a 40-year life), handover 15 Oct 2026
  # (3 months in 2026); 375,000.00 × 0.8 = 300,000.00, no cost rows. Synthetic figures.
  old_building: &old_building
    property_id: *P
    purchase_price: "375000.00"
    build_year: 1904
    purchase_date: 2026-10-15
    split: {id: *S, source: bmf_tool, building_share: "0.800000"}
  life_21: &life_21 {tax_input_id: *UL21, from_year: 2026, years: 21, document_id: *D_GUT}
  ul21: &ul21 {basis: "300000.00", rate: null, method: useful_life, useful_life_years: 21,
               useful_life_from_year: 2026,
               warnings: [{code: afa.useful_life_report, params: {years: "21", from_year: "2026"}}]}
  ul19: &ul19 {basis: "300000.00", rate: null, method: useful_life, useful_life_years: 19,
               useful_life_from_year: 2028,
               warnings: [{code: afa.useful_life_report, params: {years: "19", from_year: "2028"}}]}

cases:
  - id: etw_1998_handover_july
    description: 325,000.00 × 0.72 = 234,000.00; 2 % = 4,680.00 a year; 6/12 in 2026
    facts: *flat
    expect:
      - {tax_year: 2026, amount: "2340.00", basis: "234000.00", rate: "0.02", months: 6,
         method_code: 2, sources: *flat_sources}
      - {tax_year: 2027, amount: "4680.00", basis: "234000.00", rate: "0.02", months: 12,
         method_code: 1, sources: *flat_sources}

  - id: build_1920_rate_2_5
    description: completed before 1925 → 2.5 %; 200,000.00 × 0.8 = 160,000.00
    facts:
      property_id: *P
      purchase_price: "200000.00"
      build_year: 1920
      purchase_date: 2025-01-15
      split: {id: *S, source: bmf_tool, building_share: "0.800000"}
    expect:
      - {tax_year: 2025, amount: "4000.00", basis: "160000.00", rate: "0.025", months: 12, method_code: 2}
      - {tax_year: 2026, amount: "4000.00", basis: "160000.00", rate: "0.025", months: 12, method_code: 1}

  - id: build_2023_rate_3
    description: completed after 2022 → 3 %; 400,000.00 × 0.75 = 300,000.00
    facts:
      property_id: *P
      purchase_price: "400000.00"
      build_year: 2023
      purchase_date: 2026-01-01
      split: {id: *S, source: bmf_tool, building_share: "0.750000"}
    expect:
      - {tax_year: 2026, amount: "9000.00", basis: "300000.00", rate: "0.03", months: 12, method_code: 2}

  - id: handover_january_full_year
    description: a handover on 31 January still counts January in full → 12/12
    facts: {<<: *flat, purchase_date: 2026-01-31}
    expect:
      - {tax_year: 2026, amount: "4680.00", basis: "234000.00", rate: "0.02", months: 12, method_code: 2}

  - id: handover_december_one_twelfth
    description: a handover on 15 December → 1/12; 4,680.00 ÷ 12 = 390.00
    facts: {<<: *flat, purchase_date: 2026-12-15}
    expect:
      - {tax_year: 2026, amount: "390.00", basis: "234000.00", rate: "0.02", months: 1, method_code: 2}

  - id: nebenkosten_in_basis
    description: >
      the Nebenkosten join the basis at the building share: (250,000.00 + 8,750.00 + 3,750.00
      + 1,250.00) × 0.8 = 211,000.00 → 4,220.00 (without them 200,000.00 → 4,000.00, next case)
    facts:
      property_id: *P
      purchase_price: "250000.00"
      build_year: 1975
      purchase_date: 2025-03-01
      split: {id: *S, source: purchase_contract, building_share: "0.800000", evidence_document_id: *D_KV}
      cost_rows:
        - {id: *C1, kind: real_estate_transfer_tax, amount: "8750.00", document_id: *D_GREST, paid_by: [*A_GREST]}
        - {id: *C2, kind: notary, amount: "3750.00", document_id: *D_NOTAR, paid_by: [*A_NOTAR]}
        - {id: *C3, kind: land_registry, amount: "1250.00", document_id: *D_GB, paid_by: [*A_GB]}
    expect:
      - {tax_year: 2026, amount: "4220.00", basis: "211000.00", rate: "0.02", months: 12, method_code: 1}

  - id: nebenkosten_in_basis_none
    description: the same purchase without cost rows
    facts:
      property_id: *P
      purchase_price: "250000.00"
      build_year: 1975
      purchase_date: 2025-03-01
      split: {id: *S, source: purchase_contract, building_share: "0.800000", evidence_document_id: *D_KV}
    expect:
      - {tax_year: 2026, amount: "4000.00", basis: "200000.00", rate: "0.02", months: 12, method_code: 1}

  - id: herstellung_addition_2027
    description: >
      a Balkonanbau (an Erweiterung, so Herstellungskosten, §255 Abs. 2 S. 1 HGB) elected
      `herstellung`, 12,000.00 paid in 2027, accrues from 1 Jan 2027:
      (234,000.00 + 12,000.00) × 2 % = 4,920.00; method code 2 again in 2027
    facts:
      <<: *flat
      additions:
        - {allocation_id: *A_BALCONY, tax_year: 2027, amount: "12000.00", reason: herstellung}
    expect:
      - {tax_year: 2026, amount: "2340.00", basis: "234000.00", additions: "0", rate: "0.02",
         months: 6, method_code: 2}
      - {tax_year: 2027, amount: "4920.00", basis: "234000.00", additions: "12000.00", rate: "0.02",
         months: 12, method_code: 2,
         sources: [{kind: property, id: *P}, {kind: price_split, id: *S}, {kind: document, id: *D_KV},
                   {kind: acquisition_cost, id: *C1}, {kind: acquisition_cost, id: *C2},
                   {kind: acquisition_cost, id: *C3}, {kind: document, id: *D_GREST},
                   {kind: document, id: *D_NOTAR}, {kind: document, id: *D_GB},
                   {kind: allocation, id: *A_BALCONY}]}

  - id: limit_crossing_additions_gross
    description: >
      The 15 % limit is crossed in 2027 (anschaffungsnah.yaml crossing_in_second_year), so the
      counted costs join the basis GROSS in the year each was paid: 2026 painter 1,190.00 +
      tiles 4,760.00 = 5,950.00; 2027 roof 42,840.00 (net 36,000.00). Amended 2026:
      (234,000.00 + 5,950.00) × 2 % × 6/12 = 2,399.50. 2027: (234,000.00 + 5,950.00 +
      42,840.00) × 2 % = 282,790.00 × 2 % = 5,655.80. (The spec draft computed 2027 on the net
      amounts; §9b Abs. 1 EStG puts the non-deductible input VAT into the cost.)
    facts:
      <<: *flat
      additions:
        - {allocation_id: *A_PAINTER, tax_year: 2026, amount: "1190.00", reason: limit_exceeded}
        - {allocation_id: *A_TILES, tax_year: 2026, amount: "4760.00", reason: limit_exceeded}
        - {allocation_id: *A_ROOF, tax_year: 2027, amount: "42840.00", reason: limit_exceeded}
    expect:
      - {tax_year: 2026, amount: "2399.50", basis: "234000.00", additions: "5950.00", rate: "0.02",
         months: 6, method_code: 2}
      - {tax_year: 2027, amount: "5655.80", basis: "234000.00", additions: "48790.00", rate: "0.02",
         months: 12, method_code: 2}

  - id: no_split_empty_line
    description: without a selected split there is no basis; the line stays empty
    facts: {<<: *flat, split: null}
    expect:
      - {tax_year: 2026, amount: null, basis: null, rate: null, months: 6, method_code: null,
         warnings: [{code: afa.no_split}]}

  - id: cost_row_unpaid_warning
    description: the notary bill was paid privately, so no allocation pairs with its row
    facts:
      <<: *flat
      cost_rows:
        - {id: *C1, kind: real_estate_transfer_tax, amount: "19500.00", paid_on: 2026-04-20,
           document_id: *D_GREST, paid_by: [*A_GREST]}
        - {id: *C2, kind: notary, amount: "4200.00", paid_on: 2026-03-25, document_id: *D_NOTAR}
        - {id: *C3, kind: land_registry, amount: "1300.00", paid_on: 2026-05-12,
           document_id: *D_GB, paid_by: [*A_GB]}
      allocations:
        - {allocation_id: *A_GREST, booking_date: 2026-04-20, amount: "-19500.00", category: acquisition_cost}
        - {allocation_id: *A_GB, booking_date: 2026-05-12, amount: "-1300.00", category: acquisition_cost}
        - {allocation_id: *A_PP, booking_date: 2026-06-30, amount: "-300000.00", category: purchase_price}
    expect:
      - {tax_year: 2026, amount: "2340.00", basis: "234000.00", rate: "0.02", months: 6, method_code: 2,
         warnings: [{code: afa.cost_row_unpaid, params: {kind: notary, amount: "4200.00"}}]}

  - id: acquisition_cost_without_row_not_added
    description: >
      a broker fee booked as acquisition_cost but with no cost row is not added to the basis
      (the record is the one source, D55); a 0.00 acquisition_cost line raises nothing (D70)
    facts:
      <<: *flat
      allocations:
        - {allocation_id: *A_GREST, booking_date: 2026-04-20, amount: "-19500.00", category: acquisition_cost}
        - {allocation_id: *A_NOTAR, booking_date: 2026-03-25, amount: "-4200.00", category: acquisition_cost}
        - {allocation_id: *A_GB, booking_date: 2026-05-12, amount: "-1300.00", category: acquisition_cost}
        - {allocation_id: *A_PP, booking_date: 2026-06-30, amount: "-300000.00", category: purchase_price}
        - {allocation_id: *A_BROKER, booking_date: 2026-07-10, amount: "-2975.00", category: acquisition_cost}
        - {allocation_id: *A_ZERO, booking_date: 2026-07-31, amount: "0.00", category: acquisition_cost}
    expect:
      - {tax_year: 2026, amount: "2340.00", basis: "234000.00", rate: "0.02", months: 6, method_code: 2,
         warnings: [{code: afa.acquisition_cost_without_row, params: {amount: "2975.00"}}]}

  - id: purchase_price_mismatch_warning
    description: the account paid 290,000.00 of the 300,000.00 price (information only)
    facts:
      <<: *flat
      allocations:
        - {allocation_id: *A_GREST, booking_date: 2026-04-20, amount: "-19500.00", category: acquisition_cost}
        - {allocation_id: *A_NOTAR, booking_date: 2026-03-25, amount: "-4200.00", category: acquisition_cost}
        - {allocation_id: *A_GB, booking_date: 2026-05-12, amount: "-1300.00", category: acquisition_cost}
        - {allocation_id: *A_PP, booking_date: 2026-06-30, amount: "-290000.00", category: purchase_price}
    expect:
      - {tax_year: 2026, amount: "2340.00", basis: "234000.00", rate: "0.02", months: 6, method_code: 2,
         warnings: [{code: afa.purchase_price_mismatch, params: {price: "300000.00", paid: "290000.00"}}]}

  - id: useful_life_from_purchase
    description: >
      A Gutachten gives 21 years from the purchase year: 252 months from October 2026.
      2026: 300,000.00 × 3/252 = 3,571.43; 2027: 296,428.57 × 12/249 = 14,285.71; the
      remaining 9 months of 2047 take the rest (10,714.29); nothing from 2048. The years
      2026–2048 sum to exactly 300,000.00 (asserted in test_tax_rule_afa.py).
    facts: {<<: *old_building, useful_lives: [*life_21]}
    expect:
      - {<<: *ul21, tax_year: 2026, amount: "3571.43", months: 3, method_code: 2,
         book_value_start: "300000.00", remaining_months: 252,
         sources: [{kind: property, id: *P}, {kind: price_split, id: *S},
                   {kind: tax_input, id: *UL21}, {kind: document, id: *D_GUT}]}
      - {<<: *ul21, tax_year: 2027, amount: "14285.71", months: 12, method_code: 1,
         book_value_start: "296428.57", remaining_months: 249}
      - {<<: *ul21, tax_year: 2028, amount: "14285.71", months: 12, method_code: 1,
         book_value_start: "282142.86"}
      - {<<: *ul21, tax_year: 2046, amount: "14285.71", months: 12, method_code: 1}
      - {<<: *ul21, tax_year: 2047, amount: "10714.29", months: 12, method_code: 1,
         book_value_start: "10714.29", remaining_months: 9}
      - {<<: *ul21, tax_year: 2048, amount: "0.00", months: 12, method_code: 1,
         book_value_start: "0.00", remaining_months: 0}

  - id: useful_life_with_addition
    description: >
      As useful_life_from_purchase, plus a dormer (Gaube) elected herstellung, 21,000.00 paid
      in 2028: it joins the book value from 1 January 2028. 2028: (282,142.86 + 21,000.00) ×
      12/237 = 303,142.86 × 12/237 = 15,349.01; 2029: 287,793.85 × 12/225 = 15,349.01.
    facts:
      <<: *old_building
      useful_lives: [*life_21]
      additions:
        - {allocation_id: *A_DORMER, tax_year: 2028, amount: "21000.00", reason: herstellung}
    expect:
      - {<<: *ul21, tax_year: 2027, amount: "14285.71", additions: "0", months: 12,
         method_code: 1, book_value_start: "296428.57"}
      - {<<: *ul21, tax_year: 2028, amount: "15349.01", additions: "21000.00", months: 12,
         method_code: 2, book_value_start: "303142.86", remaining_months: 237,
         sources: [{kind: property, id: *P}, {kind: price_split, id: *S},
                   {kind: allocation, id: *A_DORMER},
                   {kind: tax_input, id: *UL21}, {kind: document, id: *D_GUT}]}
      - {<<: *ul21, tax_year: 2029, amount: "15349.01", additions: "21000.00", months: 12,
         method_code: 1, book_value_start: "287793.85"}

  - id: useful_life_from_later_year
    description: >
      A Gutachten from 2028 gives 19 years: 2026 and 2027 stay statutory (300,000.00 × 2.5 %
      × 3/12 = 1,875.00; 7,500.00); 2028 starts from the book value 290,625.00 over 228 months:
      × 12/228 = 15,296.05; 2029: 275,328.95 × 12/216 = 15,296.05.
    facts:
      <<: *old_building
      useful_lives: [{tax_input_id: *UL19, from_year: 2028, years: 19, document_id: *D_GUT}]
    expect:
      - {tax_year: 2026, amount: "1875.00", basis: "300000.00", rate: "0.025", months: 3,
         method_code: 2, sources: [{kind: property, id: *P}, {kind: price_split, id: *S}]}
      - {tax_year: 2027, amount: "7500.00", basis: "300000.00", rate: "0.025", months: 12,
         method_code: 1}
      - {<<: *ul19, tax_year: 2028, amount: "15296.05", months: 12, method_code: 2,
         book_value_start: "290625.00", remaining_months: 228,
         sources: [{kind: property, id: *P}, {kind: price_split, id: *S},
                   {kind: tax_input, id: *UL19}, {kind: document, id: *D_GUT}]}
      - {<<: *ul19, tax_year: 2029, amount: "15296.05", months: 12, method_code: 1,
         book_value_start: "275328.95"}

  - id: useful_life_sale_year
    description: >
      As useful_life_from_purchase, sold on 31 March 2028: the sale year takes its 3 owned
      months only, 282,142.86 × 3/237 = 3,571.43; nothing after the sale.
    facts: {<<: *old_building, useful_lives: [*life_21], ownership_ended_on: 2028-03-31}
    expect:
      - {<<: *ul21, tax_year: 2028, amount: "3571.43", months: 3, method_code: 1,
         book_value_start: "282142.86"}
      - {<<: *ul21, tax_year: 2029, amount: "0.00", months: 0, method_code: null,
         book_value_start: "278571.43"}

  - id: movable_in_price_reduces_building
    description: >
      D80: a kitchen estimated at 8,500.00 of the price takes its Nebenkosten share with it:
      8,500.00 × 325,000.00 ÷ 300,000.00 = 9,208.33 leaves the building's 234,000.00, so the
      basis is 224,791.67 (the land's 91,000.00 stays as it was). 2 % × 6/12 = 2,247.92 in
      2026; 4,495.83 a year after it. The kitchen's own AfA is in movable_asset.yaml.
    facts:
      <<: *flat
      movable_assets:
        - {tax_input_id: *K, label: einbaukueche, from_year: 2026, amount: "8500.00",
           useful_life_years: 10, in_purchase_price: true, document_id: *D_PLAN}
    expect:
      - {tax_year: 2026, amount: "2247.92", basis: "224791.67", rate: "0.02", months: 6,
         method_code: 2, movable_deducted: "9208.33",
         sources: [{kind: property, id: *P}, {kind: price_split, id: *S}, {kind: document, id: *D_KV},
                   {kind: acquisition_cost, id: *C1}, {kind: acquisition_cost, id: *C2},
                   {kind: acquisition_cost, id: *C3}, {kind: document, id: *D_GREST},
                   {kind: document, id: *D_NOTAR}, {kind: document, id: *D_GB},
                   {kind: tax_input, id: *K}]}
      - {tax_year: 2027, amount: "4495.83", basis: "224791.67", rate: "0.02", months: 12,
         method_code: 1, movable_deducted: "9208.33"}

  - id: movable_in_price_with_useful_life
    description: >
      D80 with D79: the reduced basis 224,791.67 is what a shorter useful life (here 30 years
      from the purchase year, synthetic) spreads over its remaining months: 2026: 224,791.67 ×
      6/360 = 3,746.53; 2027: 221,045.14 × 12/354 = 7,493.06.
    facts:
      <<: *flat
      useful_lives: [{tax_input_id: *UL30, from_year: 2026, years: 30, document_id: *D_GUT}]
      movable_assets:
        - {tax_input_id: *K, label: einbaukueche, from_year: 2026, amount: "8500.00",
           useful_life_years: 10, in_purchase_price: true, document_id: *D_PLAN}
    expect:
      - {tax_year: 2026, amount: "3746.53", basis: "224791.67", rate: null, months: 6,
         method_code: 2, method: useful_life, useful_life_years: 30, useful_life_from_year: 2026,
         book_value_start: "224791.67", remaining_months: 360, movable_deducted: "9208.33",
         warnings: [{code: afa.useful_life_report, params: {years: "30", from_year: "2026"}}]}
      - {tax_year: 2027, amount: "7493.06", basis: "224791.67", rate: null, months: 12,
         method_code: 1, method: useful_life, useful_life_years: 30, useful_life_from_year: 2026,
         book_value_start: "221045.14", remaining_months: 354, movable_deducted: "9208.33",
         warnings: [{code: afa.useful_life_report, params: {years: "30", from_year: "2026"}}]}
