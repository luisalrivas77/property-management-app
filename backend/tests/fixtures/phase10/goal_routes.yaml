# --- Route 3 „Mehr Rendite“ (the header's last part) ------------------------------------------
# Route 2's extra, route 4's scenarios and the balanced route at the typed rates are found as
# above; none of the investor cases closes a spending scenario (each extra is above 3,000).

- id: route3_within
  description: >-
    „Machbar“ through route 3: 880,000 by Dec 2029 needs 12.8 % a year, which six of the nine
    windows reached (the median's 14.7 % among them); no spending scenario closes (3,533 more a
    month); at the median's 14.7 % the walk alone reaches 880,000, so the balanced route needs
    no cut and no extra
  <<: *investor
  levers:
    goal: {kind: net_worth, target: '880000.00', due_month: '2029-12', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
  expect:
    word: feasible
    projected: '737110.28'
    noetig: '5533.00'            # E = 3,533
    more_saving: {extra: '3533.00', noetig: '5533.00'}
    more_return:
      available: true
      needed_return: '0.128'     # 880,509.17 at 12.8 %, 878,258.99 at 12.7 %
      window_years: 3
      windows: 9
      reached_windows: 6         # 1.128³ = 1.435249: 1.716, 1.512, 1.512, 2.184, 1.56, 1.98
      median: '0.147'
      best: '0.297'
      verdict: within_history    # 1.435249 ≤ 1.512
      thin: false
      left_out: []
      sources: [funds]
    scenarios:
      wants_only: {closes: false, cut: '900.00'}
      all_equal: {closes: false, cut: '3000.00'}
    balanced:
      cuts: {}
      cut: '0.00'
      saving_extra: '0.00'       # at 14.7 % the walk alone gives more than 880,000
      moved_to_saving: '0.00'
      closes: true
      return_rate: '0.147'

- id: route3_good_times
  description: >-
    „Ehrgeizig“: 1,250,000 by Dec 2029 needs 27.2 % a year, which only the best window (2019–21,
    29.7 %) reached; no spending scenario closes; the balanced route at the median's 14.7 %
    still misses with all the income
  <<: *investor
  levers:
    goal: {kind: net_worth, target: '1250000.00', due_month: '2029-12', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
  expect:
    word: ambitious
    projected: '737110.28'
    noetig: null                 # E = 12,682 above the mean income
    more_saving: {extra: '12682.00', noetig: null}
    more_return:
      available: true
      needed_return: '0.272'     # 1,252,268.29 at 27.2 %, 1,249,342.27 at 27.1 %
      window_years: 3
      windows: 9
      reached_windows: 1         # 1.272³ = 2.058076: 2.184 only
      median: '0.147'
      best: '0.297'
      verdict: good_times        # 1.512 < 2.058076 ≤ 2.184
      thin: false
      left_out: []
      sources: [funds]
    scenarios:
      wants_only: {closes: false, cut: '900.00'}
      all_equal: {closes: false, cut: '3000.00'}
    balanced:
      cuts: {hh_restaurant: '300.00', hh_streaming: '150.00'}   # at 14.7 % the extra is 7,107, half 3,553.50 above the limit
      cut: '450.00'
      saving_extra: null         # with the cuts, 5,000 more a month still misses
      moved_to_saving: '0.00'
      closes: false
      return_rate: '0.147'

- id: route3_never
  description: >-
    „Kaum erreichbar“: 1,600,000 by Dec 2029 needs 38.1 % a year, more than any window gave
  <<: *investor
  levers:
    goal: {kind: net_worth, target: '1600000.00', due_month: '2029-12', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
  expect:
    word: hardly
    projected: '737110.28'
    more_saving: {extra: '21335.00', noetig: null}
    more_return:
      available: true
      needed_return: '0.381'     # 1,602,716.38 at 38.1 %, 1,599,206.94 at 38.0 %
      window_years: 3
      windows: 9
      reached_windows: 0         # 1.381³ = 2.633789 > 2.184
      median: '0.147'
      best: '0.297'
      verdict: never
      thin: false
      left_out: []
      sources: [funds]
    scenarios:
      wants_only: {closes: false, cut: '900.00'}
