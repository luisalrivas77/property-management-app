# Phase 10 §7.11 (a)–(c), D301–D303: the goal on one month walk, „Nötig im Monat“ solved with
# growth, the routes and the word. Invented household (the one of goal.yaml), figures worked
# by hand month by month (a scratch walk written apart from the rule, its 31 Decembers checked
# against tests/fixture_models_phase9.project), never generated by the rule and never edited
# to make an implementation pass.
#
# The household: newest closed month Oct 2026, today 24 Nov 2026; income 5,000, regular
# spending 3,000 (rent 1,500 and supermarket 600 needs; restaurant 600 and streaming 300 wants),
# buffer 0, no savings plan, no rental cash; at 31 Oct 2026 the bank row 50,000 of which the
# reserve 30,000, the reserve's need 3,000 a month, 6 months' target 18,000. Saved each month:
# 2,000. Unless a case says otherwise the goal is a net worth by Jun 2036, funds are typed at 6 %
# a year and the effective split is 100 % funds.
#
# The walk, each month k after Oct 2026 (D301, fixture_models_phase9.project):
# 1. the reserve R earns the typed reserve rate (none here); 2. R += 2,000 (+ the extra of a
# route from Dec 2026, + a spending cut from Dec 2026 to the due month); 3. in December of a sale
# year R += the net proceeds; 4. what lies above 18,000 moves into funds (Nov 2026: 32,000 →
# 14,000 moves); 5. funds grow on 31 Dec by V(1 + r) + Σ c_j (1 + r (12 − j)/12), a month
# inside a year read with the months so far (m months: V(1 + r m/12) + Σ c_j(1 + r(m − j)/12));
# 6. bank row = 50,000 + R − 30,000 (38,000 once R sits at its target); a property's value and
# loans run in a straight line between 31 Oct 2026 and each 31 Dec, a sold one counts 0 from
# December of its sale year.
# So each month after Nov 2026 pays 2,000 into funds: 31 Dec 2027 funds 41,694.20, net worth
# 79,694.20; 30 Jun 2036 funds 331,991.55, net worth 369,991.55 (projected).
#
# Amended 27 Nov 2026 by phase 10 §7.11 (i), D311, before its rules existed: the word is the
# path's state (goal_path.yaml) and the balanced route always walks the typed rates. The
# ceiling = income − need − wants kept − buffer; this household's need of 3,000 counts every
# spending (written before (g)), and with no wants target the suggested wants kept are 450,
# so the ceiling 1,550 lies below Anlegbar 2,000 and the room is 0 in every case here. So step
# 1 reads on_track or nothing, and step 2 is route 3 at the room 0 (its needed returns below,
# unchanged): reached in at least half of the windows feasible, in fewer but some ambitious,
# none, out of range or not available hardly; a short history (thin) is judged the same.
# Changed: closed_by_spending, balanced_wants_target, generic_mode, nothing_held,
# sale_before_goal, property_without_scenario feasible → hardly (no room, no history);
# route3_thin hardly → feasible (2 of 4); route3_split_without_coin feasible → hardly (0 of 9);
# the balanced route of route3_within, route3_good_times, route3_never, route3_coins_left_out
# and route3_split_without_coin walked at the typed rates (return_rate null). Every other
# figure is unchanged. Superseded where it disagrees: the „Words (D303)“ paragraph and
# reading 5 of route 3 below.
#
# Amended again 27 Nov 2026 (§7.11 (i) item 1): the ceiling counts all regular spending as
# Anlegbar does, ceiling = income − regular spending + (Σ wants − wants kept) − buffer, so the
# need of 3,000 no longer enters it (its rows carry other spending −900). The room is 450
# (150 in balanced_wants_target, wants kept 750), not 0, and step 2 is route 3's needed return
# at that room. Changed: closed_by_spending and generic_mode hardly → feasible (E = 196 ≤ 450),
# property_without_scenario hardly → feasible (E = 235 ≤ 450), route3_split_without_coin
# hardly → ambitious (at the room 450 the walk needs 26.8 %, 200,120.39 at 26.8 % and
# 199,868.35 at 26.7 %, reached by one of the nine 3-year windows, 2019–2021's 2.184 ≥
# 1.268³ = 2.0387). The other route3_* words hold at the room 450 (route3_within 7 of 9,
# route3_thin 2 of 4, route3_good_times 1 of 9, route3_never 0 of 9, route3_coins_left_out 3 of
# 7); every other figure is unchanged.
#
# Nötig (D302): extra E = the smallest whole euro which, added to each month's saving from Dec
# 2026 to the due month, makes the walk reach the target at the due month; found by bisection
# between 0 and the mean income; nötig = 2,000 + E, none above it. Route 2 „Mehr anlegen“ is
# that extra (it never decides the word). Route 3 „Mehr Rendite“ below (the cases route3_*);
# the cases above hold no reference series, so their route 3 is not available: series_missing
# (funds in the mix, no download), nothing_invested (nothing held, no split), generic_mode in
# `generic`; none of their words changed with route 3. Route 4 the two spending scenarios of goal.yaml,
# cut = E (no buffer here), shared by the codes' means, each rounded up to the cent.
# „Ausgewogener Weg“, shown whenever route 1 misses: half of E (to the cent, up) cut from the
# wants by their means, each want cut at most to half its mean, or with `budget_targets.
# wants_max` set to that percent of the income (the room Σ wants − wants_max × income shared
# by the means); then the saving extra s = the smallest whole euro that with these cuts reaches
# the target; moved_to_saving = max(0, s − half of E) (what the limit leaves open); closes when
# s ≤ the mean income.
# Words (D303): on_track when route 1 reaches the target by the due month; feasible when a route
# 4 scenario closes the gap or route 3 decides with the verdict within_history; ambitious when
# route 3 decides with good_times and no scenario closes; hardly otherwise.
#
# Route 3 „Mehr Rendite“ (§7.11 (c) 3, „Route 3 as decided for the build“, D310 amended). The
# reference series are INVENTED yearly returns in euros (never French's or Coin Metrics' data).
# 1. Weights: the funds (the depot less a depot ticked into the reserve) and each coin at
#    today's value; with nothing held, the split's shares, the split's crypto part left out and
#    named (no_coin) since no coin is held; nothing held and no split: nothing_invested. A coin
#    without a series (no_series) or with fewer yearly returns than the window (too_short) is
#    left out and named with its share of the invested value (to 0.1 %), its weight shared by
#    the rest pro rata; under half of the value covered: history_short.
# 2. The mix's yearly return = Σ weight × the part's return, over the years every part has.
# 3. Window L = months_left ÷ 12 whole years, at least 1 (Nov 2026 → Dec 2029: 37 months, L = 3);
#    every run of L consecutive mix years is a window, its product Π(1 + r); fewer than 5
#    windows is thin: shown, but it never decides the word and the balanced route keeps the
#    typed rates.
# 4. needed_return = the smallest rate on the 0.1 % grid in [−0.5, 1.0] which, typed as both
#    the funds' and the crypto's yearly rate, makes the walk reach the target at the due month;
#    none there: out_of_range (the windows still shown). A window reached it when its product
#    ≥ (1 + needed)^L, compared exactly. median = the sorted products' element M ÷ 2 (the middle;
#    of an even M the upper middle, so within means at least half the windows reached it), best
#    the largest; both shown annualised, product^(1/L) − 1 rounded down to 0.1 %. verdict:
#    within_history when (1 + needed)^L ≤ the median product, good_times when ≤ the best,
#    never otherwise.
# 5. Route 3 decides when it is available, not thin and in own use: then the balanced route is
#    walked with the median's annualised rate as both rates (`return_rate`), half of the extra
#    at that rate cut from the wants as above; a rate that alone reaches the target needs no cut
#    and no extra (cut 0, saving_extra 0).
# The investor household of the route 3 cases is the one above with 500,000 of funds at the
# start (bank 50,000), today worth 551,000; the goal is a net worth by Dec 2029, funds typed at
# 6 %. Its walk: 31 Dec 2026 funds 521,070.00 (500,000 × (1 + 0.06 × 2/12) + 14,000 × (1 + 0.06 ×
# 1/12) + 2,000), net worth 559,070.00; 2027 614,994.20; 2028 674,273.85; 2029 737,110.28.
# Its funds series FUNDS (2015–2025): 10, 30, 20, −10, 40, 20, 30, −20, 50, 10, 20 %; nine
# windows of three years, products by first year 2015 1.716, 2016 1.404, 2017 1.512, 2018 1.512,
# 2019 2.184, 2020 1.248, 2021 1.56, 2022 1.32, 2023 1.98; sorted 1.248, 1.32, 1.404, 1.512, 1.512 (median, 14.7 %:
# 1.147³ = 1.50898 ≤ 1.512 < 1.148³ = 1.51294), 1.56, 1.716, 1.98, 2.184 (best, 29.7 %).
#
# Amended 27 Nov 2026 by §7.11 (j), D312: reading 1's weights blend today's values with the money
# still to come, what the walk invests from Nov 2026 to the due month in all (what moves above
# the reserve target, undiscounted; route 3 the household's own walk, step 2 the walk with the
# whole room from Dec 2026), at the split: its funds share joins the funds, its crypto share is
# spread over the coins held today by their value (also one left out), or with no coin held is
# a no_coin part; a kind in both counts once, at the sum, and the left-out shares, the half
# covered and the windows read the blended values. `mix_today_share` and `mix_future_share`
# are the two parts' percents of the whole (to 0.1, half up), null without a count; nothing
# held and nothing still to come keeps the split's reading (0.0 and 100.0). The investor by
# Dec 2029 invests 14,000 + 37 × 2,000 = 88,000 (step 2: + 37 × 450 = 104,650), so 500,000
# held of 588,000: 85.0 and 15.0; with only funds held and the split all funds the mix is the
# funds' as before. Changed: route3_coins_left_out (funds 388,000 and BTC 100,000 of 588,000:
# ETH 8.0 → 6.8, SOL 12.0 → 10.2, median 22.2 → 20.1 %, best 58.5 → 53.6 %; still 3 of 7,
# good_times, ambitious) and route3_history_short (funds 188,000 of 338,000 cover 55.6 %, so
# route 3 is available: SOL 60.0 → 44.4, 19.5 % needed, 3 of 9, good_times; the word hardly →
# ambitious, step 2's 17.9 % reached by 3 of 9); its history_short pin moves to
# route3_history_short_blended. New: route3_future_lifts_the_coin, route3_future_crypto_no_coin,
# route3_lump_above_reserve, route3_due_next_month.
#
# Amended 28 Nov 2026 by §7.13 (d) 8, D316 (Luis: the goal is judged by its year): the goal is
# reached when the walk reaches the target at any month-end of its year up to 31 Dec; „Nötig im
# Monat“, the routes, the word and the path all solve for 31 Dec of that year, and a goal stored
# with a month keeps its year (read-side, no migration). The cases due Jun 2036 now read 2036
# (stored as Dec 2036; stored_month_keeps_its_year pins a stored Jun): from Nov 2026 to Dec
# 2036, 121 months left (it was 115), 31 Dec 2036 funds 353,817.33, net worth 391,817.33 (projected).
# Recomputed with a scratch walk written apart from the rule that first reproduced every Jun
# 2036 figure below as it stood. Changed: on_track's projected; closed_by_spending and
# generic_mode E 196 → 50; closed_by_saving E 3,448 → 3,093; balanced_wants_target and
# balanced_wants_net_of_a_refund E 1,822 → 1,572; nothing_held E 1,027 → 877 (its wants_only
# now closes); sale_before_goal E 802 → 581; property_without_scenario E 235 → 50; with them
# their scenarios and balanced routes. The words hold (E within the room 450: feasible; above
# it with no series: hardly). The route3_* cases are due Dec 2029 and unchanged. New:
# stored_month_keeps_its_year; a goal reached in its year and below the target again by
# December is pinned in goal.yaml (reached_in_the_year_then_below).
bases:
  household: &household
    today: '2026-11-24'
    newest_closed: '2026-10'
    month: {mean_income: '5000.00', mean_regular_spending: '3000.00', mean_rental_cash: '0.00', buffer_percent: '0'}
    start: {month_end: '2026-10-31', bank: '50000.00', depot: '0.00', crypto: '0.00', property: '0.00', loans: '0.00', other_liabilities: '0.00'}
    reserve: {amount: '30000.00', need: '3000.00'}
    saved_mean: '2000.00'
    value_today: {net_worth: '51000.00', reserve: '31000.00'}
    means: {hh_rent: '1500.00', hh_supermarket: '600.00', hh_restaurant: '600.00', hh_streaming: '300.00'}
    split: {depot: '100', crypto: '0'}
  flat: &flat
    # a property sold in 2030: phase 4's years (value, loan balance), its cash 0 a month
    sale_year: 2030
    years: {2027: ['300000.00', '200000.00'], 2028: ['310000.00', '190000.00'], 2029: ['320000.00', '180000.00'], 2030: ['330000.00', '170000.00']}
    net_proceeds: '150000.00'
  investor: &investor
    <<: *household
    start: {month_end: '2026-10-31', bank: '50000.00', depot: '500000.00', crypto: '0.00', property: '0.00', loans: '0.00', other_liabilities: '0.00'}
    value_today: {net_worth: '551000.00', reserve: '31000.00'}
    history: &funds_history
      funds: {2015: '0.10', 2016: '0.30', 2017: '0.20', 2018: '-0.10', 2019: '0.40', 2020: '0.20', 2021: '0.30', 2022: '-0.20', 2023: '0.50', 2024: '0.10', 2025: '0.20'}

cases:
- id: on_track
  description: route 1 reaches 360,000 in 2036 on the growth; nötig is Heute, no route shown
  <<: *household
  levers:
    goal: {kind: net_worth, target: '360000.00', due_month: '2036-12', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
  expect:
    word: on_track
    projected: '391817.33'
    reached: '2036-04'           # 362,796.29 at 30 Apr 2036
    noetig: '2000.00'            # E = 0
    more_saving: {extra: '0.00', noetig: '2000.00'}
    more_return: {available: false, reason: series_missing}
    balanced: null
    scenarios: {}

- id: closed_by_spending
  description: >-
    „Machbar“: 400,000 in 2036 needs 50 a month more (49 leaves 399,868.52 at 31 Dec 2036);
    „Nur Wünsche kürzen“ closes it; the balanced route cuts half from the wants and saves the
    rest
  <<: *household
  levers:
    goal: {kind: net_worth, target: '400000.00', due_month: '2036-12', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
  expect:
    word: feasible  # §7.11 (i) item 1: E = 50 within the room 450
    projected: '391817.33'
    reached: '2037-03'
    noetig: '2050.00'            # 50: 400,032.83 at 31 Dec 2036
    more_saving: {extra: '50.00', noetig: '2050.00'}
    more_return: {available: false, reason: series_missing}
    scenarios:
      wants_only: {closes: true, cut: '50.01'}    # 600×50/900 = 33.333… → 33.34; 16.67
      all_equal: {closes: true, cut: '50.00'}     # 25.00 + 10.00 + 10.00 + 5.00
    balanced:
      cuts: {hh_restaurant: '16.67', hh_streaming: '8.34'}    # half 25.00 × 600/900, × 300/900
      cut: '25.01'
      saving_extra: '25.00'      # with the cuts, 25 reaches 400,034.47; 24 leaves 399,870.16
      moved_to_saving: '0.00'
      closes: true

- id: closed_by_saving
  description: >-
    „Kaum erreichbar“: 900,000 in 2036 needs 3,093 a month more (900,028.31 at 31 Dec 2036,
    3,092 leaves 899,864.00), more than all the spending (3,000), so no spending scenario closes
    it; route 2 still says how much; the balanced route cuts the wants to half and moves the
    rest to saving
  <<: *household
  levers:
    goal: {kind: net_worth, target: '900000.00', due_month: '2036-12', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
  expect:
    word: hardly
    projected: '391817.33'
    reached: '2045-09'
    noetig: '5093.00'            # E = 3,093 ≤ the mean income 5,000
    more_saving: {extra: '3093.00', noetig: '5093.00'}
    more_return: {available: false, reason: series_missing}
    scenarios:
      wants_only: {closes: false, cut: '900.00'}  # every want to 0
      all_equal: {closes: false, cut: '3000.00'}  # every code to 0, 93 left open
    balanced:
      cuts: {hh_restaurant: '300.00', hh_streaming: '150.00'}   # half of each mean, the limit
      cut: '450.00'
      saving_extra: '2643.00'    # 450 + 2,643 = 3,093
      moved_to_saving: '1096.50'  # 2,643 − 1,546.50 (half of 3,093)
      closes: true

- id: balanced_wants_target
  description: >-
    „Machbar“ through „Alles gleich kürzen“; the household's wants target of 15 % (750 of the
    income) leaves room for 150 of wants cut, the rest of the half moves to saving
  <<: *household
  levers:
    goal: {kind: net_worth, target: '650000.00', due_month: '2036-12', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
    budget_targets: {wants_max: '15'}
  expect:
    word: hardly
    projected: '391817.33'
    reached: '2041-12'
    noetig: '3572.00'            # E = 1,572: 650,112.72 at 31 Dec 2036, 1,571 leaves 649,948.41
    more_saving: {extra: '1572.00', noetig: '3572.00'}
    more_return: {available: false, reason: series_missing}
    scenarios:
      wants_only: {closes: false, cut: '900.00'}
      all_equal: {closes: true, cut: '1572.00'}   # 786.00 + 314.40 + 314.40 + 157.20
    balanced:
      cuts: {hh_restaurant: '100.00', hh_streaming: '50.00'}    # room 900 − 750 = 150 by the means
      cut: '150.00'
      saving_extra: '1422.00'
      moved_to_saving: '636.00'   # 1,422 − 786
      closes: true

- id: balanced_wants_net_of_a_refund
  description: >-
    Added 27 Nov 2026 (§7.11 (c) amended): the household of balanced_wants_target with 300 of
    clothing bought and 300 refunded each month, both wants, so the spending (3,000), the saving
    and the walk are that case's. The want class nets 900 (600 + 300 + 300 − 300), as the
    Budget's Wünsche line shows it, and the target keeps 750, so the wants can give up 150, not
    the 450 the positive wants alone (1,200 − 750) would allow; the 150 is shared over the
    positive wants by their means, and the rest of the half moves to saving, as in
    balanced_wants_target
  <<: *household
  means: {hh_rent: '1500.00', hh_supermarket: '600.00', hh_restaurant: '600.00', hh_streaming: '300.00', hh_clothing: '300.00', hh_refund: '-300.00'}
  levers:
    goal: {kind: net_worth, target: '650000.00', due_month: '2036-12', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
    budget_targets: {wants_max: '15'}
  expect:
    word: hardly
    projected: '391817.33'
    reached: '2041-12'
    noetig: '3572.00'            # E = 1,572, the walk of balanced_wants_target
    more_saving: {extra: '1572.00', noetig: '3572.00'}
    more_return: {available: false, reason: series_missing}
    balanced:
      # room 900 − 750 = 150 by the positive means 600, 300, 300 of 1,200: 75, 37.50, 37.50
      cuts: {hh_clothing: '37.50', hh_restaurant: '75.00', hh_streaming: '37.50'}
      cut: '150.00'
      saving_extra: '1422.00'    # 1,572 − 150, as in balanced_wants_target
      moved_to_saving: '636.00'  # 1,422 − 786
      closes: true

- id: generic_mode
  description: the case closed_by_spending in `generic` mode; route 3 says why it is not offered
  <<: *household
  mode: generic
  levers:
    goal: {kind: net_worth, target: '400000.00', due_month: '2036-12', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
  expect:
    word: feasible  # §7.11 (i) item 1: E = 50 within the room 450
    projected: '391817.33'
    reached: '2037-03'
    noetig: '2050.00'
    more_saving: {extra: '50.00', noetig: '2050.00'}
    more_return: {available: false, reason: generic_mode}
    scenarios:
      wants_only: {closes: true, cut: '50.01'}
      all_equal: {closes: true, cut: '50.00'}
    balanced:
      cuts: {hh_restaurant: '16.67', hh_streaming: '8.34'}
      cut: '25.01'
      saving_extra: '25.00'
      moved_to_saving: '0.00'
      closes: true

- id: stored_month_keeps_its_year
  description: >-
    closed_by_spending stored before D316 with the month Jun 2036: it keeps its year and reads
    exactly as 400,000 in 2036 (solved for 31 Dec 2036, E = 50)
  <<: *household
  levers:
    goal: {kind: net_worth, target: '400000.00', due_month: '2036-06', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
  expect:
    word: feasible
    projected: '391817.33'
    reached: '2037-03'
    noetig: '2050.00'
    more_saving: {extra: '50.00', noetig: '2050.00'}
    more_return: {available: false, reason: series_missing}
    scenarios:
      wants_only: {closes: true, cut: '50.01'}
      all_equal: {closes: true, cut: '50.00'}
    balanced:
      cuts: {hh_restaurant: '16.67', hh_streaming: '8.34'}
      cut: '25.01'
      saving_extra: '25.00'
      moved_to_saving: '0.00'
      closes: true

- id: nothing_held
  description: >-
    nothing held and no split: nothing moves, the money stays on the accounts at 0 % (the
    linear walk of goal.yaml); 50,000 + 2,000 × 122 = 294,000 at Dec 2036
  <<: *household
  split: null
  levers:
    goal: {kind: net_worth, target: '400000.00', due_month: '2036-12', set_on: '2026-11-20'}
  expect:
    word: hardly                 # E = 877 above the room 450, no series
    projected: '294000.00'
    reached: '2041-05'           # 50,000 + 2,000k ≥ 400,000 → k = 175
    noetig: '2877.00'            # E = ⌈106,000 ÷ 121⌉ = ⌈876.03⌉
    more_saving: {extra: '877.00', noetig: '2877.00'}
    more_return: {available: false, reason: nothing_invested}
    scenarios:
      wants_only: {closes: true, cut: '877.01'}   # 584.67 + 292.34, within the wants' 900
      all_equal: {closes: true, cut: '877.00'}    # 438.50 + 175.40 + 175.40 + 87.70
    balanced:
      cuts: {hh_restaurant: '292.34', hh_streaming: '146.17'}   # half 438.50 by the means, within half of each
      cut: '438.51'
      saving_extra: '438.00'     # 121 × (438 + 438.51) ≥ 106,000; 437 does not
      moved_to_saving: '0.00'    # 438 − 438.50 < 0
      closes: true

- id: no_rate_typed
  description: >-
    funds of 10,000 held at the start and no yearly rate typed for them: no walk, the goal
    shows phase 9's to-do „Annahme eintragen“ (rate_missing) instead of a word
  <<: *household
  start: {month_end: '2026-10-31', bank: '50000.00', depot: '10000.00', crypto: '0.00', property: '0.00', loans: '0.00', other_liabilities: '0.00'}
  split: null
  levers:
    goal: {kind: net_worth, target: '400000.00', due_month: '2036-12', set_on: '2026-11-20'}
  expect:
    word: null
    issue: no_projection
    todos: [rate_missing]

- id: sale_before_goal
  description: >-
    a property sold in 2030 lies before the goal's month: the walk goes on past the sale (never
    beyond_projection for it), the net proceeds of 150,000 land on the reserve in Dec 2030 and,
    the reserve being at its target, move into funds the same month; the property counts 0
    from then on (30 Nov 2030 321,901.14, 31 Dec 2030 316,166.04: the 10,000 of selling costs
    between value less loan, 160,000, and the proceeds)
  <<: *household
  start: {month_end: '2026-10-31', bank: '50000.00', depot: '0.00', crypto: '0.00', property: '290000.00', loans: '210000.00', other_liabilities: '0.00'}
