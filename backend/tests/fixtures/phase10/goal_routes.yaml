# Phase 10 §7.11 (a)–(c), D301–D303: the goal on one month walk, „Nötig im Monat“ solved with
# growth, the routes and the word. Invented household (the one of goal.yaml), figures worked
# by hand month by month (a scratch walk written apart from the rule, its 31 Decembers checked
# against tests/fixture_models_phase9.project), never generated by the rule and never edited
# to make an implementation pass.
#
# The household: newest closed month Oct 2026, today 24 Nov 2026; income 5,000, regular
# spending 3,000 (rent 1,500 and supermarket 600 needs; restaurant 600 and streaming 300 wants),
# buffer 0, no savings plan, no rental cash; at 31 Oct 2026 the bank row 50,000 of which the
# reserve 30,000, the reserve's need 3,000 a month, 6 months' target 18,000. Saved each month:
# 2,000. Unless a case says otherwise the goal is a net worth by Jun 2036, funds are typed at 6 %
# a year and the effective split is 100 % funds.
#
# The walk, each month k after Oct 2026 (D301, fixture_models_phase9.project):
# 1. the reserve R earns the typed reserve rate (none here); 2. R += 2,000 (+ the extra of a
# route from Dec 2026, + a spending cut from Dec 2026 to the due month); 3. in December of a sale
# year R += the net proceeds; 4. what lies above 18,000 moves into funds (Nov 2026: 32,000 →
# 14,000 moves); 5. funds grow on 31 Dec by V(1 + r) + Σ c_j (1 + r (12 − j)/12), a month
# inside a year read with the months so far (m months: V(1 + r m/12) + Σ c_j(1 + r(m − j)/12));
# 6. bank row = 50,000 + R − 30,000 (38,000 once R sits at its target); a property's value and
# loans run in a straight line between 31 Oct 2026 and each 31 Dec, a sold one counts 0 from
# December of its sale year.
# So each month after Nov 2026 pays 2,000 into funds: 31 Dec 2027 funds 41,694.20, net worth
# 79,694.20; 30 Jun 2036 funds 331,991.55, net worth 369,991.55 (projected).
#
# Nötig (D302): extra E = the smallest whole euro which, added to each month's saving from Dec
# 2026 to the due month, makes the walk reach the target at the due month; found by bisection
# between 0 and the mean income; nötig = 2,000 + E, none above it. Route 2 „Mehr anlegen“ is
# that extra (it never decides the word). Route 3 „Mehr Rendite“ is not built: not available,
# reason not_built (generic_mode in `generic`). Route 4 the two spending scenarios of goal.yaml,
# cut = E (no buffer here), shared by the codes' means, each rounded up to the cent.
# „Ausgewogener Weg“, shown whenever route 1 misses: half of E (to the cent, up) cut from the
# wants by their means, each want cut at most to half its mean, or with `budget_targets.
# wants_max` set to that percent of the income (the room Σ wants − wants_max × income shared
# by the means); then the saving extra s = the smallest whole euro that with these cuts reaches
# the target; moved_to_saving = max(0, s − half of E) (what the limit leaves open); closes when
# s ≤ the mean income.
# Words (D303): on_track when route 1 reaches the target by the due month; feasible when a route
# 4 scenario closes the gap; ambitious never now (route 3); hardly otherwise.
bases:
  household: &household
    today: '2026-11-24'
    newest_closed: '2026-10'
    month: {mean_income: '5000.00', mean_regular_spending: '3000.00', mean_rental_cash: '0.00', buffer_percent: '0'}
    start: {month_end: '2026-10-31', bank: '50000.00', depot: '0.00', crypto: '0.00', property: '0.00', loans: '0.00', other_liabilities: '0.00'}
    reserve: {amount: '30000.00', need: '3000.00'}
    saved_mean: '2000.00'
    value_today: {net_worth: '51000.00', reserve: '31000.00'}
    means: {hh_rent: '1500.00', hh_supermarket: '600.00', hh_restaurant: '600.00', hh_streaming: '300.00'}
    split: {depot: '100', crypto: '0'}
  flat: &flat
    # a property sold in 2030: phase 4's years (value, loan balance), its cash 0 a month
    sale_year: 2030
    years: {2027: ['300000.00', '200000.00'], 2028: ['310000.00', '190000.00'], 2029: ['320000.00', '180000.00'], 2030: ['330000.00', '170000.00']}
    net_proceeds: '150000.00'

cases:
- id: on_track
  description: route 1 reaches 360,000 by Jun 2036 on the growth; nötig is Heute, no route shown
  <<: *household
  levers:
    goal: {kind: net_worth, target: '360000.00', due_month: '2036-06', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
  expect:
    word: on_track
    projected: '369991.55'
    reached: '2036-04'           # 362,796.29 at 30 Apr 2036
    noetig: '2000.00'            # E = 0
    more_saving: {extra: '0.00', noetig: '2000.00'}
    more_return: {available: false, reason: not_built}
    balanced: null
    scenarios: {}

- id: closed_by_spending
  description: >-
    „Machbar“: 400,000 by Jun 2036 needs 196 a month more (195 leaves 399,973.53); „Nur
    Wünsche kürzen“ closes it; the balanced route cuts half from the wants and saves the rest
  <<: *household
  levers:
    goal: {kind: net_worth, target: '400000.00', due_month: '2036-06', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
  expect:
    word: feasible
    projected: '369991.55'
    reached: '2037-03'
    noetig: '2196.00'            # 196: 400,127.28 at 30 Jun 2036
    more_saving: {extra: '196.00', noetig: '2196.00'}
    more_return: {available: false, reason: not_built}
    scenarios:
      wants_only: {closes: true, cut: '196.01'}   # 600×196/900 = 130.666… → 130.67; 65.34
      all_equal: {closes: true, cut: '196.00'}    # 98.00 + 39.20 + 39.20 + 19.60
    balanced:
      cuts: {hh_restaurant: '65.34', hh_streaming: '32.67'}   # half 98.00 × 600/900, × 300/900
      cut: '98.01'
      saving_extra: '98.00'      # with the cuts, 98 reaches 400,000; 97 does not
      moved_to_saving: '0.00'
      closes: true

- id: closed_by_saving
  description: >-
    „Kaum erreichbar“: 900,000 by Jun 2036 needs 3,448 a month more, more than all the spending
    (3,000), so no spending scenario closes it; route 2 still says how much; the balanced route
    cuts the wants to half and moves the rest to saving
  <<: *household
  levers:
    goal: {kind: net_worth, target: '900000.00', due_month: '2036-06', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
  expect:
    word: hardly
    projected: '369991.55'
    reached: '2045-09'
    noetig: '5448.00'            # E = 3,448 ≤ the mean income 5,000
    more_saving: {extra: '3448.00', noetig: '5448.00'}
    more_return: {available: false, reason: not_built}
    scenarios:
      wants_only: {closes: false, cut: '900.00'}  # every want to 0
      all_equal: {closes: false, cut: '3000.00'}  # every code to 0, 448 left open
    balanced:
      cuts: {hh_restaurant: '300.00', hh_streaming: '150.00'}   # half of each mean, the limit
      cut: '450.00'
      saving_extra: '2998.00'
      moved_to_saving: '1274.00'  # 2,998 − 1,724 (half of 3,448)
      closes: true

- id: balanced_wants_target
  description: >-
    „Machbar“ through „Alles gleich kürzen“; the household's wants target of 15 % (750 of the
    income) leaves room for 150 of wants cut, the rest of the half moves to saving
  <<: *household
  levers:
    goal: {kind: net_worth, target: '650000.00', due_month: '2036-06', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
    budget_targets: {wants_max: '15'}
  expect:
    word: feasible
    projected: '369991.55'
    reached: '2041-12'
    noetig: '3822.00'            # E = 1,822
    more_saving: {extra: '1822.00', noetig: '3822.00'}
    more_return: {available: false, reason: not_built}
    scenarios:
      wants_only: {closes: false, cut: '900.00'}
      all_equal: {closes: true, cut: '1822.00'}   # 911.00 + 364.40 + 364.40 + 182.20
    balanced:
      cuts: {hh_restaurant: '100.00', hh_streaming: '50.00'}    # room 900 − 750 = 150 by the means
      cut: '150.00'
      saving_extra: '1672.00'
      moved_to_saving: '761.00'   # 1,672 − 911
      closes: true

- id: generic_mode
  description: the case closed_by_spending in `generic` mode; route 3 says why it is not offered
  <<: *household
  mode: generic
  levers:
    goal: {kind: net_worth, target: '400000.00', due_month: '2036-06', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
  expect:
    word: feasible
    projected: '369991.55'
    reached: '2037-03'
    noetig: '2196.00'
    more_saving: {extra: '196.00', noetig: '2196.00'}
    more_return: {available: false, reason: generic_mode}
    scenarios:
      wants_only: {closes: true, cut: '196.01'}
      all_equal: {closes: true, cut: '196.00'}
    balanced:
      cuts: {hh_restaurant: '65.34', hh_streaming: '32.67'}
      cut: '98.01'
      saving_extra: '98.00'
      moved_to_saving: '0.00'
      closes: true

- id: nothing_held
  description: >-
    nothing held and no split: nothing moves, the money stays on the accounts at 0 % (the
    linear walk of goal.yaml); 50,000 + 2,000 × 116 = 282,000 at Jun 2036
  <<: *household
  split: null
  levers:
    goal: {kind: net_worth, target: '400000.00', due_month: '2036-06', set_on: '2026-11-20'}
  expect:
    word: feasible
    projected: '282000.00'
    reached: '2041-05'           # 50,000 + 2,000k ≥ 400,000 → k = 175
    noetig: '3027.00'            # E = ⌈118,000 ÷ 115⌉ = ⌈1,026.09⌉
    more_saving: {extra: '1027.00', noetig: '3027.00'}
    more_return: {available: false, reason: not_built}
    scenarios:
      wants_only: {closes: false, cut: '900.00'}
      all_equal: {closes: true, cut: '1027.00'}   # 513.50 + 205.40 + 205.40 + 102.70
    balanced:
      cuts: {hh_restaurant: '300.00', hh_streaming: '150.00'}   # half 513.50 above the limit
      cut: '450.00'
      saving_extra: '577.00'     # 450 + 577 = 1,027
      moved_to_saving: '63.50'   # 577 − 513.50
      closes: true

- id: no_rate_typed
  description: >-
    funds of 10,000 held at the start and no yearly rate typed for them: no walk, the goal
    shows phase 9's to-do „Annahme eintragen“ (rate_missing) instead of a word
  <<: *household
  start: {month_end: '2026-10-31', bank: '50000.00', depot: '10000.00', crypto: '0.00', property: '0.00', loans: '0.00', other_liabilities: '0.00'}
  split: null
  levers:
    goal: {kind: net_worth, target: '400000.00', due_month: '2036-06', set_on: '2026-11-20'}
  expect:
    word: null
    issue: no_projection
    todos: [rate_missing]

- id: sale_before_goal
  description: >-
    a property sold in 2030 lies before the goal's month: the walk goes on past the sale (never
    beyond_projection for it), the net proceeds of 150,000 land on the reserve in Dec 2030 and,
    the reserve being at its target, move into funds the same month; the property counts 0
    from then on (30 Nov 2030 321,901.14, 31 Dec 2030 316,166.04: the 10,000 of selling costs
    between value less loan, 160,000, and the proceeds)
  <<: *household
  start: {month_end: '2026-10-31', bank: '50000.00', depot: '0.00', crypto: '0.00', property: '290000.00', loans: '210000.00', other_liabilities: '0.00'}
  flats: {flat: *flat}
  levers:
    goal: {kind: net_worth, target: '700000.00', due_month: '2036-06', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
  expect:
    word: feasible
    projected: '576747.40'       # funds 538,747.40 + bank 38,000
    reached: '2038-08'
    noetig: '2802.00'            # E = 802
    more_saving: {extra: '802.00', noetig: '2802.00'}
    more_return: {available: false, reason: not_built}
    scenarios:
      wants_only: {closes: true, cut: '802.01'}   # 534.67 + 267.34
      all_equal: {closes: true, cut: '802.00'}
    balanced:
      cuts: {hh_restaurant: '267.34', hh_streaming: '133.67'}
      cut: '401.01'
      saving_extra: '401.00'
      moved_to_saving: '0.00'
      closes: true
    net_worth_at: {'2030-11': '321901.14', '2030-12': '316166.04', '2031-12': '357516.00'}

- id: property_without_scenario
  description: >-
    a property without a default scenario is kept (D301): its value today (290,000) for ever,
    its loan along its schedule (12,000 a year less here), its cash the measured mean (0); the
    walk runs and names the assumption; the to-do no_default_scenario stays on the property page
  <<: *household
  start: {month_end: '2026-10-31', bank: '50000.00', depot: '0.00', crypto: '0.00', property: '290000.00', loans: '210000.00', other_liabilities: '0.00'}
  flats:
    flat:
      kept_value: '290000.00'
      kept_loans: {2027: '198000.00', 2028: '186000.00', 2029: '174000.00', 2030: '162000.00', 2031: '150000.00', 2032: '138000.00', 2033: '126000.00', 2034: '114000.00', 2035: '102000.00', 2036: '90000.00', 2037: '78000.00', 2038: '66000.00', 2039: '54000.00', 2040: '42000.00', 2041: '30000.00', 2042: '18000.00', 2043: '6000.00', 2044: '0.00', 2045: '0.00', 2046: '0.00', 2047: '0.00', 2048: '0.00', 2049: '0.00', 2050: '0.00', 2051: '0.00', 2052: '0.00', 2053: '0.00', 2054: '0.00', 2055: '0.00', 2056: '0.00', 2057: '0.00', 2058: '0.00', 2059: '0.00', 2060: '0.00', 2061: '0.00', 2062: '0.00', 2063: '0.00', 2064: '0.00', 2065: '0.00', 2066: '0.00'}
  levers:
    goal: {kind: net_worth, target: '600000.00', due_month: '2036-06', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
  expect:
    word: feasible
    projected: '563991.55'       # 369,991.55 + 290,000 − 96,000 (half-way 102,000 → 90,000)
    reached: '2037-02'
    noetig: '2235.00'            # E = 235
    more_saving: {extra: '235.00', noetig: '2235.00'}
    more_return: {available: false, reason: not_built}
    scenarios:
      wants_only: {closes: true, cut: '235.01'}   # 156.67 + 78.34
      all_equal: {closes: true, cut: '235.00'}
    balanced:
      cuts: {hh_restaurant: '78.34', hh_streaming: '39.17'}     # half 117.50
      cut: '117.51'
      saving_extra: '117.00'
      moved_to_saving: '0.00'
      closes: true
    assumption: >-
      Annahme: Wohnung wird behalten, Wert unverändert. Szenario anlegen
    net_worth_at: {'2027-12': '171694.20'}   # 79,694.20 + 290,000 − 198,000
