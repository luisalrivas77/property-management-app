# Phase 10 §7.11 (a) 2, (a) 6 and (f) 1, D301, D304 (written 25 Nov 2026, before
# rules/plan/split.py existed): the household's investment split, the mix the walk invests in,
# the form's prefill and the „noch nicht angelegt“ lines on Anlagen. Hand-written for invented
# owners A and B; every expectation is worked by hand in the comments, never generated by the
# rule, and never edited to make an implementation pass.
#
# The two kinds are phase 9's plan classes: `depot` (funds and securities) and `crypto`.
#
# Rules this file pins:
# - A share is a percent with one decimal. Shares computed from amounts (the savings plans'
#   mix, the holdings' mix, the prefill, the actual share beside a „noch nicht angelegt“ line)
#   are depot = round_half_up(100 × depot ÷ (depot + crypto), 0.1) and crypto = 100 − depot,
#   so the two always add up to exactly 100.0 (for two kinds the same as largest remainder
#   with depot winning a tie).
# - The reserve's account set (D237, D304): the default kinds (bank_current, bank_savings,
#   credit_card, not a rental account) plus `reserve_accounts.added` less `.removed`. Of the
#   investment accounts only a depot a member ticked „Zählt zur Reserve“ (`reserve_added`
#   here) is in it. Such a depot is left out of everything invested: its savings plan, its
#   value in the holdings' mix, money moved into it in the prefill and in the lines.
#
# 1. `mix`: the split the walk invests in (§7.11 (a) 2). Sources in this order: the saved
#    split (`saved`, the lever `investment_split`); else the mix of the continuing savings plans
#    (after the household's overrides) by monthly amount; else today's held funds and crypto by
#    value. A source whose amounts are all 0 is skipped. A kind with a share above 0 whose
#    yearly rate (`value_change.depot` / `.crypto`) is not typed is left out (`left_out`) and
#    the other kind takes its share (with two kinds: 100.0); a typed 0 is a rate (D247). When
#    every kind with a share is left out, nothing moves (`shares` null) and the to-do
#    „Rendite eintragen“ names those kinds. A kind with share 0 is never left out and never
#    named. Nothing saved, no plan and nothing held: source `none`, nothing moves, no to-do
#    (there is no kind to name; the coder's reading, reported with the build).
# 2. `prefill`: the form's shares from the last twelve closed months (the window, at most 12,
#    the unbroken run of closed months ending at the newest, phase 9 D231). A purchase is
#    money sent into an investment, counted once: a confirmed outgoing payment from a private
#    account (phase 9's plan lines, D245, over the window instead of three months), into an own
#    depot (depot), exchange (crypto) or wallet (crypto), or to a payee booked
#    hh_investment_securities (depot) or hh_investment_crypto (crypto). Money moved into an
#    account of the reserve's set, or into an own savings account, is no purchase; a line
#    outside the window does not count. Nothing bought: no prefill (null).
# 3. `not_invested` (§7.11 (a) 6): only once a split is saved. invested = Σ purchases of
#    the window (rule 2); per kind target = round_half_up(invested × share ÷ 100, 0.01),
#    amount = target − bought; a line only while amount > 0, with the actual share (rule 1's
#    rounding) beside the target share. `generic` mode (D251): no kind, the amount only
#    (`lines` empty). Nothing to show (no split, nothing bought, no amount above 0): null.
#
# Worked by hand:
# - mix saved_split: saved 70.0 / 30.0, both rates typed → 70.0 / 30.0, source saved (the plan
#   of 200 and the holdings are not read).
# - mix plans_mix: no split; plans Depot 250.00, Börse 125.00 (crypto), broker 25.00 (depot),
#   Cash-Depot 100.00 (ticked, left out). depot 275, crypto 125, Σ 400; 100 × 275 ÷ 400 =
#   68.75 → 68.8; crypto 31.2.
# - mix holdings_mix: no split, no plan; held Depot 18,000.00 (depot), Cash-Depot 5,000.00
#   (ticked, left out), Börse 6,000.00 and Tangem 3,000.00 (crypto). depot 18,000, crypto
#   9,000, Σ 27,000; 66.666… → 66.7; crypto 33.3.
# - mix plans_all_zero_falls_to_holdings: the only plan was overridden to 0.00 (continuing at
#   0), so the plans give no mix; held Depot 4,000.00 and Börse 1,000.00 → 80.0 / 20.0.
# - mix kind_without_rate_left_out: saved 60.0 / 40.0, crypto rate not typed → crypto left
#   out, depot 100.0, crypto 0.0, no to-do.
# - mix typed_zero_is_a_rate: saved 50.0 / 50.0, depot 0.000, crypto not typed → depot 100.0.
# - mix zero_share_needs_no_rate: saved 100.0 / 0.0, crypto not typed → 100.0 / 0.0, nothing
#   left out.
# - mix no_rate_at_all: plans Depot 300.00 and Börse 100.00, no rate typed → both left out,
#   nothing moves, the to-do names „Fonds und Wertpapiere und Krypto“.
# - mix no_rate_for_the_only_kind: held Depot 10,000.00 only, depot not typed (crypto typed):
#   the depot left out, crypto has share 0 → nothing moves, the to-do names „Fonds und
#   Wertpapiere“.
# - mix nothing_held: nothing saved, no plan, nothing held → source none, nothing moves.
# - prefill twelve_months: window Apr 2026 to Mar 2027. Depot 12 × 200.00 = 2,400.00; broker
#   (hh_investment_securities) 3 × 25.00 = 75.00 → depot 2,475.00. Börse 400.00 + 250.00 +
#   350.00 = 1,000.00; hh_investment_crypto 125.00; Tangem 100.00 → crypto 1,225.00. Left
#   out: Cash-Depot 3 × 500.00 (ticked), Tagesgeld 300.00 (savings account), Depot 999.00 on
#   20 Mar 2026 (before the window). Σ 3,700.00; 100 × 2,475 ÷ 3,700 = 66.8918… → 66.9;
#   crypto 33.1.
# - prefill nothing_bought: only the ticked Cash-Depot and the savings account → null.
# - not_invested crypto_below_its_share: the purchases of twelve_months, saved 60.0 / 40.0.
#   invested 3,700.00; crypto target 1,480.00 − 1,225.00 = 255.00 → a line, actual 33.1;
#   depot target 2,220.00 − 2,475.00 < 0 → none. amount 255.00.
# - not_invested generic_mode: the same in `generic` → no line, amount 255.00.
# - not_invested at_its_share: Depot 3 × 300.00 = 900.00, Börse 300.00, saved 75.0 / 25.0:
#   invested 1,200.00, targets 900.00 and 300.00, both amounts 0 → null.
# - not_invested no_split_saved: the purchases of twelve_months, nothing saved → null.
# - not_invested nothing_bought: saved 60.0 / 40.0, only the ticked Cash-Depot → null.

purchases:
  twelve_months: &twelve_months
  - {booked: 2026-03-20, amount: '-999.00', account: Depot, account_kind: depot}
  - {booked: 2026-04-15, amount: '-200.00', account: Depot, account_kind: depot}
  - {booked: 2026-04-16, amount: '-500.00', account: Cash-Depot, account_kind: depot}
  - {booked: 2026-05-15, amount: '-200.00', account: Depot, account_kind: depot}
  - {booked: 2026-05-16, amount: '-500.00', account: Cash-Depot, account_kind: depot}
  - {booked: 2026-06-15, amount: '-200.00', account: Depot, account_kind: depot}
  - {booked: 2026-06-16, amount: '-500.00', account: Cash-Depot, account_kind: depot}
  - {booked: 2026-07-03, amount: '-400.00', account: Börse, account_kind: exchange}
  - {booked: 2026-07-15, amount: '-200.00', account: Depot, account_kind: depot}
  - {booked: 2026-08-15, amount: '-200.00', account: Depot, account_kind: depot}
  - {booked: 2026-08-20, amount: '-300.00', account: Tagesgeld, account_kind: bank_savings}
  - {booked: 2026-09-15, amount: '-200.00', account: Depot, account_kind: depot}
  - {booked: 2026-10-09, amount: '-250.00', account: Börse, account_kind: exchange}
  - {booked: 2026-10-15, amount: '-200.00', account: Depot, account_kind: depot}
  - {booked: 2026-11-15, amount: '-200.00', account: Depot, account_kind: depot}
  - {booked: 2026-11-28, amount: '-125.00', payee: Krypto Broker Muster, category: hh_investment_crypto}
  - {booked: 2026-12-15, amount: '-200.00', account: Depot, account_kind: depot}
  - {booked: 2027-01-12, amount: '-350.00', account: Börse, account_kind: exchange}
  - {booked: 2027-01-15, amount: '-200.00', account: Depot, account_kind: depot}
  - {booked: 2027-01-20, amount: '-25.00', payee: Fondsbroker Muster, category: hh_investment_securities}
  - {booked: 2027-02-15, amount: '-200.00', account: Depot, account_kind: depot}
  - {booked: 2027-02-20, amount: '-25.00', payee: Fondsbroker Muster, category: hh_investment_securities}
  - {booked: 2027-02-22, amount: '-100.00', account: Tangem, account_kind: wallet}
  - {booked: 2027-03-15, amount: '-200.00', account: Depot, account_kind: depot}
  - {booked: 2027-03-20, amount: '-25.00', payee: Fondsbroker Muster, category: hh_investment_securities}
  only_reserve: &only_reserve
  - {booked: 2026-06-16, amount: '-500.00', account: Cash-Depot, account_kind: depot}
  - {booked: 2026-08-20, amount: '-300.00', account: Tagesgeld, account_kind: bank_savings}
  at_share: &at_share
  - {booked: 2027-01-15, amount: '-300.00', account: Depot, account_kind: depot}
  - {booked: 2027-02-15, amount: '-300.00', account: Depot, account_kind: depot}
  - {booked: 2027-02-18, amount: '-300.00', account: Börse, account_kind: exchange}
  - {booked: 2027-03-15, amount: '-300.00', account: Depot, account_kind: depot}

windows:
  twelve: &twelve [2026-04, 2026-05, 2026-06, 2026-07, 2026-08, 2026-09, 2026-10, 2026-11, 2026-12,
    2027-01, 2027-02, 2027-03]

mix:
- id: saved_split
  description: a saved split is the mix, whatever the plans and holdings say
  saved: {depot: '70.0', crypto: '30.0'}
  plans:
  - {key: depot, account: Depot, asset_class: depot, monthly: '200.00'}
  held:
  - {account: Börse, asset_class: crypto, value: '8000.00'}
  rates: {depot: '0.060', crypto: '0.100'}
  expect: {source: saved, shares: {depot: '70.0', crypto: '30.0'}, left_out: []}
- id: plans_mix
  description: no split; the continuing plans by monthly amount, a ticked depot's plan left out
  plans:
  - {key: depot, account: Depot, asset_class: depot, monthly: '250.00'}
  - {key: boerse, account: Börse, asset_class: crypto, monthly: '125.00'}
  - {key: fondsbroker-muster, payee: Fondsbroker Muster, asset_class: depot, monthly: '25.00'}
  - {key: cash-depot, account: Cash-Depot, asset_class: depot, monthly: '100.00'}
  held:
  - {account: Depot, asset_class: depot, value: '1000.00'}
  reserve_added: [Cash-Depot]
  rates: {depot: '0.060', crypto: '0.100'}
  expect: {source: savings_plans, shares: {depot: '68.8', crypto: '31.2'}, left_out: []}
- id: holdings_mix
  description: no split, no plan; today's holdings by value, a ticked depot left out
  held:
  - {account: Depot, asset_class: depot, value: '18000.00'}
  - {account: Cash-Depot, asset_class: depot, value: '5000.00'}
  - {account: Börse, asset_class: crypto, value: '6000.00'}
  - {account: Tangem, asset_class: crypto, value: '3000.00'}
  reserve_added: [Cash-Depot]
  rates: {depot: '0.060', crypto: '0.100'}
  expect: {source: holdings, shares: {depot: '66.7', crypto: '33.3'}, left_out: []}
- id: plans_all_zero_falls_to_holdings
  description: a plan continuing at 0.00 gives no mix; the holdings decide
  plans:
  - {key: depot, account: Depot, asset_class: depot, monthly: '0.00'}
  held:
  - {account: Depot, asset_class: depot, value: '4000.00'}
  - {account: Börse, asset_class: crypto, value: '1000.00'}
  rates: {depot: '0.060', crypto: '0.100'}
  expect: {source: holdings, shares: {depot: '80.0', crypto: '20.0'}, left_out: []}
- id: kind_without_rate_left_out
  description: crypto has no typed rate; the funds take the whole mix
  saved: {depot: '60.0', crypto: '40.0'}
  rates: {depot: '0.050', crypto: null}
  expect: {source: saved, shares: {depot: '100.0', crypto: '0.0'}, left_out: [crypto]}
- id: typed_zero_is_a_rate
  description: a typed 0 is a rate (D247); only the untyped kind is left out
  saved: {depot: '50.0', crypto: '50.0'}
  rates: {depot: '0.000', crypto: null}
  expect: {source: saved, shares: {depot: '100.0', crypto: '0.0'}, left_out: [crypto]}
- id: zero_share_needs_no_rate
  description: a kind with share 0 is never left out
  saved: {depot: '100.0', crypto: '0.0'}
  rates: {depot: '0.040', crypto: null}
  expect: {source: saved, shares: {depot: '100.0', crypto: '0.0'}, left_out: []}
- id: no_rate_at_all
  description: no rate typed; nothing moves and the to-do names both kinds
  plans:
  - {key: depot, account: Depot, asset_class: depot, monthly: '300.00'}
  - {key: boerse, account: Börse, asset_class: crypto, monthly: '100.00'}
  rates: {depot: null, crypto: null}
  expect:
    source: savings_plans
    shares: null
    left_out: [depot, crypto]
    todo: {action: Rendite eintragen, names: Fonds und Wertpapiere und Krypto}
- id: no_rate_for_the_only_kind
  description: only funds are held and their rate is missing; nothing moves
  held:
  - {account: Depot, asset_class: depot, value: '10000.00'}
  rates: {depot: null, crypto: '0.100'}
  expect:
    source: holdings
    shares: null
    left_out: [depot]
    todo: {action: Rendite eintragen, names: Fonds und Wertpapiere}
- id: nothing_held
  description: nothing saved, no plan, nothing held
  rates: {depot: '0.060', crypto: '0.100'}
  expect: {source: none, shares: null, left_out: []}

prefill:
- id: twelve_months
  description: every purchase of the window by the kind bought; the ticked depot, the savings account and a line before the window left out
  window: *twelve
  purchases: *twelve_months
  reserve_added: [Cash-Depot]
  expect: {depot: '2475.00', crypto: '1225.00', split: {depot: '66.9', crypto: '33.1'}}
- id: nothing_bought
  description: money moved only into the reserve gives no prefill
  window: *twelve
  purchases: *only_reserve
  reserve_added: [Cash-Depot]
  expect: null

not_invested:
- id: crypto_below_its_share
  description: crypto bought less than its share; the funds bought more and show nothing
  window: *twelve
  purchases: *twelve_months
  reserve_added: [Cash-Depot]
  saved: {depot: '60.0', crypto: '40.0'}
  mode: own_use
  expect:
    invested: '3700.00'
    amount: '255.00'
    lines:
    - {asset_class: crypto, target_percent: '40.0', actual_percent: '33.1', amount: '255.00'}
- id: generic_mode
  description: generic mode names no kind, only the amount
  window: *twelve
  purchases: *twelve_months
  reserve_added: [Cash-Depot]
  saved: {depot: '60.0', crypto: '40.0'}
  mode: generic
  expect: {invested: '3700.00', amount: '255.00', lines: []}
- id: at_its_share
  description: both kinds bought exactly their share; nothing shown
  window: *twelve
  purchases: *at_share
  saved: {depot: '75.0', crypto: '25.0'}
  mode: own_use
  expect: null
- id: no_split_saved
  description: without a saved split nothing is compared
  window: *twelve
  purchases: *twelve_months
  reserve_added: [Cash-Depot]
  mode: own_use
  expect: null
- id: nothing_bought
  description: nothing bought in the window; nothing shown
  window: *twelve
  purchases: *only_reserve
  reserve_added: [Cash-Depot]
  saved: {depot: '60.0', crypto: '40.0'}
  mode: own_use
  expect: null
