# Phase 10 §7.11 (c) 3, D310 amended: the reference series turned into yearly returns in euros
# by rules/goal/history (code, never a model). Every number here is INVENTED, never French's,
# Coin Metrics', the ECB's or the Bundesbank's data; the arithmetic is worked by hand below and
# the expectations are exact fractions.
#
# U_Y = US dollars per euro at the end of year Y: the ECB's year-end reference rate from 1999,
# before it the Bundesbank's DM per US dollar converted at the fixed 1.95583 DM per euro
# (U = 1.95583 ÷ DM per USD, „eigene Berechnung“).
# - Funds (Kenneth French's Developed market, annual, in USD, percent as published): the USD
#   return r = (Mkt−RF + RF) ÷ 100; in euros (1 + r) × U_{Y−1} ÷ U_Y − 1.
# - A coin (Coin Metrics' PriceUSD on 31 Dec): (P_Y ÷ U_Y) ÷ (P_{Y−1} ÷ U_{Y−1}) − 1.
# - A US dollar stablecoin follows the rate: U_{Y−1} ÷ U_Y − 1; a euro one (and an exchange's
#   euro cash) returns 0. Both for every year whose two rates are known.
# A year without both rates, or a coin without both prices, has no return.
fx:
  usd_per_eur: {1999: '1.0000', 2020: '1.2500', 2021: '1.0000'}
  dem_per_usd: {1997: '1.95583', 1998: '1.564664'}   # U_1997 = 1, U_1998 = 1.95583 ÷ 1.564664 = 5/4
funds:
  1997: {mkt_rf: '12.00', rf: '3.00'}   # no U_1996: no return
  1998: {mkt_rf: '15.00', rf: '5.00'}   # 1.20 × 1 ÷ 5/4 − 1 = −1/25
  1999: {mkt_rf: '6.00', rf: '4.00'}    # 1.10 × 5/4 ÷ 1 − 1 = 3/8
  2020: {mkt_rf: '8.00', rf: '1.00'}    # no U_2019: no return
  2021: {mkt_rf: '30.00', rf: '0.00'}   # 1.30 × 5/4 ÷ 1 − 1 = 5/8
coins:
  BTC: {2019: '9000', 2020: '20000', 2021: '50000'}   # 2020: no U_2019; 2021: (50,000 ÷ 1) ÷ (20,000 ÷ 5/4) − 1 = 17/8
expect:
  usd_per_eur: {1997: '1', 1998: '5/4', 1999: '1', 2020: '5/4', 2021: '1'}
  funds: {1998: '-1/25', 1999: '3/8', 2021: '5/8'}
  coins:
    BTC: {2021: '17/8'}
  pegged:
    USD: {1998: '-1/5', 1999: '1/4', 2021: '1/4'}   # 1 ÷ 5/4 − 1; 5/4 ÷ 1 − 1; 5/4 ÷ 1 − 1
    EUR: {1998: '0', 1999: '0', 2021: '0'}
