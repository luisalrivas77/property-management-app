# Phase 10 §7.13 (d) (4), D316: with „Wertzuwachs fürs Ziel“ removed, the goal still counts
# each property at its typed yearly value change and, when the property is sold by the goal's
# due month, its sale; a sale after the due month counts no sale, the property at its value on
# the due month. Invented household, invented figures, worked by hand, never generated by the
# rule and never edited to make an implementation pass.
# Amended 28 Nov 2026 by §7.13 (d) 8, D316 (Luis: the goal is judged by its year): the goal
# solves for 31 Dec of its year, so a sale in the goal's year counts, whatever month a goal
# stored before reads; a sale in a later year still counts no sale. sold_later_in_the_due_year
# (a goal stored as Jun 2031, the flat sold in 2031) now counts the sale.
#
# The household (goal_routes.yaml's): today 24 Nov 2026, newest closed month Oct 2026; income
# 5,000, regular spending 3,000, buffer 0, so 2,000 a month; at 31 Oct 2026 the bank row 50,000,
# the reserve 30,000, the need 3,000, 6 months' target 18,000; funds typed at 0 %, the split
# 100 % funds. Its walk: Nov 2026 the reserve 32,000, 14,000 move into funds; 2,000 a month
# from Dec 2026; so k months after Oct 2026 bank row and funds together are 50,000 + 2,000 × k
# (Dec 2031: k = 62, 174,000).
# The flat: worth 300,000 at 31 Oct 2026 with its loan 200,000, typed growth 2 % a year, so its
# 31 Dec value is 300,000 × 1.02^n to the cent (phase 4's projection), its loan 5,000 less each
# year, its cash 0; a sale's net proceeds = the value − 5 % of it to the cent − the loan.
# The walk (rules/plan/projection.py, readings 3 and 5) books a sale on 31 December of its
# sale year: in that December the property counts 0 and its net proceeds join the reserve row,
# which moves what lies above the target into funds (0 %, so the net worth simply adds them).
# Between two 31 Decembers the property's value and loan run on a straight line.
bases:
  household: &household
    today: '2026-11-24'
    newest_closed: '2026-10'
    month: {mean_income: '5000.00', mean_regular_spending: '3000.00', mean_rental_cash: '0.00', buffer_percent: '0'}
    start: {month_end: '2026-10-31', bank: '50000.00', depot: '0.00', crypto: '0.00', property: '300000.00', loans: '200000.00', other_liabilities: '0.00'}
    reserve: {amount: '30000.00', need: '3000.00'}
    saved_mean: '2000.00'
    value_today: {net_worth: '150000.00', reserve: '30000.00'}
    means: {hh_rent: '1500.00', hh_supermarket: '600.00', hh_restaurant: '600.00', hh_streaming: '300.00'}
    split: {depot: '100', crypto: '0'}
  years: &years
    2027: ['306000.00', '195000.00']
    2028: ['312120.00', '190000.00']
    2029: ['318362.40', '185000.00']
    2030: ['324729.65', '180000.00']
    2031: ['331224.24', '175000.00']
    2032: ['337848.73', '170000.00']
    2033: ['344605.70', '165000.00']
    2034: ['351497.81', '160000.00']
    2035: ['358527.77', '155000.00']
    2036: ['365698.33', '150000.00']
    2037: ['373012.29', '145000.00']
    2038: ['380472.54', '140000.00']

cases:
- id: sold_well_before_the_due_month
  description: >-
    sold in 2029, the goal due Dec 2031: in Dec 2029 (k = 38) the flat counts 0 and its net
    proceeds 318,362.40 − 15,918.12 − 185,000 = 117,444.28 join the reserve and move into funds:
    126,000 + 117,444.28 = 243,444.28; Dec 2031 174,000 + 117,444.28 = 291,444.28, no property
    and no loan left. Nov 2029 (k = 37), before the sale: the flat on its line from Dec 2028 at
    11/12, 312,120 + 6,242.40 × 11/12 = 317,842.20 less 190,000 − 5,000 × 11/12 =
    185,416.67 (exactly 185,416.666…), with 124,000: 256,425.533…, 256,425.53 half up
  <<: *household
  flats:
    flat: {sale_year: 2029, years: *years, net_proceeds: '117444.28'}
  levers:
    goal: {kind: net_worth, target: '100000.00', due_month: '2031-12', set_on: '2026-11-20'}
    value_change: {depot: '0.00'}
  expect:
    word: on_track
    projected: '291444.28'
    net_worth_at: {'2029-11': '256425.53', '2029-12': '243444.28', '2031-12': '291444.28'}

- id: sold_after_the_due_month
  description: >-
    sold in 2038, the goal due Dec 2031: no sale counted by then; the flat at its 31 Dec 2031
    value 331,224.24 less its loan 175,000: 174,000 + 156,224.24 = 330,224.24
  <<: *household
  flats:
    flat: {sale_year: 2038, years: *years, net_proceeds: '221448.91'}
  levers:
    goal: {kind: net_worth, target: '100000.00', due_month: '2031-12', set_on: '2026-11-20'}
    value_change: {depot: '0.00'}
  expect:
    word: on_track
    projected: '330224.24'
    net_worth_at: {'2031-12': '330224.24'}

- id: sold_in_the_due_month
  description: >-
    sold in 2031, the goal due Dec 2031 (31 Dec of the sale year): the sale counts; net
    proceeds 331,224.24 − 16,561.21 − 175,000 = 139,663.03; 174,000 + 139,663.03 = 313,663.03
  <<: *household
  flats:
    flat: {sale_year: 2031, years: *years, net_proceeds: '139663.03'}
  levers:
    goal: {kind: net_worth, target: '100000.00', due_month: '2031-12', set_on: '2026-11-20'}
    value_change: {depot: '0.00'}
  expect:
    word: on_track
    projected: '313663.03'
    net_worth_at: {'2031-12': '313663.03'}

- id: sold_later_in_the_due_year
  description: >-
    sold in 2031, a goal stored as Jun 2031: it reads 2031, so it solves for 31 Dec 2031 and the
    sale counts, projected 313,663.03 as in sold_in_the_due_month; the walk at Jun 2031 (k = 56)
    is unchanged: the flat on its line from Dec 2030 at 6/12, 324,729.65 + 6,494.59 × 6/12 =
    327,976.945 less 180,000 − 2,500 = 177,500; with 162,000: 312,476.945, 312,476.95 half up
  <<: *household
  flats:
    flat: {sale_year: 2031, years: *years, net_proceeds: '139663.03'}
  levers:
    goal: {kind: net_worth, target: '100000.00', due_month: '2031-06', set_on: '2026-11-20'}
    value_change: {depot: '0.00'}
  expect:
    word: on_track
    projected: '313663.03'
    net_worth_at: {'2031-06': '312476.95', '2031-12': '313663.03'}
