# Phase 10 §7.9 (b), D296: rules/recurring over a household's confirmed private spending lines.
# Hand-written 24 Nov 2026 from §7.9 (b) for invented payees; the expectations are worked by
# hand, never generated by the rule, and never edited to make an implementation pass (a
# disagreement goes back to the spec).
#
# Input per case: `today`; `history_start` (the household's first line, D231); `lines`, the
# confirmed private lines the household month counts as spending (D232) plus, where a case
# says so, lines it must leave out (hh_cash), each with an id, booking date, payee (counterparty
# name), optional purpose and a negative amount; `marks`, the stored answers on a series in the
# order stored (target = series key + interval, answer `hidden` or `shown`; the newest counts).
#
# Rules this file pins (§7.9 (b), with the details settled 24 Nov 2026 when the fixture was
# written, and D296 amended the same day: the cases one_missed_interval, switch_to_yearly and
# switch_keeps_kein_abo, and `accounts_through` on `stopped`):
# - A series is one payee as rules.matching.same_payee recognises it (D160 (4)); its key is
#   the shortest rules.matching.payee_key among its lines, ties alphabetical.
# - Intervals: monthly at least 3 payments, every gap 25-35 days; quarterly at least 3, gaps
#   80-100; yearly at least 2, gaps 350-380. At most one payment per interval, so a payee paid
#   more often is no series. Every payment within 25 % of the series' median amount.
# - A price change: the newest payments (monthly the last two, quarterly and yearly the last
#   one) at one amount at least 0.50 EUR from the amount the series held before; `since` is
#   the month of the first payment at the new amount; `change` is new minus old.
# - yearly_total = newest amount x 12, 4 or 1.
# - Missed intervals = floor((today - last payment date) in days / the interval's upper gap
#   (35, 100, 380)); 3 or more left out of every list. Below 3 (D296 amended 24 Nov 2026,
#   Luis): `maybe_ended` when missed >= 1 and the account of the newest payment has a line
#   dated after last payment + upper gap, else `active` (two missed intervals on an account
#   whose lines end before that day read as active). An account's lines: the case's lines on
#   it and `accounts_through` (the newest line the case leaves out: income, transfers).
#   A line's `account` defaults to `giro`.
# - A switch to yearly (D296 amended 24 Nov 2026): a monthly series' newest payment L (amount
#   a) followed by exactly one payment P of the payee with 8a <= P <= 13a dated 1-70 days
#   after L, and by no payment within 25 % of a after L: interval yearly, last amount and
#   yearly total P, no price change, payments the monthly ones plus P, missed and state from
#   P with the gap 380, the key the monthly payments'. A mark on the key counts across monthly
#   and yearly for such a series, the newest in stored order deciding.
# - `yearly_detectable` is false while today - history_start < 350 days (the card's note).
# - A `hidden` series (newest mark per key+interval is `hidden`) is listed under `hidden`, not
#   `series`; a mark whose key+interval matches no series is ignored.
# - Amounts in the expectations are positive (what was paid). `series` and `hidden` are
#   compared ignoring order.
