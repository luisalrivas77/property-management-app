# Phase 10 §7.9 (e), „(e) as decided for the build“ items 3 and 4 (D298 (5)–(7)): „Für euer Ziel“,
# the card on Anlagen › Übersicht that follows the return the household chose on Haushalt › Ziel
# („Diesem Weg folgen“ on route 3 „Mehr Rendite“ or on the balanced route while it walks the
# median return). Invented household and invented figures, worked by hand (the implied changes
# with exact fractions on a scratch sheet apart from the rule), never generated by the rule and
# never edited to make an implementation pass.
#
# NOT in this file: the property scenario of item 1 („(e) as decided“ items 1 and 2) and its cases
# (growth within the median, only in good years, never; a series shorter than the window; a
# property without a scenario; a property sold before the due month). GENESIS-Online refused the
# house price index (table 61262) to its guest login on 26 Nov 2026 (HTTP 401, code 15, „Sie sind
# nicht berechtigt diesen Service aufzurufen“), so by item 2 the property scenario waits, and its
# cases are written with it.
#
# The readings this file pins (each a build choice of 26 Nov 2026, for Luis to overrule):
# 1. Shown: own use only (`advice_mode = generic`: nothing shown or computed, reason
#    generic_mode); with a goal (else no_goal) and `goal_choice.investment` set (else
#    not_following). The card is shown from then on; it carries a word only when every figure
#    below is known.
# 2. The followed return is today's answer of the route followed, never a stored rate: route 3's
#    `needed_return` while it is available; the balanced route's `return_rate` while it walks a
#    median return and closes (`saving_extra` set). Otherwise the card reads route_gone (no
#    planned figure, no implied change, no word); a goal with an issue (no projection, due
#    passed, …) reads goal_issue.
# 3. Planned per year: what the walk of the followed route pays into funds and crypto in the
#    twelve months after the current month (the month after it to the same month next year) —
#    the regular pace, without the money already above the reserve target that month 1 moves
#    at once. Pays do not depend on the classes' rates, so the rule reads them as the difference
#    of two walks of the route (rates 0 and none); the route's saving extra and spending changes
#    count from the month after the current one, as the goal walks them. Planned by now = planned
#    per year × the days since the day chosen ÷ 365, to the cent (half up).
# 4. Money in: the external flows of the funds and crypto accounts (depots, exchanges, wallets;
#    a depot ticked „Zählt zur Reserve“ is the reserve's and is left out, D304) dated after the
#    day chosen up to today, net (in − out), as rules/performance counts them (a move between two
#    counted accounts is no flow; money from a reserve depot is). A flow on the day chosen is in
#    the value then.
# 5. Value change = value today − value at the end of the day chosen − money in. Implied change =
#    Σ a × ((1 + r)^n × (1 + r × rest/365) − 1) over the value then (from the day chosen) and each
#    flow a (from its day), n = whole years of 365 days, rest the days over — whole years
#    compounded, the rest simple, as the walk credits a year's growth at its end. To the cent,
#    half up.
# 6. The word: „auf dem Pfad“ (on_path) when money in ≥ planned by now AND value change ≥
#    implied change; otherwise „dahinter“ (behind), naming what fell short (paid, value, or
#    both). A flow without euros (unpriced) or a position without a value then or today
#    (unvalued) leaves the figures it touches and the word out, with that reason.
# 7. A yearly rate only after 365 days (MIN_DAYS of rules/performance): the money-weighted return
#    (xirr) over the value then as the first payment in, the flows, and the value today.
#
# The household of every case (the walk of goal_routes.yaml moved on by four months): newest
# closed month Feb 2027, today 10 Mar 2027; income 5,000, regular spending 3,000 (rent 1,500,
# supermarket 600, restaurant 600, streaming 300), buffer 0; at 28 Feb 2027 the bank row 50,000
# of which the reserve 30,000, the need 3,000 a month, 6 months' target 18,000; funds 100,000
# typed at 6 %, the split 100 % funds; a net-worth goal of 400,000 by Dec 2032.
# Its walk: Mar 2027 (the current month) the reserve 32,000 → 14,000 moves into funds; from Apr
# 2027 2,000 a month. So route 3 („Mehr Rendite“, no change) pays 12 × 2,000 = 24,000 in Apr 2027
# – Mar 2028. The balanced route of these cases saves 300 more from Apr 2027 and cuts the
# restaurant from 600 to 400 (the cut reaches the walk whole with no buffer): 12 × 2,500 =
# 30,000.
# Chosen 10 Dec 2026, 90 days ago: planned by now 24,000 × 90/365 = 5,917.81 (route 3) and 30,000
# × 90/365 = 7,397.26 (balanced). Chosen 10 Mar 2026: 365 days, 24,000.00.
# The implied changes at 10 % on 100,000 from 10 Dec 2026: 100,000 × 0.1 × 90/365 = 2,465.75; a
# 2,000 paid 15 Dec (85 days) 46.58, 15 Jan (54 days) 29.59, 15 Feb (23 days) 12.60.
bases:
  household: &household
    today: '2027-03-10'
    newest_closed: '2027-02'
    month: {mean_income: '5000.00', mean_regular_spending: '3000.00', mean_rental_cash: '0.00', buffer_percent: '0'}
    start: {month_end: '2027-02-28', bank: '50000.00', depot: '100000.00', crypto: '0.00', property: '0.00', loans: '0.00', other_liabilities: '0.00'}
    reserve: {amount: '30000.00', need: '3000.00'}
    saved_mean: '2000.00'
    value_today: {net_worth: '150000.00', reserve: '30000.00'}
    means: {hh_rent: '1500.00', hh_supermarket: '600.00', hh_restaurant: '600.00', hh_streaming: '300.00'}
    split: {depot: '100', crypto: '0'}
  goal: &goal {kind: net_worth, target: '400000.00', due_month: '2032-12', set_on: '2026-03-01'}
  more_return: &more_return
    levers:
      goal: *goal
      value_change: {depot: '0.06'}
      goal_choice: {investment: more_return, investment_chosen_on: '2026-12-10'}
    followed: {route: more_return, rate: '0.100'}
  balanced: &balanced
    levers:
      goal: *goal
      value_change: {depot: '0.06'}
      goal_choice: {investment: balanced, investment_chosen_on: '2026-12-10'}
    followed:
      route: balanced
      rate: '0.147'
      saving_extra: '300.00'
      spending_changes: [{code: hh_restaurant, monthly: '400.00', from_month: '2027-04', to_month: '2032-12'}]
  three_in: &three_in
    - {day: '2026-12-15', amount: '2000.00'}
    - {day: '2027-01-15', amount: '2000.00'}
    - {day: '2027-02-15', amount: '2000.00'}

cases:
- id: on_path
  description: >-
    Route 3 at 10 % followed for 90 days: 6,000 put in against 5,917.81 planned; the value rose
    3,000 beyond the money put in against 2,554.52 implied; no yearly rate under 365 days
  <<: [*more_return, *household]
  actual:
    value_then: '100000.00'
    flows: *three_in
    value_now: '109000.00'
  expect:
    shown: true
    route: more_return
    chosen_on: '2026-12-10'
    days: 90
    rate: '0.100'
    planned_per_year: '24000.00'
    planned_by_now: '5917.81'
    paid_in: '6000.00'
    value_then: '100000.00'
    value_now: '109000.00'
    value_change: '3000.00'
    implied_change: '2554.52'     # 2,465.75 + 46.58 + 29.59 + 12.60
    no_rate: short_history
    word: on_path

- id: behind_paid
  description: two of the three payments made, 4,000 < 5,917.81; the value change alone is on the path
  <<: [*more_return, *household]
  actual:
    value_then: '100000.00'
    flows:
      - {day: '2026-12-15', amount: '2000.00'}
      - {day: '2027-01-15', amount: '2000.00'}
    value_now: '107000.00'
  expect:
    shown: true
    route: more_return
    chosen_on: '2026-12-10'
    days: 90
    rate: '0.100'
    planned_per_year: '24000.00'
    planned_by_now: '5917.81'
    paid_in: '4000.00'
    value_then: '100000.00'
    value_now: '107000.00'
    value_change: '3000.00'
    implied_change: '2541.92'     # 2,465.75 + 46.58 + 29.59
    no_rate: short_history
    word: behind
    short: [paid]

- id: behind_value
  description: the money in on the path, the value 2,000 up beyond it against 2,554.52 implied
  <<: [*more_return, *household]
  actual:
    value_then: '100000.00'
    flows: *three_in
    value_now: '108000.00'
  expect:
    shown: true
    route: more_return
    chosen_on: '2026-12-10'
    days: 90
    rate: '0.100'
    planned_per_year: '24000.00'
    planned_by_now: '5917.81'
    paid_in: '6000.00'
    value_then: '100000.00'
    value_now: '108000.00'
    value_change: '2000.00'
    implied_change: '2554.52'
    no_rate: short_history
    word: behind
    short: [value]

- id: behind_both
  description: one payment of 2,000 and the value 500 up beyond it (implied 2,512.33)
  <<: [*more_return, *household]
  actual:
    value_then: '100000.00'
    flows:
      - {day: '2026-12-15', amount: '2000.00'}
    value_now: '102500.00'
  expect:
    shown: true
    route: more_return
    chosen_on: '2026-12-10'
    days: 90
    rate: '0.100'
    planned_per_year: '24000.00'
    planned_by_now: '5917.81'
    paid_in: '2000.00'
    value_then: '100000.00'
    value_now: '102500.00'
    value_change: '500.00'
    implied_change: '2512.33'     # 2,465.75 + 46.58
    no_rate: short_history
    word: behind
    short: [paid, value]

- id: balanced_on_path
  description: >-
    The balanced route at its median 14.7 % with 300 more saved and the restaurant cut by 200:
    30,000 a year planned, 7,397.26 by now; 3 × 2,500 put in; the value 4,500 up beyond it
    against 3,787.77 implied (14,700 × 90/365 = 3,624.66; 367.5 × 162/365 = 163.11)
  <<: [*balanced, *household]
  actual:
    value_then: '100000.00'
    flows:
      - {day: '2026-12-15', amount: '2500.00'}
      - {day: '2027-01-15', amount: '2500.00'}
      - {day: '2027-02-15', amount: '2500.00'}
    value_now: '112000.00'
  expect:
    shown: true
    route: balanced
    chosen_on: '2026-12-10'
    days: 90
    rate: '0.147'
    planned_per_year: '30000.00'
    planned_by_now: '7397.26'
    paid_in: '7500.00'
    value_then: '100000.00'
    value_now: '112000.00'
    value_change: '4500.00'
    implied_change: '3787.77'
    no_rate: short_history
    word: on_path

- id: a_year_money_short
  description: >-
    Route 3 at 8 % followed for exactly 365 days with nothing put in: 0 < 24,000 planned; the
    value 100,000 → 108,000 equals the implied 8,000.00 (≥, so the value is on the path); the
    yearly rate shown, 8 %
  <<: *household
  levers:
    goal: *goal
    value_change: {depot: '0.06'}
    goal_choice: {investment: more_return, investment_chosen_on: '2026-03-10'}
  followed: {route: more_return, rate: '0.080'}
  actual:
    value_then: '100000.00'
    flows: []
    value_now: '108000.00'
  expect:
    shown: true
    route: more_return
    chosen_on: '2026-03-10'
    days: 365
    rate: '0.080'
    planned_per_year: '24000.00'
    planned_by_now: '24000.00'
    paid_in: '0.00'
    value_then: '100000.00'
    value_now: '108000.00'
    value_change: '8000.00'
    implied_change: '8000.00'
    yearly_return: '0.080000'
    word: behind
    short: [paid]

- id: route_gone
  description: >-
    The balanced route is followed but today walks the typed rates (its history thin, or the
    goal on track without it): no planned figure, no implied change, no word; the money in and
    the value change still shown
  <<: *household
  levers:
    goal: *goal
    value_change: {depot: '0.06'}
    goal_choice: {investment: balanced, investment_chosen_on: '2026-12-10'}
  followed: route_gone
  actual:
    value_then: '100000.00'
    flows: *three_in
    value_now: '109000.00'
  expect:
    shown: true
    reason: route_gone
    route: balanced
    chosen_on: '2026-12-10'
    days: 90
    paid_in: '6000.00'
    value_then: '100000.00'
    value_now: '109000.00'
    value_change: '3000.00'
    no_rate: short_history

- id: goal_issue
  description: the goal has an issue (here phase 9's projection has to-dos), so nothing is planned
  <<: [*more_return, *household]
  followed: goal_issue
  actual:
    value_then: '100000.00'
    flows: *three_in
    value_now: '109000.00'
  expect:
    shown: true
    reason: goal_issue
    route: more_return
    chosen_on: '2026-12-10'
    days: 90
    paid_in: '6000.00'
    value_then: '100000.00'
    value_now: '109000.00'
    value_change: '3000.00'
    no_rate: short_history

- id: unvalued
  description: >-
    A position held today has no value: the value change, the implied change and the word are
    left out; the money in and the plan still shown
  <<: [*more_return, *household]
  actual:
    value_then: '100000.00'
    flows: *three_in
    value_now: '95000.00'
    unvalued: 1
  expect:
    shown: true
    reason: unvalued
    route: more_return
    chosen_on: '2026-12-10'
    days: 90
    rate: '0.100'
    planned_per_year: '24000.00'
    planned_by_now: '5917.81'
    paid_in: '6000.00'
    no_rate: unvalued

- id: unpriced
  description: a payment's euros are unknown (units moved on a day with no price), so the money in is unknown too
  <<: [*more_return, *household]
  actual:
    value_then: '100000.00'
    flows:
      - {day: '2026-12-15', amount: '2000.00'}
      - {day: '2027-01-15', amount: null}
    value_now: '109000.00'
  expect:
    shown: true
    reason: unpriced
    route: more_return
    chosen_on: '2026-12-10'
    days: 90
    rate: '0.100'
    planned_per_year: '24000.00'
    planned_by_now: '5917.81'
    no_rate: unpriced

- id: not_following
  description: a goal and an adopted budget, no return followed, so no card
  <<: *household
  levers:
    goal: *goal
    value_change: {depot: '0.06'}
    goal_choice: {spending: wants_only, spending_chosen_on: '2026-12-10'}
  expect:
    shown: false
    reason: not_following

- id: no_goal
  description: no goal set (a choice left without its goal is ignored)
  <<: *household
  levers:
    value_change: {depot: '0.06'}
  expect:
    shown: false
    reason: no_goal

- id: generic_mode
  description: in `generic` mode nothing of this is shown or computed, a followed return included
  <<: [*more_return, *household]
  mode: generic
  actual:
    value_then: '100000.00'
    flows: *three_in
    value_now: '109000.00'
  expect:
    shown: false
    reason: generic_mode
