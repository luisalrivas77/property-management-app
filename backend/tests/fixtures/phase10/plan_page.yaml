  flat9: &flat9   # g = 9 %: 843,799.43 in 2038, less 42,189.97 selling costs and the 140,000 loan
    sale_year: 2038
    years: {2027: ['327000.00', '195000.00'], 2028: ['356430.00', '190000.00'], 2029: ['388508.70', '185000.00'], 2030: ['423474.48', '180000.00'], 2031: ['461587.19', '175000.00'], 2032: ['503130.03', '170000.00'], 2033: ['548411.74', '165000.00'], 2034: ['597768.79', '160000.00'], 2035: ['651567.98', '155000.00'], 2036: ['710209.10', '150000.00'], 2037: ['774127.92', '145000.00'], 2038: ['843799.43', '140000.00']}
