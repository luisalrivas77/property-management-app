# Phase 10 §7.11 (h), D306: „Euer Plan“, seven cards from the goal's one walk, the three risks
# („Wenn es schlechter läuft“, sizes as Luis decided them on 26 Nov 2026) and the shared view.
# Invented households (the one of goal_routes.yaml, plus variants), figures worked by hand month
# by month with a scratch walk written apart from the rule (it imports nothing from hausbuch; it
# reproduces goal_routes.yaml's 369,991.55 at Jun 2036, its 2036-04 and its investor's
# 737,110.28 at Dec 2029 before any case here was worked), never generated by the rule and never
# edited to make an implementation pass.
#
# The household (goal_routes.yaml): newest closed month Oct 2026, today 26 Nov 2026, so the walk
# starts in Nov 2026 and a route's extra and cuts from Dec 2026; income 5,000, regular spending
# 3,000 (rent 1,500 and supermarket 600 needs, restaurant 600 and streaming 300 wants), buffer 0,
# no savings plan, no rental cash, the reserve's need 3,000, its target 6 × 3,000 = 18,000; the
# walk of goal_routes.yaml's header. The cards household adds one property kept without a
# scenario (value 200,000, no loan, 55 m²): every month's net worth is 200,000 higher, nothing
# else moves, so its goal of 600,000 by Jun 2036 has the routes goal_routes.yaml worked for
# 400,000 (closed_by_spending): E = 196, the balanced route cuts 98.01 (restaurant 65.34,
# streaming 32.67) and saves 98.00 more.
#
# Readings this fixture pins (§7.11 (h); the spec leaves them to the build):
# 1. The base run is the plan's route: the balanced route when the word is not on track (its
#    cuts from next month to the due month and its saving extra from next month to the walk's
#    end, as the goal's walk runs them, at route 3's median when that decides, else at the typed
#    rates; corrected 26 Nov 2026 before merge: the hand-work had ended the extra at the due
#    month too, which only moves a risk run that slips past it); on track, the walk without change (or with the adopted
#    budget when only that reaches the target). Card 3's „Am Ziel“ is that run's first month at
#    or above the target; „ohne den Weg“ is the projected value at the due month and the gap the
#    target less it.
# 2. Each risk is that same run with one change. Its row shows the run's first month at or
#    above the target and the months from the base run's month to it (`delay_months`); a run
#    that never gets there within the walk (forty years after the newest closed month, Oct 2066)
#    shows `not_until`, the walk's last month („bis Okt. 2066 nicht“), and no delay.
# 3. Weak markets: L = the goal's months left ÷ 12 whole years, at least 1 (route 3's window);
#    per kind the worst window of L years in its own full history, annualised as route 3 does
#    (product^(1/L) − 1, floored to 0.1 %): the funds over the funds series, crypto over the held
#    coins' series weighted by today's values (a coin without a series or too short a history
#    left out and named with its share of the crypto, as route 3 names it). A kind walks at its
#    worst window, but never above the rate typed for it (`capped` names a kind kept at its
#    typed rate). Not available in `generic` mode (`generic_mode`) or while funds are walked
#    (a typed funds rate) without the funds series (`series_missing`): the row is then left out
#    with that reason and the card shows the other two.
# 4. Income gap: six months (risks.yaml) from the walk's first month with no household income
#    (the window's mean income and any typed income change in those months set to 0); the rental
#    cash, the spending cuts and the savings plans go on, the route's extra pauses (no income, no
#    extra saving). The reserve pays; once it is below 0 the walk sets it to 0 and draws the rest
#    from the invested funds and crypto in proportion to their values that month (a depot ticked
#    into the reserve is never drawn); `drawn` is the total. Afterwards the reserve is refilled
#    first, as the walk always does (nothing moves out below its target). Only when the invested
#    money is short too is the reserve used up.
# 5. Repair: per property with a stored living area, area × the year's maintenance rate per m²
#    (risks.yaml; 2026: 14.40) × 10 years, to the cent, paid once in the walk's first month
#    (55 m² → 7,920.00). It is not drawn from the invested money: a repair the reserve cannot
#    pay ends the run (`used_up`, „bis … nicht“). A property without a living area gets none and
#    the to-do `plan.living_area_missing`; with no property the row reads `no_property`.
# 6. Card 7: „mehr anlegen“ = the route's saving extra, done when the month's booked investment
#    transfers reach it; „Wünsche-Budget“ = Σ want means − the route's cut, done once it is the
#    default scenario's budget. Steps with 0 € are not shown; on track there are none.
#    The extra's split by class: amount × share ÷ 100 to the cent half-up, the last class with a
#    share taking the rest, so the parts add up; a class with share 0 is not named.
# 7. „Zum Teilen“ (switch round_amounts on): half-up to a step, ties away from zero: a net worth
#    (today, the value today of a net-worth goal, „ohne den Weg“ and the gap of a net-worth goal)
#    to 10,000; the reserve to 1,000; a monthly amount (Heute im Monat, the route's extra, its
#    split, its cut, the wants budget, routes 2 and 4) to 50; a sum paid once (the repair, the
#    drawn total) to 1,000, the assistant's choice since the spec names none. The target, the
#    percent, the months, the rates and the months reached stay as they are. With `accounts` off
#    the reserve's account labels are absent from the answer, with `wants` off the want
#    categories are; `risks` and `assumptions` off leave out those cards. Absent means the key is
#    not in the answer, not null or empty.

