# Phase 10 §7.11 (h), D306: „Euer Plan“, seven cards from the goal's one walk, the three risks
# („Wenn es schlechter läuft“, sizes as Luis decided them on 26 Nov 2026) and the shared view.
# Invented households (the one of goal_routes.yaml, plus variants), figures worked by hand month
# by month with a scratch walk written apart from the rule (it imports nothing from hausbuch; it
# reproduces goal_routes.yaml's 369,991.55 at Jun 2036, its 2036-04 and its investor's
# 737,110.28 at Dec 2029 before any case here was worked), never generated by the rule and never
# edited to make an implementation pass.
#
# The household (goal_routes.yaml): newest closed month Oct 2026, today 26 Nov 2026, so the walk
# starts in Nov 2026 and a route's extra and cuts from Dec 2026; income 5,000, regular spending
# 3,000 (rent 1,500 and supermarket 600 needs, restaurant 600 and streaming 300 wants), buffer 0,
# no savings plan, no rental cash, the reserve's need 3,000, its target 6 × 3,000 = 18,000; the
# walk of goal_routes.yaml's header. The cards household adds one property kept without a
# scenario (value 200,000, no loan, 55 m²): every month's net worth is 200,000 higher, nothing
# else moves, so its goal of 600,000 by Jun 2036 has the routes goal_routes.yaml worked for
# 400,000 (closed_by_spending): E = 196, the balanced route cuts 98.01 (restaurant 65.34,
# streaming 32.67) and saves 98.00 more.
#
# Readings this fixture pins (§7.11 (h); the spec leaves them to the build):
# 1. The base run is the plan's route: the balanced route when the word is not on track (its
#    cuts from next month to the due month and its saving extra from next month to the walk's
#    end, as the goal's walk runs them, at route 3's median when that decides, else at the typed
#    rates; corrected 26 Nov 2026 before merge: the hand-work had ended the extra at the due
#    month too, which only moves a risk run that slips past it); on track, the walk without change (or with the adopted
#    budget when only that reaches the target). Card 3's „Am Ziel“ is that run's first month at
#    or above the target; „ohne den Weg“ is the projected value at the due month and the gap the
#    target less it.
# 2. Each risk is that same run with one change. Its row shows the run's first month at or
#    above the target and the months from the base run's month to it (`delay_months`); a run
#    that never gets there within the walk (forty years after the newest closed month, Oct 2066)
#    shows `not_until`, the walk's last month („bis Okt. 2066 nicht“), and no delay.
# 3. Weak markets: L = the goal's months left ÷ 12 whole years, at least 1 (route 3's window);
#    per kind the worst window of L years in its own full history, annualised as route 3 does
#    (product^(1/L) − 1, floored to 0.1 %): the funds over the funds series, crypto over the held
#    coins' series weighted by today's values (a coin without a series or too short a history
#    left out and named with its share of the crypto, as route 3 names it). A kind walks at its
#    worst window, but never above the rate typed for it (`capped` names a kind kept at its
#    typed rate). Not available in `generic` mode (`generic_mode`) or while funds are walked
#    (a typed funds rate) without the funds series (`series_missing`): the row is then left out
#    with that reason and the card shows the other two.
# 4. Income gap: six months (risks.yaml) from the walk's first month with no household income
#    (the window's mean income and any typed income change in those months set to 0); the rental
#    cash, the spending cuts and the savings plans go on, the route's extra pauses (no income, no
#    extra saving). The reserve pays; once it is below 0 the walk sets it to 0 and draws the rest
#    from the invested funds and crypto in proportion to their values that month (a depot ticked
#    into the reserve is never drawn); `drawn` is the total. Afterwards the reserve is refilled
#    first, as the walk always does (nothing moves out below its target). Only when the invested
#    money is short too is the reserve used up.
# 5. Repair: per property with a stored living area, area × the year's maintenance rate per m²
#    (risks.yaml; 2026: 14.40) × 10 years, to the cent, paid once in the walk's first month
#    (55 m² → 7,920.00). It is not drawn from the invested money: a repair the reserve cannot
#    pay ends the run (`used_up`, „bis … nicht“). A property without a living area gets none and
#    the to-do `plan.living_area_missing`; with no property the row reads `no_property`.
# 6. Card 7: „mehr anlegen“ = the route's saving extra, done when the month's booked investment
#    transfers reach it; „Wünsche-Budget“ = Σ want means − the route's cut, done once it is the
#    default scenario's budget. Steps with 0 € are not shown; on track there are none.
#    The extra's split by class: amount × share ÷ 100 to the cent half-up, the last class with a
#    share taking the rest, so the parts add up; a class with share 0 is not named.
# 7. „Zum Teilen“ (switch round_amounts on): half-up to a step, ties away from zero: a net worth
#    (today, the value today of a net-worth goal, „ohne den Weg“ and the gap of a net-worth goal)
#    to 10,000; the reserve to 1,000; a monthly amount (Heute im Monat, the route's extra, its
#    split, its cut, the wants budget, routes 2 and 4) to 50; a sum paid once (the repair, the
#    drawn total) to 1,000, the assistant's choice since the spec names none. The target, the
#    percent, the months, the rates and the months reached stay as they are. With `accounts` off
#    the reserve's account labels are absent from the answer, with `wants` off the want
#    categories are; `risks` and `assumptions` off leave out those cards. Absent means the key is
#    not in the answer, not null or empty.

bases:
  household: &household
    today: '2026-11-26'
    newest_closed: '2026-10'
    month: {mean_income: '5000.00', mean_regular_spending: '3000.00', mean_rental_cash: '0.00', buffer_percent: '0'}
    start: {month_end: '2026-10-31', bank: '50000.00', depot: '0.00', crypto: '0.00', property: '0.00', loans: '0.00', other_liabilities: '0.00'}
    reserve: {amount: '30000.00', need: '3000.00'}
    saved_mean: '2000.00'
    value_today: {net_worth: '51000.00', reserve: '31000.00'}
    net_worth_today: '51000.00'
    reserve_today: '31000.00'
    reserve_accounts: ['Tagesgeld (Bank A)']
    means: {hh_rent: '1500.00', hh_supermarket: '600.00', hh_restaurant: '600.00', hh_streaming: '300.00'}
    split: {depot: '100', crypto: '0'}
  cards: &cards
    <<: *household
    start: {month_end: '2026-10-31', bank: '50000.00', depot: '0.00', crypto: '0.00', property: '200000.00', loans: '0.00', other_liabilities: '0.00'}
    value_today: {net_worth: '251000.00', reserve: '31000.00'}
    net_worth_today: '251000.00'
    flats:
      flat: {kept_value: '200000.00', living_area: '55'}
    levers:
      goal: {kind: net_worth, target: '600000.00', due_month: '2036-06', set_on: '2026-11-20'}
      value_change: {depot: '0.06'}
    invested_this_month: '120.00'
    # INVENTED funds returns 2014–2025 (12 years): a 9-year window gives 4 windows, so route 3 is
    # thin (shown, never deciding) and the balanced route keeps the typed 6 %. The windows'
    # products by first year 2014–2017; the worst, 2017–2025, 1.17589…, annualised 1.8 %
    # (1.018⁹ = 1.17426 ≤ it < 1.019⁹ = 1.18469).
    history:
      funds: {2014: '0.10', 2015: '0.05', 2016: '-0.20', 2017: '0.15', 2018: '0.08', 2019: '-0.10', 2020: '0.20', 2021: '0.12', 2022: '-0.15', 2023: '0.25', 2024: '0.10', 2025: '0.05'}
  # INVENTED funds returns 2010–2025: their worst 5-year window, 2011–2015, 0.70 × 1.05 × 0.90 ×
  # 1.15 × 0.75 = 0.57054375, annualised −10.7 % (0.893⁵ = 0.56788 ≤ it < 0.894⁵ = 0.57107)
  funds2: &funds2 {2010: '0.10', 2011: '-0.30', 2012: '0.05', 2013: '-0.10', 2014: '0.15', 2015: '-0.25', 2016: '0.08', 2017: '-0.05', 2018: '0.20', 2019: '0.12', 2020: '-0.15', 2021: '0.25', 2022: '0.10', 2023: '0.05', 2024: '-0.10', 2025: '0.06'}

rules:
  income_gap_months: 6
  repair_years: 10
  rounding: {net_worth: '10000', reserve: '1000', monthly: '50', once: '1000'}

maintenance:   # ImmoWertV Anlage 3, rounded to one decimal; a year without its own figure the latest earlier one
- {year: 2026, per_m2: '14.40'}
- {year: 2031, per_m2: '14.40'}
- {year: 2025, per_m2: null}

rounding:
- {id: nw_tie_up, kind: net_worth, value: '5000.00', rounded: '10000.00'}
- {id: nw_below_tie, kind: net_worth, value: '4999.99', rounded: '0.00'}
- {id: nw_negative_tie, kind: net_worth, value: '-15000.00', rounded: '-20000.00'}
- {id: nw_plain, kind: net_worth, value: '251000.00', rounded: '250000.00'}
- {id: reserve_tie, kind: reserve, value: '500.00', rounded: '1000.00'}
- {id: reserve_below, kind: reserve, value: '31499.99', rounded: '31000.00'}
- {id: monthly_tie, kind: monthly, value: '125.00', rounded: '150.00'}
- {id: monthly_below, kind: monthly, value: '24.99', rounded: '0.00'}
- {id: monthly_cents, kind: monthly, value: '98.01', rounded: '100.00'}
- {id: once_repair, kind: once, value: '7920.00', rounded: '8000.00'}

# Amended 27 Nov 2026 by phase 10 §7.11 (i), D311: cards_one_walk's word feasible → hardly
# (goal_routes.yaml's household: the room is 0 and its 9-year windows never reach the
# return needed); every card's figure is unchanged. Amended again the same day (§7.11 (i)
# item 1, the ceiling counts all regular spending): the room is 450, and 600,000 by Jun 2036
# needs E = 196 a month (goal_routes' closed_by_spending with the kept 200,000 added), within
# it: hardly → feasible.
cases:
- id: cards_one_walk
  description: >-
    the seven cards from one walk: „Machbar“, the balanced route reaches 600,000 in Jun 2036;
    weak markets at the funds' worst 9-year window 1.8 % move it 28 months, six months without
    income 14, a 7,920 € repair 4
  <<: *cards
  expect:
    cards:
      goal: {kind: net_worth, target: '600000.00', due_month: '2036-06', word: feasible, value_today: '251000.00', percent: '41.8'}
      heute: {net_worth: '251000.00', reserve: '31000.00', reserve_months: '10.3', reserve_full: true, saved_mean: '2000.00', reserve_accounts: ['Tagesgeld (Bank A)']}
      plan:
        on_track: false
        reached: '2036-06'         # 600,128.82 at 30 Jun 2036 (goal_routes: 98 reaches, 97 not)
        without_route: '569991.55'
        gap: '30008.45'
        saving_extra: '98.00'
        by_class: {depot: '98.00'}
        cut: '98.01'
        wants:
        - {code: hh_restaurant, from: '600.00', to: '534.66'}
        - {code: hh_streaming, from: '300.00', to: '267.33'}
      assumptions:
        rates: {depot: '0.06', crypto: null, reserve: null}
        properties:
        - {key: flat, kept: true, sale_year: null, value_change: null}
      risks:
        base_reached: '2036-06'
        weak_markets:
          available: true
          reason: null
          window_years: 9          # 115 months from Nov 2026 to Jun 2036
          rates: {depot: '0.018'}
          worst: {depot: '0.018'}
          capped: []
          left_out: []
          reached: '2038-10'
          delay_months: 28
          not_until: null
        income_gap:
          # Nov 2026 – Apr 2027 without the 5,000 (and without the 98 extra from Dec): in Nov the
          # reserve 30,000 − 3,000 = 27,000, 9,000 moves; from Dec it falls by 3,000 − 98.01 (the
          # cut goes on) = 2,901.99 a month to 3,490.05 at 30 Apr 2027; from May it refills by
          # 2,196.01 a month (16,666.11 at 31 Oct 2027); nothing drawn
          available: true
          months: 6
          reached: '2037-08'
          delay_months: 14
          not_until: null
          drawn: '0.00'
        repair:
          available: true
          reason: null
          per_m2: '14.40'
          years: 10
          by_property: {flat: '7920.00'}   # 55 × 14.40 × 10
          amount: '7920.00'
          reached: '2036-10'
          delay_months: 4
          not_until: null
        todos: []
      other_routes: {more_saving: '196.00', needed_return: '0.077', less_spending: '196.01'}
      this_month:
        steps:
        - {kind: invest, amount: '98.00', done: true}          # 120.00 booked this month
        - {kind: wants_budget, amount: '801.99', done: false}  # 900.00 − 98.01, not adopted
        done: 1
        of: 2
    share:
      goal: {target: '600000.00', value_today: '250000.00', percent: '41.8', word: feasible}
      heute: {net_worth: '250000.00', reserve: '31000.00', reserve_months: '10.3', saved_mean: '2000.00'}
      plan: {reached: '2036-06', without_route: '570000.00', gap: '30000.00', saving_extra: '100.00', by_class: {depot: '100.00'}, cut: '100.00'}
      risks:
        weak_markets: {rates: {depot: '0.018'}, delay_months: 28}
        income_gap: {delay_months: 14, drawn: '0.00'}
        repair: {amount: '8000.00', by_property: {flat: '8000.00'}, delay_months: 4}
      other_routes: {more_saving: '200.00', needed_return: '0.077', less_spending: '200.00'}
      this_month:
        steps:
        - {kind: invest, amount: '100.00', done: true}
        - {kind: wants_budget, amount: '800.00', done: false}
    share_absent: [heute.reserve_accounts, plan.wants]

- id: share_switches
  description: >-
    the shared view with amounts unrounded, accounts and wants shared, risks and assumptions not:
    the labels are in the answer, the two cards are not
  <<: *cards
  switches: {round_amounts: false, accounts: true, wants: true, risks: false, assumptions: false}
  expect:
    share:
      heute: {net_worth: '251000.00', reserve: '31000.00', reserve_accounts: ['Tagesgeld (Bank A)']}
      plan:
        saving_extra: '98.00'
        wants:
        - {code: hh_restaurant, from: '600.00', to: '534.66'}
        - {code: hh_streaming, from: '300.00', to: '267.33'}
    share_absent: [risks, assumptions]

- id: on_track
  description: >-
    goal_routes' on_track: 360,000 by Jun 2036 reached in Apr 2036 without change: „Ihr seid auf
    Kurs“, no moves, no steps; no property, so no repair; no funds series, so no weak markets
  <<: *household
  flats: {}
  levers:
    goal: {kind: net_worth, target: '360000.00', due_month: '2036-06', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
  expect:
    cards:
      goal: {word: on_track, percent: '14.2'}
      plan: {on_track: true, reached: '2036-04', without_route: '369991.55', gap: null, saving_extra: null, by_class: {}, cut: null, wants: []}
      risks:
        base_reached: '2036-04'
        weak_markets: {available: false, reason: series_missing}
        income_gap:
          # Nov 2026 – Apr 2027 without the 5,000: the reserve 27,000 → 12,000 (nothing drawn)
          available: true
          reached: '2037-06'
          delay_months: 14
          drawn: '0.00'
        repair: {available: false, reason: no_property, amount: null}
        todos: []
      other_routes: {more_saving: '0.00', needed_return: null, less_spending: null}
      this_month: {steps: [], done: 0, of: 0}

- id: weak_not_reached
  description: >-
    the investor of goal_routes (500,000 of funds) is on track for 800,000 by Dec 2031 (Dec 2030);
    at the funds' worst 5-year window, −10.7 % a year, the walk never gets there: „bis Okt. 2066
    nicht“
  <<: *household
  start: {month_end: '2026-10-31', bank: '50000.00', depot: '500000.00', crypto: '0.00', property: '0.00', loans: '0.00', other_liabilities: '0.00'}
  value_today: {net_worth: '551000.00', reserve: '31000.00'}
  net_worth_today: '551000.00'
  flats: {}
  levers:
    goal: {kind: net_worth, target: '800000.00', due_month: '2031-12', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
  history:
    funds: *funds2
  expect:
    cards:
      goal: {word: on_track}
      risks:
        base_reached: '2030-12'
        weak_markets:
          available: true
          window_years: 5          # 61 months from Nov 2026 to Dec 2031
          rates: {depot: '-0.107'}
          worst: {depot: '-0.107'}
          capped: []
          reached: null
          delay_months: null
          not_until: '2066-10'     # the walk's last month: 254,716.99 then

- id: income_gap_empties_reserve
  description: >-
    a reserve of 5,000 (below its 18,000 target) and 100,000 of funds: six months without income
    empty it in Dec 2026; the walk keeps going with the reserve at 0 and draws 13,000 in all from
    the funds, then refills the reserve first; 300,000 moves from Jun 2032 to Jul 2033
  <<: *household
  start: {month_end: '2026-10-31', bank: '5000.00', depot: '100000.00', crypto: '0.00', property: '0.00', loans: '0.00', other_liabilities: '0.00'}
  reserve: {amount: '5000.00', need: '3000.00'}
  value_today: {net_worth: '105000.00', reserve: '5000.00'}
  net_worth_today: '105000.00'
  reserve_today: '5000.00'
  flats: {}
  levers:
    goal: {kind: net_worth, target: '300000.00', due_month: '2033-12', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}
  expect:
    cards:
      goal: {word: on_track}
      heute: {reserve_months: '1.7', reserve_full: false}
      risks:
        base_reached: '2032-06'
        income_gap:
          # Nov 2026: 5,000 − 3,000 = 2,000; Dec: −1,000, so 1,000 drawn (funds at 31 Dec 2026
          # 100,000 × 1.01 − 1,000 = 100,000.00, net worth 100,000.00); Jan – Apr 2027: −3,000 a
          # month drawn (12,000); from May the reserve refills by 2,000 a month (2,000 at 31 May
          # 2027, 16,000 at 31 Dec 2027). Without the draw the walk would end in Dec 2026.
          available: true
          months: 6
          reached: '2033-07'
          delay_months: 13
          not_until: null
          drawn: '13000.00'

- id: weak_markets_capped
  description: >-
    funds and crypto held, split 50/50, funds typed 6 %, crypto 20 %: the funds walk at their
    worst 5-year window (−10.7 %); BTC's worst window (+30 %) is above the typed 20 %, so crypto
    keeps 20 %; XYZ has no series and is named with its 25 % of the crypto
  <<: *household
  start: {month_end: '2026-10-31', bank: '50000.00', depot: '100000.00', crypto: '40000.00', property: '0.00', loans: '0.00', other_liabilities: '0.00'}
  value_today: {net_worth: '190000.00', reserve: '31000.00'}
  net_worth_today: '190000.00'
  split: {depot: '50', crypto: '50'}
  flats: {}
  levers:
    goal: {kind: net_worth, target: '400000.00', due_month: '2031-12', set_on: '2026-11-20'}
    value_change: {depot: '0.06', crypto: '0.20'}
  invested: {funds: '100000.00', coins: {BTC: '30000.00', XYZ: '10000.00'}}
  history:
    funds: *funds2
    coins:
      BTC: {2017: '0.30', 2018: '0.30', 2019: '0.30', 2020: '0.30', 2021: '0.30', 2022: '0.30', 2023: '0.30', 2024: '0.30', 2025: '0.30'}
  expect:
    cards:
      goal: {word: on_track}
      risks:
        base_reached: '2030-12'    # 473,951.16 at 31 Dec 2031
        weak_markets:
          available: true
          window_years: 5
          rates: {depot: '-0.107', crypto: '0.20'}
          worst: {depot: '-0.107', crypto: '0.300'}
          capped: [crypto]
          left_out:
          - {kind: coin, symbol: XYZ, share: '25.0', reason: no_series}
          reached: '2032-08'
          delay_months: 20

- id: weak_markets_no_funds_series
  description: >-
    the cards household before the funds series is downloaded: the weak-markets row is left out
    with its reason, the other two rows are those of cards_one_walk
  <<: *cards
  history: {}
  expect:
    cards:
      risks:
        base_reached: '2036-06'
        weak_markets: {available: false, reason: series_missing}
        income_gap: {available: true, reached: '2037-08', delay_months: 14}
        repair: {available: true, amount: '7920.00', reached: '2036-10', delay_months: 4}

- id: weak_markets_generic
  description: the cards household in `generic` mode; the weak-markets row says why it is left out
  <<: *cards
  mode: generic
  expect:
    cards:
      other_routes: {needed_return: null}
      risks:
        weak_markets: {available: false, reason: generic_mode}
        income_gap: {available: true, delay_months: 14}
        repair: {available: true, delay_months: 4}

- id: repair_without_area
  description: >-
    the cards household's property without a stored living area: no repair, and a to-do to enter
    it on the property's page
  <<: *cards
  flats:
    flat: {kept_value: '200000.00', living_area: null}
  expect:
    cards:
      risks:
        repair: {available: false, reason: no_living_area, amount: null, by_property: {}}
        todos:
        - {code: plan.living_area_missing, property: flat, action: Wohnfläche eintragen, href: /properties/flat}
