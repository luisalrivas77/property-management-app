# --- „Noch nie erreicht“ (§7.13 (d) 5, D316), added 28 Nov 2026 --------------------------------
# A property's typed yearly value change on card 4 „Eure Annahmen“ carries the German house
# price index beside it (`house_prices`), a mark, never a block: nothing else on the page
# changes with it. Readings this part pins:
# 8. L = the goal's months left ÷ 12 whole years, at least 1 (route 3's and the weak markets'
#    window). Every run of L consecutive yearly returns Q4 to Q4 (Q4 of Y ÷ Q4 of Y−1) is a
#    window; `reached` counts those whose product is at least (1 + the typed change)^L, of
#    `windows`; `never` is true when none reached it (the mark „Noch nie erreicht“); `thin` under
#    5 windows, as route 3 counts. The key is present and null for a property without a typed
#    change (kept without a scenario), in `generic` mode, and when the index has no window of L
#    years. `house_index` is the case's invented index; the page itself reads the committed
#    Eurostat series.
# The counts were worked apart from the rule with exact fractions on a scratch sheet that
# imports nothing from hausbuch; it first reproduced goal_property.yaml's 10, 5 and 0 of 16
# five-year windows at 3.0 %, 6.0 % and 10.0 % and its 2 windows from Q4 2019.
- id: house_prices_reached
  description: >-
    the flat's typed 2 % a year: the index rose at least 1.02^5 over 12 of its 16 five-year
    windows, so no mark
  <<: *sold
  flats: {flat: *flat2}
  expect:
    cards:
      assumptions:
        properties:
        - {key: flat, kept: false, sale_year: 2038, value_change: '0.02', house_prices: {window_years: 5, windows: 16, reached: 12, never: false, thin: false}}

- id: house_prices_never_reached
  description: >-
    the flat's typed 9 % a year: no five-year window reached 1.09^5 = 1.5386 (the best, 2017–2021,
    163.0 ÷ 107.0 = 1.5234, is 8.7 % a year), so „Noch nie erreicht“, 0 of 16
  <<: *sold
  flats: {flat: *flat9}
  expect:
    cards:
      assumptions:
        properties:
        - {key: flat, kept: false, sale_year: 2038, value_change: '0.09', house_prices: {window_years: 5, windows: 16, reached: 0, never: true, thin: false}}

- id: house_prices_thin
  description: >-
    the index only from Q4 2019: six returns 2020–2025 give 2 five-year windows; 2021–2025
    (154.7 ÷ 145.5) does not reach 1.02^5 = 1.1041, 2020–2024 (151.7 ÷ 132.3 = 1.1466) does: 1 of
    2, thin, no mark
  <<: *sold
  house_index: {2019: '132.3', 2020: '145.5', 2021: '163.0', 2022: '158.1', 2023: '150.2', 2024: '151.7', 2025: '154.7'}
  flats: {flat: *flat2}
  expect:
    cards:
      assumptions:
        properties:
        - {key: flat, kept: false, sale_year: 2038, value_change: '0.02', house_prices: {window_years: 5, windows: 2, reached: 1, never: false, thin: true}}

- id: house_prices_no_window
  description: the index only from Q4 2022 has three returns and no five-year window, so no mark
  <<: *sold
  house_index: {2022: '158.1', 2023: '150.2', 2024: '151.7', 2025: '154.7'}
  flats: {flat: *flat2}
  expect:
    cards:
      assumptions:
        properties:
        - {key: flat, kept: false, sale_year: 2038, value_change: '0.02', house_prices: null}

- id: house_prices_generic
  description: in `generic` mode the typed 9 % gets no comparison with house prices
  <<: *sold
  mode: generic
  flats: {flat: *flat9}
  expect:
    cards:
      assumptions:
        properties:
        - {key: flat, kept: false, sale_year: 2038, value_change: '0.09', house_prices: null}

- id: house_prices_kept_property
  description: >-
