# Amended 27 Nov 2026 by phase 10 §7.11 (i), D311: cards_one_walk's word feasible → hardly
# (goal_routes.yaml's household: the room is 0 and its 9-year windows never reach the
# return needed); every card's figure is unchanged. Amended again the same day (§7.11 (i)
# item 1, the ceiling counts all regular spending): the room is 450, and 600,000 by Jun 2036
# needs E = 196 a month (goal_routes' closed_by_spending with the kept 200,000 added), within
# it: hardly → feasible.
# Amended 28 Nov 2026 by §7.13 (d) 8, D316 (Luis: the goal is judged by its year): the goal
# solves for 31 Dec of its year, so the cards household's goal reads 600,000 in 2036 (stored Dec
# 2036): 121 months left, L = 10 years; E = 50 a month (goal_routes' closed_by_spending at Dec
# 2036 with the kept 200,000 added), the balanced route cuts 25.01 (restaurant 16.67, streaming
# 8.34) and saves 25.00 more, reaching 600,034.47 at 31 Dec 2036; the funds' worst 10-year
# window 3.9 %. on_track reads 360,000 in 2036, its figures unchanged but „ohne den Weg“
# (391,817.33). Recomputed with the scratch walk of goal_routes.yaml's amendment; the cases due
# Dec of a year are unchanged.
cases:
- id: cards_one_walk
  description: >-
    the seven cards from one walk: „Machbar“, the balanced route reaches 600,000 in Dec 2036;
    weak markets at the funds' worst 10-year window 3.9 % move it 13 months, six months without
    income 15, a 7,920 € repair 4
  <<: *cards
  expect:
    cards:
      goal: {kind: net_worth, target: '600000.00', due_month: '2036-12', word: feasible, value_today: '251000.00', percent: '41.8'}
      # §7.13 (d) 2: the reserve as „31.000 € von 18.000 €“ (the target 6 × 3,000), reached
      heute: {net_worth: '251000.00', reserve: '31000.00', reserve_months: '10.3', reserve_full: true, reserve_target: '18000.00', reserve_gap: '0.00', saved_mean: '2000.00', reserve_accounts: ['Tagesgeld (Bank A)']}
      plan:
        on_track: false
        reached: '2036-12'         # 600,034.47 at 31 Dec 2036 (goal_routes: 25 reaches, 24 not)
        without_route: '591817.33'
        gap: '8182.67'
        saving_extra: '25.00'
        by_class: {depot: '25.00'}
        cut: '25.01'
        wants:
        - {code: hh_restaurant, from: '600.00', to: '583.33'}
        - {code: hh_streaming, from: '300.00', to: '291.66'}
      assumptions:
        rates: {depot: '0.06', crypto: null, reserve: null}
        properties:
        - {key: flat, kept: true, sale_year: null, value_change: null}
      risks:
        base_reached: '2036-12'
        weak_markets:
          available: true
          reason: null
          window_years: 10         # 121 months from Nov 2026 to Dec 2036
          rates: {depot: '0.039'}
          worst: {depot: '0.039'}
          capped: []
          left_out: []
          reached: '2038-01'
          delay_months: 13
          not_until: null
        income_gap:
          # Nov 2026 – Apr 2027 without the 5,000 (and without the 25 extra from Dec): in Nov the
          # reserve 30,000 − 3,000 = 27,000, 9,000 moves; from Dec it falls by 3,000 − 25.01 (the
          # cut goes on) = 2,974.99 a month to 3,125.05 at 30 Apr 2027; from May it refills by
          # 2,050.01 a month (15,425.11 at 31 Oct 2027); nothing drawn
          available: true
          months: 6
          reached: '2038-03'
          delay_months: 15
          not_until: null
          drawn: '0.00'
        repair:
          available: true
          reason: null
          per_m2: '14.40'
          years: 10
          by_property: {flat: '7920.00'}   # 55 × 14.40 × 10
          amount: '7920.00'
          reached: '2037-04'
          delay_months: 4
          not_until: null
        todos: []
      other_routes: {more_saving: '50.00', needed_return: '0.065', less_spending: '50.01'}
      this_month:
        steps:
        - {kind: invest, amount: '25.00', done: true}          # 120.00 booked this month
        - {kind: wants_budget, amount: '874.99', done: false}  # 900.00 − 25.01, not adopted
        done: 1
        of: 2
    share:
      goal: {target: '600000.00', value_today: '250000.00', percent: '41.8', word: feasible}
      heute: {net_worth: '250000.00', reserve: '31000.00', reserve_months: '10.3', saved_mean: '2000.00'}
      plan: {reached: '2036-12', without_route: '590000.00', gap: '10000.00', saving_extra: '50.00', by_class: {depot: '50.00'}, cut: '50.00'}
      risks:
        weak_markets: {rates: {depot: '0.039'}, delay_months: 13}
        income_gap: {delay_months: 15, drawn: '0.00'}
        repair: {amount: '8000.00', by_property: {flat: '8000.00'}, delay_months: 4}
      other_routes: {more_saving: '50.00', needed_return: '0.065', less_spending: '50.00'}
      this_month:
        steps:
        - {kind: invest, amount: '50.00', done: true}
        - {kind: wants_budget, amount: '850.00', done: false}
    share_absent: [heute.reserve_accounts, plan.wants]

- id: share_switches
  description: >-
    the shared view with amounts unrounded, accounts and wants shared, risks and assumptions not:
    the labels are in the answer, the two cards are not
  <<: *cards
  switches: {round_amounts: false, accounts: true, wants: true, risks: false, assumptions: false}
  expect:
    share:
      heute: {net_worth: '251000.00', reserve: '31000.00', reserve_accounts: ['Tagesgeld (Bank A)']}
      plan:
        saving_extra: '25.00'
        wants:
