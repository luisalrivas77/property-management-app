  # INVENTED funds returns 2010–2025: their worst 5-year window, 2011–2015, 0.70 × 1.05 × 0.90 ×
  # 1.15 × 0.75 = 0.57054375, annualised −10.7 % (0.893⁵ = 0.56788 ≤ it < 0.894⁵ = 0.57107)
  funds2: &funds2 {2010: '0.10', 2011: '-0.30', 2012: '0.05', 2013: '-0.10', 2014: '0.15', 2015: '-0.25', 2016: '0.08', 2017: '-0.05', 2018: '0.20', 2019: '0.12', 2020: '-0.15', 2021: '0.25', 2022: '0.10', 2023: '0.05', 2024: '-0.10', 2025: '0.06'}
  # „Noch nie erreicht“ (§7.13 (d) 5, D316; readings at the end of this file). INVENTED Q4
  # values of a house price index 2005–2025 (goal_property.yaml's `index`, moved here when that
  # card was removed): 20 yearly returns 2006–2025, so 16 five-year windows.
  house_index: &house_index {2005: '80.0', 2006: '80.8', 2007: '81.6', 2008: '80.0', 2009: '82.4', 2010: '82.4', 2011: '85.7', 2012: '90.0', 2013: '92.7', 2014: '98.3', 2015: '100.0', 2016: '107.0', 2017: '115.6', 2018: '126.0', 2019: '132.3', 2020: '145.5', 2021: '163.0', 2022: '158.1', 2023: '150.2', 2024: '151.7', 2025: '154.7'}
  # goal_property.yaml's household: this file's with a flat worth 300,000 today, its loan
  # 200,000 falling 5,000 a year, sold in 2038 at 5 % selling costs, 55 m²; its value at 31 Dec
  # of year Y is 300,000 × (1 + g)^(Y − 2026) to the cent half-up. A goal of 300,000 by Dec
  # 2031: today Nov 2026, so 61 months left and windows of L = 5 years.
  sold: &sold
    <<: *household
    start: {month_end: '2026-10-31', bank: '50000.00', depot: '0.00', crypto: '0.00', property: '300000.00', loans: '200000.00', other_liabilities: '0.00'}
    value_today: {net_worth: '151000.00', reserve: '31000.00'}
    net_worth_today: '151000.00'
    levers:
      goal: {kind: net_worth, target: '300000.00', due_month: '2031-12', set_on: '2026-11-20'}
      value_change: {depot: '0.06'}
    house_index: *house_index
  flat2: &flat2   # g = 2 %: 380,472.54 in 2038, less 19,023.63 selling costs and the 140,000 loan
    sale_year: 2038
    years: {2027: ['306000.00', '195000.00'], 2028: ['312120.00', '190000.00'], 2029: ['318362.40', '185000.00'], 2030: ['324729.65', '180000.00'], 2031: ['331224.24', '175000.00'], 2032: ['337848.73', '170000.00'], 2033: ['344605.70', '165000.00'], 2034: ['351497.81', '160000.00'], 2035: ['358527.77', '155000.00'], 2036: ['365698.33', '150000.00'], 2037: ['373012.29', '145000.00'], 2038: ['380472.54', '140000.00']}
    net_proceeds: '221448.91'
