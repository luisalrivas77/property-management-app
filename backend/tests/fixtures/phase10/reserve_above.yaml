# Phase 10 §7.11 (a), (d), D301, D304: the money above the reserve target and where it goes.
# Invented household of goal_routes.yaml (income 5,000, spending 3,000, saved 2,000 a month,
# need 3,000, 6 months' target 18,000, funds typed at 6 %, split 100 % funds, newest closed Oct
# 2026); figures worked by hand month by month, never generated by the rule and never edited
# to make an implementation pass.
#
# above_target (§7.11 (d), „Anlegbar jetzt“) = max(0, the reserve today − its target), on
# GET /household-plan only, never in the stored key figures (health_snapshot's Reserve).
# In the walk the money above the target moves into funds at the end of month 1 (Nov 2026);
# the saving then fills the reserve to its target first and moves what lies above it, month by
# month. A depot ticked „Zählt zur Reserve“ (D304) is in the reserve and stays at its start
# value in the depot row; a typed reserve rate pays R × r ÷ 12 to the cent each month before
# the saving.
bases:
  household: &household
    today: '2026-11-24'
    newest_closed: '2026-10'
    month: {mean_income: '5000.00', mean_regular_spending: '3000.00', mean_rental_cash: '0.00', buffer_percent: '0'}
    start: {month_end: '2026-10-31', bank: '50000.00', depot: '0.00', crypto: '0.00', property: '0.00', loans: '0.00', other_liabilities: '0.00'}
    reserve: {amount: '30000.00', need: '3000.00'}
    saved_mean: '2000.00'
    value_today: {net_worth: '51000.00', reserve: '31000.00'}
    means: {hh_rent: '1500.00', hh_supermarket: '600.00', hh_restaurant: '600.00', hh_streaming: '300.00'}
    split: {depot: '100', crypto: '0'}
  goal: &goal
    goal: {kind: net_worth, target: '400000.00', due_month: '2040-12', set_on: '2026-11-20'}
    value_change: {depot: '0.06'}

cases:
- id: above_the_target
  description: >-
    30,000 against 18,000: 12,000 above; in Nov 2026 the reserve is 32,000 after the saving and
    14,000 moves into funds; Dec 2026 funds 14,000 × (1 + 0.06 × 2/12) + 2,000 = 16,070
  <<: *household
  levers: *goal
  expect:
    word: on_track
    above_target: '12000.00'
    reserve_at: {'2026-11': '18000.00', '2026-12': '18000.00'}
    net_worth_at: {'2026-11': '52000.00', '2026-12': '54070.00', '2027-12': '79694.20'}
    reached: '2037-03'

- id: at_the_target
  description: >-
    18,000 against 18,000: nothing above today; from Nov 2026 each month's 2,000 moves;
    Dec 2026 funds 2,000 × 1.005 + 2,000 = 4,010
  <<: *household
  start: {month_end: '2026-10-31', bank: '38000.00', depot: '0.00', crypto: '0.00', property: '0.00', loans: '0.00', other_liabilities: '0.00'}
  reserve: {amount: '18000.00', need: '3000.00'}
  levers: *goal
  expect:
    word: on_track
    above_target: '0.00'
    reserve_at: {'2026-11': '18000.00'}
    net_worth_at: {'2026-11': '40000.00', '2026-12': '42010.00', '2027-12': '66910.60'}
    reached: '2037-09'

- id: below_the_target
  description: >-
    10,000 against 18,000: nothing above; the saving fills the reserve first (Feb 2027 at
    18,000 exactly, nothing moves), from Mar 2027 2,000 a month moves
  <<: *household
  start: {month_end: '2026-10-31', bank: '30000.00', depot: '0.00', crypto: '0.00', property: '0.00', loans: '0.00', other_liabilities: '0.00'}
  reserve: {amount: '10000.00', need: '3000.00'}
  levers: *goal
  expect:
    word: on_track
    above_target: '0.00'
    reserve_at: {'2026-11': '12000.00', '2027-02': '18000.00', '2027-03': '18000.00'}
    net_worth_at: {'2027-02': '38000.00', '2027-03': '40000.00', '2027-12': '58450.00'}
    reached: '2038-01'

- id: lump_sum_kept_on_the_accounts
  description: >-
    the same household with no split: nothing moves, 400,000 is reached only in May 2041
    (50,000 + 2,000k, k = 175); against above_the_target, investing the 12,000 above the
    target in Nov 2026 and the saving after it brings the goal month forward by 50 months
  <<: *household
  split: null
  levers: *goal
  expect:
    word: feasible               # 60 a month more closes it (both spending scenarios)
    above_target: '12000.00'
    reserve_at: {'2026-11': '32000.00'}
    net_worth_at: {'2040-12': '390000.00'}
    reached: '2041-05'
    noetig: '2060.00'            # ⌈10,000 ÷ 169⌉ = ⌈59.17⌉

- id: ticked_depot
  description: >-
    a depot of 5,000 ticked „Zählt zur Reserve“ is in the reserve's 30,000 (bank 25,000) and
    stays at 5,000 in the depot row; the bank row is 45,000 + R − 30,000, so the totals equal
    above_the_target's
  <<: *household
  start: {month_end: '2026-10-31', bank: '45000.00', depot: '5000.00', crypto: '0.00', property: '0.00', loans: '0.00', other_liabilities: '0.00', reserve_depot: '5000.00'}
  levers: *goal
  expect:
    word: on_track
    above_target: '12000.00'
    reserve_at: {'2026-11': '18000.00'}
    net_worth_at: {'2026-11': '52000.00', '2026-12': '54070.00', '2027-12': '79694.20'}
    reached: '2037-03'

- id: typed_reserve_rate
  description: >-
    the reserve typed at 2 % a year: Nov 2026 30,000 × 0.02 ÷ 12 = 50.00, R 32,050, 14,050
    moves; from Dec the reserve at 18,000 earns 30.00 a month, which moves too (2,030)
  <<: *household
  levers:
    goal: {kind: net_worth, target: '400000.00', due_month: '2040-12', set_on: '2026-11-20'}
    value_change: {depot: '0.06', reserve: '0.02'}
  expect:
    word: on_track
    above_target: '12000.00'
    reserve_at: {'2026-11': '18000.00', '2026-12': '18000.00'}
    net_worth_at: {'2026-11': '52050.00', '2026-12': '54150.25', '2027-12': '80149.17'}
    reached: '2037-01'
