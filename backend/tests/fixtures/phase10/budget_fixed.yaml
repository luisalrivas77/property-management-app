  description: "A monthly series whose first payment is in the window's second month, and a
    quarterly one paid once in the window: each mean is spread over all three months, below or
    equal to its monthly amount."
  today: '2027-02-10'
  history_start: '2026-01-01'
  window: [2026-11, 2026-12, 2027-01]
  lines:
  - {id: 'DSN_01', date: '2026-12-03', payee: 'Disney Plus', category: 'hh_streaming', amount: '-8.99'}
  - {id: 'DSN_02', date: '2027-01-03', payee: 'Disney Plus', category: 'hh_streaming', amount: '-8.99'}
  - {id: 'DSN_03', date: '2027-02-03', payee: 'Disney Plus', category: 'hh_streaming', amount: '-8.99'}
  - {id: 'RBF_01', date: '2026-04-15', payee: 'Rundfunk ARD ZDF Beitragsservice', category: 'hh_broadcast_fee', amount: '-55.08'}
  - {id: 'RBF_02', date: '2026-07-15', payee: 'Rundfunk ARD ZDF Beitragsservice', category: 'hh_broadcast_fee', amount: '-55.08'}
  - {id: 'RBF_03', date: '2026-10-15', payee: 'Rundfunk ARD ZDF Beitragsservice', category: 'hh_broadcast_fee', amount: '-55.08'}
  - {id: 'RBF_04', date: '2027-01-15', payee: 'Rundfunk ARD ZDF Beitragsservice', category: 'hh_broadcast_fee', amount: '-55.08'}
  # need: the broadcast fee's January payment 55.08 (RBF_03 is in October, outside);
  #   55.08 ÷ 3 = 18.36 exactly. want: Disney's December and January 2 × 8.99 = 17.98
  #   (DSN_03 is in February, outside); 17.98 ÷ 3 = 5.9933… → 5.99.
  class_means: {need: '18.36', want: '5.99'}
  expect:
    need:
      fixed:
      # quarterly: monthly 55.08 × 4 ÷ 12 = 18.36; mean 55.08 ÷ 3 = 18.36
      - {key: 'RBF_01', label: 'Rundfunk ARD ZDF Beitragsservice', interval: quarterly, state: active,
         monthly: '18.36', mean: '18.36', change: null, since: null}
      # 18.36 − 18.36 = 0.00
      variable: '0.00'
    want:
      fixed:
      # monthly 8.99; mean 17.98 ÷ 3 = 5.9933… → 5.99, below the monthly amount since the
      # series started in December
      - {key: 'DSN_01', label: 'Disney Plus', interval: monthly, state: active,
         monthly: '8.99', mean: '5.99', change: null, since: null}
      # 5.99 − 5.99 = 0.00
      variable: '0.00'

