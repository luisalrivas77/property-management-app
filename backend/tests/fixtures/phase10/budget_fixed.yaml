    are the variable part. Notwendiges holds nothing."
  today: '2027-02-10'
  history_start: '2026-01-01'
  window: [2026-11, 2026-12, 2027-01]
  lines:
  - {id: 'SPO_01', date: '2026-09-05', payee: 'Spotify AB', category: 'hh_music_audio', amount: '-10.99'}
  - {id: 'SPO_02', date: '2026-10-05', payee: 'Spotify AB', category: 'hh_music_audio', amount: '-10.99'}
  - {id: 'SPO_03', date: '2026-11-05', payee: 'Spotify AB', category: 'hh_music_audio', amount: '-10.99'}
  - {id: 'SPO_04', date: '2026-12-05', payee: 'Spotify AB', category: 'hh_music_audio', amount: '-10.99'}
