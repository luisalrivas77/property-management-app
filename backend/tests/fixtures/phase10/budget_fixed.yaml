  - {id: 'SPO_06', date: '2027-02-05', payee: 'Spotify AB', category: 'hh_music_audio', amount: '-10.99'}
  - {id: 'NFX_01', date: '2026-09-14', payee: 'Netflix International B.V.', category: 'hh_streaming', amount: '-13.99'}
  - {id: 'NFX_02', date: '2026-10-14', payee: 'Netflix International B.V.', category: 'hh_streaming', amount: '-13.99'}
  - {id: 'NFX_03', date: '2026-11-14', payee: 'Netflix International B.V.', category: 'hh_streaming', amount: '-13.99'}
  - {id: 'NFX_04', date: '2026-12-14', payee: 'Netflix International B.V.', category: 'hh_streaming', amount: '-13.99'}
  - {id: 'NFX_05', date: '2027-01-14', payee: 'Netflix International B.V.', category: 'hh_streaming', amount: '-13.99'}
  marks:
  - {key: 'SPOTIFY AB', interval: monthly, answer: hidden}
  # need: nothing booked. want: Spotify 3 × 10.99 = 32.97 and Netflix 3 × 13.99 = 41.97 in the
  #   window; 74.94 ÷ 3 = 24.98 exactly.
  class_means: {need: '0.00', want: '24.98'}
  expect:
    need:
      fixed: []
      variable: '0.00'
    want:
      fixed:
      # monthly 13.99; mean 41.97 ÷ 3 = 13.99
      - {key: 'NFX_01', label: 'Netflix International B.V.', interval: monthly, state: active,
         monthly: '13.99', mean: '13.99', change: null, since: null}
      # 24.98 − 13.99 = 10.99, the hidden Spotify series' 32.97 ÷ 3
      variable: '10.99'

