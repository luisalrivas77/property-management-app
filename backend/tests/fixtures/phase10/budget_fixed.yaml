# Phase 10 §7.10 (c), D300: fixed payments inside Notwendiges and Wünsche. Hand-written 25 Nov
# 2026 from §7.10 (c) and D300 for invented payees; every expectation is worked by hand in the
# comment beside it, never generated by the rule, and never edited to make an implementation pass
# (a disagreement goes back to the spec).
#
# Input per case, recurring.yaml's shape plus the Budget's side:
# - `today`, `history_start`, `lines` (the confirmed private spending lines, each with an id,
#   booking date, payee, code and a negative amount; `account` defaults to `giro`),
#   `accounts_through` and `marks` (answers on a series: key + interval, `hidden` = „kein Abo“)
#   exactly as in recurring.yaml: the test runs rules.recurring over them first, so which
#   series are listed, hidden, maybe ended or left out is the shipped rule's (D296).
# - `window`: the Budget's closed months (D231), oldest first; n = their number.
# - `class_means`: the Budget's monthly figure of Notwendiges and Wünsche as GET
#   /household-budget serves it (an input here; in every case below it is the class's window
#   total ÷ n to the cent half-up, worked in the comment).
# - `overrides`: the household's class overrides (D272 (1)), empty by default.
#
# Rules this file pins (§7.10 (c), D300, with the details settled when it was written):
# - `fixed` of a class: the series rules.recurring lists (`series`: active or maybe_ended; a
#   `hidden` one, „kein Abo“, is not fixed; one left out after three missed intervals is in
#   no list) whose code is in the class. A series' code is its newest payment's code, placed
#   as the Budget places it (the override for a movable code, else the taxonomy's class; a
#   code one-off in force belongs to neither class).
# - Each fixed row: `key` = the id of the series' oldest payment (the opaque id the recurring
#   panel already uses, never the payee's words); `label` as rules.recurring gives it;
#   `monthly` = the expected monthly amount = yearly_total ÷ 12 to the cent half-up (monthly:
#   the newest amount; quarterly: newest × 4 ÷ 12; yearly: newest ÷ 12); `mean` = the series'
#   payments inside the window that the Budget counts in this class (marked one-off ones
#   left out), summed and divided by n, to the cent half-up, so a series that started inside
#   the window or holds a price change has a mean below or apart from its monthly amount;
#   `interval`, `state`, `change`, `since` as rules.recurring gives them.
# - `variable` = the class mean − Σ the fixed rows' means, so fixed + variable equals the class
#   mean to the cent, whatever each part's own rounding (case monthly_and_yearly_in_one_class).
# - Rows in a class ordered by `monthly`, largest first, then label.
cases:
- id: monthly_and_yearly_in_one_class
  description: "Wünsche holds a monthly series with a price change inside the window and a yearly
    one; Notwendiges a monthly rent and a supermarket that is no series. Each fixed mean and the
    variable part round up on their own, so only the remainder adds up to the class mean."
  today: '2027-02-10'
  history_start: '2026-01-01'
  window: [2026-11, 2026-12, 2027-01]
  lines:
  - {id: 'NWS_01', date: '2026-01-20', payee: 'Musterverlag GmbH', category: 'hh_news', amount: '-119.00'}
  - {id: 'NWS_02', date: '2027-01-20', payee: 'Musterverlag GmbH', category: 'hh_news', amount: '-119.00'}
  - {id: 'NFX_01', date: '2026-09-14', payee: 'Netflix International B.V.', category: 'hh_streaming', amount: '-13.99'}
  - {id: 'NFX_02', date: '2026-10-14', payee: 'Netflix International B.V.', category: 'hh_streaming', amount: '-13.99'}
  - {id: 'NFX_03', date: '2026-11-14', payee: 'Netflix International B.V.', category: 'hh_streaming', amount: '-13.99'}
  - {id: 'NFX_04', date: '2026-12-14', payee: 'Netflix International B.V.', category: 'hh_streaming', amount: '-14.99'}
  - {id: 'NFX_05', date: '2027-01-14', payee: 'Netflix International B.V.', category: 'hh_streaming', amount: '-14.99'}
  - {id: 'RST_01', date: '2026-11-07', payee: 'Trattoria Roma', category: 'hh_restaurant', amount: '-60.00'}
  - {id: 'RST_02', date: '2026-12-12', payee: 'Café Lindt', category: 'hh_cafe', amount: '-45.50'}
  - {id: 'RST_03', date: '2027-01-09', payee: 'Pizzeria Napoli', category: 'hh_restaurant', amount: '-80.25'}
  - {id: 'RNT_01', date: '2026-09-01', payee: 'Hausverwaltung Muster GmbH', category: 'hh_rent', amount: '-950.00'}
  - {id: 'RNT_02', date: '2026-10-01', payee: 'Hausverwaltung Muster GmbH', category: 'hh_rent', amount: '-950.00'}
  - {id: 'RNT_03', date: '2026-11-01', payee: 'Hausverwaltung Muster GmbH', category: 'hh_rent', amount: '-950.00'}
  - {id: 'RNT_04', date: '2026-12-01', payee: 'Hausverwaltung Muster GmbH', category: 'hh_rent', amount: '-950.00'}
  - {id: 'RNT_05', date: '2027-01-01', payee: 'Hausverwaltung Muster GmbH', category: 'hh_rent', amount: '-950.00'}
  - {id: 'RNT_06', date: '2027-02-01', payee: 'Hausverwaltung Muster GmbH', category: 'hh_rent', amount: '-950.00'}
  - {id: 'RWE_01', date: '2026-11-03', payee: 'REWE Markt', category: 'hh_supermarket', amount: '-45.30'}
  - {id: 'RWE_02', date: '2026-11-17', payee: 'REWE Markt', category: 'hh_supermarket', amount: '-62.10'}
  - {id: 'RWE_03', date: '2026-12-05', payee: 'REWE Markt', category: 'hh_supermarket', amount: '-51.00'}
  - {id: 'RWE_04', date: '2026-12-19', payee: 'REWE Markt', category: 'hh_supermarket', amount: '-38.40'}
  - {id: 'RWE_05', date: '2027-01-08', payee: 'REWE Markt', category: 'hh_supermarket', amount: '-70.20'}
  - {id: 'RWE_06', date: '2027-01-22', payee: 'REWE Markt', category: 'hh_supermarket', amount: '-44.00'}
  # need: in the window rent 3 × 950.00 = 2850.00 and REWE 45.30 + 62.10 + 51.00 + 38.40 + 70.20
  #   + 44.00 = 311.00; 3161.00 ÷ 3 = 1053.666… → 1053.67 (RNT_06 is in February, outside).
  # want: Netflix 13.99 + 14.99 + 14.99 = 43.97, Musterverlag 119.00 (NWS_02; NWS_01 is
  #   outside), restaurants 60.00 + 45.50 + 80.25 = 185.75; 348.72 ÷ 3 = 116.24 exactly.
  class_means: {need: '1053.67', want: '116.24'}
  expect:
    need:
      fixed:
      # monthly 950.00; mean 2850.00 ÷ 3 = 950.00
      - {key: 'RNT_01', label: 'Hausverwaltung Muster GmbH', interval: monthly, state: active,
         monthly: '950.00', mean: '950.00', change: null, since: null}
      # 1053.67 − 950.00 = 103.67 (REWE alone: 311.00 ÷ 3 = 103.666… → 103.67)
      variable: '103.67'
    want:
      fixed:
      # monthly the newest 14.99 (a rise of 1.00 from December); mean 43.97 ÷ 3 = 14.6566… → 14.66
      - {key: 'NFX_01', label: 'Netflix International B.V.', interval: monthly, state: active,
         monthly: '14.99', mean: '14.66', change: '1.00', since: 2026-12}
      # yearly: monthly 119.00 ÷ 12 = 9.9166… → 9.92; mean 119.00 ÷ 3 = 39.666… → 39.67
      - {key: 'NWS_01', label: 'Musterverlag GmbH', interval: yearly, state: active,
         monthly: '9.92', mean: '39.67', change: null, since: null}
      # 116.24 − (14.66 + 39.67) = 116.24 − 54.33 = 61.91. The restaurants' own mean,
      # 185.75 ÷ 3 = 61.9166… → 61.92, is a cent higher: all three parts rounded up, and the
      # remainder keeps fixed + variable = 116.24.
      variable: '61.91'

