# Phase 10 §7.9 (c), D297: a single payment marked one-off. Hand-written 24 Nov 2026 from
# §7.9 (c) with Q-O183 answered (a): a marked payment counts as one-off spending wherever a
# one-off code does. The expectations are worked by hand, never generated by the rule, and
# never edited to make an implementation pass.
#
# Input: `today`; the household's confirmed private lines (id = the allocation id; income
# positive, spending negative); `marks`, the stored answers in the order stored (allocation id,
# `one_off` or `regular`; the newest per allocation counts; a mark on an id no line has is
# ignored). The closed window is Jan-Oct 2026 (D231) unless a case says otherwise. No rental
# account, no transfer links.
#
# Rules this file pins:
# - Candidate: a spending line whose code is not one-off (D236), not part of a recurring
#   series (rules/recurring, §7.9 (b); the quarterly insurance here is one), not answered yet,
#   amount >= 250 EUR and >= 3 x its code's median month, the median over the window's closed
#   months with a month without that code counting 0. Fewer than three closed months: none.
# - A line whose newest mark is `one_off` moves from regular to one-off spending in
#   rules/health/month.household_month (private_spending, saved and income unchanged), out of
#   its code's mean in rules/plan's spending (the per-code monthly mean spending in play uses,
#   D263), and into the Budget's one-off line (rules/budget). With no marks every phase 9 and
#   phase 10 fixture holds unchanged.
# - A payment outside its payee's series amount band (the 480 doctor's bill among 40s) is not
#   part of the series and can be a candidate. `candidates` are compared as a set.
# - mean_regular_spending: Σ regular_spending ÷ the window's months, to the cent.
#
# Worked by hand: regular spending per month without marks is Jan 900, Feb 600, Mar 600 (the
# car purchase 8500 is one-off by its code), Apr 1340, May 600, Jun 600, Jul 900, Aug 600,
# Sep 600, Oct 1970; Σ 8710.
