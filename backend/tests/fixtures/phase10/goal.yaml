# Phase 10 §7.9 (d), D289, D298: the household goal and its spending scenarios. Hand-written
# 24 Nov 2026 from §7.9 (d) for invented owners A and B, before rules/goal existed. The
# expectations are worked by hand (the comments), never generated by the rule, and never edited
# to make an implementation pass.
#
# Input at rule level: what services.plan already has for phase 9's projection (the month
# basis, the stored run at the newest closed month-end as `start`, the reserve and its monthly
# need, the savings plans, the property scenarios), the codes' means over the window with their
# class from the Budget taxonomy (rules/budget, D272, no override), „Heute im Monat“ (the mean
# monthly saved over the window, phase 9's household month), the values today (the net worth
# and the reserve accounts), today and the default scenario's levers with the goal.
#
# The household of every case unless it says otherwise: newest closed month Oct 2026, today
# 24 Nov 2026 (so the current month is Nov 2026); income 5,000 a month, regular spending
# 3,000, no rental cash, no buffer; free = investable = 2,000 a month (phase 9 §7.1); no
# savings plan, no fund, no coin, no property, so no rate is needed (§7.5 (1)). The month-end
# run of 31 Oct 2026: 50,000 on the bank accounts, of which 30,000 on the reserve accounts
# (the rest e.g. a rental account), net worth 50,000. Reserve need 3,000 a month. Heute im
# Monat 2,000. Today: net worth 51,000, reserve accounts 31,000. Spending means: rent 1,500 and
# supermarket 600 (Notwendiges, 2,100), restaurant 600 and streaming 300 (Wünsche, 900).
#
# Rules this file pins (rules/goal):
# - k counts the months after the newest closed one (k = 1 is Nov 2026). Without any change the
#   net worth after k months is 50,000 + 2,000·k and the reserve 30,000 + 2,000·k (phase 9's
#   bank and as_is rows, §7.5 (4)). A due month Dec 2028 is k = 26, Jun 2027 k = 8, Mar 2027
#   k = 5.
# - months left n = the months from the current month to the due month: Nov 2026 → Dec 2028 is
#   25, → Jun 2027 7, → Mar 2027 4. A scenario's change runs from next month (Dec 2026) to the
#   due month, so it is in force in exactly those n months.
# - projected = the value without any change at the due month; gap = target − projected.
# - nötig = Heute + gap ÷ n, to the cent half-up (the extra kept as cash at 0 %).
# - reached = the first month without change at or above the target (none within the walk:
#   null); reached_with_budget the same with the adopted budget's spending changes.
# - percent = value today ÷ target × 100, one place half-up. A reserve goal's target = its months
#   × the monthly need.
# - A spending scenario cuts, per month from next month to the due month, cut = the gap ÷ n
#   ÷ (1 − buffer), rounded up to the cent, plus 0.01 when a buffer is kept (phase 9 keeps the
#   buffer back from every positive free month, so a cut reaches the projection only at
#   (1 − buffer); the cent covers the buffer's own rounding). Each cut code loses its mean ×
#   cut ÷ (the scenario's total mean), rounded up to the cent; its budget is the mean less
#   that. „Nur Wünsche kürzen“ cuts the want codes, „Alles gleich kürzen“ every code with a
#   class. When the codes cannot give the cut, every one goes to 0 and `rest` names what is
#   still missing a month. `cut` is the Σ of the codes' cuts (a cent or two above the target
#   cut from the roundings up), `saving` = Heute + that cut. A scenario closes the gap when the
#   projection with its spending changes reaches the target by the due month.
# - The buffer is the month basis's `buffer_percent` (services.plan copies it from the levers;
#   the rules read the basis).
# - The spending changes a scenario writes for „Als Budget übernehmen“ are D263 planned
#   monthly amounts from next month to the due month, one per code, or one per group when the
#   group's fallback code has spending of its own (a fallback code stands for its whole group,
#   and one beside its own subcategory is refused, §7.6 (1)); sorted by code.
# - word: none without a goal; on_track when the projection without change, or with the
#   budget the household adopted (`goal_choice.spending` set), reaches the target by the due
#   month; behind when a spending scenario closes the gap; unreachable otherwise, with `later`
#   (the month reached without change) and `reaches_by_due` (the value at the due month).
bases:
  household: &household
    today: '2026-11-24'
    newest_closed: '2026-10'
    month: {mean_income: '5000.00', mean_regular_spending: '3000.00', mean_rental_cash: '0.00', buffer_percent: '0'}
    start: {month_end: '2026-10-31', bank: '50000.00', depot: '0.00', crypto: '0.00', property: '0.00', loans: '0.00', other_liabilities: '0.00'}
    reserve: {amount: '30000.00', need: '3000.00'}
    saved_mean: '2000.00'
    value_today: {net_worth: '51000.00', reserve: '31000.00'}
    means: {hh_rent: '1500.00', hh_supermarket: '600.00', hh_restaurant: '600.00', hh_streaming: '300.00'}

cases:
- id: none_set
  description: no goal in the default scenario; the card reads „Ziel festlegen“
  <<: *household
  levers: {}
  expect: {word: none}

- id: net_worth_on_track
  description: a net-worth goal the household reaches without change
  <<: *household
  levers:
    goal: {kind: net_worth, target: '100000.00', due_month: '2028-12', set_on: '2026-11-20'}
  expect:
    word: on_track
    target: '100000.00'
    value_today: '51000.00'
    percent: '51.0'               # 51,000 ÷ 100,000
    months_left: 25               # Nov 2026 → Dec 2028
    heute: '2000.00'
    projected: '102000.00'        # 50,000 + 2,000 × 26
    noetig: '1920.00'             # 2,000 + (100,000 − 102,000) ÷ 25 = 2,000 − 80
    reached: '2028-11'            # 50,000 + 2,000k ≥ 100,000 → k = 25 → Oct 2026 + 25
    reached_with_budget: null
    scenarios: {}                 # no gap: nothing to cut
    unreachable: null

- id: behind_closed_by_wants
  description: „Dahinter“; „Nur Wünsche kürzen“ closes the gap, „Alles gleich kürzen“ too
  <<: *household
  levers:
    goal: {kind: net_worth, target: '120000.00', due_month: '2028-12', set_on: '2026-11-20'}
  expect:
    word: behind
    target: '120000.00'
    value_today: '51000.00'
    percent: '42.5'               # 51,000 ÷ 120,000 = 0.425
    months_left: 25
    heute: '2000.00'
    projected: '102000.00'
    noetig: '2720.00'             # 2,000 + 18,000 ÷ 25 = 2,000 + 720
    reached: '2029-09'            # 50,000 + 2,000k ≥ 120,000 → k = 35 → Oct 2026 + 35
    reached_with_budget: null
    scenarios:
      wants_only:
        closes: true              # 50,000 + 2,000 (Nov) + 25 × 2,720 = 120,000 ≥ 120,000
        cut: '720.00'             # 18,000 ÷ 25, no buffer
        rest: '0.00'
        saving: '2720.00'         # 2,000 + 720
        budgets: {hh_restaurant: '120.00', hh_streaming: '60.00'}   # 600 − 600×720/900 = 600 − 480; 300 − 240
        changes:
        - {code: hh_restaurant, monthly: '120.00', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_streaming, monthly: '60.00', from_month: '2026-12', to_month: '2028-12'}
      all_equal:
        closes: true
        cut: '720.00'             # 360 + 144 + 144 + 72
        rest: '0.00'
        saving: '2720.00'
        budgets: {hh_rent: '1140.00', hh_supermarket: '456.00', hh_restaurant: '456.00', hh_streaming: '228.00'}  # each × (1 − 720/3,000 = 0.76)
        changes:
        - {code: hh_rent, monthly: '1140.00', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_restaurant, monthly: '456.00', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_streaming, monthly: '228.00', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_supermarket, monthly: '456.00', from_month: '2026-12', to_month: '2028-12'}
    unreachable: null

- id: wants_cannot_close
  description: all wants together are 900 a month, the gap 1,520; „Alles gleich kürzen“ closes it
  <<: *household
  levers:
    goal: {kind: net_worth, target: '140000.00', due_month: '2028-12', set_on: '2026-11-20'}
  expect:
    word: behind
    target: '140000.00'
    value_today: '51000.00'
    percent: '36.4'               # 51,000 ÷ 140,000 = 0.36428…
    months_left: 25
    heute: '2000.00'
    projected: '102000.00'
    noetig: '3520.00'             # 2,000 + 38,000 ÷ 25 = 2,000 + 1,520
    reached: '2030-07'            # 50,000 + 2,000k ≥ 140,000 → k = 45 → Oct 2026 + 45
    reached_with_budget: null
    scenarios:
      wants_only:
        closes: false
        cut: '900.00'             # every want to 0
        rest: '620.00'            # 1,520 − 900
        saving: '2900.00'         # 2,000 + 900: „Selbst ohne jeden Wunsch …“
        budgets: {hh_restaurant: '0.00', hh_streaming: '0.00'}
        changes:
        - {code: hh_restaurant, monthly: '0.00', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_streaming, monthly: '0.00', from_month: '2026-12', to_month: '2028-12'}
      all_equal:
        closes: true              # 50,000 + 2,000 + 25 × 3,520 = 140,000
        cut: '1520.00'            # 760 + 304 + 304 + 152
        rest: '0.00'
        saving: '3520.00'
        budgets: {hh_rent: '740.00', hh_supermarket: '296.00', hh_restaurant: '296.00', hh_streaming: '148.00'}  # each less its mean × 1,520/3,000
        changes:
        - {code: hh_rent, monthly: '740.00', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_restaurant, monthly: '296.00', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_streaming, monthly: '148.00', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_supermarket, monthly: '296.00', from_month: '2026-12', to_month: '2028-12'}
    unreachable: null

- id: not_reachable
  description: „So nicht erreichbar“; the gap of 11,920 a month is more than all spending
  <<: *household
  levers:
    goal: {kind: net_worth, target: '400000.00', due_month: '2028-12', set_on: '2026-11-20'}
  expect:
    word: unreachable
    target: '400000.00'
    value_today: '51000.00'
    percent: '12.8'               # 51,000 ÷ 400,000 = 0.1275, half-up
    months_left: 25
    heute: '2000.00'
    projected: '102000.00'
    noetig: '13920.00'            # 2,000 + 298,000 ÷ 25 = 2,000 + 11,920
    reached: '2041-05'            # 50,000 + 2,000k ≥ 400,000 → k = 175 = 14 years 7 months
    reached_with_budget: null
    scenarios:
      wants_only:
        closes: false
        cut: '900.00'
        rest: '11020.00'          # 11,920 − 900
        saving: '2900.00'
        budgets: {hh_restaurant: '0.00', hh_streaming: '0.00'}
        changes:
        - {code: hh_restaurant, monthly: '0.00', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_streaming, monthly: '0.00', from_month: '2026-12', to_month: '2028-12'}
      all_equal:
        closes: false
        cut: '3000.00'            # every code to 0
        rest: '8920.00'           # 11,920 − 3,000
        saving: '5000.00'
        budgets: {hh_rent: '0.00', hh_supermarket: '0.00', hh_restaurant: '0.00', hh_streaming: '0.00'}
        changes:
        - {code: hh_rent, monthly: '0.00', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_restaurant, monthly: '0.00', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_streaming, monthly: '0.00', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_supermarket, monthly: '0.00', from_month: '2026-12', to_month: '2028-12'}
    unreachable:
      later: '2041-05'            # the same goal without change, the month it is reached
      reaches_by_due: '102000.00' # what the household has at Dec 2028 without change

- id: saved_sum_on_track
  description: a sum saved, measured on the reserve accounts (D237)
  <<: *household
  levers:
    goal: {kind: saved_sum, target: '40000.00', due_month: '2027-06', set_on: '2026-11-20'}
  expect:
    word: on_track
    target: '40000.00'
    value_today: '31000.00'       # the reserve accounts today
    percent: '77.5'               # 31,000 ÷ 40,000
    months_left: 7                # Nov 2026 → Jun 2027
    heute: '2000.00'
    projected: '46000.00'         # 30,000 + 2,000 × 8
    noetig: '1142.86'             # 2,000 + (40,000 − 46,000) ÷ 7 = 2,000 − 857.142857…
    reached: '2027-03'            # 30,000 + 2,000k ≥ 40,000 → k = 5
    reached_with_budget: null
    scenarios: {}
    unreachable: null

- id: reserve_months_behind
  description: a reserve of 14 months by Mar 2027; target 14 × 3,000 = 42,000
  <<: *household
  levers:
    goal: {kind: reserve_months, target: '14.0', due_month: '2027-03', set_on: '2026-11-20'}
  expect:
    word: behind
    target: '42000.00'            # 14 × the monthly need 3,000
    value_today: '31000.00'
    percent: '73.8'               # 31,000 ÷ 42,000 = 0.738095…
    months_left: 4                # Nov 2026 → Mar 2027
    heute: '2000.00'
    projected: '40000.00'         # 30,000 + 2,000 × 5
    noetig: '2500.00'             # 2,000 + 2,000 ÷ 4
    reached: '2027-04'            # 30,000 + 2,000k ≥ 42,000 → k = 6
    reached_with_budget: null
    scenarios:
      wants_only:
        closes: true              # 30,000 + 2,000 (Nov) + 4 × 2,500.01 = 42,000.04
        cut: '500.01'             # 333.34 + 166.67
        rest: '0.00'
        saving: '2500.01'
        budgets: {hh_restaurant: '266.66', hh_streaming: '133.33'}   # 600 − ⌈600×500/900 = 333.33…⌉; 300 − ⌈166.66…⌉
        changes:
        - {code: hh_restaurant, monthly: '266.66', from_month: '2026-12', to_month: '2027-03'}
        - {code: hh_streaming, monthly: '133.33', from_month: '2026-12', to_month: '2027-03'}
      all_equal:
        closes: true              # 32,000 + 4 × 2,500 = 42,000
        cut: '500.00'             # 250 + 100 + 100 + 50
        rest: '0.00'
        saving: '2500.00'
        budgets: {hh_rent: '1250.00', hh_supermarket: '500.00', hh_restaurant: '500.00', hh_streaming: '250.00'}
        changes:
        - {code: hh_rent, monthly: '1250.00', from_month: '2026-12', to_month: '2027-03'}
        - {code: hh_restaurant, monthly: '500.00', from_month: '2026-12', to_month: '2027-03'}
        - {code: hh_streaming, monthly: '250.00', from_month: '2026-12', to_month: '2027-03'}
        - {code: hh_supermarket, monthly: '500.00', from_month: '2026-12', to_month: '2027-03'}
    unreachable: null

- id: buffer_kept
  description: a 10 % buffer; a cut reaches the projection at 90 %, so the scenario cuts more than nötig − heute
  <<: *household
  month: {mean_income: '5000.00', mean_regular_spending: '3000.00', mean_rental_cash: '0.00', buffer_percent: '10'}
  levers:
    buffer_percent: '10'
    goal: {kind: net_worth, target: '110000.00', due_month: '2028-12', set_on: '2026-11-20'}
  expect:
    word: behind
    target: '110000.00'
    value_today: '51000.00'
    percent: '46.4'               # 51,000 ÷ 110,000 = 0.4636…
    months_left: 25
    heute: '2000.00'
    projected: '96800.00'         # investable 2,000 − 200 = 1,800; 50,000 + 1,800 × 26
    noetig: '2528.00'             # 2,000 + 13,200 ÷ 25 = 2,000 + 528
    reached: '2029-08'            # 50,000 + 1,800k ≥ 110,000 → k = 34 (33.3 rounded up)
    reached_with_budget: null
    scenarios:
      wants_only:
        # cut = ⌈13,200 ÷ 25 ÷ 0.9 = 586.666…⌉ + 0.01 = 586.68; restaurant ⌈600 × 586.68/900⌉ =
        # 391.12, streaming ⌈195.56⌉ = 195.56. With it free = 2,586.68 from Dec 2026, buffer
        # 258.67, investable 2,328.01: 50,000 + 1,800 + 25 × 2,328.01 = 110,000.25.
        closes: true
        cut: '586.68'
        rest: '0.00'
        saving: '2586.68'
        budgets: {hh_restaurant: '208.88', hh_streaming: '104.44'}
        changes:
        - {code: hh_restaurant, monthly: '208.88', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_streaming, monthly: '104.44', from_month: '2026-12', to_month: '2028-12'}
      all_equal:
        # rent ⌈1,500 × 586.68/3,000 = 293.34⌉, supermarket ⌈117.336⌉ = 117.34, restaurant
        # 117.34, streaming ⌈58.668⌉ = 58.67; Σ 586.69; free 2,586.69, buffer 258.67,
        # investable 2,328.02: 51,800 + 25 × 2,328.02 = 110,000.50.
        closes: true
        cut: '586.69'
        rest: '0.00'
        saving: '2586.69'
        budgets: {hh_rent: '1206.66', hh_supermarket: '482.66', hh_restaurant: '482.66', hh_streaming: '241.33'}
        changes:
        - {code: hh_rent, monthly: '1206.66', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_restaurant, monthly: '482.66', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_streaming, monthly: '241.33', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_supermarket, monthly: '482.66', from_month: '2026-12', to_month: '2028-12'}
    unreachable: null

- id: budget_adopted
  description: the case behind_closed_by_wants after „Als Budget übernehmen“ of „Nur Wünsche kürzen“; the word is „Auf Kurs“
  <<: *household
  levers:
    goal: {kind: net_worth, target: '120000.00', due_month: '2028-12', set_on: '2026-11-20'}
    goal_choice: {spending: wants_only, spending_chosen_on: '2026-11-24'}
    spending_changes:
    - {code: hh_restaurant, monthly: '120.00', from_month: '2026-12', to_month: '2028-12'}
    - {code: hh_streaming, monthly: '60.00', from_month: '2026-12', to_month: '2028-12'}
  expect:
    word: on_track
    target: '120000.00'
    value_today: '51000.00'
    percent: '42.5'
    months_left: 25
    heute: '2000.00'
    projected: '102000.00'        # without change: the spending changes are not counted
    noetig: '2720.00'
    reached: '2029-09'
    reached_with_budget: '2028-12'  # 52,000 + 2,720j ≥ 120,000 first at j = 25, Dec 2028
    scenarios:                    # the same as behind_closed_by_wants: measured means, not the budget
      wants_only:
        closes: true
        cut: '720.00'
        rest: '0.00'
        saving: '2720.00'
        budgets: {hh_restaurant: '120.00', hh_streaming: '60.00'}
        changes:
        - {code: hh_restaurant, monthly: '120.00', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_streaming, monthly: '60.00', from_month: '2026-12', to_month: '2028-12'}
      all_equal:
        closes: true
        cut: '720.00'
        rest: '0.00'
        saving: '2720.00'
        budgets: {hh_rent: '1140.00', hh_supermarket: '456.00', hh_restaurant: '456.00', hh_streaming: '228.00'}
        changes:
        - {code: hh_rent, monthly: '1140.00', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_restaurant, monthly: '456.00', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_streaming, monthly: '228.00', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_supermarket, monthly: '456.00', from_month: '2026-12', to_month: '2028-12'}
    unreachable: null

- id: fallback_group_mixed
  description: a group's fallback code with spending of its own beside a want and a need subcategory; the group gets one change
  <<: *household
  means: {hh_rent: '1500.00', hh_supermarket: '600.00', hh_mobility: '200.00', hh_fuel: '150.00', hh_taxi: '100.00', hh_restaurant: '450.00'}
  levers:
    goal: {kind: net_worth, target: '113000.00', due_month: '2028-12', set_on: '2026-11-20'}
  expect:
    word: behind
    target: '113000.00'
    value_today: '51000.00'
    percent: '45.1'               # 51,000 ÷ 113,000 = 0.4513…
    months_left: 25
    heute: '2000.00'
    projected: '102000.00'
    noetig: '2440.00'             # 2,000 + 11,000 ÷ 25
    reached: '2029-06'            # 50,000 + 2,000k ≥ 113,000 → k = 32 (31.5 rounded up)
    reached_with_budget: null
    scenarios:
      wants_only:
        # wants: taxi 100 (in Mobilität, whose fallback hh_mobility is a need) and restaurant
        # 450; cut 440 = 80 + 360. The taxi's budget joins its group's change: hh_mobility
        # 200 + hh_fuel 150 + hh_taxi 20 = 370.
        closes: true              # 52,000 + 25 × 2,440 = 113,000
        cut: '440.00'
        rest: '0.00'
        saving: '2440.00'
        budgets: {hh_taxi: '20.00', hh_restaurant: '90.00'}
        changes:
        - {code: hh_mobility, monthly: '370.00', from_month: '2026-12', to_month: '2028-12'}
        - {code: hh_restaurant, monthly: '90.00', from_month: '2026-12', to_month: '2028-12'}
      all_equal:
        # cut 440 ÷ 3,000: rent 220, supermarket 88, mobility ⌈29.333…⌉ = 29.34, fuel 22, taxi
        # ⌈14.666…⌉ = 14.67, restaurant 66; Σ 440.01. Mobilität's change 170.66 + 128 + 85.33.
        closes: true              # 52,000 + 25 × 2,440.01 = 113,000.25
        cut: '440.01'
        rest: '0.00'
        saving: '2440.01'
        budgets: {hh_rent: '1280.00', hh_supermarket: '512.00', hh_mobility: '170.66', hh_fuel: '128.00', hh_taxi: '85.33', hh_restaurant: '384.00'}
        changes:
        - {code: hh_mobility, monthly: '383.99', from_month: '2026-12', to_month: '2028-12'}
