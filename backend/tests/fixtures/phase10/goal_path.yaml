# Phase 10 §7.11 (i), D311: a realistic path, adopted and tracked. Invented owners A and B,
# figures worked by hand month by month with a scratch walk written apart from the rule (the
# walk of goal_routes.yaml's header, which reproduces its 369,991.55 and 737,110.28), never
# generated by the rule and never edited to make an implementation pass.
#
# The household (a consistent one, unlike goal_routes.yaml's, whose need of 3,000 counts every
# spending): newest closed month Oct 2026, today 24 Nov 2026; income 5,000, regular spending
# 3,000 (rent 1,500 and supermarket 600 needs, 2,100; restaurant 600 and streaming 300 wants,
# 900), no rental cash, buffer 0, funds typed at 6 % a year, the split 100 % funds; 31 Oct 2026
# bank 50,000 of which the reserve 30,000; the reserve's need ((g): needs only) 2,100 a month,
# 6 months' target 12,600. So Nov 2026 moves 19,400 into funds and every month after it 2,000:
# net worth 52,000.00 at 30 Nov 2026, 54,097.00 at 31 Dec 2026, 80,046.82 at 31 Dec 2027,
# 374,035.42 at 30 Jun 2036 (the household's projected value for a goal of Jun 2036).
# The investor: the same with 500,000 of funds at the start (bank 50,000), today 551,000; the
# goal by Dec 2029 (37 months left, windows of 3 years); 738,173.93 at 31 Dec 2029.
#
# Rules this file pins (rules/goal/path.py):
# 1. Ceiling (item 1) = free − buffer_of(free), free = income − regular spending + rental cash
#    + max(0, wants net − wants kept): Anlegbar's free cash with the wants cut to the wants
#    kept, the buffer kept as phase 9 keeps it from a free month (amended 27 Nov 2026 from
#    income + max(rental, 0) − need − wants kept, which left out regular spending outside the
#    need and the wants; amended again the same day: the wants net is the want class's net
#    mean, every want code with a refund (hh_refund) netted, as the Budget's Wünsche nets it,
#    where the positive wants alone had cut a phantom amount). Its rows add up: other
#    spending = income + max(rental, 0) − need − wants kept − free = regular spending − need −
#    wants net, signed, 0 where the codes are needs and wants only (every case before
#    `spending_outside_the_classes`). Wants kept = min(wants net, wants_max % × income), else,
#    with no wants target saved, the suggestion: half of each positive want's mean, rounded
#    down to the cent, at most the wants net (`suggested: true`). Anlegbar = free − buffer_of(free), free = income − regular spending +
#    rental cash (phase 9 §7.1; one-offs stay out, the walk carries the planned ones month by
#    month). Room = max(0, ceiling − Anlegbar).
# 2. Step 1 at the typed rates: on_track when the walk without change reaches the target by the
#    due month (extra 0); else the smallest whole euro e ≤ room which, added to each month's
#    Anlegbar from next month to the due month, reaches it: doable_rates. The path's monthly
#    amount = Anlegbar + e. The rate counted on = the typed rates weighted by the effective
#    split (here 6 %).
# 3. Step 2 (own use, a net-worth goal): route 3's needed return at the whole room (the same
#    grid, windows and comparison as goal_routes.yaml's route 3, its extra the room).
#    reached × 2 ≥ windows (and windows > 0): doable_return, its monthly amount Anlegbar +
#    room; 0 < reached and reached × 2 < windows: ambitious, never adoptable; reached 0, out of
#    range or no history: hardly. Fewer than 5 windows: judged the same, `short_history` with
#    the mix's first and last year. In `generic` mode no step 2: hardly. The mix (§7.11 (j),
#    D312, amended 27 Nov 2026) weighs today's holdings with the money the walk at the whole
#    room invests from next month to the due month (undiscounted, at the split): shown as
#    `mix_today_share` and `mix_future_share`, percent to 0.1, null without a count. Here the
#    split is all funds and only funds are held, so the mix's returns are the funds' as before.
# 4. The wants budget the path stores: the cut the plan needs, wanted = e, grossed up for a
#    buffer as the spending scenarios do (e ÷ (1 − b), up to the cent, + 0.01 when b > 0), at
#    most wants net − wants kept, shared by the positive wants' means and each rounded up to
#    the cent; budget = mean − cut per want that is cut. The budget total = wants net − Σ cuts
#    (net, as the tracking's month wants are). No cut: no budget rows, the budget total the
#    wants net.
# 5. Why (no path): the due-month value with the whole room used at the typed rates and the
#    month the goal is then reached (null within 40 years).
# 6. word: on_track → on_track, doable_* → feasible, ambitious → ambitious, hardly → hardly.
