# Tracking rows (item 6 amended, item 12), rules/goal/path.py `track`: one row per closed
# month-end since the day the path was adopted. Per row:
# - planned = the path's monthly amount; waiting (item 12, only with a saved split) =
#   min(max(0, planned × crypto % − crypto bought that month), max(0, saved − principal −
#   max(0, invested in the property) − invested)), to the cent (amended 27 Nov 2026, Q-O194:
#   the loan's repayment and the payments into the property, D234, are saved but not waiting;
#   a month whose loan payout exceeds what the property took counts 0 there, the payout being
#   no saving); principal and invested_property default to 0 in a month that names neither;
#   the invested mark compares invested + waiting with planned (gap = what is short).
# - „Jetzt anlegen“ (§7.11 (k), 27 Nov 2026; `now` and `now_crypto` on the adopted path):
#   invest_now = what of it is still open at the month's start (None when nothing is); the
#   month's purchases pay it first (its crypto part from the crypto bought), up to what is
#   open, and only the rest is the month's own investing in the waiting formula (invested and
#   crypto bought less what paid the lump); the invested mark compares invested + waiting with
#   planned + invest_now, so a lump not bought in the month adopted stays planned until it is.
# - wants against the path's wants budget total; net worth against the path's walk at that
#   month-end.
# - value change = value now − value at the day − money in since the day; implied change =
#   tracker.implied(the rate counted on, the value at the day and each flow, the month-end);
#   both as cumulative percentages of (value at the day + money in), two places half up, never
#   annualised; the mark compares the two amounts.
# - the row's word: on_path when every mark is, else behind.
