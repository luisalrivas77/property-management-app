# Phase 10 §7.9 (e), „(e) as decided for the build“ items 1 and 2 (D289, D298): the property
# scenario, one card per property on Anlagen › Immobilie with the yearly value growth that
# property alone would need for the household's goal to be reached at today's saving, beside
# the German house price index over every window of the goal's length. Invented household,
# invented index and invented figures, worked by hand (closed forms with exact fractions on a
# scratch sheet apart from the rule), never generated by the rule and never edited to make an
# implementation pass. The real index (Eurostat prc_hpi_q, committed in
# rules/goal/history.yaml) is never read by these cases.
#
# The readings this file pins (each a build choice of 26 Nov 2026, for Luis to overrule):
# 1. Shown: own use only (`advice_mode = generic`: nothing shown or computed, reason
#    generic_mode); a net-worth goal only (a sum saved or the reserve counts no property:
#    not_net_worth); a goal the walk can answer (no projection, due passed, beyond the
#    projection or the reserve used up on the way: goal_issue).
# 2. One card per property the walk runs with phase 4's default scenario and sells at the due
#    month or later; none for a property kept without a scenario, none for one sold before the
#    due month (its value no longer counts at the due month).
# 3. The needed growth: the walk to the due month with nothing else changed (the typed fund
#    and crypto rates kept), only that property's yearly value growth replaced: every
#    projected year's value = phase 4's value, base × (1 + g)^(year − today's year) to the cent
#    (half up), base the scenario's value today; the loans and the rental cash as phase 4
#    projects them (they do not depend on the value). When the property is sold in the due
#    month its net proceeds follow g too (phase 4's sale at g; here, with no tax, V − V × the
#    selling rate to the cent − the loan). The smallest g on the 0.1 % grid between −50 % and
#    +100 % whose walk reaches the target at the due month; −50 % when even that reaches it;
#    none (out_of_range) when +100 % does not.
# 4. The history: the index's yearly returns Q4 to Q4 (Q4 of Y ÷ Q4 of Y−1 − 1); every run of
#    the goal's months left in whole years (at least one) of consecutive returns; the median
#    (the sorted products' element M ÷ 2), the best, each annualised and floored to 0.1 %; N of
#    M windows reached; the verdict as route 3 gives it (at or below the median
#    within_history, at or below the best good_times, else never). Under 5 windows thin. No
#    window at all: the needed growth is still shown, the count is not (history_short).
#    Price only: the index carries no rent and no costs.
# 5. `available` is true when both the needed growth and at least one window exist.
#
# The household of every case (goal_routes.yaml's, with a flat): today 24 Nov 2026, newest
# closed month Oct 2026; income 5,000, regular spending 3,000, buffer 0, so 2,000 a month;
# at 31 Oct 2026 the bank row 50,000 of which the reserve 30,000, the need 3,000, 6 months'
# target 18,000; funds typed at 0 %, the split 100 % funds. Its walk: Nov 2026 the reserve
# 32,000 → 14,000 into funds; 2,000 a month from Dec 2026; so at 31 Dec of year Y the bank row
# 38,000 and funds 14,000 + 2,000 × (1 + 12 × (Y − 2026)): 174,000 together at Dec 2031,
# 150,000 at Dec 2030, 294,000 at Dec 2036. The flat: worth 300,000 today (31 Oct 2026, its
# loan 200,000), typed growth 2 % a year, its loan 5,000 less each year, its cash 0. A
# December due month puts the flat at its 31 Dec value exactly.
# The invented index (Q4 of each year): its 20 yearly returns 2006–2025 give 16 windows of 5
# years (median 3.9 %, best 8.7 %) and 17 of 4 years (median 3.9 %, best 8.9 %).
bases:
  household: &household
    today: '2026-11-24'
    newest_closed: '2026-10'
    month: {mean_income: '5000.00', mean_regular_spending: '3000.00', mean_rental_cash: '0.00', buffer_percent: '0'}
    start: {month_end: '2026-10-31', bank: '50000.00', depot: '0.00', crypto: '0.00', property: '300000.00', loans: '200000.00', other_liabilities: '0.00'}
    reserve: {amount: '30000.00', need: '3000.00'}
    saved_mean: '2000.00'
    value_today: {net_worth: '150000.00', reserve: '30000.00'}
    means: {hh_rent: '1500.00', hh_supermarket: '600.00', hh_restaurant: '600.00', hh_streaming: '300.00'}
    split: {depot: '100', crypto: '0'}
    properties: &typed
      flat: {base: '300000.00', typed_growth: '0.02', selling_rate: '0.05'}
    index: &index
      {2005: '80.0', 2006: '80.8', 2007: '81.6', 2008: '80.0', 2009: '82.4', 2010: '82.4', 2011: '85.7', 2012: '90.0', 2013: '92.7', 2014: '98.3', 2015: '100.0', 2016: '107.0', 2017: '115.6', 2018: '126.0', 2019: '132.3', 2020: '145.5', 2021: '163.0', 2022: '158.1', 2023: '150.2', 2024: '151.7', 2025: '154.7'}
  flat_2038: &flat_2038
    # sold in 2038, after every due month below
    sale_year: 2038
    years: {2027: ['306000.00', '195000.00'], 2028: ['312120.00', '190000.00'], 2029: ['318362.40', '185000.00'], 2030: ['324729.65', '180000.00'], 2031: ['331224.24', '175000.00'], 2032: ['337848.73', '170000.00'], 2033: ['344605.70', '165000.00'], 2034: ['351497.81', '160000.00'], 2035: ['358527.77', '155000.00'], 2036: ['365698.33', '150000.00'], 2037: ['373012.29', '145000.00'], 2038: ['380472.54', '140000.00']}
    net_proceeds: '221448.91'    # 380,472.54 − 19,023.63 − 140,000
  due_2031: &due_2031
    <<: *household
    flats: {flat: *flat_2038}

cases:
- id: within_median
  description: >-
    the goal of 346,000 by Dec 2031 needs the flat worth 347,000 then (174,000 + V − 175,000):
    300,000 × 1.029^5 = 346,097.23 misses, × 1.030^5 = 347,782.22 reaches; 3.0 % against a
    median of 3.9 %: reached in 10 of 16 five-year windows
  <<: *due_2031
  levers:
    goal: {kind: net_worth, target: '346000.00', due_month: '2031-12', set_on: '2026-11-20'}
    value_change: {depot: '0.00'}
  expect:
    shown: true
    properties:
      flat: {available: true, typed_growth: '0.02', needed_growth: '0.030', sale_year: 2038, window_years: 5, windows: 16, reached_windows: 10, median: '0.039', best: '0.087', verdict: within_history, thin: false}

- id: good_times
  description: >-
    400,000 by Dec 2031 needs the flat worth 401,000: 1.059^5 × 300,000 = 399,577.53 misses,
    1.060^5 × 300,000 = 401,467.67 reaches; 6.0 % lies above the median 3.9 % and below the best 8.7 %:
    5 of 16 windows
  <<: *due_2031
  levers:
    goal: {kind: net_worth, target: '400000.00', due_month: '2031-12', set_on: '2026-11-20'}
    value_change: {depot: '0.00'}
  expect:
    shown: true
    properties:
      flat: {available: true, typed_growth: '0.02', needed_growth: '0.060', sale_year: 2038, window_years: 5, windows: 16, reached_windows: 5, median: '0.039', best: '0.087', verdict: good_times, thin: false}

- id: never
  description: >-
    480,000 by Dec 2031 needs the flat worth 481,000: 1.099^5 × 300,000 = 480,960.84 misses,
    1.100^5 × 300,000 = 483,153.00 reaches; 10.0 % a year, no window reached it
  <<: *due_2031
  levers:
    goal: {kind: net_worth, target: '480000.00', due_month: '2031-12', set_on: '2026-11-20'}
    value_change: {depot: '0.00'}
  expect:
    shown: true
    properties:
      flat: {available: true, typed_growth: '0.02', needed_growth: '0.100', sale_year: 2038, window_years: 5, windows: 16, reached_windows: 0, median: '0.039', best: '0.087', verdict: never, thin: false}

- id: out_of_range
  description: >-
    10,000,000 by Dec 2031: even +100 % a year (300,000 × 2^5 = 9,600,000) misses; the windows
    are still shown
  <<: *due_2031
  levers:
    goal: {kind: net_worth, target: '10000000.00', due_month: '2031-12', set_on: '2026-11-20'}
    value_change: {depot: '0.00'}
  expect:
    shown: true
    properties:
      flat: {available: false, reason: out_of_range, typed_growth: '0.02', needed_growth: null, sale_year: 2038, window_years: 5, windows: 16, median: '0.039', best: '0.087', thin: false}

- id: thin_series
  description: >-
    the index only from Q4 2019: six returns 2020–2025 give 2 five-year windows (median
    and best both 2.7 % a year); 6.0 % is never reached and the count is thin
  <<: *due_2031
  index: {2019: '132.3', 2020: '145.5', 2021: '163.0', 2022: '158.1', 2023: '150.2', 2024: '151.7', 2025: '154.7'}
  levers:
    goal: {kind: net_worth, target: '400000.00', due_month: '2031-12', set_on: '2026-11-20'}
    value_change: {depot: '0.00'}
  expect:
    shown: true
    properties:
      flat: {available: true, typed_growth: '0.02', needed_growth: '0.060', sale_year: 2038, window_years: 5, windows: 2, reached_windows: 0, median: '0.027', best: '0.027', verdict: never, thin: true}

- id: series_shorter_than_window
  description: >-
    480,000 by Dec 2036 (121 months left, a 10-year window) needs the flat worth 336,000
    (294,000 + V − 150,000): 1.011^10 × 300,000 = 334,682.35 misses, 1.012^10 × 300,000 =
    338,007.53 reaches, 1.2 % a year; the index only from Q4 2016 holds 9 returns, no
    10-year window: the growth is shown, the count is not
  <<: *due_2031
  index: {2016: '107.0', 2017: '115.6', 2018: '126.0', 2019: '132.3', 2020: '145.5', 2021: '163.0', 2022: '158.1', 2023: '150.2', 2024: '151.7', 2025: '154.7'}
  levers:
    goal: {kind: net_worth, target: '480000.00', due_month: '2036-12', set_on: '2026-11-20'}
    value_change: {depot: '0.00'}
  expect:
    shown: true
    properties:
      flat: {available: false, reason: history_short, typed_growth: '0.02', needed_growth: '0.012', sale_year: 2038, window_years: 10, windows: 0, thin: true}

- id: sold_in_due_month
  description: >-
    the flat sold in 2030, the goal 280,000 by Dec 2030: at the due month the flat is gone and
    its net proceeds sit in funds (150,000 + proceeds); the proceeds follow the growth, V −
    5 % − 180,000, so 130,000 are needed: 300,000 × 1.021^4 = 326,004.97 gives 129,704.72 and
    misses, × 1.022^4 = 327,284.05 gives 130,919.85 and reaches; 2.2 % against 17 four-year
    windows (49 months left), median 3.9 %, reached in 12
  <<: *household
  flats:
    flat:
      sale_year: 2030
      years: {2027: ['306000.00', '195000.00'], 2028: ['312120.00', '190000.00'], 2029: ['318362.40', '185000.00'], 2030: ['324729.65', '180000.00']}
      net_proceeds: '128493.17'  # 324,729.65 − 16,236.48 − 180,000
  levers:
    goal: {kind: net_worth, target: '280000.00', due_month: '2030-12', set_on: '2026-11-20'}
    value_change: {depot: '0.00'}
  expect:
    shown: true
    properties:
      flat: {available: true, typed_growth: '0.02', needed_growth: '0.022', sale_year: 2030, window_years: 4, windows: 17, reached_windows: 12, median: '0.039', best: '0.089', verdict: within_history, thin: false}

- id: sold_before_due
  description: >-
    the flat sold in 2029, the goal due Dec 2031: its value no longer counts at the due month,
    so no card
  <<: *household
  flats:
    flat:
      sale_year: 2029
      years: {2027: ['306000.00', '195000.00'], 2028: ['312120.00', '190000.00'], 2029: ['318362.40', '185000.00']}
      net_proceeds: '117444.28'  # 318,362.40 − 15,918.12 − 185,000
  levers:
    goal: {kind: net_worth, target: '346000.00', due_month: '2031-12', set_on: '2026-11-20'}
    value_change: {depot: '0.00'}
  expect:
    shown: true
    properties: {}

- id: without_scenario
  description: >-
    the flat kept without a default scenario (D301 (a) 5): its value today for ever, no growth
    to vary, so no card (the property page keeps its to-do no_default_scenario)
  <<: *household
  flats:
    flat:
      kept_value: '300000.00'
      kept_loans: {2027: '195000.00', 2028: '190000.00', 2029: '185000.00', 2030: '180000.00', 2031: '175000.00', 2032: '170000.00', 2033: '165000.00', 2034: '160000.00', 2035: '155000.00', 2036: '150000.00', 2037: '145000.00', 2038: '140000.00', 2039: '135000.00', 2040: '130000.00', 2041: '125000.00', 2042: '120000.00', 2043: '115000.00', 2044: '110000.00', 2045: '105000.00', 2046: '100000.00', 2047: '95000.00', 2048: '90000.00', 2049: '85000.00', 2050: '80000.00', 2051: '75000.00', 2052: '70000.00', 2053: '65000.00', 2054: '60000.00', 2055: '55000.00', 2056: '50000.00', 2057: '45000.00', 2058: '40000.00', 2059: '35000.00', 2060: '30000.00', 2061: '25000.00', 2062: '20000.00', 2063: '15000.00', 2064: '10000.00', 2065: '5000.00', 2066: '0.00'}
  levers:
    goal: {kind: net_worth, target: '346000.00', due_month: '2031-12', set_on: '2026-11-20'}
    value_change: {depot: '0.00'}
  expect:
    shown: true
    properties: {}

- id: generic_mode
  description: in `generic` mode nothing is shown or computed (D289)
  <<: *due_2031
  mode: generic
  levers:
    goal: {kind: net_worth, target: '346000.00', due_month: '2031-12', set_on: '2026-11-20'}
    value_change: {depot: '0.00'}
  expect:
    shown: false
    reason: generic_mode

- id: sum_saved
  description: a goal for a sum saved counts the reserve row, never a property
  <<: *due_2031
  levers:
    goal: {kind: saved_sum, target: '40000.00', due_month: '2031-12', set_on: '2026-11-20'}
    value_change: {depot: '0.00'}
  expect:
    shown: false
    reason: not_net_worth

- id: due_passed
  description: a goal whose month is over has no walk to vary
  <<: *due_2031
  levers:
    goal: {kind: net_worth, target: '346000.00', due_month: '2026-10', set_on: '2026-01-20'}
    value_change: {depot: '0.00'}
  expect:
    shown: false
    reason: goal_issue
