# Rule fixture: a depot cash line's category by its booking text, without a model
# (hausbuch.rules.depot.categorise; docs/phases/phase-6.md D165 (1), §7, §14)
#
# categorise(booking_text) -> AllocationCategory. The rule data is rules/depot.BOOKING_PATTERNS
# (written in step 0): case-insensitive, at a word start, first match wins, in the order
# Einlage, Auszahlung, Vorabpauschale, the taxes, Kauf, Verkauf, Dividende/Ausschüttung,
# Verwaltergebühr/Gebühr; anything else is `uncategorized` and goes to review. Every
# expectation is recomputed on load from BOOKING_PATTERNS, so this file and the table cannot
# drift; categorise itself is the stub of step 4.
#
# Booking texts are invented from the bookings §3's secondary source names; step 4 corrects
# them against the anonymised real statements.
#
# Step 0 readings (listed in the step 0 report):
# - "Steuer auf Ausschüttung" is the tax, not the distribution: the taxes come before the
#   distribution words (the spec lists the codes, not their order; the order follows the
#   reading that a line naming both is the tax line).
# - A tax refund ("Steuererstattung") is capital_income_tax too, as a credit (the spec's
#   `Steuer` matches it; phase 8's KAP rules read the sign).
# - "Kaufpreis" or another word that only starts with Kauf is no purchase (whole word only):
#   uncategorized, for review.

cases:
  - {id: deposit, booking_text: "Einlage", expect: internal_transfer_in, pending: "phase 6 step 4 (the depot)"}
  - {id: deposit_lower_case, booking_text: "einlage per SEPA-Überweisung", expect: internal_transfer_in, pending: "phase 6 step 4 (the depot)"}
  - {id: payout, booking_text: "Auszahlung auf Referenzkonto", expect: internal_transfer_out, pending: "phase 6 step 4 (the depot)"}
  - {id: purchase, booking_text: "Kauf IE00BEISPL01 Beispiel MSCI World UCITS ETF", expect: security_purchase, pending: "phase 6 step 4 (the depot)"}
  - {id: sale, booking_text: "Verkauf LU0BEISPIEL3 Beispiel Euro Bond UCITS ETF", expect: security_sale, pending: "phase 6 step 4 (the depot)"}
  - {id: distribution, booking_text: "Ausschüttung IE00BEISPL02", expect: distribution, pending: "phase 6 step 4 (the depot)"}
  - {id: dividend, booking_text: "Dividende IE00BEISPL02", expect: distribution, pending: "phase 6 step 4 (the depot)"}
  - {id: advance_lump_sum, booking_text: "Vorabpauschale 2025", expect: capital_income_tax, pending: "phase 6 step 4 (the depot)"}
  - {id: tax_on_a_distribution, booking_text: "Steuer auf Ausschüttung IE00BEISPL02", expect: capital_income_tax, pending: "phase 6 step 4 (the depot)"}
  - {id: kapst, booking_text: "KapSt Verkauf LU0BEISPIEL3", expect: capital_income_tax, pending: "phase 6 step 4 (the depot)"}
  - {id: soli, booking_text: "Solidaritätszuschlag", expect: capital_income_tax, pending: "phase 6 step 4 (the depot)"}
  - {id: tax_refund, booking_text: "Steuererstattung", expect: capital_income_tax, pending: "phase 6 step 4 (the depot)"}
  - {id: management_fee, booking_text: "Verwaltergebühr 05/2026", expect: depot_fee, pending: "phase 6 step 4 (the depot)"}
  - {id: fee, booking_text: "Gebühr Depotübertrag", expect: depot_fee, pending: "phase 6 step 4 (the depot)"}
  - {id: unknown_text, booking_text: "Zinsen Verrechnungskonto", expect: uncategorized, pending: "phase 6 step 4 (the depot)"}
  - {id: word_only_starts_with_kauf, booking_text: "Kaufpreisrückerstattung", expect: uncategorized, pending: "phase 6 step 4 (the depot)"}
