    lines:
      - {name: "EPRIMO GMBH"}
      - {name: "EPRIMO GMBH FLUGHAFENSTRASE 20"}
    shared: false
  - id: dkb_clearing_iban
    lines:
      - {name: "Lieferando"}
      - {name: "KAUFLAND"}
      - {name: "ROSSMANN"}
    shared: true
  - id: paypal_iban_two_merchants
    lines:
      - {name: "PAYPAL EUROPE S A R L ET CIE S C A", purpose: ", Ihr Einkauf bei DisneyPlus, "}
      - {name: "PAYPAL EUROPE S A R L ET CIE S C A - BOULEVARD ROYAL", purpose: ", Ihr Einkauf bei DisneyPlus, "}
      - {name: "PAYPAL EUROPE S A R L ET CIE S C A", purpose: ", Ihr Einkauf bei MicrosoftPay, "}
    shared: true
  - id: paypal_iban_one_merchant_two_spellings
    lines:
      - {name: "PayPal Europe S.a.r.l. et Cie S.C.A", purpose: ", Ihr Einkauf bei DisneyPlus, "}
      - {name: "PayPal Europe S.a.r.l. et Cie S.C.A 22-24 Boulevard Royal", purpose: ", Ihr Einkauf bei DisneyPlus, "}
