# Rule fixture: when two private lines have one payee (hausbuch.rules.matching.payee,
# same_payee, shared_iban)
#
# docs/phases/phase-6.md D160 amended (4), 14 Nov 2026 (Luis: „There are some repeated disney
# plus from PayPal …“; „Please check for all these repetitions“, after eprimo's two spellings on
# one IBAN had made it a shared IBAN). The payee is decided by code, not by a pattern:
#   1. the name cut before a per-purchase token (merchant_pattern.yaml, steps 1-1c);
#   2. its words: upper-case, Ä/Ö/Ü/ß written out (OE, SS), accents dropped, every other
#      character that is not a letter (digits, '-', '*', '.', '/') a word break;
#   3. a card processor's own short name first (SPC, UZR, SQ, SUMUP, ZETTLE) is dropped: the
#      payee is what follows;
#   4. a payment service (PayPal, Klarna) carries many merchants: its line's payee is the
#      merchant, read from the card form "… PAYPAL *<MERCHANT> …", the debit card form
#      "<Merchant> - PayPal", or a direct debit's purpose after „Ihr Einkauf bei“ (PayPal) or
#      "Purchase at" (Klarna); a service line whose merchant is not read has no payee;
#   5. one payee, both ways: either line's words start the other's (one generic word alone,
#      "HOTEL", is no payee); or the first two words are the same (not with a linking second
#      word, "HOTEL AT …", nor fewer than 5 letters in the two, "G A …"); or the first word is,
#      when it has 5 letters or more and is not a generic first word (DEUTSCHE, HOTEL, CAFE,
#      GRUPO, HAUS, PRAXIS, SHOP, CITY, PARKPLATZ, BAHNHOF and the like).
# An IBAN is shared when its lines hold two payees that are not one payee (shared_iban).
#
# `same: null` is a pair the rules may read either way (two booking.com hotels; Amazon's two
# companies); the case records what the code does today in `today`.
# Well-known merchant brands as they print on statements; no private person, IBAN or amount.

same:
  - id: eprimo_street_appended
    note: one IBAN; the street must not make it a shared IBAN
    a: {name: "EPRIMO GMBH"}
    b: {name: "EPRIMO GMBH FLUGHAFENSTRASE 20"}
    same: true
  - id: insurer_abbreviated
    a: {name: "VOLKSWAGEN AUTOVERSICHERUNG AG"}
    b: {name: "VOLKSWAGEN AUTOVERS AG"}
    same: true
  - id: telecom_same_name
    note: the same name on two IBANs
    a: {name: "TELEFONICA GERMANY GMBH + CO OHG"}
    b: {name: "TELEFONICA GERMANY GMBH + CO OHG"}
    same: true
  - id: savings_bank_same_name
    a: {name: "STADTSPARKASSE DUESSELDORF"}
    b: {name: "STADTSPARKASSE DUESSELDORF"}
    same: true
  - id: drugstore_city_appended
