    b: {name: "PAYPAL EUROPE S A R L ET CIE S C A", purpose: "Ihr Einkauf bei DisneyPlus Gläubiger-ID: LU96ZZZ0000000000000000058"}
    same: true
  - id: paypal_card_and_direct_debit
