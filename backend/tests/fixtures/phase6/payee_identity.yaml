  - id: paypal_long_and_short_name
    a: {name: "PAYPAL EUROPE S A R L ET CIE S C A", purpose: "1041234567890 PP.1234.PP . DisneyPlus, Ihr Einkauf bei DisneyPlus"}
    b: {name: "PAYPAL EUROPE S A R L ET CIE S C A - BOULEVARD ROYAL", purpose: "1041234567891 PP.1234.PP . DisneyPlus, Ihr Einkauf bei DisneyPlus"}
    same: true
  - id: paypal_third_iban_spelling
