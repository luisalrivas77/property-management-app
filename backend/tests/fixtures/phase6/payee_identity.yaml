# What the panel shows for a payment service's line, and the rule a line learns.
payees:
  - id: paypal_direct_debit
    name: "PayPal Europe S.a.r.l. et Cie S.C.A"
    purpose: "1041234567890 PP.1234.PP . DisneyPlus, Ihr Einkauf bei DisneyPlus"
    label: "PayPal: DisneyPlus"
    name_pattern: '^PAYPAL\b'
    purpose_pattern: 'Ihr Einkauf bei DisneyPlus(?!\w)'
  - id: paypal_direct_debit_creditor_id
    name: "PayPal Europe S.a.r.l. et Cie S.C.A 22-24 Boulevard Royal"
    purpose: "Ihr Einkauf bei DisneyPlus Gläubiger-ID: LU96ZZZ0000000000000000058"
    label: "PayPal: DisneyPlus"
    name_pattern: '^PAYPAL\b'
    purpose_pattern: 'Ihr Einkauf bei DisneyPlus(?!\w)'
  - id: paypal_card
    name: "4029357733 PAYPAL *DISNEYPLUS 35314369001 LU"
    label: "PayPal: DISNEYPLUS"
    name_pattern: '^PAYPAL \*DISNEYPLUS'
  - id: paypal_debit_card
    name: "DisneyPlus - PayPal"
    label: "PayPal: DisneyPlus"
    name_pattern: '^DISNEYPLUS \- PAYPAL'
  - id: klarna_direct_debit
    name: "Klarna Bank AB"
    purpose: "Purchase at H&M Gläubiger-ID: SE00ZZZ0000000000000000001"
    label: "Klarna: H&M"
    name_pattern: '^KLARNA\b'
    purpose_pattern: 'Purchase at H\&M(?!\w)'
  - id: paypal_merchant_not_read
    name: "PayPal Europe S.a.r.l. et Cie S.C.A"
    purpose: "1041234567893 PP.1234.PP"
    label: null
    unreadable: true
  - id: plain_name
    name: "EPRIMO GMBH FLUGHAFENSTRASE 20"
    label: null
    name_pattern: '^EPRIMO GMBH FLUGHAFENSTRASE'
  - id: reference_code_dropped
    name: "K7B2QXNE ANTHROPIC 548 Market Street PMB 1234"
    label: null
    name_pattern: '^ANTHROPIC MARKET STREET PMB'
    words: [ANTHROPIC, MARKET, STREET, PMB]
  - id: reference_code_then_processor
    name: "4f1c09ad SQ *ATARIGUA, S.L. Carrer Marina 100"
    label: null
    name_pattern: '^SQ \*ATARIGUA, S L CARRER MARINA'
    words: [ATARIGUA, S, L, CARRER, MARINA]
  - id: reference_code_then_domain
    name: "R0555123 curiara.com Avenue Louise 10"
    label: null
    name_pattern: '^CURIARA COM AVENUE LOUISE'
    words: [CURIARA, AVENUE, LOUISE]
  - id: web_address_pattern_unchanged
    # merchant_pattern.yaml's pattern stays; only the payee's words drop WWW and COM
    name: "WWW.DAZN.COM Huidekoperstraat 10"
    label: null
    name_pattern: '^WWW DAZN COM HUIDEKOPERSTRAAT'
    words: [DAZN, HUIDEKOPERSTRAAT]
  - id: processor_dropped_for_the_payee_not_the_pattern
    name: "SPC*CAMPUS HAIR"
    label: null
    name_pattern: '^SPC\*CAMPUS HAIR'
  - id: google_merchant_cut
    # review F1: the merchant after the star, the help page's address dropped
    name: "GOOGLE *Netflix g.co/helppay#"
    label: "Google: Netflix"
    name_pattern: '^GOOGLE \*NETFLIX'
    words: [NETFLIX]
  - id: google_without_merchant
    # review F1: Google's company name names no merchant, so no payee and no rule
    name: "Google Payment Ie Ltd"
    purpose: "GOOGLE PLAY 4711-0815-2233"
    label: null
    unreadable: true

# How surely two names are one payee (review F2, step 6 above): a rule that hits a line only
# through a WEAK identity proposes it with „Gleicher Empfänger wie „…“? Bitte bestätigen.“
strengths:
  - id: two_shops_one_first_word
    a: {name: "ADLER MODEMARKT"}
    b: {name: "ADLER APOTHEKE"}
    strength: weak
  - id: one_word_prefix
    a: {name: "ALDI"}
    b: {name: "ALDI TALK"}
    strength: weak
  - id: insurer_abbreviated_weak_but_one_payee
    note: still one payee for same_payee (same/insurer_abbreviated), but a rule only proposes
    a: {name: "VOLKSWAGEN AUTOVERSICHERUNG AG"}
    b: {name: "VOLKSWAGEN AUTOVERS AG"}
    strength: weak
  - id: delivery_city_appended_one_word  # a long one-word brand (BRAND_WORD_MIN), Luis 14 Nov 2026
    a: {name: "LIEFERANDO"}
    b: {name: "LIEFERANDO DE BERLIN"}
    strength: strong
  - id: supermarket_branch_appended
    a: {name: "KAUFLAND"}
    b: {name: "KAUFLAND DUESSELDORF HAUPTSTR"}
    strength: strong
  - id: short_brand_another_company
    a: {name: "MUELLER"}
    b: {name: "MUELLER BROT GMBH"}
    strength: weak
  - id: discounter_two_branches
    a: {name: "NETTO MARKEN-DISCOUNT CARL-EULER STR"}
    b: {name: "NETTO MARKEN-DISCOUNT ZOLLAMTSTR"}
    strength: strong
  - id: two_hotels_charged_by_booking
    a: {name: "Hotel at Booking.com Kanaalstraat 12"}
    b: {name: "Hotel at Booking.com Parkweg 7"}
    strength: strong
  - id: street_appended_two_words
    a: {name: "EPRIMO GMBH"}
    b: {name: "EPRIMO GMBH FLUGHAFENSTRASE 20"}
    strength: strong
  - id: google_merchant_two_spellings
    a: {name: "GOOGLE *Netflix g.co/helppay#"}
    b: {name: "GOOGLE*Netflix"}
    strength: strong
  - id: paypal_merchant_two_spellings
    a: {name: "PayPal Europe S.a.r.l. et Cie S.C.A", purpose: ", Ihr Einkauf bei DisneyPlus, "}
    b: {name: "4029357733 PAYPAL *DISNEYPLUS 35314369001 LU"}
    strength: strong

# Whether an IBAN hash is shared (two payees that are not one payee on its private lines).
shared_ibans:
