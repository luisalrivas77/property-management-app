# Rule fixture: internal transfers between the household's own accounts
# (hausbuch.rules.matching.match_transfer, hausbuch.services.transfers.relink)
#
# docs/phases/phase-6.md D162, §6, §14 (§6's cases). A leg is a line or an asset movement of one
# own account; open_legs are the other own accounts' unlinked legs (MatchContext.open_legs);
# today is the day the matcher runs (the card waits until the window has passed).
#
#   by IBAN      the counterparty IBAN is another own account's (MatchContext.own_account_hmacs:
#                every account with an IBAN except the line's own) → a transfer by IBAN alone,
#                confidence 1.0: internal_transfer_out|in on a private account,
#                owner_transfer_out|in on the rental one (phase 2 unchanged). The candidates are
#                that account's legs.
#   by type      a depot cash line categorised by its booking text (Einlage, D165 (1)) or an
#                exchange's EUR Deposit/Withdrawal row (D166) is a transfer by its type
#                (booked_as); the candidates are every other own account's legs.
#   the link     candidates: opposite sign, out booked on or before in, in within 3 banking days
#                of out; amount equal to the cent, or (one side an exchange) the in-leg equal to
#                the out-leg less at most the recorded fee. One → transfer_link written
#                (matched_by matcher), kind bank | exchange_eur | depot_cash by the accounts'
#                kinds; several → transfer.ambiguous with the candidates (the allocation is still
#                booked); none → booked, no card until the window has passed, then
#                transfer.unmatched_leg.
#   no own IBAN  a leg whose counterparty is not an own IBAN, but whose amount and date fit one
#                exchange or depot EUR movement exactly → proposed_link for review, never
#                written; the line's category is left to the later stages (category null).
#   relink       services.transfers.relink(account_id) after an import runs the same rule over
#                confirmed and proposed legs, so a mirror of a line the rental account
#                confirmed months ago is linked when the private history arrives.
# Recomputed on load (tests/fixture_models_phase6.py TransfersFixture). Pending phase 6 step 2.
#
# Accounts are invented; HMACs are placeholders of 64 hex characters.
#
# Step 0 readings (listed in the step 0 report):
# - "3 banking days": Monday to Friday, no holiday calendar; the dates here avoid holidays.
#   The window runs from the out-leg's booking day; "past the window" is today later than its
#   third banking day.
# - "bank → exchange EUR with a 0.99 fee → link within fee" and "fit an exchange movement
#   exactly → proposed for review" read together: the exchange account has no IBAN (D156),
#   so the bank line to the exchange's bank is no transfer by IBAN; the link within the fee is
#   made from the exchange's EUR Deposit row, a transfer by its type, and the bank line alone
#   only proposes a link when an exchange or depot movement fits it to the cent.
# - The fee tolerance applies only when one side is an exchange (D162 names bank ↔ exchange);
#   a depot Einlage is equal to the cent.
# - A by-IBAN leg's candidates are the legs of the account that IBAN names; a by-type leg's are
#   every other own account's.

accounts:
  rental: {id: 00000ac6-0000-4000-8000-000000000001, kind: bank_current, purpose: rental,
           iban_hmac: "a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1"}
  owner_a: {id: 00000ac6-0000-4000-8000-000000000002, kind: bank_current, purpose: private,
            iban_hmac: "a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2"}
  joint: {id: 00000ac6-0000-4000-8000-000000000003, kind: bank_current, purpose: private,
          iban_hmac: "a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3"}
  savings: {id: 00000ac6-0000-4000-8000-000000000004, kind: bank_savings, purpose: private,
            iban_hmac: "a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4"}
  exchange: {id: 00000ac6-0000-4000-8000-000000000005, kind: exchange, purpose: private}
  depot: {id: 00000ac6-0000-4000-8000-000000000006, kind: depot, purpose: private}

bases:
