    leg: {id: 00000e60-0000-4000-8000-000000000101, account: owner_a, booked_on: 2026-03-03,
          amount: "-500.00", counterparty_iban_hmac: *H_S}
    open_legs:
      - {id: 00000e60-0000-4000-8000-000000000102, account: savings, booked_on: 2026-03-04,
         amount: "500.00", counterparty_iban_hmac: "a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2"}
    today: 2026-03-05
