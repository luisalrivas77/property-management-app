# Rule fixture: the depot's four readers (hausbuch.rules.extraction_parse.parse_lines for the
# kinds trade_confirmation, distribution_note, depot_report, securities_transfer) and what code
# proposes from them
#
# docs/phases/phase-6.md D165 (2), (3), §7, §14. The lines follow phase 2's parse contract
# unchanged (tests/fixtures/phase2/extraction_parse.yaml's header: values normalised by their
# kind, cited, value_in_quote, validates, confidence by the checks).
#
# The layouts were invented from the secondary source of §3 in step 0 and corrected in step 4
# against quirion's real Postbox documents (read on Luis's computer, never committed). The
# quotes follow the real layouts as the PDF's text layer gives them: a value stands before its
# label („12,3457 STNominal / Stück“, „700000001Referenz-Nr“). Every name, ISIN (pattern only,
# no check digit), reference, number, amount and date below is invented.
#
# proposes (code, step 4), recomputed on load from the case's expected values:
#   trade_confirmation  one asset_movement: kind acquisition (Kauf) or disposal (Verkauf),
#                       quantity ± units, eur_amount ∓ the net amount (the cash line's amount),
#                       fee_eur the fees, tax_withheld_eur the taxes, occurred_at the trade
#                       date, external_ref the Referenz-Nr; checked: a buy's net = gross + fees
#                       + taxes, a sale's net = gross − fees − taxes.
#   distribution_note   one asset_movement of kind distribution: quantity 0, eur_amount the
#                       euro gross, tax_withheld_eur the euro gross − the euro net (so the
#                       movement's net is the cash line's amount to the cent), occurred_at the
#                       payment date; checked in the note's currency: gross = units × per unit
#                       rounded to the cent, net = gross − both taxes; in euro: net = gross −
#                       taxes within one cent per tax line (the bank converts each line).
#   depot_report        one holding_statement per position (as_of the report date, the units
#                       and the value), and the trades of the Umsätze list (the references
#                       holdings_reconcile.yaml names when a confirmation is missing).
#   securities_transfer one asset_movement per position: internal_transfer_in (Einbuchung) or
#                       internal_transfer_out (Ausbuchung), quantity ± units, no euro amount,
#                       occurred_at the transfer date, external_ref the Referenz-Nr shared by
#                       both sides (the pair is linked by it, never a disposal).
#
# `pending` marks the proposals (step 4); `parse_pending` marks a parse that needs step 4's
# scrub (scrub_depot, D168).
#
# Step 4 corrections (§14.1):
# - A Wertpapierabrechnung's side stands in its heading, its reference is the Referenz-Nr, the
#   trade date is „Handelstag / Zeit“, the Valuta and the cash account sit in one sentence, and
#   the fees are four lines (Bank-Provision, Courtage, Spesen, Gebühren). Its second page holds
#   the taxes; on a sale the Ausmachender Betrag is after them, so the reader asks `taxes` and
#   the sale's check is net = gross − fees − taxes.
# - An Erträgnisabrechnung of a fund in USD states Betrag, the taxes and the Ausmachender
#   Betrag in USD, the Devisenkurs, and the euro amount credited; its tax section gives the
#   euro gross (Ausschüttungsbetrag) and the euro taxes. The euro net differs from the euro
#   gross − taxes by a cent through the conversion, and the per-unit amount has four decimals
#   (a decimal, no longer money). No Quellensteuer line was printed.
# - The report's Umsätze list prints the Ausmachender Betrag signed (a purchase negative) and
#   runs from the mandate's start, so a later report repeats earlier trades: code keys them by
#   reference.
# - Units moved between two own depots arrive as an Einbuchung on one and an Ausbuchung on the
#   other, both with one Referenz-Nr and no price: the reader securities_transfer (new in step
#   4). Without it the report's positions do not reconcile from the trades alone.

