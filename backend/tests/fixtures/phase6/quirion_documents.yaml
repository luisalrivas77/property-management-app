  - id: depot_report_three_positions_two_trades
    pending: "phase 6 step 4 (the depot readers' proposals)"
    kind: depot_report
    blocks:
      - {text: "report_date: "}
      - text: "30.06.2026"
        citations: [{cited_text: "Vermögensübersicht zum 30.06.2026", start_page_number: 1, end_page_number: 2}]
      - {text: "\npositions: "}
      - text: "IE00BEISPL01 | Beispiel MSCI World UCITS ETF | 32,345678 | 82,10 | 2.655,58 | EUR; IE00BEISPL02 | Beispiel Global Dividend UCITS ETF | 20,000000 | 40,00 | 800,00 | EUR; LU0BEISPIEL3 | Beispiel Euro Bond UCITS ETF | 7,000000 | 91,00 | 637,00 | EUR"
