# Rule fixture: the depot's three readers (hausbuch.rules.extraction_parse.parse_lines for the
# kinds trade_confirmation, distribution_note, depot_report) and what code proposes from them
#
# docs/phases/phase-6.md D165 (2), (3), §7, §14. The lines follow phase 2's parse contract
# unchanged (tests/fixtures/phase2/extraction_parse.yaml's header: values normalised by their
# kind, cited, value_in_quote, validates, confidence by the checks). The layouts are invented
# from the secondary source of §3 and are corrected in step 4 against the anonymised real PDFs
# (a layout difference is a spec amendment, as phase 2 §12.1 did for the camt).
#
# proposes (code, step 4), recomputed on load from the case's expected values:
#   trade_confirmation  one asset_movement: kind acquisition (Kauf) or disposal (Verkauf),
#                       quantity ± units, eur_amount ∓ the net amount, fee_eur the fees,
#                       occurred_at the trade date; checked: a buy's net = gross + fees, a
#                       sell's net = gross − fees.
#   distribution_note   one asset_movement of kind distribution: quantity 0, eur_amount the
#                       gross, tax_withheld_eur the withholding plus the German taxes,
#                       occurred_at the payment date; checked: net = gross − both taxes.
#   depot_report        one holding_statement per position (as_of the report date, the units
#                       and the value), and the trades of the Umsätze list (the references
#                       holdings_reconcile.yaml names when a confirmation is missing).
#
# Invented security names, ISINs (pattern only, no check digit), references and amounts.
#
# Each case's lines run through today's parse_lines in step 0
# (tests/rules/test_extraction_parse_phase6.py) and pass: the three kinds were registered in
# step 0. `pending` marks only the proposals (step 4); `parse_pending` marks a parse that
# needs step 4 (the scrub runs as scrubber(kind) in jobs/document_read, as for phase 4b).
#
# Step 0 readings (listed in the step 0 report):
# - A distribution's eur_amount is the gross and tax_withheld_eur both taxes ("the gross and
#   the tax split kept on the row", D165 (2)); quantity 0 (the units do not change); the cash
#   line it links to carries the net.
# - The report's list items are written `a | b | c` (DEPOT_POSITIONS_MEANING); a PDF quote
#   never holds the " | " form, so value_in_quote fails for them and the confidence is medium,
#   as phase 2's rule says for a text_list item not found in its quote.
# - The scrub of a depot number keeps the label and replaces the number by „…“, as
#   scrub_identifiers does for the other identifiers; pending step 4 (the depot kinds join
#   SCRUBBED_KINDS there).

cases:
  - id: trade_confirmation_buy
    pending: "phase 6 step 4 (the depot readers' proposals)"
    kind: trade_confirmation
    blocks:
      - {text: "isin: "}
      - text: "IE00BEISPL01"
        citations: [{cited_text: "ISIN IE00BEISPL01 Beispiel MSCI World UCITS ETF", start_page_number: 1, end_page_number: 2}]
      - {text: "\nsecurity_name: "}
      - text: "Beispiel MSCI World UCITS ETF"
        citations: [{cited_text: "ISIN IE00BEISPL01 Beispiel MSCI World UCITS ETF", start_page_number: 1, end_page_number: 2}]
      - {text: "\ntrade_date: "}
      - text: "14.05.2026"
        citations: [{cited_text: "Handelstag 14.05.2026 Handelszeit 09:04", start_page_number: 1, end_page_number: 2}]
      - {text: "\nsettlement_date: "}
      - text: "18.05.2026"
        citations: [{cited_text: "Valuta 18.05.2026", start_page_number: 1, end_page_number: 2}]
      - {text: "\nside: "}
      - text: "Kauf"
        citations: [{cited_text: "Wertpapierabrechnung Kauf", start_page_number: 1, end_page_number: 2}]
      - {text: "\nunits: "}
      - text: "12,345678"
        citations: [{cited_text: "Stück 12,345678", start_page_number: 1, end_page_number: 2}]
      - {text: "\nprice_per_unit: "}
      - text: "81,00 EUR"
        citations: [{cited_text: "Kurs 81,00 EUR", start_page_number: 1, end_page_number: 2}]
      - {text: "\ngross_amount: "}
      - text: "1.000,00 EUR"
        citations: [{cited_text: "Kurswert 1.000,00 EUR", start_page_number: 1, end_page_number: 2}]
      - {text: "\nfees: "}
      - text: "0,00 EUR"
        citations: [{cited_text: "Provision 0,00 EUR", start_page_number: 1, end_page_number: 2}]
      - {text: "\nnet_amount: "}
      - text: "1.000,00 EUR"
        citations: [{cited_text: "Ausmachender Betrag 1.000,00 EUR zu Lasten", start_page_number: 1, end_page_number: 2}]
      - {text: "\ncurrency: "}
      - text: "EUR"
        citations: [{cited_text: "Ausmachender Betrag 1.000,00 EUR zu Lasten", start_page_number: 1, end_page_number: 2}]
      - {text: "\norder_reference: "}
      - text: "A26-0514-0001"
        citations: [{cited_text: "Auftragsnummer A26-0514-0001", start_page_number: 1, end_page_number: 2}]
    expect:
      isin: {value: IE00BEISPL01, source: {page: 1, quote: "ISIN IE00BEISPL01 Beispiel MSCI World UCITS ETF"}, checks: [cited, value_in_quote, validates], confidence: high}
      security_name: {value: Beispiel MSCI World UCITS ETF, source: {page: 1, quote: "ISIN IE00BEISPL01 Beispiel MSCI World UCITS ETF"}, checks: [cited, value_in_quote, validates], confidence: high}
      trade_date: {value: "2026-05-14", source: {page: 1, quote: "Handelstag 14.05.2026 Handelszeit 09:04"}, checks: [cited, value_in_quote, validates], confidence: high}
      settlement_date: {value: "2026-05-18", source: {page: 1, quote: "Valuta 18.05.2026"}, checks: [cited, value_in_quote, validates], confidence: high}
      side: {value: Kauf, source: {page: 1, quote: "Wertpapierabrechnung Kauf"}, checks: [cited, value_in_quote, validates], confidence: high}
      units: {value: "12.345678", source: {page: 1, quote: "Stück 12,345678"}, checks: [cited, value_in_quote, validates], confidence: high}
      price_per_unit: {value: "81.00", source: {page: 1, quote: "Kurs 81,00 EUR"}, checks: [cited, value_in_quote, validates], confidence: high}
      gross_amount: {value: "1000.00", source: {page: 1, quote: "Kurswert 1.000,00 EUR"}, checks: [cited, value_in_quote, validates], confidence: high}
      fees: {value: "0.00", source: {page: 1, quote: "Provision 0,00 EUR"}, checks: [cited, value_in_quote, validates], confidence: high}
      net_amount: {value: "1000.00", source: {page: 1, quote: "Ausmachender Betrag 1.000,00 EUR zu Lasten"}, checks: [cited, value_in_quote, validates], confidence: high}
      currency: {value: EUR, source: {page: 1, quote: "Ausmachender Betrag 1.000,00 EUR zu Lasten"}, checks: [cited, value_in_quote, validates], confidence: high}
      order_reference: {value: A26-0514-0001, source: {page: 1, quote: "Auftragsnummer A26-0514-0001"}, checks: [cited, value_in_quote, validates], confidence: high}
    proposes:
      movements:
        - {kind: acquisition, isin: IE00BEISPL01, quantity: "12.345678", eur_amount: "-1000.00", fee_eur: "0.00", occurred_on: 2026-05-14, external_ref: A26-0514-0001}

