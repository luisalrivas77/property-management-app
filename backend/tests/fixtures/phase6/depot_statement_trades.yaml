# Rule fixture: a depot trade read from its cash statement line, without a model
# (hausbuch.rules.depot.statement_trade, statement_window, statement_booked;
# docs/phases/phase-6.md D292 (1), (2)).
#
# A depot's monthly cash statement prints, under each „Wertpapier Kauf“ and „Wertpapier
# Verkauf“ headline, the fund's ISIN and the units („IE00BEISPL02, ST 4,8000“; a sale's units
# negative), and a sale's withheld tax („KEST: EUR -4,74“). services.bank.depot_pdf stores them
# on the line as raw.isin, raw.units (a decimal string) and raw.tax_withheld (positive). For a
# provider that issues no trade confirmation (a savings-plan purchase, a rebalancing trade) the
# line is the only record of the trade, so the line itself becomes the trade's movement.
#
# lines: statement_trade(category, amount, raw) -> {kind, isin, units, tax_withheld} or null.
# Null means unreadable: the line is never guessed and gets the card „Kauf ohne Stückzahl“.
# The amount is the line's signed cash (D166: a purchase negative, a sale positive); units
# whose sign contradicts it are unreadable too.
#
# windows: statement_window(trade_on, line_on): the cash line is booked on its value date,
# on the trade day or up to 10 days after it (rules.depot.STATEMENT_TRADE_DAYS).
#
# report_trades: statement_booked(trade, booked): a quarterly report's trade (ISIN, trade day,
# signed units) is booked already when a current statement movement has the same ISIN and
# units and a value date inside the window; the report never books it a second time.
#
# transit: rules.net_worth.in_transit(paid_on, opened_on, through, receiver_history, linked)
# (D292 (3)): money sent from an own account to an own depot (or any own account) whose
# statements reach only up to before the payment counts as „unterwegs zu <Konto>“ on that
# account. paid_on is the debit's day; opened_on and through the sending account's anchor day
# and the last day its balance counts on the net worth's day; receiver_history the day the
# receiving account's imported history reaches (null: none). It counts while the sender's
# balance holds the debit and the receiver's history ends before the payment's day, and drops
# once a statement of the receiver reaches that day or the debit is linked to its credit.
#
# transit_to_card: rules.net_worth.transit_counted(amounts, card_balance) (D292 amended
# (a), 23 Nov 2026): the amounts in transit to one receiving account, in payment order,
# and what each counts. A credit card (card_balance its balance line, negative for a
# debt) takes them only until its balance plus them reaches 0, never more; any other
# receiver (card_balance null) takes them in full.
#
# twins: rules.depot.statement_twin(line_reference, line_on, other_reference, trade_on)
# (D292 amended (b)): whether a trade a confirmation or a report booked is a cash line's
# trade. The same reference when both have one (the day does not matter); when either
# has none, the line's value date on the trade day or up to 10 days after it.
#
# Every ISIN, reference and amount below is invented.

lines:
  - id: purchase
    category: security_purchase
    amount: "-500.00"
    raw: {isin: IE00BEISPL02, units: "4.8000"}
    expect: {kind: acquisition, isin: IE00BEISPL02, units: "4.8000"}
  - id: sale_with_tax
    category: security_sale
    amount: "1234.50"
    raw: {isin: IE00BEISPL01, units: "-15.2500", tax_withheld: "4.74"}
    expect: {kind: disposal, isin: IE00BEISPL01, units: "-15.2500", tax_withheld: "4.74"}
  - id: sale_without_tax
    category: security_sale
    amount: "80.10"
    raw: {isin: IE00BEISPL01, units: "-1.0000"}
    expect: {kind: disposal, isin: IE00BEISPL01, units: "-1.0000"}
  - id: no_units
    description: the detail line with ISIN and units was not on the page
    category: security_purchase
    amount: "-150.00"
    raw: {}
    expect: null
  - id: isin_without_units
    category: security_purchase
    amount: "-150.00"
    raw: {isin: IE00BEISPL02}
    expect: null
  - id: units_of_zero
    category: security_purchase
    amount: "-150.00"
    raw: {isin: IE00BEISPL02, units: "0"}
    expect: null
  - id: isin_of_another_form
    category: security_purchase
    amount: "-150.00"
    raw: {isin: BEISPIEL, units: "1.5000"}
    expect: null
  - id: purchase_with_negative_units
    description: the units' sign contradicts a purchase
    category: security_purchase
    amount: "-150.00"
    raw: {isin: IE00BEISPL02, units: "-1.5000"}
    expect: null
  - id: sale_debited
    description: a sale whose amount is a debit
    category: security_sale
    amount: "-150.00"
    raw: {isin: IE00BEISPL01, units: "-1.5000"}
    expect: null
  - id: negative_tax_dropped
    category: security_sale
    amount: "300.00"
    raw: {isin: IE00BEISPL01, units: "-3.0000", tax_withheld: "-1.00"}
    expect: {kind: disposal, isin: IE00BEISPL01, units: "-3.0000"}
  - id: fee_is_no_trade
    category: depot_fee
    amount: "-12.30"
    raw: {}
    expect: null

windows:
  - {id: same_day, trade_on: "2026-03-13", line_on: "2026-03-13", expect: true}
  - {id: two_bank_days_later, trade_on: "2026-03-13", line_on: "2026-03-17", expect: true}
  - {id: ten_days_later, trade_on: "2026-03-13", line_on: "2026-03-23", expect: true}
  - {id: eleven_days_later, trade_on: "2026-03-13", line_on: "2026-03-24", expect: false}
  - {id: line_before_the_trade, trade_on: "2026-03-13", line_on: "2026-03-12", expect: false}

report_trades:
  - id: same_trade
    trade: {isin: IE00BEISPL02, trade_date: "2026-03-13", units: "4.8000"}
    booked: [{isin: IE00BEISPL02, units: "4.8000", value_date: "2026-03-17"}]
    expect: true
  - id: other_units
    trade: {isin: IE00BEISPL02, trade_date: "2026-03-13", units: "4.8000"}
    booked: [{isin: IE00BEISPL02, units: "4.7000", value_date: "2026-03-17"}]
    expect: false
  - id: other_fund
    trade: {isin: IE00BEISPL02, trade_date: "2026-03-13", units: "4.8000"}
    booked: [{isin: IE00BEISPL01, units: "4.8000", value_date: "2026-03-17"}]
    expect: false
  - id: other_side
    trade: {isin: IE00BEISPL01, trade_date: "2026-03-12", units: "-15.2500"}
    booked: [{isin: IE00BEISPL01, units: "15.2500", value_date: "2026-03-16"}]
    expect: false
  - id: outside_the_window
    trade: {isin: IE00BEISPL02, trade_date: "2026-03-13", units: "4.8000"}
    booked: [{isin: IE00BEISPL02, units: "4.8000", value_date: "2026-04-17"}]
    expect: false
  - id: nothing_booked
    trade: {isin: IE00BEISPL02, trade_date: "2026-03-13", units: "4.8000"}
    booked: []
    expect: false

transit:
  - id: sent_after_the_depot_statement
    description: a monthly payment of 3 Nov, the depot's cash statement imported up to 30 Oct
    paid_on: "2026-11-03"
    opened_on: "2025-12-31"
    through: "2026-11-20"
    receiver_history: "2026-10-30"
    expect: true
  - id: statement_covers_the_day
    description: the November statement is imported; the depot's own figures count the money
    paid_on: "2026-11-03"
    opened_on: "2025-12-31"
    through: "2026-11-20"
    receiver_history: "2026-11-28"
    expect: false
  - id: history_ends_on_the_payment_day
    paid_on: "2026-11-03"
    opened_on: "2025-12-31"
    through: "2026-11-20"
    receiver_history: "2026-11-03"
    expect: false
  - id: linked_to_its_credit
    description: the depot's credit is booked (two days before the debit, D162) and linked
    paid_on: "2026-11-03"
    opened_on: "2025-12-31"
    through: "2026-11-20"
    receiver_history: "2026-11-01"
    linked: true
    expect: false
  - id: receiver_without_history
    paid_on: "2026-11-03"
    opened_on: "2025-12-31"
    through: "2026-11-20"
    receiver_history: null
    expect: false
  - id: sender_balance_not_yet_holding_it
    description: the sending account is reconciled only up to before the debit
    paid_on: "2026-11-03"
    opened_on: "2025-12-31"
    through: "2026-11-02"
    receiver_history: "2026-10-30"
    expect: false
  - id: debit_on_the_anchor_day
    description: the sending account's anchor balance already holds the debit
    paid_on: "2025-12-31"
    opened_on: "2025-12-31"
    through: "2026-11-20"
    receiver_history: "2025-12-01"
    expect: false

transit_to_card:
  - id: card_one_statement_behind
    description: >-
      the September statement closes at -300; 300 paid on 1 Oct and 250 on 30 Oct; the second
      payment paid charges of a statement not yet in the app
    card_balance: "-300.00"
    amounts: ["300.00", "250.00"]
    expect: ["300.00", "0.00"]
  - id: card_debt_paid_in_part
    card_balance: "-300.00"
    amounts: ["200.00", "250.00"]
    expect: ["200.00", "100.00"]
  - id: card_payment_within_the_debt
    card_balance: "-500.00"
    amounts: ["300.00"]
    expect: ["300.00"]
  - id: card_already_in_credit
    card_balance: "20.00"
    amounts: ["100.00"]
    expect: ["0.00"]
  - id: depot_takes_every_transfer
    description: a depot or a bank account is no debt; it receives every transfer in full
    card_balance: null
    amounts: ["300.00", "250.00"]
    expect: ["300.00", "250.00"]

twins:
  - id: same_reference_far_apart
    description: the references decide; the day does not matter
    line_reference: "5500000002"
    line_on: "2026-03-30"
    other_reference: "5500000002"
    trade_on: "2026-03-01"
    expect: true
  - id: other_reference_in_the_window
    description: a second purchase of the same fund, its own reference
    line_reference: "5500000002"
    line_on: "2026-03-17"
    other_reference: "7700000099"
    trade_on: "2026-03-13"
    expect: false
  - id: line_without_reference_in_the_window
    line_reference: null
    line_on: "2026-03-17"
    other_reference: "7700000099"
    trade_on: "2026-03-13"
    expect: true
  - id: neither_reference_in_the_window
    line_reference: null
    line_on: "2026-03-17"
    other_reference: null
    trade_on: "2026-03-13"
    expect: true
  - id: neither_reference_outside_the_window
    line_reference: null
    line_on: "2026-03-30"
    other_reference: null
    trade_on: "2026-03-13"
    expect: false
  - id: line_before_the_trade
    line_reference: "5500000002"
    line_on: "2026-03-12"
    other_reference: null
    trade_on: "2026-03-13"
    expect: false
