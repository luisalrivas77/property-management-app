          line: {booking_date: 2026-01-19, value_date: 2026-01-17, amount: "-45.10", counterparty_name: BEISPIEL MARKT 0815 Musterstadt, purpose: BEISPIEL MARKT 0815 Musterstadt, booking_text: Kauf, bank_reference: "1000000002"}
        - index: 2
