# Parser and import fixture: the credit card's monthly PDF statement (services.bank.card_pdf
# through services.bank.parse_statement and services.statements.import_statement;
# docs/phases/phase-6.md D176, §14.1 „The card statement“, Q-O77).
#
# The input is the statement's text layer, one string per page, as pypdf extracts it; the
# tests draw each physical line into a PDF (reportlab) and check pypdf gives the text back, so
# the bytes path is replayed too. The statements are INVENTED in the real layout (§14.1, checked
# against a real statement on Luis's computer, never committed): nothing here is from it.
#
# The layout the cases pin:
#   - page 1: the statement number „Nummer: <customer>-<account>-<yymmdd>-<yymmdd>“ (the
#     period's first and last day), „Zeitraum: dd.mm.yyyy - dd.mm.yyyy“, „Kundennummer: <n>“,
#     the summary under „Kontoauszug“ (Alter Saldo vom letzten Monat, Rückzahlungen, Einkauf,
#     Bargeldabhebungen & Quasi-Geld, Zinsen und sonstige Gebühren, Neuer Saldo; what is owed is
#     negative), the card row starting with the card number masked to its first six and last
#     four digits, and the issuer's IBAN under „Angaben bei Einzahlungen :“
#   - page 2: a column header, then one row per line: Bew.ID (ten digits), Buchung, Bew.Datum
#     (absent on the payment and on an interest line), the kind and, two spaces on, the
#     description, „Wechselkurs <rate>“, the original amount and currency, the EUR amount and
#     D (debit) or C (credit); a row wraps over up to three physical lines, anywhere (inside the
#     description, between „Wechselkurs“ and its rate, before the amounts); every purchase
#     prints a rate and an original amount, 1.00000 and EUR for a purchase in euros; the
#     interest row has no rate and no original amount. Under the rows the totals „Verwendeter
#     Gesamtbetrag“ (debits, negative) and „Bezahlter Gesamtbetrag“ (credits), then a footer.
#   - amounts: a space as thousands separator (the real file also has no-break spaces), a point
#     as decimal mark.
#
# Reading rules the cases pin (D176 (3), (4)):
#   - format card_pdf; no IBAN of the account (account_iban null): the customer number is the
#     account's reference (`account_ref`), stored as the account's external_ref, masked
#     („**** “ + its last four) and HMAC'd, never in clear; the statement number's first part
#     must be the same number
#   - of the card number only the last four digits (`card_last4`); the first six are never read
#     into anything
#   - opening and closing balance are Alter and Neuer Saldo; the file must agree with itself
#     (the summary's parts, the lines and the printed totals all lead from Alter to Neuer
#     Saldo), else statement.report_unbalanced: the file is stored, unreconciled as a whole,
#     and none of its lines is matched (phase 2 D34)
#   - each line: bank_reference = Bew.ID (D22's reference path, so a re-downloaded statement
#     adds nothing), booking_date = Buchung, value_date = Bew.Datum, booking_text = the kind
#     word, counterparty_name = the description (none on the payment „Bezahlung“, whose
#     description is the payment method, and none on an interest line), purpose = the
#     description (the interest text on an interest line), plus „ (<original amount>
#     <currency>, Kurs <rate>)“ for a purchase in another currency, whose original amount,
#     currency and rate are also kept in `raw`; a wrapped description is joined with one space
#   - the payment IBAN is returned as `payment_iban`; the import only proposes it, masked, and
#     the user confirms it (principle 3)
#   - an interest or fee line is booked by code to hh_interest_fees, confirmed without review
#
# Step 2b readings (listed in the step 2b report):
#   - a refund's kind word is „Gutschrift“ (the real statement holds none) and it carries the
#     merchant as its counterparty; the summary nets it inside „Einkauf“
#   - the first import onto a card account without a reference sets it from the file; a later
#     file naming another customer number is refused with statement.account_mismatch, as an
#     IBAN file of another account is (D164)
#   - `import.after` lists the cases imported onto the same account before this one, in order;
#     the account's anchor is `bases.account` (the first statement's Alter Saldo, a day before
#     its first booking)
#
# Invented names, numbers and amounts; the IBAN is a checksum-valid synthetic IBAN under the
# Bundesbank test BLZ 10000000, none under a real bank. Owner A stands for the card holder.

ids:
  account: 0000006c-0000-4000-8000-000000000001

bases:
  account:
    kind: credit_card
    provider: Beispielbank Kreditkarte
    opening_balance: "-1250.40"
    opening_balance_on: 2026-01-14

