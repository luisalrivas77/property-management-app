          Seite:2/2
          Kreditkartenkonto
          Bew.ID Buchung Bew.Datum Beschreibung Urspr. Betrag und
          Währung
          Wechsel.Kurs
          (EUR)
          D/
          C
          1000000001 16.01.2026 Bezahlung  Lastschrift Wechselkurs 1.00000 1 250.40 EUR 1 250.40 C
          1000000002 19.01.2026 17.01.2026 Kauf  BEISPIEL MARKT 0815 Musterstadt Wechselkurs
          1.00000
          45.10 EUR -45.10 D
