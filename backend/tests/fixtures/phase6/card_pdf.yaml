      lines:
        - index: 0
          description: the payment to the card, a credit without a merchant
          line: {booking_date: 2026-01-16, amount: "1250.40", purpose: Lastschrift, booking_text: Bezahlung, bank_reference: "1000000001"}
        - index: 1
