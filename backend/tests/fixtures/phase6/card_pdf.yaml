          Wechselkurs 1.00000
          89.90 EUR -89.90 D
          1000000004 09.02.2026 06.02.2026 Kauf  BUCHLADEN AM MARKT Wechselkurs 1.00000
          177.75 EUR -177.75 D
          Verwendeter Gesamtbetrag: -312.75
          Bezahlter Gesamtbetrag: 1 250.40
          Beispielbank AB, Musterweg 1, 10115 Berlin
    expect:
