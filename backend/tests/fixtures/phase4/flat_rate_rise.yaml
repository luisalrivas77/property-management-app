    Any fall is a to-do (§560 Abs. 3 BGB): the Hausgeld from 150.00 to 149.99, one room with
    the whole share, a fall of 0.01: „senken“.
  today: 2027-01-15
  facts:
    property: *property
    units: *units
    tenancies:
      - {id: *T1, unit_id: *Z1, start_date: 2026-07-01, operating_costs_terms: flat_rate,
         rents: [{effective_from: 2026-07-01, cold_rent: "400.00", operating_costs_prepayment: "120.00"}]}
    allocations:
      - {allocation_id: 0155a100-0000-4000-8000-000000000401, booking_date: 2026-07-01, amount: "-150.00", category: hausgeld_umlagefaehig, recurring: true}
      - {allocation_id: 0155a100-0000-4000-8000-000000000402, booking_date: 2027-01-01, amount: "-149.99", category: hausgeld_umlagefaehig, recurring: true}
  expect:
    property_id: *P
    as_of: 2027-01-15
    pauschalen_total: "120.00"
    tenancies:
      - tenancy_id: *T1
        unit_id: *Z1
        unit_label: Zimmer 1
        pauschale: "120.00"
        set_on: 2026-07-01
        set_by: start
        share_percent: "100.0"
        changes:
          - {category: hausgeld_umlagefaehig, then: "150.00", now: "149.99", change: "-0.01"}
          - *same_gs
          - *same_ins
          - *same_el
        flat_rise: "-0.01"
        rise: "-0.01"
        verdict: lower
