# flat_rate_rise.yaml: rules/performance/flat_rate.py, the Nebenkostenpauschale rise test
# (docs/phases/phase-4.md D155, §11 step 2c).
#
#   flat_rate_check(facts: DraftFacts, today: date) -> FlatRateCheck
#
# Synthetic numbers only (the repo is public). Loaded through tests/fixture_models_phase4.py:
# every figure is checked against the schemas, and each expectation's own arithmetic is checked
# on load (each rate from its sources, each change, each tenancy's share of the rise, the
# verdict, the earliest start), so a hand slip fails before a rule test runs. Every field
# compares exactly, sources included (principle 2).
#
# The rules, as written for this fixture (D155 (2)–(4); the interpretations are marked *):
# - A line's reference date is its service period's start when the period is one calendar
#   month*, else its booking date. A payment's rate is −Σ the allocations of the chosen line's
#   transaction in the category (one line unless a payment was split*).
# - hausgeld_umlagefaehig, electricity (monthly): the latest line with reference date on or
#   before the date, else the first one after it (from_later). When the category has at least
#   one `recurring` line, only recurring lines are rates and the others are settlements*
#   (D155: "a settlement is not a rate"; shown as hints, those of the 12 months up to today).
# - insurance: the latest line on or before the date, else the first after it; a yearly
#   premium (÷ 12, half-up) when no other insurance line lies within 6 months either side of
#   it* (D155: "one line in 12 months", read as a 12-month window centred on the line, so a
#   monthly premium's first payment, followed by a second, is not mistaken for a yearly one),
#   else the payment as a month's.
# - grundsteuer: the confirmed grundsteuer_schedule in force for the date's year (the latest
#   row with tax_year ≤ the year, as the reminders read it, so a Bescheid holds until a later
#   one replaces it: case grundsteuer_schedule_carried_forward) ÷ 12; else Σ the lines of the
#   12 months up to the date (reference date in (date − 12 months, date]) ÷ 12 when the first
#   line lies on or before date − 12 months, so that window is fully covered; else, the first
#   line lying on or before the date, Σ the lines of the 12 months from the first line ÷ 12
#   (one or two instalments of the first year never stand for a year: case
#   grundsteuer_first_year_of_lines); else*, nothing
#   being known on or before the date, the first schedule of a later year, else the first
#   12 months of lines after the date (from_later); else 0.00. (*D155 says "else 0"; with 0 a
#   Pauschale set before the first Grundsteuerbescheid would show the whole Grundsteuer as a
#   rise the moment the Bescheid is confirmed: case grundsteuer_known_later_no_rise.)
# - Per tenancy (flat_rate, in force today: start ≤ today and no end before today): its
#   Pauschale = the rent row in force today; set_on = the latest rent row (in force, from its
#   start through today) whose operating_costs_prepayment differs from the row before it,
#   else the tenancy's start. flat_rise = Σ BetrKV rates today − Σ BetrKV rates on set_on;
#   rise = flat_rise × Pauschale ÷ Σ Pauschalen of the flat_rate tenancies in force today,
#   half-up to the cent; share_percent the share × 100, one decimal (display only).
#   verdict raise when rise > 10.00, lower when rise ≤ −0.01, else none; earliest_start (raise
#   only) = the first day of the month after next from today (§560 Abs. 2 BGB); fell_on
#   (lower only) = the date the cost fell: of the BetrKV categories whose rate fell, the
#   earliest date from which today's rate applies (the first line of the unbroken run of lines
#   at today's rate, a schedule's 1 January)*.
#   Electricity's change is shown and never counts (§2 BetrKV does not list it).
# - A change already recorded: when a rent row dated after today (among the rows in force, so
#   not superseded) is the first to change the Pauschale in force today, recorded_from and
#   recorded_pauschale name it and the verdict is none (no to-do, letter or pre-fill), whatever
#   the rise; today's Pauschale stays in the shares until the row takes effect (case
#   change_already_recorded).

ids:
  property: &P 0155000b-0000-4000-8000-000000000001
  z1: &Z1 0155000c-0000-4000-8000-000000000001
  z2: &Z2 0155000c-0000-4000-8000-000000000002
  z3: &Z3 0155000c-0000-4000-8000-000000000003
  t1: &T1 0155000e-0000-4000-8000-000000000001
  t2: &T2 0155000e-0000-4000-8000-000000000002
  t3: &T3 0155000e-0000-4000-8000-000000000003
  bescheid: &DB 01550d0c-0000-4000-8000-000000000001
  schedule_2027: &S27 0155f100-0000-4000-8000-000000002027
  schedule_2028: &S28 0155f100-0000-4000-8000-000000002028

bases:
  property: &property {id: *P, label: Wohnung Beispielweg, kind: etw, build_year: 1998,
                       purchase_date: 2026-07-01, purchase_price: "300000.00"}
  units: &units
    - {id: *Z1, label: Zimmer 1, floor_area_m2: "18.00"}
    - {id: *Z2, label: Zimmer 2, floor_area_m2: "22.00"}
    - {id: *Z3, label: Zimmer 3, floor_area_m2: "12.00"}
  none_gs: &none_gs {category: grundsteuer, monthly: "0.00", basis: none, from_later: false, sources: []}
  none_ins: &none_ins {category: insurance, monthly: "0.00", basis: none, from_later: false, sources: []}
  none_el: &none_el {category: electricity, monthly: "0.00", basis: none, from_later: false, sources: []}
  same_gs: &same_gs {category: grundsteuer, then: "0.00", now: "0.00", change: "0.00"}
  same_ins: &same_ins {category: insurance, then: "0.00", now: "0.00", change: "0.00"}
  same_el: &same_el {category: electricity, then: "0.00", now: "0.00", change: "0.00"}
  schedule_2027: &schedule_2027
