        - {due_on: 2027-02-15, amount: "120.00"}
        - {due_on: 2027-05-15, amount: "120.00"}
        - {due_on: 2027-08-15, amount: "120.00"}
        - {due_on: 2027-11-15, amount: "120.00"}

