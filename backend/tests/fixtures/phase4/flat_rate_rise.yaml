    A new Wirtschaftsplan raises the Hausgeld's umlagefähig part from 150.00 to 195.00 from
    January; three rooms share the 45.00 by their Pauschalen 100 / 150 / 50 (of 300): 15.00
    and 22.50 are to-dos, 7.50 is not. The yearly insurance premium (240.00 ÷ 12 = 20.00) is
    unchanged; the Hausgeldabrechnung's back-payment of November is a hint, not a rate.
  today: 2027-02-10
  facts:
    property: *property
    units: *units
    tenancies:
      - {id: *T1, unit_id: *Z1, start_date: 2026-07-01, operating_costs_terms: flat_rate,
         rents: [{effective_from: 2026-07-01, cold_rent: "400.00", operating_costs_prepayment: "100.00"}]}
      - {id: *T2, unit_id: *Z2, start_date: 2026-07-01, operating_costs_terms: flat_rate,
         rents: [{effective_from: 2026-07-01, cold_rent: "450.00", operating_costs_prepayment: "150.00"}]}
      - {id: *T3, unit_id: *Z3, start_date: 2026-08-01, operating_costs_terms: flat_rate,
         rents: [{effective_from: 2026-08-01, cold_rent: "300.00", operating_costs_prepayment: "50.00"}]}
    allocations:
      - {allocation_id: 0155a100-0000-4000-8000-000000000101, booking_date: 2026-07-01, amount: "-150.00", category: hausgeld_umlagefaehig, recurring: true}
      - {allocation_id: 0155a100-0000-4000-8000-000000000107, booking_date: 2026-07-15, amount: "-240.00", category: insurance}
      - {allocation_id: 0155a100-0000-4000-8000-000000000102, booking_date: 2026-08-01, amount: "-150.00", category: hausgeld_umlagefaehig, recurring: true}
      - {allocation_id: 0155a100-0000-4000-8000-000000000104, booking_date: 2026-11-20, amount: "-310.00", category: hausgeld_umlagefaehig}
      - {allocation_id: 0155a100-0000-4000-8000-000000000103, booking_date: 2026-12-01, amount: "-150.00", category: hausgeld_umlagefaehig, recurring: true}
      - {allocation_id: 0155a100-0000-4000-8000-000000000105, booking_date: 2027-01-01, amount: "-195.00", category: hausgeld_umlagefaehig, recurring: true}
      - {allocation_id: 0155a100-0000-4000-8000-000000000106, booking_date: 2027-02-01, amount: "-195.00", category: hausgeld_umlagefaehig, recurring: true}
  expect:
    property_id: *P
    as_of: 2027-02-10
    pauschalen_total: "300.00"
    tenancies:
      - tenancy_id: *T1
        unit_id: *Z1
        unit_label: Zimmer 1
        pauschale: "100.00"
        set_on: 2026-07-01
        set_by: start
        share_percent: "33.3"
        changes: &changes_hausgeld_45
          - {category: hausgeld_umlagefaehig, then: "150.00", now: "195.00", change: "45.00"}
          - *same_gs
          - {category: insurance, then: "20.00", now: "20.00", change: "0.00"}
          - *same_el
        flat_rise: "45.00"
        rise: "15.00"
        verdict: raise
        earliest_start: 2027-04-01
      - tenancy_id: *T2
        unit_id: *Z2
        unit_label: Zimmer 2
        pauschale: "150.00"
        set_on: 2026-07-01
        set_by: start
        share_percent: "50.0"
        changes: *changes_hausgeld_45
        flat_rise: "45.00"
        rise: "22.50"
        verdict: raise
        earliest_start: 2027-04-01
      - tenancy_id: *T3
        unit_id: *Z3
        unit_label: Zimmer 3
        pauschale: "50.00"
        set_on: 2026-08-01
        set_by: start
        share_percent: "16.7"
        changes: *changes_hausgeld_45
        flat_rise: "45.00"
        rise: "7.50"
        verdict: none
    levels:
      - as_of: 2026-07-01
        rates:
          - {category: hausgeld_umlagefaehig, monthly: "150.00", basis: monthly_payment,
             sources: [{kind: allocation, id: 0155a100-0000-4000-8000-000000000101, amount: "-150.00"}]}
          - *none_gs
          - {category: insurance, monthly: "20.00", basis: yearly_premium, from_later: true,
             sources: [{kind: allocation, id: 0155a100-0000-4000-8000-000000000107, amount: "-240.00"}]}
          - *none_el
        betrkv: "170.00"
      - as_of: 2026-08-01
        rates:
          - {category: hausgeld_umlagefaehig, monthly: "150.00", basis: monthly_payment,
             sources: [{kind: allocation, id: 0155a100-0000-4000-8000-000000000102, amount: "-150.00"}]}
          - *none_gs
          - {category: insurance, monthly: "20.00", basis: yearly_premium,
             sources: [{kind: allocation, id: 0155a100-0000-4000-8000-000000000107, amount: "-240.00"}]}
          - *none_el
        betrkv: "170.00"
      - as_of: 2027-02-10
        rates:
          - {category: hausgeld_umlagefaehig, monthly: "195.00", basis: monthly_payment,
             sources: [{kind: allocation, id: 0155a100-0000-4000-8000-000000000106, amount: "-195.00"}]}
          - *none_gs
          - {category: insurance, monthly: "20.00", basis: yearly_premium,
             sources: [{kind: allocation, id: 0155a100-0000-4000-8000-000000000107, amount: "-240.00"}]}
