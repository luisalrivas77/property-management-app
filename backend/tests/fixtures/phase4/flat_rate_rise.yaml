  description: >
    The 10 € edge after the share: two rooms at 100.00 each, the Hausgeld from 150.00 to
    170.00, so each room's rise is 20.00 × ½ = 10.00, which is not above 10 €: no to-do.
  today: 2027-01-15
  facts:
    property: *property
    units: *units
    tenancies: &two_rooms
      - {id: *T1, unit_id: *Z1, start_date: 2026-07-01, operating_costs_terms: flat_rate,
         rents: [{effective_from: 2026-07-01, cold_rent: "400.00", operating_costs_prepayment: "100.00"}]}
      - {id: *T2, unit_id: *Z2, start_date: 2026-07-01, operating_costs_terms: flat_rate,
         rents: [{effective_from: 2026-07-01, cold_rent: "400.00", operating_costs_prepayment: "100.00"}]}
    allocations:
      - {allocation_id: 0155a100-0000-4000-8000-000000000201, booking_date: 2026-07-01, amount: "-150.00", category: hausgeld_umlagefaehig, recurring: true}
      - {allocation_id: 0155a100-0000-4000-8000-000000000202, booking_date: 2027-01-01, amount: "-170.00", category: hausgeld_umlagefaehig, recurring: true}
  expect:
    property_id: *P
    as_of: 2027-01-15
    pauschalen_total: "200.00"
    tenancies:
      - &edge_room_1
        tenancy_id: *T1
        unit_id: *Z1
        unit_label: Zimmer 1
        pauschale: "100.00"
        set_on: 2026-07-01
        set_by: start
        share_percent: "50.0"
        changes: &changes_hausgeld_20
          - {category: hausgeld_umlagefaehig, then: "150.00", now: "170.00", change: "20.00"}
          - *same_gs
          - *same_ins
          - *same_el
        flat_rise: "20.00"
        rise: "10.00"
        verdict: none
      - <<: *edge_room_1
        tenancy_id: *T2
        unit_id: *Z2
        unit_label: Zimmer 2
    levels:
      - as_of: 2026-07-01
        rates:
          - {category: hausgeld_umlagefaehig, monthly: "150.00", basis: monthly_payment,
             sources: [{kind: allocation, id: 0155a100-0000-4000-8000-000000000201, amount: "-150.00"}]}
          - *none_gs
          - *none_ins
          - *none_el
        betrkv: "150.00"
