- id: pauschale_changed_by_rent_row
  description: >
    The Pauschale was raised from 100.00 to 120.00 by a rent row from 1 October, after the
    Hausgeld had risen in September; a later row changes only the cold rent. The comparison
    starts on 1 October (165.00), not at the lease's start (150.00): the January rise to
    180.00 is 15.00, a to-do from 1 March.
  today: 2027-01-20
  facts:
    property: *property
    units: *units
    tenancies:
      - {id: *T1, unit_id: *Z1, start_date: 2026-07-01, operating_costs_terms: flat_rate,
         rents: [{effective_from: 2026-07-01, cold_rent: "400.00", operating_costs_prepayment: "100.00"},
                 {effective_from: 2026-10-01, cold_rent: "400.00", operating_costs_prepayment: "120.00"},
                 {effective_from: 2026-12-01, cold_rent: "420.00", operating_costs_prepayment: "120.00"}]}
