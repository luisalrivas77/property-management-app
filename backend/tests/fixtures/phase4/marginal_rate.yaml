# --- Phase 4b amendment (docs/phases/phase-4b.md §5.9, D98), written in phase 4b step 0 ---
# zve_base and tax_effect take the owners' Anlage N summaries (`employment`) and the household
# context (`household`). Per owner: gross from the summary (its gross_source), deductions =
# wk_applied + vorsorge + 36 (deductions_source employment) unless a deductions_override row
# exists, which still wins. With a household context the effect is assessed_tax(base + R) −
# assessed_tax(base) (§5.10: the Progressionsvorbehalt at six decimals of the rate, floored;
# the Günstigerprüfung; §35a; Soli and church tax on est_with); without one, total_tax as
# before. The household is owners A and B of phase 4b's anlage_n.yaml, outside a church, one
# child born 15 Mar 2026, benefits L = 7,360.00. `pending` names the step that builds the
# rule; tests/rules/performance/test_income.py skips the case until then.
