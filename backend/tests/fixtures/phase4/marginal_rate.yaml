# marginal_rate.yaml: rules/tax/tariff.py tax_effect and rules/performance/income.py zve_base
# (docs/phases/phase-4.md §5.1, §5.2, D82–D84).

# Synthetic numbers only (the repo is public). Loaded through tests/fixture_models_phase4.py:
# every figure here is checked against the §7 schemas, and each expectation's own arithmetic
# is checked on load. Decimals are quoted strings (the schemas accept decimal strings only).
# The step 0 coder filled every row by the spec's §5 arithmetic in Decimal, with the taxable
# results and AfA from phase 3's real draft() (9 Nov 2026); each figure the spec states
# (§5, §10.3) was reproduced exactly. Every field of an expectation compares exactly, None
# included, except `sources` (left empty here; a test compares with them excluded).
#
# A case gives the year, the owners and the income inputs. `expect` names what it checks; one
# it leaves out (zve, effect, tariff) is not asserted.
# - zve: zve_base(tax_year, inputs, owners, tariff). per_owner lists the owners' estimates when
#   the source is an estimate, and is empty under a Bescheid. Under a Bescheid,
#   base = the Bescheid's zvE − assessed_result (the property's result in that zvE).
# - effect: tax_effect(base, result, tariff, owners), where base is the case's `zve_base`
#   when stated (then the source is estimate) and zve's amount otherwise. The effect is
#   T(base + R) − T(base) with both breakdowns; the effective rate is effect ÷ R in percent to
#   one decimal, half-up. With R = 0 the effect is 0.00 and `slope` is shown instead: the
#   §32a zone's derivative at the floored half of the base, × (1 + the Soli factor at the base
#   (0, 0.055 or 0.119) + the owners' church rates ÷ 2), in percent to one decimal. Under an
#   override the effect is R × rate, half-up to the cent, without breakdowns.
# - tariff: registry.tariff(tax_year)'s stamp.
# - missing: no row for the year or an earlier one: zve_base and the effect are None.
# Deductions (D84): 1,230 + 36 + min(gross, 101,400) × 0.093 + min(gross, 69,750) ×
# (0.073 + 0.0145) × 0.96 + min(gross, 69,750) × 0.018, half-up to the cent.

