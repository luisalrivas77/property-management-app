# projection.yaml: rules/performance/synthesize.py + projection.py
# (docs/phases/phase-4.md §5.4, §10.3, D86, D87).

# Synthetic numbers only (the repo is public). Loaded through tests/fixture_models_phase4.py:
# every figure here is checked against the §7 schemas, and each expectation's own arithmetic
# is checked on load. Decimals are quoted strings (the schemas accept decimal strings only).
# The step 0 coder filled every row by the spec's §5 arithmetic in Decimal, with the taxable
# results and AfA from phase 3's real draft() (9 Nov 2026); each figure the spec states
# (§5, §10.3) was reproduced exactly. Every field of an expectation compares exactly, None
# included, except `sources` (left empty here; a test compares with them excluded).
#
# Inputs (§10.3): case A's facts with its tenancy flat_rate, today 31 Dec 2026 (2026 is the
# last actual year, n = 1 in 2027), owners A and B in church in Bayern, gross pay 60,000 and
# 45,000 for 2026 only (carried forward to every projected year), the loan's terms for
# build_schedule, and the levers. Years are asserted as year totals, not as monthly rows; the
# synthesized rows' ids are not asserted. How the rows were synthesized (§5.4):
# (a) Rent and NK: the year's total, rent × 12 × (1 + rent_growth)^(n−1) × (12 − vacancy) ÷ 12,
#     half-up, minus what real recurring lines already pay for months of that year (the
#     29 Dec 2026 rent and NK for January 2027, §11), spread over the open months in equal
#     cents with the last month taking the remainder; dated the rent due day, recurring,
#     service period the month. Vacant months are the year's last.
# (b) A loan entry's interest and principal are dated its due_on, recurring, service period
#     the month of due_on.
# (c) A recurring cost's annual figure grows by (1 + cost_inflation)^(n−1), is rounded half-up
#     once per year, then spread over its cadence (equal cents, the last row the remainder):
#     Hausgeld parts and management and bank fees monthly, Grundsteuer quarterly.
# (d) Upkeep grows with cost inflation too and is one `repairs` row on 30 June with a
#     synthetic exclude_from_15pct input (reason annual_maintenance).
# (e) Taxable result and AfA come from draft(facts + rows, year, rule_set_or_latest(year)).
# (f) Tax effect per marginal_rate.yaml on the carried-forward base 81,993.00
#     (source estimate, carried_forward true; flag tax_estimated).
# (g) value = today_value (None: the purchase price) × (1 + value_growth)^n, half-up;
#     loan_balance = the schedule year's closing balance; equity = value − loan balance.
# (h) The Pauschale check (D92): a projected year is a full year with the flat-rate tenancy
#     in force all year, so flat_rate_months is 12 and the gap is (in − out) ÷ 12.
# The sale (D88, D89) is on 31 Dec of the sale year, as in sale.yaml; afa_actual and
# cash_flow_actual are the actual 2026's building AfA and net cash it adds. The sale block is
# given for the three scenarios and C's control only; the other cases assert their years.

