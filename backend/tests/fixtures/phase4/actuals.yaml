# actuals.yaml: rules/performance/year_figures.py over a property's real facts
# (docs/phases/phase-4.md §5.3, D85, D91).

# Synthetic numbers only (the repo is public). Loaded through tests/fixture_models_phase4.py:
# every figure here is checked against the §7 schemas, and each expectation's own arithmetic
# is checked on load. Decimals are quoted strings (the schemas accept decimal strings only).
# The step 0 coder filled every row by the spec's §5 arithmetic in Decimal, with the taxable
# results and AfA from phase 3's real draft() (9 Nov 2026); each figure the spec states
# (§5, §10.3) was reproduced exactly. Every field of an expectation compares exactly, None
# included, except `sources` (left empty here; a test compares with them excluded).
#
# `facts` is phase 3's anlage_v_2026.yaml case by reference, with typed modifications applied
# in this order: drop_allocations, recategorize, add_allocations, add_tax_inputs, then
# operating_costs_terms on every tenancy (FactsRef in the loader).
# - kind: actual; actual_partial (flag so_far) when `today` is in the year and before 31 Dec.
# - flags: income.missing without a tax effect; tax_estimated when the effect's source is not
#   a Bescheid.
# - tax_effect: the household base from the income inputs (81,993.00 here) and the draft's
#   result, as in marginal_rate.yaml.
# - invested: Σ purchase_price + acquisition_cost magnitudes of the year (evidence only).
# - value, loan_balance, equity: None for actual years.
# - The Pauschale check (D91 amended 9 Nov 2026, D92): flat_rate_in = Σ umlagen_in of flat_rate
#   tenancies; flat_rate_months = the calendar months of the year in which at least one
#   flat_rate tenancy was in force (start to end date, any day of the month) and that are not
#   before the month of the property's purchase_date (the handover); flat_rate_gap_monthly =
#   (flat_rate_in − umlagen_out) ÷ flat_rate_months, half-up to the cent; both None without a
#   flat_rate tenancy or with 0 months. umlagen_out includes `electricity` (D92). Case A's
#   tenancy is `prepayment` by the schema default (§10.3 calls it flat_rate; the projection
#   cases set flat_rate explicitly); it starts on the handover, 1 Jul 2026, so a flat_rate
#   case A counts July to December, 6 months.

