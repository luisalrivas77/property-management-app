      breakdown_with: {est: '12472.00', soli: '0.00', church: '997.76', total: '13469.76'}
      breakdown_without: {est: '15052.00', soli: '0.00', church: '1204.16', total: '16256.16'}
    net_cash: '-4381.03'
    invested: '320800.00'
