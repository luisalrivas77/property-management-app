# D92: the flat's own electricity, paid by the landlord because the Pauschale covers it.
# Hand calculation (case A's facts, tenancy flat_rate, handover = tenancy start = 1 Jul 2026;
# six Abschläge of 50.00 on the 15th of July to December, one-off lines without a service
# period, so §11 keeps them in 2026):
#   umlagen_out   = 1,200.00 (case A: 6 × 180 Hausgeld + 2 × 60 Grundsteuer) + 6 × 50.00
#                 = 1,500.00; umlagen_net = 1,080.00 − 1,500.00 = −420.00
#   cash_out      = 13,897.43 + 300.00 = 14,197.43
#   result        = −7,948.66 − 300.00 = −8,248.66 (electricity on wk.allocable_costs, Z75)
#   tax effect    = T(81,993.00 − 8,248.66) − T(81,993.00) = 13,469.76 − 16,256.16 = −2,786.40
#                   (per marginal_rate.yaml's method; computed with rules.performance.income
#                   .year_tax_effect, which reproduces case A's −2,687.04 on −7,948.66)
#   net_cash      = 5,100.00 + 850.00 + 1,080.00 − 14,197.43 + 2,786.40 = −4,381.03
#                   (= case A's −4,180.39 − 300.00 + the extra saving 99.36)
#   flat_rate_in  = 6 × 180.00 = 1,080.00
#   months        = July … December = 6 (the tenancy starts on the handover; ÷ 12 would give
#                   −35.00, the D91 figure that was too small)
#   gap           = (1,080.00 − 1,500.00) ÷ 6 = −70.00 a month
- id: flat_rate_electricity_from_handover
  description: 'D92: monthly electricity of 50.00 counts in umlagen_out, and the Pauschale gap is per month
    the flat rate was in force from the handover (6), not per calendar month (12)'
  facts:
    case: case_a
    operating_costs_terms: flat_rate
    add_allocations:
    - {allocation_id: 000000e1-0000-4000-8000-000000000007, booking_date: 2026-07-15, amount: '-50.00', category: electricity}
    - {allocation_id: 000000e1-0000-4000-8000-000000000008, booking_date: 2026-08-14, amount: '-50.00', category: electricity}
    - {allocation_id: 000000e1-0000-4000-8000-000000000009, booking_date: 2026-09-15, amount: '-50.00', category: electricity}
