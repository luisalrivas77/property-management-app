    - {allocation_id: 000000e1-0000-4000-8000-00000000000c, booking_date: 2026-12-15, amount: '-50.00', category: electricity}
  year: 2026
  today: 2027-01-15
  owners: *owners
  income_inputs: *income_2026
  expect:
    year: 2026
    kind: actual
    flags:
    - tax_estimated
    rent_in: '5100.00'
    other_income: '850.00'
    umlagen_in: '1080.00'
    umlagen_out: '1500.00'
    umlagen_net: '-420.00'
    interest: '3724.56'
    principal_repaid: '1508.77'
    running_costs: '7464.10'
    cash_out: '14197.43'
    taxable_result: '-8248.66'
    afa: '2340.00'
    afa_movable: null
    tax_effect:
