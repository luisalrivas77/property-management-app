# sale.yaml: rules/performance/sale.py (docs/phases/phase-4.md §5.5, D88, D89).

# Synthetic numbers only (the repo is public). Loaded through tests/fixture_models_phase4.py:
# every figure here is checked against the §7 schemas, and each expectation's own arithmetic
# is checked on load. Decimals are quoted strings (the schemas accept decimal strings only).
# The step 0 coder filled every row by the spec's §5 arithmetic in Decimal, with the taxable
# results and AfA from phase 3's real draft() (9 Nov 2026); each figure the spec states
# (§5, §10.3) was reproduced exactly. Every field of an expectation compares exactly, None
# included, except `sources` (left empty here; a test compares with them excluded).
#
# `facts` flattens what sale() reads: the property record, the sale year's projected value,
# balance and result, the AfA claimed and every year's net cash.
# - The sale and the price's Zufluss are on 31 Dec of the sale year; §23 applies when that is
#   before tax_free_from (11 Mar 2036 here).
# - selling_costs = value × rate, half-up. gain = value − selling costs − (purchase price +
#   cost rows − building AfA claimed). Each owner's share of the gain is half-up, the last
#   owner taking the remainder; below_freigrenze when 0 < the owner's gain < 1,000 (a cliff).
#   sale_tax = T(base + R + taxed gain) − T(base + R), the taxed gain being the owners' gains
#   that are positive and not below the Freigrenze. A loss is taxed at 0.00 and not refunded.
# - E₀ = purchase price + cost rows − loan principal. profit = net proceeds + Σ CF − E₀, and
#   the bridge rows sum to it. flows: −E₀ on the purchase date, each CF on 31 Dec, the net
#   proceeds on the sale date.
# - cagr: years = days from the purchase date to the sale ÷ 365.25. irr: XIRR, Actual/365.
#   Both are rounded half-up to six decimals (the generator bisected to 1e-9; D89's 1e-6
#   bisection may differ by one in the last place, so a test compares to ±0.000001).

