# D94: gain_below_freigrenze's sale with a fitted kitchen bought with the flat (D80). Hand
# calculation (synthetic figures):
# - Kitchen: 8,000.00 of the 300,000.00 price; with its share of the 25,000.00 Nebenkosten
#   (phase 3 movable.py) its basis is 8,000.00 × 325,000.00 ÷ 300,000.00 = 8,666.67, over
#   10 years. 2026 from the July handover: 8,666.67 × 6 ÷ 120 = 433.33; 2027: 8,666.67 × 12
#   ÷ 120 = 866.67. afa_claimed_movable = 433.33 + 866.67 = 1,300.00.
# - The building AfA is the base case's 7,020.00, held as given so that the two cases differ
#   by the kitchen's AfA alone (sale() takes the AfA as a fact; in a real draft the kitchen's
#   basis would also have left the building's, D80). afa_claimed = 7,020.00 + 1,300.00 =
#   8,320.00.
# - gain = 319,780.00 − 0.00 − (300,000.00 + 25,000.00 − 8,320.00) = 3,100.00, which is the
#   base case's 1,800.00 + 1,300.00: before D94 the kitchen's cost stayed in the basis while
#   its AfA was not added back. 1,550.00 per spouse, not below 1,000: fully taxed (without
#   the add-back each spouse's 900.00 was below it and the tax 0.00).
# - sale_tax under the 2027 tariff (2026's, reused): base zvE 81,993.00 − 4,446.81 =
#   77,546.19. Without the gain: x 77,546, half 38,773, z = (38,773 − 17,799) ÷ 10,000 =
#   2.0974, (173.10·z + 2,397)·z + 1,034.87 = 6,823.82 → 6,823 × 2 = 13,646 ESt. With it:
#   80,646.19, half 40,323, z = 2.2524 → 7,312.06 → 7,312 × 2 = 14,624. Soli 0 (ESt below
#   40,700), church tax 8 % (BY). T = (14,624 − 13,646) × 1.08 = 978 × 1.08 = 1,056.24.
# - net proceeds = 319,780.00 − 0.00 − 1,056.24 − 234,779.24 = 83,944.52; profit =
#   83,944.52 + (−4,180.39 − 3,160.32) − 85,000.00 = −8,396.19 (the bridge: 19,780.00 +
#   5,220.76 − 7,340.71 − 25,000.00 − 0.00 − 1,056.24). CAGR over 548 ÷ 365.25 years and the
#   IRR by XIRR on the four flows below.
