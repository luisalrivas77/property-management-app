# Phase 7 (docs/phases/phase-7.md §15, D181 (d), D183, D186, D187): Solana by shape, over
# standard JSON-RPC `getTransaction` records (encoding jsonParsed, maxSupportedTransactionVersion
# 0) and `getInflationReward`.
#
# WRITTEN BY HAND in the RPC's field names, never copied from a live answer: every key is
# generated from random bytes for this file, every signature too, every amount invented. The
# public program ids are the System, Token, Token-2022, Associated Token Account and Stake
# programs and the registry's USDC mint; the AMM programs are invented (decoders.yaml).
# Only the fields D181 (d) reads are kept: accountKeys, the instructions' programId and
# parsed type, meta.err, meta.fee, pre/postBalances, pre/postTokenBalances (with `owner`),
# meta.loadedAddresses.
#
# Loading recomputes D181 (d): the own address's SOL delta over its main account and every
# token account it owns (so a token account's rent moving from the main account is no
# delta), the fee added back when the own address is accountKeys[0] (the fee payer); one
# delta per mint over the token balances it owns (a routed swap's intermediate token nets to
# zero and is no delta); meta.err → failed. The movements, the group kind and the card are
# step 2's (`pending`). Step 0's readings (§15.1):
# - jsonParsed lists the lookup table's keys in accountKeys with `source: lookupTable`, so
#   the balance arrays index that list as it stands (the plain json encoding would need
#   meta.loadedAddresses appended); step 2 checks this against a stored original;
# - a send that creates the recipient's token account: the rent A paid is part of the `fee`
#   movement (meta.fee + rent), D181 (d)'s „the rent as fee“;
# - a signed transaction that moves no asset (a token account closed, its rent back): group
#   `transfer` whose only movement is the fee, confirmed like a fee (D186 (1)).
#
# A = BU8o…jsJP (own); F = ANgP…Y5J (a third party); A's USDC token account Dd2n…ZH8ZU;
# F's USDC token account 41fr…nD4; a stake account Hqw2…9fF; the invented listed AMM
# DKFJ…TarL and unlisted program 9ZgA…pyQw; pool accounts E1ST…bT7, H7CG…f6Bf, 3jDv…2rEu.
