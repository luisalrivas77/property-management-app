# Phase 7 (docs/phases/phase-7.md §15, D179, D180, D184 (1)(a), D192): the chain registry's
# shape, the address formats and their mask, Binance's network names, the provider boundary.
#
# Every address here is invented or a published test vector, never a household's:
# - Bitcoin: BIP-173's example `bc1qw508…f3t4`, the long-public legacy example `1BvB…NVN2`, and
#   bech32 addresses generated from random bytes for this file;
# - EVM: EIP-55's own example `0x5aAe…eAed` (valid, a wrong checksum, the lower-case form);
# - Solana: the System Program's id (32 zero bytes) and keys generated from random bytes.
#
# Loading recomputes: each registry row against rules/chain/chains.yaml; the Bitcoin and Solana
# formats (bech32 with its checksum, base58check, 32 bytes of base58) and the mask (the first
# four and the last four characters, D179; migration 0041's CHECK also allows three in front,
# the spec's example „7Qx…mN4p“, step 0 writes four); each network name against
# `exchange_networks`. The EIP-55 checksum needs Keccak-256, which no backend dependency
# provides: its cases are shape-checked here and replayed by step 1 (§15.1).
registry_rows:
  - {id: reg_bitcoin, code: bitcoin, family: utxo, chain_id: null, native_symbol: BTC, native_decimals: 8, source: bitcoin_esplora, confirmations_final: 6, explorer_host: mempool.space}
  - {id: reg_ethereum, code: ethereum, family: evm, chain_id: 1, native_symbol: ETH, native_decimals: 18, source: evm_etherscan, confirmations_final: 12, explorer_host: etherscan.io}
  - {id: reg_arbitrum, code: arbitrum, family: evm, chain_id: 42161, native_symbol: ETH, native_decimals: 18, source: evm_etherscan, confirmations_final: 12, explorer_host: arbiscan.io}
  - {id: reg_bsc, code: bsc, family: evm, chain_id: 56, native_symbol: BNB, native_decimals: 18, source: evm_rpc_balance, confirmations_final: 12, explorer_host: bscscan.com}
  # Solana reads at commitment `finalized`; 0 confirmations on top of it (§15.1).
  - {id: reg_solana, code: solana, family: solana, chain_id: null, native_symbol: SOL, native_decimals: 9, source: solana_rpc, confirmations_final: 0, explorer_host: solscan.io}

addresses:
  # Bitcoin: bech32 (BIP-173) and base58check legacy.
  - {id: btc_bech32_valid, pending: "phase 7 step 1 (address.validate, mask)", chain: bitcoin, address: bc1qw508d6qejxtdg4y5r3zarvary0c5xw7kv8f3t4, valid: true, normalised: bc1qw508d6qejxtdg4y5r3zarvary0c5xw7kv8f3t4, masked: "bc1q…f3t4"}
  - {id: btc_bech32_generated, pending: "phase 7 step 1 (address.validate, mask)", chain: bitcoin, address: bc1q62vj3efj43p06q74rjqe2kmvfs4yya99s7rtxz, valid: true, normalised: bc1q62vj3efj43p06q74rjqe2kmvfs4yya99s7rtxz, masked: "bc1q…rtxz"}
  - {id: btc_bech32_bad_checksum, pending: "phase 7 step 1 (address.validate)", chain: bitcoin, address: bc1qw508d6qejxtdg4y5r3zarvary0c5xw7kv8f3t5, valid: false}
  - {id: btc_legacy_valid, pending: "phase 7 step 1 (address.validate, mask)", chain: bitcoin, address: 1BvBMSEYstWetqTFn5Au4m4GFg7xJaNVN2, valid: true, normalised: 1BvBMSEYstWetqTFn5Au4m4GFg7xJaNVN2, masked: "1BvB…NVN2"}
  - {id: btc_legacy_bad_checksum, pending: "phase 7 step 1 (address.validate)", chain: bitcoin, address: 1BvBMSEYstWetqTFn5Au4m4GFg7xJaNVN3, valid: false}
  # EVM: EIP-55. Normalised is the lower-case form the HMAC is taken over (D179 (2)); the mask
  # shows it as stored.
  - {id: evm_eip55_valid, pending: "phase 7 step 1 (address.validate with Keccak-256)", chain: ethereum, address: "0x5aAeb6053F3E94C9b9A09f33669435E7Ef1BeAed", valid: true, normalised: "0x5aaeb6053f3e94c9b9a09f33669435e7ef1beaed", masked: "0x5a…eaed"}
  - {id: evm_eip55_wrong_checksum, pending: "phase 7 step 1 (address.validate with Keccak-256)", chain: ethereum, address: "0x5aaeb6053F3E94C9b9A09f33669435E7Ef1BeAed", valid: false}
  - {id: evm_lower_case_accepted, pending: "phase 7 step 1 (address.validate)", chain: arbitrum, address: "0x5aaeb6053f3e94c9b9a09f33669435e7ef1beaed", valid: true, normalised: "0x5aaeb6053f3e94c9b9a09f33669435e7ef1beaed", masked: "0x5a…eaed"}
  - {id: evm_too_short, pending: "phase 7 step 1 (address.validate)", chain: bsc, address: "0x5aaeb6053f3e94c9b9a09f33669435e7ef1bea", valid: false}
  # Solana: base58 of exactly 32 bytes.
  - {id: sol_system_program, pending: "phase 7 step 1 (address.validate, mask)", chain: solana, address: "11111111111111111111111111111111", valid: true, normalised: "11111111111111111111111111111111", masked: "1111…1111"}
  - {id: sol_generated, pending: "phase 7 step 1 (address.validate, mask)", chain: solana, address: BU8oH89B6z89SV3HfU1FBa5p8aE43HhZz3F6BQBtjsJP, valid: true, normalised: BU8oH89B6z89SV3HfU1FBa5p8aE43HhZz3F6BQBtjsJP, masked: "BU8o…jsJP"}
  - {id: sol_31_bytes_refused, pending: "phase 7 step 1 (address.validate)", chain: solana, address: "1111111111111111111111111111111", valid: false}
  - {id: sol_not_base58, pending: "phase 7 step 1 (address.validate)", chain: solana, address: BU8oH89B6z89SV3HfU1FBa5p8aE43HhZz3F6BQBtjs0P, valid: false}

networks:
  # D184 (1)(a): Binance's withdraw history names the network; BISON's rows name none (Q-O76).
  - {id: net_sol, name: SOL, chain: solana}
  - {id: net_bsc, name: BSC, chain: bsc}
  - {id: net_eth, name: ETH, chain: ethereum}
  - {id: net_arbitrum, name: ARBITRUM, chain: arbitrum}
  - {id: net_btc, name: BTC, chain: bitcoin}
  - {id: net_unknown, name: TRX, chain: null}
  - {id: net_case_matters, name: eth, chain: null}

providers:
  # D192: the same recorded records through two base URLs give the same ChainTx; a replay over
  # the stored originals with no source configured gives the same movements; a refused
  # provider leaves the history untouched. `records_from` names the recorded case replayed.
  - id: esplora_two_urls
    chain: bitcoin
    records_from: btc_utxo.spend_registered_change
    urls: ["https://esplora.example.invalid/api", "https://mirror.example.invalid/api"]
    expect: {same_as_first: true}
  - id: solana_two_urls
    pending: "phase 7 step 2 (services/chain/solana_rpc)"
    chain: solana
    records_from: solana_tx.native_send_with_fee
    urls: ["https://rpc-one.example.invalid", "https://rpc-two.example.invalid"]
    expect: {same_as_first: true}
  - id: solana_replay_without_source
    pending: "phase 7 step 2 (replay over wallet_sync originals)"
    chain: solana
    records_from: solana_tx.swap_listed_amm
    urls: []
    expect: {same_as_first: true}
  - id: refused_provider
    pending: "phase 7 step 2 (services/chain/base.ChainSourceError)"
    chain: solana
    records_from: solana_tx.native_receive
    urls: ["https://rpc-one.example.invalid"]
    status: 401
    expect: {error: wallet.source_refused, history_untouched: true}
