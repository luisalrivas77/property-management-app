# Phase 7 (docs/phases/phase-7.md §15, D182 (2)): a chain movement's hash.
#
# movement_hash = SHA-256 over chain, tx_hash, address_hmac, index and role joined by "\x1f"
# (U+001F, like rules/exchange.movement_hash), lower-case hex. Recomputed on load; the rule
# (rules/chain.movement_hash) replays the cases in step 2.
#
# The index as step 0 writes it (D182 (2) names the parts, not their spelling; §15.1):
# Bitcoin the vout or vin number, or `net` for D185's one net movement; EVM the log index,
# `internal:<trace address>` (the trace's path joined by `_`), or `fee`; Solana the instruction
# index, `<outer>.<inner>` for an inner instruction, or `fee`. Hashes and HMACs are invented
# placeholders; the Solana signature was generated from random bytes.
