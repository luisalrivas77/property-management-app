# Phase 7 (docs/phases/phase-7.md §15, D185, D186 (2), D182 (1)): Bitcoin per UTXO.
#
# Each `tx` is an Esplora /tx record (the fields D185 reads: vin with prevout, vout, fee,
# status), written by hand: every address is a bech32 address generated from random bytes
# for this file, every txid an invented hash, every amount invented (sats). Loading checks
# Σ inputs = Σ outputs + fee and recomputes D185 (1)/(2):
# - a receive (no own input): one `in` movement per own output, index = the vout number;
# - a spend (every input own): one `out` movement of Σ own inputs − Σ own outputs − fee
#   (index `net`) and one `fee`, both on the first own input's address; the change is no
#   movement;
# - a transaction with foreign inputs too (a CoinJoin, a shared PSBT): `unknown`, review;
# - step 0's reading of the change question (§15.1): while two or more outputs go to
#   unregistered addresses nobody answered for, the group is `unknown` with the card
#   `wallet.change_candidate` listing them; one answer settles §6 (12) either way.
#
# Addresses: own receive bc1q62vj…rtxz, own change (registered) bc1qsdqk…z2k, a second own
# address bc1q0phh…zqrl; a payee bc1qfrg0…tuf; an unregistered output bc1qn8du…ngw (the
# Tangem's change with „Dynamic Addresses“ on); a foreign input bc1qmc3c…yhg.
