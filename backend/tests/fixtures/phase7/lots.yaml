# Phase 7 (docs/phases/phase-7.md §8, §15, D188 (1), (2), (4), D184 (4)): lots by FIFO per
# account and asset, computed on read.
#
# Each case is one asset's confirmed ledger events (`exchange` is a phase 6 exchange account,
# `wallet` A's wallet account): an acquisition, a reward or a swap's received leg creates a
# lot; a transfer out (a linked transfer, D184 (4)) moves the oldest lots to the receiving
# account with their day and cost; a disposal or a fee paid in the asset consumes the oldest
# lots at cost. Every amount is invented.
#
# Loading recomputes D188 (1): FIFO by the Berlin day of acquisition (D188 (2)); a lot's cost
# is the event's `cost_eur` (the TOTAL for its units, as the exchange's EUR leg or the price
# table gives it) plus its `fee_eur` (Rn. 59); a use's cost and an open lot's cost are the
# per-unit cost × units, to the cent; an unpriced acquisition (`cost_eur` null) gives a lot
# and uses whose cost is null, never 0 € (D188 (4)); a superseded event is not read (D184
# (5): nothing is cached). Step 0's readings (§15.1):
# - §8's „10 units on 1 Feb 2026 at 100 €“ is read as 100 € per unit (1,000 € for the lot);
# - a swap's received leg is a lot with `source: acquisition` (LotSource has no `swap`; the
#   screen's „Swap“ label comes from the group, step 2);
# - a moved lot keeps its source and is marked `moved` (its `moved_through` chain is step 5's).
# Added from the step 0 review (15 Nov 2026), after the five cases above it:
# - a case that holds two assets names each event's `asset` (and each lot's): a `wrap` or a
#   `bridge` consumes the oldest lots of its asset and re-creates them on `to_asset` of the
#   same account with their day, cost per unit and source unchanged and no use, since neither
#   is a disposal (D184 (2)-(4)); a bridge's fee would be a separate `fee` movement on the
#   sending side, consumed like any fee (the first case shows one);
# - `lp_deposit` and `lp_withdrawal` consume and create nothing: D188 (1) leaves the position
#   to phase 8 ("here lp_* consumes nothing and the card says the position is open").
cases:
  # §8: three acquisitions, a transfer of 12 out, a disposal of 5, a reward and a fee.
  - id: fifo_transfer_disposal_reward_fee
    events:
      - {name: buy_feb, at: "2026-02-01T09:00:00Z", account: exchange, kind: acquisition, units: "10", cost_eur: "1000.00", fee_eur: "1.00"}
      - {name: buy_jun, at: "2026-06-01T09:00:00Z", account: exchange, kind: acquisition, units: "10", cost_eur: "2000.00", fee_eur: "2.00"}
      - {name: buy_sep, at: "2026-09-01T09:00:00Z", account: exchange, kind: acquisition, units: "5", cost_eur: "750.00", fee_eur: "1.50"}
      - {name: move_oct, at: "2026-10-01T09:00:00Z", account: exchange, kind: transfer_out, units: "12", to_account: wallet}
      - {name: sell_nov, at: "2026-11-01T09:00:00Z", account: exchange, kind: disposal, units: "5"}
      - {name: reward_nov, at: "2026-11-10T09:00:00Z", account: wallet, kind: reward, units: "1", cost_eur: "150.00"}
      - {name: fee_nov, at: "2026-11-15T09:00:00Z", account: wallet, kind: fee, units: "0.1"}
    expect_lots:
      - {account: exchange, acquired_on: 2026-06-01, units_open: "3", cost_eur: "600.60", source: acquisition, tax_free_from: 2027-06-02}
      - {account: exchange, acquired_on: 2026-09-01, units_open: "5", cost_eur: "751.50", source: acquisition, tax_free_from: 2027-09-02}
      - {account: wallet, acquired_on: 2026-02-01, units_open: "9.9", cost_eur: "990.99", source: acquisition, tax_free_from: 2027-02-02, moved: true}
      - {account: wallet, acquired_on: 2026-06-01, units_open: "2", cost_eur: "400.40", source: acquisition, tax_free_from: 2027-06-02, moved: true}
      - {account: wallet, acquired_on: 2026-11-10, units_open: "1", cost_eur: "150.00", source: reward, tax_free_from: 2027-11-11}
    expect_uses:
      - {event: move_oct, acquired_on: 2026-02-01, units: "10", cost_eur: "1001.00"}
      - {event: move_oct, acquired_on: 2026-06-01, units: "2", cost_eur: "400.40"}
      - {event: sell_nov, acquired_on: 2026-06-01, units: "5", cost_eur: "1001.00"}
      - {event: fee_nov, acquired_on: 2026-02-01, units: "0.1", cost_eur: "10.01"}

  # An unpriced acquisition: the lot's cost and the disposal's cost are null, never 0 €.
  - id: unpriced_acquisition
    events:
      - {name: airdrop_mar, at: "2026-03-01T09:00:00Z", account: wallet, kind: reward, units: "4"}
      - {name: buy_apr, at: "2026-04-01T09:00:00Z", account: wallet, kind: acquisition, units: "2", cost_eur: "300.00"}
      - {name: pay_may, at: "2026-05-01T09:00:00Z", account: wallet, kind: disposal, units: "5"}
    expect_lots:
      - {account: wallet, acquired_on: 2026-04-01, units_open: "1", cost_eur: "150.00", source: acquisition, tax_free_from: 2027-04-02}
    expect_uses:
      - {event: pay_may, acquired_on: 2026-03-01, units: "4", cost_eur: null}
      - {event: pay_may, acquired_on: 2026-04-01, units: "1", cost_eur: "150.00"}

  # A swap's received leg at 23:30 UTC on 31 Dec: a new lot dated the swap's Berlin day.
  - id: swap_received_leg_new_lot
    events:
      - {name: swap_in, at: "2026-12-31T23:30:00Z", account: wallet, kind: swap_in, units: "150", cost_eur: "138.00", fee_eur: "0.70"}
    expect_lots:
      - {account: wallet, acquired_on: 2027-01-01, units_open: "150", cost_eur: "138.70", source: acquisition, tax_free_from: 2028-01-02}
    expect_uses: []

  # The same ledger read twice: first with the disposal, then with it superseded (re-booked).
  # The lots differ; nothing was cached.
  - id: before_rebooking
    events:
      - {name: buy_a, at: "2026-02-01T09:00:00Z", account: wallet, kind: acquisition, units: "10", cost_eur: "1000.00"}
      - {name: buy_b, at: "2026-03-01T09:00:00Z", account: wallet, kind: acquisition, units: "10", cost_eur: "1200.00"}
      - {name: pay, at: "2026-04-01T09:00:00Z", account: wallet, kind: disposal, units: "12"}
    expect_lots:
      - {account: wallet, acquired_on: 2026-03-01, units_open: "8", cost_eur: "960.00", source: acquisition, tax_free_from: 2027-03-02}
    expect_uses:
      - {event: pay, acquired_on: 2026-02-01, units: "10", cost_eur: "1000.00"}
      - {event: pay, acquired_on: 2026-03-01, units: "2", cost_eur: "240.00"}
  - id: after_rebooking_superseded
    events:
      - {name: buy_a, at: "2026-02-01T09:00:00Z", account: wallet, kind: acquisition, units: "10", cost_eur: "1000.00"}
      - {name: buy_b, at: "2026-03-01T09:00:00Z", account: wallet, kind: acquisition, units: "10", cost_eur: "1200.00"}
      - {name: pay, at: "2026-04-01T09:00:00Z", account: wallet, kind: disposal, units: "12", superseded: true}
    expect_lots:
      - {account: wallet, acquired_on: 2026-02-01, units_open: "10", cost_eur: "1000.00", source: acquisition, tax_free_from: 2027-02-02}
      - {account: wallet, acquired_on: 2026-03-01, units_open: "10", cost_eur: "1200.00", source: acquisition, tax_free_from: 2027-03-02}
    expect_uses: []

  # D184 (3): ETH wrapped into WETH on one chain. FIFO takes the March lot whole and half of
  # the May lot; both re-appear on WETH with their day and cost; nothing is a use.
  - id: wrap_carries_lots
    events:
      - {name: buy_mar, at: "2026-03-01T09:00:00Z", account: wallet, asset: ETH, kind: acquisition, units: "2", cost_eur: "4000.00"}
      - {name: buy_may, at: "2026-05-01T09:00:00Z", account: wallet, asset: ETH, kind: acquisition, units: "1", cost_eur: "2500.00"}
      - {name: wrap_jun, at: "2026-06-01T09:00:00Z", account: wallet, asset: ETH, kind: wrap, units: "2.5", to_asset: WETH}
    expect_lots:
      - {account: wallet, asset: ETH, acquired_on: 2026-05-01, units_open: "0.5", cost_eur: "1250.00", source: acquisition, tax_free_from: 2027-05-02}
      - {account: wallet, asset: WETH, acquired_on: 2026-03-01, units_open: "2", cost_eur: "4000.00", source: acquisition, tax_free_from: 2027-03-02, moved: true}
      - {account: wallet, asset: WETH, acquired_on: 2026-05-01, units_open: "0.5", cost_eur: "1250.00", source: acquisition, tax_free_from: 2027-05-02, moved: true}
    expect_uses: []

  # D184 (2): ETH bridged from Ethereum to Arbitrum (the same wallet account, another asset).
  # The reward lot keeps its source; the bridged lots keep their days and costs; no use.
  - id: bridge_carries_lots
    events:
      - {name: buy_jan, at: "2026-01-15T09:00:00Z", account: wallet, asset: ETH-ethereum, kind: acquisition, units: "1", cost_eur: "3000.00", fee_eur: "3.00"}
      - {name: reward_feb, at: "2026-02-15T09:00:00Z", account: wallet, asset: ETH-ethereum, kind: reward, units: "0.5", cost_eur: "1400.00"}
      - {name: bridge_mar, at: "2026-03-03T10:00:00Z", account: wallet, asset: ETH-ethereum, kind: bridge, units: "1.2", to_asset: ETH-arbitrum}
    expect_lots:
      - {account: wallet, asset: ETH-arbitrum, acquired_on: 2026-01-15, units_open: "1", cost_eur: "3003.00", source: acquisition, tax_free_from: 2027-01-16, moved: true}
      - {account: wallet, asset: ETH-arbitrum, acquired_on: 2026-02-15, units_open: "0.2", cost_eur: "560.00", source: reward, tax_free_from: 2027-02-16, moved: true}
      - {account: wallet, asset: ETH-ethereum, acquired_on: 2026-02-15, units_open: "0.3", cost_eur: "840.00", source: reward, tax_free_from: 2027-02-16}
    expect_uses: []

  # D188 (1): a liquidity-pool deposit and its withdrawal leave the lots as they were, so the
  # later sale of 8 units takes them from the one 10-unit lot (had the deposit consumed 4,
  # the February lot would hold 6 and the uses would differ).
  - id: lp_leaves_lots_untouched
    events:
      - {name: buy, at: "2026-02-01T09:00:00Z", account: wallet, kind: acquisition, units: "10", cost_eur: "1000.00"}
      - {name: lp_in, at: "2026-03-01T09:00:00Z", account: wallet, kind: lp_deposit, units: "4"}
      - {name: lp_out, at: "2026-04-01T09:00:00Z", account: wallet, kind: lp_withdrawal, units: "4"}
      - {name: sell, at: "2026-05-01T09:00:00Z", account: wallet, kind: disposal, units: "8"}
    expect_lots:
      - {account: wallet, acquired_on: 2026-02-01, units_open: "2", cost_eur: "200.00", source: acquisition, tax_free_from: 2027-02-02}
    expect_uses:
      - {event: sell, acquired_on: 2026-02-01, units: "8", cost_eur: "800.00"}
  # D188 amended (16 Nov 2026, decided by the orchestrator; a spec amendment by decision,
  # not a change to make a test pass): a trade's fee. A `trade_fee` is a fee movement in the
  # trade's group (the exchange's trade group, phase 6 D178 amended (3)), naming its trade.
  # - In the coin bought (Binance's default): valued at the trade's own euro price per unit
  #   (EUR paid ÷ units received), so it adds nothing to the lot: the lot's cost is the EUR
  #   paid (plus any `fee_eur`), and no market price of the day is needed. The fee movement
  #   then takes its units FIFO at cost like every fee (D188 (1)): from the trade's own lot
  #   when it is the oldest, else from the oldest lot (the second case), so the trade's lot
  #   then keeps the whole EUR paid on its units.
  # - In another coin (BNB): valued at that coin's price on the Berlin day and added to the
  #   lot's cost; without that price the lot is unpriced (null), never 0 €.
  # - A EUR fee (`fee_eur`) and a fee in another coin both count; neither replaces the other.
  - id: trade_fee_in_the_coin_bought
    events:
      - {name: buy, at: "2026-03-02T10:00:00Z", account: exchange, kind: acquisition, units: "1", cost_eur: "100.00"}
      - {name: buy_fee, at: "2026-03-02T10:00:00Z", account: exchange, kind: trade_fee, trade: buy, units: "0.001"}
    expect_lots:
      - {account: exchange, acquired_on: 2026-03-02, units_open: "0.999", cost_eur: "99.90", source: acquisition, tax_free_from: 2027-03-03}
    expect_uses:
      - {event: buy_fee, acquired_on: 2026-03-02, units: "0.001", cost_eur: "0.10"}
  - id: trade_fee_in_the_coin_bought_after_an_older_lot
    events:
      - {name: buy_jan, at: "2026-01-15T10:00:00Z", account: exchange, kind: acquisition, units: "1", cost_eur: "80.00"}
      - {name: buy, at: "2026-03-02T10:00:00Z", account: exchange, kind: acquisition, units: "1", cost_eur: "100.00"}
      - {name: buy_fee, at: "2026-03-02T10:00:00Z", account: exchange, kind: trade_fee, trade: buy, units: "0.001"}
    expect_lots:
      - {account: exchange, acquired_on: 2026-01-15, units_open: "0.999", cost_eur: "79.92", source: acquisition, tax_free_from: 2027-01-16}
      - {account: exchange, acquired_on: 2026-03-02, units_open: "1", cost_eur: "100.00", source: acquisition, tax_free_from: 2027-03-03}
    expect_uses:
      - {event: buy_fee, acquired_on: 2026-01-15, units: "0.001", cost_eur: "0.08"}
  - id: trade_fees_in_eur_and_another_coin
    events:
      - {name: buy_bnb, at: "2026-02-01T10:00:00Z", account: exchange, asset: BNB, kind: acquisition, units: "1", cost_eur: "500.00"}
      - {name: buy_sol, at: "2026-03-02T10:00:00Z", account: exchange, asset: SOL, kind: acquisition, units: "2", cost_eur: "300.00", fee_eur: "0.50"}
      - {name: sol_fee, at: "2026-03-02T10:00:00Z", account: exchange, asset: BNB, kind: trade_fee, trade: buy_sol, units: "0.002", price_eur: "500.00"}
    expect_lots:
      - {account: exchange, asset: BNB, acquired_on: 2026-02-01, units_open: "0.998", cost_eur: "499.00", source: acquisition, tax_free_from: 2027-02-02}
      - {account: exchange, asset: SOL, acquired_on: 2026-03-02, units_open: "2", cost_eur: "301.50", source: acquisition, tax_free_from: 2027-03-03}
    expect_uses:
      - {event: sol_fee, acquired_on: 2026-02-01, units: "0.002", cost_eur: "1.00"}
  - id: trade_fee_in_another_coin_unpriced
    events:
      - {name: buy_bnb, at: "2026-02-01T10:00:00Z", account: exchange, asset: BNB, kind: acquisition, units: "1", cost_eur: "500.00"}
      - {name: buy_sol, at: "2026-03-02T10:00:00Z", account: exchange, asset: SOL, kind: acquisition, units: "2", cost_eur: "300.00", fee_eur: "0.50"}
      - {name: sol_fee, at: "2026-03-02T10:00:00Z", account: exchange, asset: BNB, kind: trade_fee, trade: buy_sol, units: "0.002"}
    expect_lots:
      - {account: exchange, asset: BNB, acquired_on: 2026-02-01, units_open: "0.998", cost_eur: "499.00", source: acquisition, tax_free_from: 2027-02-02}
      - {account: exchange, asset: SOL, acquired_on: 2026-03-02, units_open: "2", cost_eur: null, source: acquisition, tax_free_from: 2027-03-03}
    expect_uses:
      - {event: sol_fee, acquired_on: 2026-02-01, units: "0.002", cost_eur: "1.00"}
  # D188 amended (review of step 6, 16 Nov 2026, decided by the orchestrator): the fee in the
  # coin bought adds nothing only when it is withheld from the units received (an exchange
  # trade, the cases above). Gas a chain transaction pays in the coin it acquires is paid on
  # top of the units received: its value on the Berlin day joins the new lot's cost, and the
  # fee movement still takes its units FIFO at cost from the oldest lot. `chain: true` marks
  # events read from a chain (D182): a chain swap has no EUR leg, so the acquisition's
  # `cost_eur` is the day's price × units. Swap 3,000 USDC for 1 ETH with 0.01 ETH gas, ETH at
  # 2,800 € that day: the new lot costs 2,800.00 + 0.01 × 2,800 = 2,828.00 €; the gas takes
  # 0.01 ETH from the February lot (2,000 € per unit) at 20.00 €.
  - id: chain_swap_gas_in_acquired_coin
    events:
      - {name: buy_usdc, at: "2026-01-10T10:00:00Z", account: wallet, asset: USDC, kind: acquisition, units: "3000", cost_eur: "2760.00"}
      - {name: buy_eth, at: "2026-02-01T10:00:00Z", account: wallet, asset: ETH, kind: acquisition, units: "0.5", cost_eur: "1000.00"}
      - {name: swap_eth, at: "2026-04-01T10:00:00Z", account: wallet, asset: ETH, kind: acquisition, units: "1", cost_eur: "2800.00", chain: true}
      - {name: swap_usdc, at: "2026-04-01T10:00:00Z", account: wallet, asset: USDC, kind: disposal, units: "3000", chain: true}
      - {name: swap_gas, at: "2026-04-01T10:00:00Z", account: wallet, asset: ETH, kind: trade_fee, trade: swap_eth, units: "0.01", chain: true}
    expect_lots:
      - {account: wallet, asset: ETH, acquired_on: 2026-02-01, units_open: "0.49", cost_eur: "980.00", source: acquisition, tax_free_from: 2027-02-02}
      - {account: wallet, asset: ETH, acquired_on: 2026-04-01, units_open: "1", cost_eur: "2828.00", source: acquisition, tax_free_from: 2027-04-02}
    expect_uses:
      - {event: swap_usdc, acquired_on: 2026-01-10, units: "3000", cost_eur: "2760.00"}
      - {event: swap_gas, acquired_on: 2026-02-01, units: "0.01", cost_eur: "20.00"}
