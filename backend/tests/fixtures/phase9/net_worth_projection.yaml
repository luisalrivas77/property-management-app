  - id: first_year_partial
    description: seven months, June to December, one stretch of the formula
    stretch: {value: "10000.00", rate: "0.05", monthly: "100.00", months: 7}
    expect: {value: "11000.42"}

  - id: full_year_closed_formula
    description: a full year with a constant plan is V × (1 + r) + 12 c + 5.5 c r
    stretch: {value: "10000.00", rate: "0.05", monthly: "100.00", months: 12}
    expect: {value: "11727.50"}

  - id: property_kept_without_scenario
    description: >-
      phase 10 D301 (it was the to-do no_default_scenario and no point until 25 Nov 2026): the
      property is kept at its value today, 320,000.00, its loan along its schedule (the
      balances below, invented), and the measured rental mean −353.33 stays the flat's cash in
      every month, so R gains 452.00 a month throughout: 31 Dec 2028 = 19,950 + 19 × 452 =
      28,538.00, each later year + 12 × 452 = 5,424.00. Funds and crypto as phase 9's.
    <<: *household
    flats:
      p1: {sale_year: null, kept_value: "320000.00", kept_loans: {2028: "230350.00", 2029: "226420.00",
        2030: "222400.00", 2031: "218290.00", 2032: "214090.00"}}
