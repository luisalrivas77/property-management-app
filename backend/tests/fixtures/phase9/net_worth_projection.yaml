    <<: *household
    start: null
    levers: {value_change: *worked_rates, net_worth_years: 5}
    expect: {points: [], todos: [month_end_missing]}

  - id: sale_before_the_last_point
    description: >-
      the flat sold on 31 Dec 2030 for net proceeds of 102,000.00 (invented; phase 4's value
      less selling costs, sale tax and the loan). No split: the proceeds land on the bank row
      once, 44,321.24 + 102,000.00 = 146,321.24; the property and its loan are 0 from that day.
      From January 2031 the flat's cash is 0: free 5,583.33 − 4,116.67 = 1,466.66, buffer
      146.67, investable 1,319.99, R gains 769.99 a month, 9,239.88 a year: 155,561.12 and
      164,801.00. The points run on past the sale (phase 9 stopped before it, so this case
      was `ends_before_sale_year: 2030` with two points).
