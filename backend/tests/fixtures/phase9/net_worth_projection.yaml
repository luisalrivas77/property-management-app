    <<: *household
    levers: {value_change: {depot: "0.037"}, net_worth_years: 5}
    expect: {points: [], todos: [rate_missing]}

  - id: split_into_a_class_without_rate
    description: >-
      no crypto held and no plan into it, but the split moves money into crypto: its rate is
      needed (services never pass such a split, rules/investment_split leaves the class out;
      the rule still refuses it)
    <<: *household
    start: {month_end: "2027-05-31", run: run-2027-05, bank: "19950.00", depot: "21500.00",
      crypto: "0.00", property: "320000.00", loans: "236400.00", other_liabilities: "820.00"}
    plans: [{key: depot, asset_class: depot, monthly: "400.00"}]
    split: *split
    levers: {value_change: {depot: "0.037"}, net_worth_years: 2}
    expect: {points: [], todos: [rate_missing]}

  - id: zero_typed_is_a_rate
    description: the start plus what was paid in
    <<: *household
    levers: {value_change: {depot: "0", crypto: "0"}, net_worth_years: 5}
    expect:
      last: {"on": "2032-12-31", bank: "58459.40", depot: "48300.00", crypto: "14200.00", property: "344730.88", loans: "214090.00", other_liabilities: "820.00", total: "250780.28"}
      todos: []

