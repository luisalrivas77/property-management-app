        - {"on": "2029-12-31", bank: "37252.16", depot: "27312.43", crypto: "8554.55", property: "329672.00", loans: "226420.00", other_liabilities: "820.00", total: "175551.14"}
      todos: []

  - id: class_not_held_needs_no_rate
