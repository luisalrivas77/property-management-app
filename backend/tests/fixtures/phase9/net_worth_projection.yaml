# Phase 9 (docs/phases/phase-9.md §7.5, D247 amended, §15.1, §15.2), amended by phase 10
# §7.11 (a), D301 (25 Nov 2026): `rules/plan/projection.project_net_worth`, one month walk
# that Anlagen's 31-December points, the goal and Durchspielen all read. Start: the stored run
# at the newest closed month-end. The reserve row R, month by month, in this order:
#   1. R earns the typed reserve rate for one month, R × r ÷ 12 to the cent half-up (while R > 0; none
#      typed: nothing; reserve_above.yaml in phase 10 has the rate's cases);
#   2. R += investable(k) − every plan (the month function of §7.1, plan_levers.yaml);
#   3. in December of a property's sale year, R += the sale's net proceeds (phase 4's
#      SaleResult.net_proceeds), once;
#   4. R < 0: the walk ends, `used_up` = that month, no point from that month on;
#   5. what lies above the reserve target (months × need) moves out of R into funds and crypto
#      in the effective investment split's shares (no split: nothing moves; nothing moves
#      back, the walk never sells to refill the reserve);
#   6. a class's payment that month = its plans + its share of what moved.
# Bank row = start bank + (R − R at the start). Funds and crypto per class with its typed rate
# r, over a stretch of m months ending on a 31 December: V × (1 + r·m/12) + Σ_j c_j ×
# (1 + r·(m − j)/12), exact fractions, rounded half-up to the cent only in the output; money
# moved in December earns nothing that year. The property's value and loan from the default
# scenario's YearFigures until its sale year, 0 from that 31 December on (its proceeds are on
# the bank row) and its cash 0 from the January after; a property kept without a scenario at
# its value today with its loans along their schedule and the measured rental mean (the
# assumption line names it; no to-do any more). Other liabilities (a card) kept at the start
# value. Points: 31 December of each year after the newest closed month's year,
# `net_worth_years` of them, past any sale (until 25 Nov 2026 the points stopped before the
# earliest sale year, `ends_before_sale_year`, and a property without a scenario was a to-do).
#
# The rates in these cases are test inputs, deliberately uneven; no screen, default,
# placeholder or mockup may show them (§15.2). Step 0 recomputes every point on load and
# passes each through hausbuch.schemas.plan.ProjectionPoint (the total and the five change
# rows sum).
#
# Step 0's readings, recorded in docs/phases/phase-9.md §15.1:
# - a point's total is the sum of its rounded classes less its rounded liabilities (so
#   31 Dec 2031 is 233,068.74 and 31 Dec 2032 257,747.90 in the cases where nothing moves);
# - "used up inside the projection" keeps the points before the month the reserve row falls
#   below 0 and drops every point from that month on;
# - a class needs a typed rate when it has a value at the start, a plan pays into it, or the
#   split moves money into it; a class with none of these stays 0 and needs none.
#
# The household's reserve target is phase 9's honest one, 6 × the need 3,853.33 = 23,119.98
# (health_worked.yaml). Only the cases that name a `split` move money above it; the others
# have no split (services: EffectiveSplit source none), so nothing moves and they keep the
# values phase 9 gave them. The split 72.7 / 27.3 is the one the savings plans give
# (400 ÷ 550 = 72.7 %, rules/investment_split.shares).
bases:
  month: &month {mean_income: "5583.33", mean_regular_spending: "4116.67", mean_rental_cash: "-353.33", buffer_percent: "10"}
  start: &start {month_end: "2027-05-31", run: run-2027-05, bank: "19950.00", depot: "21500.00",
    crypto: "4150.00", property: "320000.00", loans: "236400.00", other_liabilities: "820.00"}
  reserve: &reserve "16830.00"
  plans: &plans [{key: depot, asset_class: depot, monthly: "400.00"}, {key: exchange, asset_class: crypto, monthly: "150.00"}]
  flat: &flat
    sale_year: 2035
    net_proceeds: "154000.00"
    years:
      2028: {value: "324800.00", loan_balance: "230350.00", net_cash: "-1512.00", tax_effect: "-900.00"}
      2029: {value: "329672.00", loan_balance: "226420.00", net_cash: "-1512.00", tax_effect: "-900.00"}
      2030: {value: "334617.08", loan_balance: "222400.00", net_cash: "-1512.00", tax_effect: "-900.00"}
      2031: {value: "339636.34", loan_balance: "218290.00", net_cash: "-1512.00", tax_effect: "-900.00"}
      2032: {value: "344730.88", loan_balance: "214090.00", net_cash: "-1512.00", tax_effect: "-900.00"}
      2033: {value: "349901.84", loan_balance: "209790.00", net_cash: "-1512.00", tax_effect: "-900.00"}
      2034: {value: "355150.37", loan_balance: "205390.00", net_cash: "-1512.00", tax_effect: "-900.00"}
      2035: {value: "360477.63", loan_balance: "200890.00", net_cash: "-1512.00", tax_effect: "-900.00"}
  worked_rates: &worked_rates {depot: "0.037", crypto: "-0.015"}
  split: &split {depot: "72.7", crypto: "27.3"}
  household: &household
    newest_closed: "2027-05"
    closed_months: 3
    month: *month
    start: *start
    reserve: *reserve
    target: "23119.98"
    plans: *plans
    flats: {p1: *flat}

cases:
  - id: worked
    description: >-
      §15.2 with phase 10 D301: the money above the reserve target is invested in the split.
      Each month of 2027 R gains investable 1,002.00 (free 1,113.33 less the 10 % buffer
      111.33) − 550 plans = 452.00: 16,830 + 7 × 452 = 19,994.00 < 23,119.98, nothing moves,
      so 31 Dec 2027 is phase 9's. From 2028 the flat's year replaces the mean (−201.00 a
      month): free 1,265.66, buffer 126.57, investable 1,139.09, R gains 589.09 a month and
      passes the target in June 2028 (May 19,994 + 5 × 589.09 = 22,939.45 < 23,119.98; June
      19,994 + 6 × 589.09 = 23,528.54, of which 408.56 moves).
      From then R stays at 23,119.98, so the bank row stays at 19,950 + (23,119.98 − 16,830) =
      26,239.98, and 589.09 a month moves into funds (72.7 %) and crypto (27.3 %). Paid in by
      2032: the plans 36,850.00 + moved 38,509.40 (phase 9's saving to 2032) − 6,289.98 (the
      gap the reserve kept) = 69,069.42.
    <<: *household
    split: *split
    levers: {value_change: *worked_rates, net_worth_years: 5}
    expect:
      end_of_2027: {bank: "23114.00", depot: "24789.94", crypto: "5159.75"}
      points:
        - {"on": "2028-12-31", bank: "26239.98", depot: "33480.51", crypto: "7942.59", property: "324800.00", loans: "230350.00", other_liabilities: "820.00", total: "161293.08"}
        - {"on": "2029-12-31", bank: "26239.98", depot: "44827.06", crypto: "11527.67", property: "329672.00", loans: "226420.00", other_liabilities: "820.00", total: "185026.71"}
        - {"on": "2030-12-31", bank: "26239.98", depot: "56593.43", crypto: "15058.97", property: "334617.08", loans: "222400.00", other_liabilities: "820.00", total: "209289.46"}
        - {"on": "2031-12-31", bank: "26239.98", depot: "68795.16", crypto: "18537.30", property: "339636.34", loans: "218290.00", other_liabilities: "820.00", total: "234098.78"}
        - {"on": "2032-12-31", bank: "26239.98", depot: "81448.36", crypto: "21963.46", property: "344730.88", loans: "214090.00", other_liabilities: "820.00", total: "259472.68"}
      used_up: null
      todos: []

  - id: nothing_moves_without_a_split
    description: §15.2 as phase 9 computed it; with no split the reserve keeps everything
    <<: *household
    levers: {value_change: *worked_rates, net_worth_years: 5}
    expect:
      end_of_2027: {bank: "23114.00", depot: "24789.94", crypto: "5159.75"}
      points:
        - {"on": "2028-12-31", bank: "30183.08", depot: "30588.57", crypto: "6869.98", property: "324800.00", loans: "230350.00", other_liabilities: "820.00", total: "161271.63"}
        - {"on": "2029-12-31", bank: "37252.16", depot: "36601.75", crypto: "8554.55", property: "329672.00", loans: "226420.00", other_liabilities: "820.00", total: "184840.46"}
        - {"on": "2030-12-31", bank: "44321.24", depot: "42837.41", crypto: "10213.86", property: "334617.08", loans: "222400.00", other_liabilities: "820.00", total: "208769.59"}
        - {"on": "2031-12-31", bank: "51390.32", depot: "49303.80", crypto: "11848.28", property: "339636.34", loans: "218290.00", other_liabilities: "820.00", total: "233068.74"}
        - {"on": "2032-12-31", bank: "58459.40", depot: "56009.44", crypto: "13458.18", property: "344730.88", loans: "214090.00", other_liabilities: "820.00", total: "257747.90"}
      used_up: null
      todos: []

  - id: bank_equals_as_is_path
    description: >-
      bank(k) − bank(0) = R(k) − R(0) for every month (§7.5 (4)); with the split R stops at
      the target, so the difference is the gap 23,119.98 − 16,830.00 = 6,289.98
    <<: *household
    split: *split
    levers: {value_change: *worked_rates, net_worth_years: 5}
    expect: {as_is_reserve: {"2032-12": "23119.98"}, bank: {"2032-12-31": "26239.98"}, difference: "6289.98"}

  - id: bank_equals_as_is_path_without_split
    description: phase 9's case; nothing moves, so R grows like the bank row
    <<: *household
    levers: {value_change: *worked_rates, net_worth_years: 5}
    expect: {as_is_reserve: {"2032-12": "55339.40"}, bank: {"2032-12-31": "58459.40"}, difference: "38509.40"}

