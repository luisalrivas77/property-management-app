# Phase 9 (docs/phases/phase-9.md §15.2, §15.1 "end to end"): the invented household of §15.2
# with its lines, balances, stored runs and scenarios, run through every function of steps 1
# and 2 together. Owners A and B; every name, line and amount is invented.
#
# `household` holds what the services would read from the database: the accounts with their
# kinds and owner shares, the booked lines of March to May 2027 (signed as booked, a debit
# negative; `links` pairs the legs of a transfer between own accounts), the balances on
# 2 June 2027, the stored net worth runs, the flat with its loan and its default scenario, and
# the household scenario's levers (the limits of the marks as confirmed in the case).
#
# Step 0 checks on load that the expected figures agree with each other and with the per-function
# fixtures of §15.1 that quote §15.2 (savings_rate three_months, reserve default_accounts,
# debt one_loan, net_worth_series three_points, lights worked, surplus baseline,
# savings_plans depot_and_exchange, paths four_rows, plan_levers projection_year_replaces_mean,
# net_worth_projection worked): the same function gives the same figure everywhere. Reading the
# lines into months is step 1's (pending "1"), the plan and the projection step 2's
# (pending "2").
