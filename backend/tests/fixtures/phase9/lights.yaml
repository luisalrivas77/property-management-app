# Phase 9 (docs/phases/phase-9.md §5.6, D250, D240, §15.1): `rules/health/bands.light` and
# `lights`. Lower is better (ltv, debt_service_ratio, debt_ratio, debt_to_income): green at or
# below green, red above red, amber between. Higher is better (savings_rate): green at or above
# green, red below red. The reserve: green at or above its own target, red below
# `red × target`, amber between, compared in euros. A side without a limit gives no colour;
# a figure that is None has no mark; limits nobody confirmed (`bands: null`) colour nothing
# and add the to-do `bands_unconfirmed`. Compared at stored precision, never the display.
#
# `figures`: the values (`reserve` as amount and target). `bands`: the confirmed limits as
# stored in the default scenario's `levers.bands` (a list of BandLimits), or null. `expect`:
# per figure the colour (null = no mark) and the sentence codes of rules/health/bands.yaml.
# Step 0 recomputes every colour on load, and refuses the `refuses` cases through
# hausbuch.schemas.health.BandLimits.
#
# Step 0's reading, recorded in docs/phases/phase-9.md §15.1: `savings_rate.red_regular` is
# added to the red sentence only when the rate without one-offs is not below 0 (bands.yaml).
bases:
  worked_bands: &worked_bands
    - {figure: reserve, red: "0.5"}
    - {figure: savings_rate, red: "0"}
    - {figure: ltv, green: "0.60", red: "1.00"}
    - {figure: debt_service_ratio, green: "0.30", red: "0.40"}
  worked_figures: &worked_figures
    reserve: {amount: "16830.00", target: "26820.00"}
    # phase 10 D308 (amended 25 Nov 2026): the window's rate leaves the May one-off out, so
    # it is the old rate without one-offs, 0.2571; savings_rate_regular is gone (null)
    savings_rate: "0.2571"
    savings_rate_regular: null
    ltv: "0.7388"
    debt_service_ratio: "0.1537"
    debt_ratio: "0.6489"
    debt_to_income: "3.20"

cases:
  - id: worked
    description: §15.2
    figures: *worked_figures
    bands: *worked_bands
    expect:
      lights:
        reserve: {colour: amber, sentences: [reserve.amber]}
        # 0.2571 is not below red 0 and no green limit is set: no colour (was red, D308)
        savings_rate: {colour: null, sentences: []}
        ltv: {colour: amber, sentences: [ltv.intro, ltv.amber]}
        debt_service_ratio: {colour: green, sentences: [debt_service_ratio.intro, debt_service_ratio.green]}
        debt_ratio: {colour: null, sentences: []}
        debt_to_income: {colour: null, sentences: []}
      todos: []

  - id: on_the_limit_takes_the_better_colour
    figures: {ltv: "0.6000", debt_service_ratio: "0.4000", savings_rate: "0.0000", savings_rate_regular: "0.0000"}
    bands:
      - {figure: ltv, green: "0.60", red: "1.00"}
      - {figure: debt_service_ratio, green: "0.30", red: "0.40"}
      - {figure: savings_rate, green: "0.10", red: "0"}
    expect:
      lights:
        ltv: {colour: green, sentences: [ltv.intro, ltv.green]}
        debt_service_ratio: {colour: amber, sentences: [debt_service_ratio.intro, debt_service_ratio.amber]}
        savings_rate: {colour: amber, sentences: [savings_rate.amber]}
      todos: []

  - id: just_past_the_limit
    figures: {ltv: "1.0001", debt_service_ratio: "0.3001", savings_rate: "-0.0001", savings_rate_regular: "-0.0001"}
    bands:
      - {figure: ltv, green: "0.60", red: "1.00"}
      - {figure: debt_service_ratio, green: "0.30", red: "0.40"}
      - {figure: savings_rate, red: "0"}
    expect:
      lights:
        ltv: {colour: red, sentences: [ltv.intro, ltv.red]}
        debt_service_ratio: {colour: amber, sentences: [debt_service_ratio.intro, debt_service_ratio.amber]}
        savings_rate: {colour: red, sentences: [savings_rate.red]}
      todos: []

  - id: compared_unrounded
    description: both display as 60,0 %; the stored four decimals decide
    variants:
      - figures: {ltv: "0.6000"}
        bands: [{figure: ltv, green: "0.60", red: "1.00"}]
        expect: {lights: {ltv: {colour: green, sentences: [ltv.intro, ltv.green]}}, todos: []}
      - figures: {ltv: "0.6001"}
        bands: [{figure: ltv, green: "0.60", red: "1.00"}]
        expect: {lights: {ltv: {colour: amber, sentences: [ltv.intro, ltv.amber]}}, todos: []}

  - id: only_red_limit
    description: with only a red limit a figure is red or unmarked
    variants:
      - figures: {debt_ratio: "0.8000"}
        bands: [{figure: debt_ratio, red: "0.70"}]
        expect: {lights: {debt_ratio: {colour: red, sentences: [debt_ratio.intro, debt_ratio.red]}}, todos: []}
      - figures: {debt_ratio: "0.6489"}
        bands: [{figure: debt_ratio, red: "0.70"}]
        expect: {lights: {debt_ratio: {colour: null, sentences: []}}, todos: []}

  - id: unconfirmed_proposal_no_mark
    description: the same household before „Übernehmen“ on „Ampel-Grenzen festlegen“
    figures: *worked_figures
    bands: null
    expect:
      lights:
        reserve: {colour: null, sentences: []}
        savings_rate: {colour: null, sentences: []}
        ltv: {colour: null, sentences: []}
        debt_service_ratio: {colour: null, sentences: []}
        debt_ratio: {colour: null, sentences: []}
        debt_to_income: {colour: null, sentences: []}
      todos: [bands_unconfirmed]

  - id: figure_none_no_mark
    description: income_year ≤ 0 left the debt service ratio uncomputed
    figures: {debt_service_ratio: null, ltv: "0.7388"}
    bands: *worked_bands
    expect:
      lights:
        debt_service_ratio: {colour: null, sentences: []}
        ltv: {colour: amber, sentences: [ltv.intro, ltv.amber]}
      todos: []

  - id: reserve_against_own_target
    variants:
      - description: at the target
        figures: {reserve: {amount: "26820.00", target: "26820.00"}}
        bands: [{figure: reserve, red: "0.5"}]
        expect: {lights: {reserve: {colour: green, sentences: [reserve.green]}}, todos: []}
      - description: on half the target takes the better colour
        figures: {reserve: {amount: "13410.00", target: "26820.00"}}
        bands: [{figure: reserve, red: "0.5"}]
        expect: {lights: {reserve: {colour: amber, sentences: [reserve.amber]}}, todos: []}
      - description: below half the target
        figures: {reserve: {amount: "13409.99", target: "26820.00"}}
        bands: [{figure: reserve, red: "0.5"}]
        expect: {lights: {reserve: {colour: red, sentences: [reserve.red]}}, todos: []}

  - id: savings_rate_below_zero_red
    figures: {savings_rate: "-0.0500", savings_rate_regular: "-0.0500"}
    bands: [{figure: savings_rate, red: "0"}]
    expect: {lights: {savings_rate: {colour: red, sentences: [savings_rate.red]}}, todos: []}

  - id: savings_rate_one_off_sentence
    description: the second sentence only when the rate without one-offs is not below 0
    figures: {savings_rate: "-0.4648", savings_rate_regular: "0.2571"}
    bands: [{figure: savings_rate, red: "0"}]
    expect: {lights: {savings_rate: {colour: red, sentences: [savings_rate.red, savings_rate.red_regular]}}, todos: []}

  - id: own_green_limit_on_savings_rate
    description: a member typed a green limit; the app proposes none (D249)
    variants:
      - figures: {savings_rate: "0.1500", savings_rate_regular: "0.1500"}
        bands: [{figure: savings_rate, green: "0.15", red: "0"}]
        expect: {lights: {savings_rate: {colour: green, sentences: [savings_rate.green]}}, todos: []}
      - figures: {savings_rate: "0.1499", savings_rate_regular: "0.1499"}
        bands: [{figure: savings_rate, green: "0.15", red: "0"}]
        expect: {lights: {savings_rate: {colour: amber, sentences: [savings_rate.amber]}}, todos: []}

  - id: limits_in_wrong_order_refused
    refusals:
      - {band: {figure: ltv, green: "1.00", red: "0.60"}, refuses: band.limits_out_of_order}
      - {band: {figure: savings_rate, green: "0", red: "0.10"}, refuses: band.limits_out_of_order}
      - {band: {figure: reserve, green: "1.0"}, refuses: band.limits_out_of_order}
      - {band: {figure: reserve, red: "1.5"}, refuses: band.limits_out_of_order}

  - id: band_on_share_refused
    refusals:
      - {band: {figure: share_property, red: "0.80"}, refuses: band.share_refused}
      - {band: {figure: share_crypto, green: "0.05"}, refuses: band.share_refused}

  - id: every_sentence_passes_validator
    description: >-
      every sentence of rules/health/bands.yaml, its {f:} slots filled from the facts of
      explain_validator.yaml, passes the validator in both modes (D250 (7)); step 0 checks
      that each uses only {f:} slots and words of the vocabulary
    from_bands: true
