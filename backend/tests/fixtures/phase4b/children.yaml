# children.yaml: rules/tax/anlage_n/children.py and return_estimate.assessed_tax
# (docs/phases/phase-4b.md §5.10, D102, D109, D112).

# Synthetic numbers only (the repo is public). Loaded through tests/fixture_models_phase4b.py,
# which checks every value against the §7 schemas and recomputes each expectation on load;
# tests/test_phase4b_fixture_arithmetic.py recomputes them once more with the real tariff.
#
# months = max(birth month, January) … December (up to the 18th birthday's month); kindergeld =
# months × 259; allowances = (3,414 + 1,464) × 2 × months ÷ 12. est(z) = income_tax(z), or with
# benefits L: floor(z × rate), rate = income_tax(z + L) ÷ (z + L) cut to six decimals (D102).
# est_without = est(zvE), est_with = est(zvE − allowances); est = est_with + kindergeld when
# est_without − est_with > kindergeld, else est_without; credit = min(§35a credit, est); Soli and
# church tax on est_with − credit (§51a Abs. 2 S. 1). Without a context: total_tax.

bases:
  owners_plain: &owners_plain
  - {owner_id: 0000000a-0000-4000-8000-000000000001}
  - {owner_id: 0000000a-0000-4000-8000-000000000002}
  owners_church: &owners_church
  - {owner_id: 0000000a-0000-4000-8000-000000000001, church_tax: true, tax_state: BY}
  - {owner_id: 0000000a-0000-4000-8000-000000000002}

cases:
- id: born_march_ten_months
