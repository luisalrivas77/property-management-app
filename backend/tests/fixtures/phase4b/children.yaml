  tax_year: 2026
  zve: '62033'
  owners: *owners_plain
  household: {children: [{born_on: 2026-03-15}]}
  expect:
    assessed:
      zve: '62033'
      zve_after_allowances: '53903'
      est_without: '9010'
      est_with: '6746'
      est: '9010'
      est_final: '9010'
      children: {months: 10, kindergeld: '2590.00', allowances: '8130.00', saving: '2264',
                 favourable: kindergeld}
      soli: '0.00'
      church: '0.00'
      total: '9010.00'
    warnings: [{code: return.kindergeld_apply}]
