# return_estimate.yaml: rules/tax/return_estimate.py return_estimate (docs/phases/phase-4b.md
# §5.8, D101, D102, D109, D112).

# Synthetic numbers only (the repo is public). The household of §5.6: owners A and B take their
# rows from anlage_n.yaml by case id (`case`, with `drop_inputs` / `add_inputs`), the Anlage V
# result −7,948.66 stands for phase 3's anlage_v_2026.yaml case A, one child born 15 Mar 2026.
# Loaded through tests/fixture_models_phase4b.py, which checks every value against the §7
# schemas and recomputes each expectation on load; tests/test_phase4b_fixture_arithmetic.py
# recomputes the household chain once more with the real tariff.
#
# total_income = Σ Anlage N results + Σ Anlage V results; special_expenses = Σ Vorsorge +
# max(72, church tax paid + donations within 20 % of total_income, cut to the cent) + Σ per
# child min(80 % × childcare, 4,800); zvE = floor(total_income − special_expenses); assessed =
# assessed_tax (§5.10, as children.yaml) with L = Σ (Nr. 15 + typed benefits) less each owner's
# unused Pauschbetrag (§32b Abs. 2) and the §35a credit Σ per class min(20 % × labour, cap);
# withheld = Σ Nr. 4–7 over the certificates (or the payslip projection); result = assessed.total
# − withheld.total (negative = Erstattung). filing_required per §46 Abs. 2 with German reasons;
# the deadline is 31 July of the next year, moved to the next working day (Q-O24).

