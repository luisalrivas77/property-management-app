# vorsorge.yaml: rules/tax/anlage_n/vorsorge.py vorsorge (docs/phases/phase-4b.md §5.7).

# Synthetic numbers only (the repo is public). Owners A and B as in anlage_n.yaml. Loaded
# through tests/fixture_models_phase4b.py, which checks every value against the §7 schemas and
# recomputes each expectation on load.
#
# pension = max(0, min(Σ (23a + 23b + 22a), 30,826) − Σ 22a); health_care_basis = cents(Σ 25 ×
# 0.96) + Σ 26; other = max(basis, min(1,900, basis + Σ 27 + other insurance)) − basis;
# deductible = the sum. A vorsorge_override row replaces the three figures as typed (never cut);
# a payslip projection stands in for a missing certificate (source payslip).

