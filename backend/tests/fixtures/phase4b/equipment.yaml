                professional_share: {numerator: 1, denominator: 2}}
  years:
  - {tax_year: 2025, amount: '99.92'}
  - {tax_year: 2026, amount: '119.90'}
  - {tax_year: 2027, amount: '119.90'}
  - {tax_year: 2028, amount: '119.90'}
  - {tax_year: 2029, amount: '119.90'}
  - {tax_year: 2030, amount: '19.98'}
  - {tax_year: 2031, amount: '0.00'}
