# equipment.yaml: rules/tax/anlage_n/equipment.py equipment_lines (docs/phases/phase-4b.md §5.5,
# D100 (3), D108).

# Synthetic numbers only (the repo is public). Loaded through tests/fixture_models_phase4b.py,
# which checks every value against the §7 schemas and recomputes each expectation on load.
#
# Per item and year Y: net = the typed net or cents(gross ÷ 1.19); base = cents(gross × share);
# a subscription → base in its year; net ≤ 800 or a full_in_year class (computer, software) →
# base in the purchase year; otherwise linear AfA over the life in months (the class default,
# or the typed life; an `other` item needs one: anlage_n.useful_life_missing), from the purchase
# month inclusive, half-up per year, the final year taking the remainder; bought_on may precede
# Y. With disposed_on: the disposal year counts the months through the disposal month, nothing
# after. `full_life_sum` checks the slices of every year add up to the base.

cases:
- id: laptop_1500_full_in_year
  description: gross 1,500.00, net 1,260.50 > 800, a computer → 1,500.00 in 2026, nothing in 2027
  item: {label: Laptop, item_class: computer, gross: '1500.00', bought_on: 2026-03-10}
  years:
  - {tax_year: 2026, amount: '1500.00'}
  - {tax_year: 2027, amount: '0.00'}
- id: monitor_gwg_70pct
  description: gross 950.81, net 799.00 ≤ 800, share 0.7 → 665.57
  item: {label: Monitor, item_class: computer, gross: '950.81', bought_on: 2026-05-04,
         professional_share: {numerator: 7, denominator: 10}}
  years:
  - {tax_year: 2026, amount: '665.57'}
- id: phone_2025_slice_2026
