# questionnaire.yaml: rules/tax/questionnaire.py prefill, progress, reminders and
# extraordinary_threshold (docs/phases/phase-4b.md §4.2, §5.11, D110, D112).

# Synthetic numbers only (the repo is public). Owners A and B and one flat, on the 2026 file
# rules/tax/questionnaire/2026.yaml (25 questions: 17 per owner, 6 for the household, 2 per
# property → 42 slots). Loaded through tests/fixture_models_phase4b.py, which checks every
# value against the §7 schemas and recomputes each expectation on load.
#
# prefill: per slot the previous year's current answer (when the key is in this year's file)
# carried as the proposed answer unless carry_forward is none or it was not_applicable, else the
# question's default_answer; for copy targets the previous year's rows of the kind as proposed
# rows with carried_from_id (dates moved by a year); for reconfirm targets the spanning rows
# still in force (a child under 18, an item with a slice in the year) listed, never copied.
# progress: a slot is answered when a current answer of the year exists. `slots` names only the
# slots it asserts; the others are not checked.

