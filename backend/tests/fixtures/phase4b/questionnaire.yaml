     owner_id: 0000000a-0000-4000-8000-000000000002, answer: 'yes'}
  prior_rows: [*commute_b_2025]
  expect:
    slot_count: 42
    slots:
    - key: owner.commute
      owner_id: 0000000a-0000-4000-8000-000000000002
      prior_answer_id: 0000004b-0000-4000-8000-000000000111
      proposed_answer: 'yes'
      proposed_rows:
      - owner_id: 0000000a-0000-4000-8000-000000000002
        kind: commute
        tax_year: 2026
        carried_from_id: 0000004b-0000-4000-8000-000000000101
        value: {kind: first_workplace, workplace_label: Büro, period_from: 2026-01-01,
