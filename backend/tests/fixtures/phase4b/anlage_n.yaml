# anlage_n.yaml: rules/tax/anlage_n/draft.py draft_n with other.py (docs/phases/phase-4b.md
# §5.6, D100).

# Synthetic numbers only (the repo is public). The household of §5.6 is invented: owner A
# works fully remote from a work room and bought a phone in 2025; owner B commutes by car,
# works from home on some days and was on short-time work for part of the year; both are
# statutory-insured employees outside a church at the fictional employer "Muster GmbH".
# Loaded through tests/fixture_models_phase4b.py, which checks every value against the §7
# schemas and recomputes each expectation on load. return_estimate.yaml and vorsorge.yaml
# take the owners' rows from here by case id.
#
# wk_itemised = commute + Tagespauschale + work room + equipment + telecom + dues + training +
# other; wk_applied = union dues + max(min(1,230, gross), wk_itemised − union dues) (§9a S. 3
# from 2026); result = gross − wk_applied. `lines` are the money lines by key (module
# docstring of fixture_models_phase4b.py); `components` the pieces of wk_itemised.

