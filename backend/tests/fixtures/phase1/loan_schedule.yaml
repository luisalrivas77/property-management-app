      - {number: 5, due_on: 2025-06-01, rate: "0.05", opening_balance: "16310.35", interest: "67.96", principal: "932.04", payment: "1000.00", closing_balance: "15378.31"}
      - {number: 6, due_on: 2025-07-01, rate: "0.08", opening_balance: "15378.31", interest: "102.52", principal: "897.48", payment: "1000.00", closing_balance: "14480.83"}
      - {number: 7, due_on: 2025-08-01, rate: "0.08", opening_balance: "14480.83", interest: "96.54", principal: "903.46", payment: "1000.00", closing_balance: "13577.37"}
      - {number: 8, due_on: 2025-09-01, rate: "0.08", opening_balance: "13577.37", interest: "90.52", principal: "909.48", payment: "1000.00", closing_balance: "12667.89"}
      - {number: 9, due_on: 2025-10-01, rate: "0.08", opening_balance: "12667.89", interest: "84.45", principal: "915.55", payment: "1000.00", closing_balance: "11752.34"}
      - {number: 10, due_on: 2025-11-01, rate: "0.08", opening_balance: "11752.34", interest: "78.35", principal: "921.65", payment: "1000.00", closing_balance: "10830.69"}
      - {number: 11, due_on: 2025-12-01, rate: "0.08", opening_balance: "10830.69", interest: "72.20", principal: "927.80", payment: "1000.00", closing_balance: "9902.89"}
