  - id: payment_below_interest
    description: 6 % on 100k is 500.00 interest a month; a 400.00 payment never amortizes.
    terms:
      principal: "100000.00"
      nominal_rate: "0.06"
      monthly_payment: "400.00"
      disbursed_on: 2025-01-01
      first_payment_on: 2025-02-01
    expect:
      error: {code: loan.payment_does_not_cover_interest, at_number: 1}

  - id: payment_below_interest_after_switch
    description: Amortizes at 3 %, but at the 6 % follow-up rate interest exceeds the payment.
    terms:
      principal: "100000.00"
      nominal_rate: "0.03"
      monthly_payment: "450.00"
      disbursed_on: 2025-01-01
      first_payment_on: 2025-02-01
      fixed_until: 2025-12-31
      follow_up_rate: "0.06"
    expect:
      error: {code: loan.payment_does_not_cover_interest, at_number: 12}
