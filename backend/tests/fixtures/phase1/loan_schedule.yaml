# Rule fixture: loan repayment schedule (hausbuch.rules.loan_schedule.build_schedule)
#
# Conventions (docs/phases/phase-1.md#loan-schedule):
# - Monthly annuity, payable in arrears. Payment n is due on first_payment_on + (n-1) months,
#   on the same day of month, clamped to the month's last day (30th -> Feb 28).
# - Interest is 30E/360: period 1 = balance * rate * days360(disbursed_on, first_payment_on) / 360;
#   every later period = balance * rate / 12. Rounded half-up to the cent each period.
# - Rate: nominal_rate while due_on <= fixed_until, then follow_up_rate (null -> nominal_rate).
#   The monthly payment does not change at the switch.
# - principal = payment - interest. Final payment = remaining balance + interest.
# - A period whose interest >= payment is an error (the loan would never amortize).
# - years: totals per calendar year of due_on; closing_balance = after that year's last payment.
#
# Synthetic examples, computed with an independent reference script and spot-checked by hand
# (e.g. entry 3 of full_first_month: 298998.50 * 0.036 / 12 = 896.9955 -> 897.00).
# entries / years list a subset, matched by number / year; entry_count is the full length.

cases:
  - id: full_first_month
    description: Disbursed exactly one month before the first payment; 10-year Zinsbindung, no follow_up_rate, so the rate stays 3.6 % to payoff.
    terms:
      principal: "300000.00"
      nominal_rate: "0.036"
      monthly_payment: "1400.00"
      disbursed_on: 2024-04-01
      first_payment_on: 2024-05-01
      fixed_until: 2034-04-30
    expect:
      entry_count: 344
      entries:
      - {number: 1, due_on: 2024-05-01, rate: "0.036", opening_balance: "300000.00", interest: "900.00", principal: "500.00", payment: "1400.00", closing_balance: "299500.00"}
      - {number: 2, due_on: 2024-06-01, rate: "0.036", opening_balance: "299500.00", interest: "898.50", principal: "501.50", payment: "1400.00", closing_balance: "298998.50"}
      - {number: 3, due_on: 2024-07-01, rate: "0.036", opening_balance: "298998.50", interest: "897.00", principal: "503.00", payment: "1400.00", closing_balance: "298495.50"}
      - {number: 120, due_on: 2034-04-01, rate: "0.036", opening_balance: "228621.26", interest: "685.86", principal: "714.14", payment: "1400.00", closing_balance: "227907.12"}
      - {number: 121, due_on: 2034-05-01, rate: "0.036", opening_balance: "227907.12", interest: "683.72", principal: "716.28", payment: "1400.00", closing_balance: "227190.84"}
      - {number: 344, due_on: 2052-12-01, rate: "0.036", opening_balance: "1006.79", interest: "3.02", principal: "1006.79", payment: "1009.81", closing_balance: "0.00"}
      years:
      - {year: 2024, interest: "7157.75", principal: "4042.25", payment: "11200.00", closing_balance: "295957.75"}
      - {year: 2025, interest: "10552.07", principal: "6247.93", payment: "16800.00", closing_balance: "289709.82"}

  - id: partial_first_period
    description: Disbursed mid-month; 44-day first period (30E/360); due on the 30th, clamped in February.
    terms:
      principal: "300000.00"
      nominal_rate: "0.036"
      monthly_payment: "1400.00"
      disbursed_on: 2024-04-16
      first_payment_on: 2024-05-30
      fixed_until: 2034-04-30
    expect:
      entry_count: 345
      entries:
      - {number: 1, due_on: 2024-05-30, rate: "0.036", opening_balance: "300000.00", interest: "1320.00", principal: "80.00", payment: "1400.00", closing_balance: "299920.00"}
      - {number: 2, due_on: 2024-06-30, rate: "0.036", opening_balance: "299920.00", interest: "899.76", principal: "500.24", payment: "1400.00", closing_balance: "299419.76"}
      - {number: 9, due_on: 2025-01-30, rate: "0.036", opening_balance: "296386.64", interest: "889.16", principal: "510.84", payment: "1400.00", closing_balance: "295875.80"}
