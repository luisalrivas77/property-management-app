# Rule fixture: loan repayment schedule (hausbuch.rules.loan_schedule.build_schedule)
#
# Conventions (docs/phases/phase-1.md#loan-schedule):
# - Monthly annuity, payable in arrears. Payment n is due on first_payment_on + (n-1) months,
#   on the same day of month, clamped to the month's last day (30th -> Feb 28).
# - Interest is 30E/360 and accrues over the period it pays for, in arrears: from the previous
#   due date (disbursed_on for payment 1) up to but not including due_on. Period 1 has
#   days360(disbursed_on, first_payment_on) days; every later period has 30.
# - interest_only_before_first_payment (default false; added 2026-11-08): the lender charges
#   interest only before first_payment_on, outside the schedule (a loan paid out in parts).
#   Period 1 then runs from one month before first_payment_on and has 30 days, on the full
#   principal; when disbursed_on is later than that (paid out less than a month before the
#   first payment) period 1 stays days360(disbursed_on, first_payment_on).
# - Each day accrues at the rate in force that day: nominal_rate up to and including
#   fixed_until, follow_up_rate after it (null -> nominal_rate); standard per-day accrual.
#   Let switch = the day after fixed_until. A period with due_on <= switch is entirely at
#   nominal_rate; one starting on or after switch is entirely at follow_up_rate. A period
#   straddling it gets days_new = min(period days, days360(switch, due_on)) at follow_up_rate
#   and days_old = period days - days_new at nominal_rate. (Measured from the switch because
#   days360 between clamped month-end dates is not 30: Jan 30 -> Feb 28 measures 28.)
#   Interest = balance * (rate_old * days_old + rate_new * days_new) / 360, rounded half-up to
#   the cent once per period. The monthly payment does not change at the switch.
# - rate (per entry) is the rate in force on the period's last day.
#
# Changed 2026-11-05 (Luis): the earlier rule charged a whole period at the follow-up rate when
# its due date fell after fixed_until. With payments in arrears that charged the last fixed
# month (e.g. June, paid on 1 July) at the new rate. Cases follow_up_rate_to_payoff and
# payment_below_interest_after_switch were recomputed; mid_period_rate_switch was added.
# Same day, after review: the split is decided by date first and the follow-up days are
# counted from the switch; three month-end cases (payments on the 30th) were added.
# - principal = payment - interest. Final payment = remaining balance + interest.
# - A period whose interest >= payment is an error (the loan would never amortize).
# - More than 1,200 payments (100 years) is an error, loan.term_too_long, at payment 1201
#   (spec amendment 1: a nonsensical payment used to loop and fail uncoded).
# - Each entry carries interest_days (the period's 30E/360 days) and follow_up_days (those
#   after fixed_until, at the follow-up rate), so the interest is traceable from the entry:
#   interest = opening_balance * (nominal * (interest_days - follow_up_days)
#              + follow_up * follow_up_days) / 360, rounded half-up (principle 2).
# - years: totals per calendar year of due_on; closing_balance = after that year's last payment.
#
# Synthetic examples, computed with an independent exact-fraction reference and spot-checked by hand
# (e.g. entry 3 of full_first_month: 298998.50 * 0.036 / 12 = 896.9955 -> 897.00).
# entries / years list a subset, matched by number / year; entry_count is the full length.

cases:
  - id: full_first_month
    description: Disbursed exactly one month before the first payment; 10-year Zinsbindung, no follow_up_rate, so the rate stays 3.6 % to payoff.
    terms:
      principal: "300000.00"
      nominal_rate: "0.036"
      monthly_payment: "1400.00"
      disbursed_on: 2024-04-01
      first_payment_on: 2024-05-01
      fixed_until: 2034-04-30
