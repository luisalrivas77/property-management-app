  # --- Phase 3 D142: a bank line proves a deposit -------------------------------------------
  # The deposits of tenancies taken over with the property reach the buyer as one bank line
  # from the seller at the handover. A deposit line linked to the tenancy is its proof; the
  # unlinked rest is offered on the missing items, with the tenancies it could be split to.

  - id: deposit_proven_by_a_bank_line_and_the_rest_offered
    description: >
      T1's 1,000 line is linked to it: present, no documents, the line in bank_lines. A 2,000
      line from the same handover is unlinked: T2 and T3 (1,000 each, cash) are missing and
      both are offered that line with both as candidates. The rent part of the same bank line
      is not a deposit line.
    tax_year: 2024
    today: 2024-11-06
    facts:
      <<: *efh
      units: [{id: *U1, label: WE 1}]
      tenancies:
        - {id: *T1, unit_id: *U1, start_date: 2023-01-01, deposit_form: cash_account, deposit_amount: "1000.00"}
        - {id: *T2, unit_id: *U1, start_date: 2023-02-01, deposit_form: cash_account, deposit_amount: "1000.00"}
        - {id: *T3, unit_id: *U1, start_date: 2023-03-01, deposit_form: cash_account, deposit_amount: "1000.00"}
      allocations:
        - {id: *A1, category: deposit_in, amount: "1000.00", booking_date: 2024-05-03, tax_year: 2024,
           tenancy_id: *T1, transaction_id: *X1}
        - {id: *A2, category: deposit_in, amount: "2000.00", booking_date: 2024-05-03, tax_year: 2024,
           transaction_id: *X2}
        - {id: *A3, category: rent_cold, amount: "122.00", booking_date: 2024-05-03, tax_year: 2024,
           transaction_id: *X2}
    expect:
      - {code: purchase_contract, status: missing, scope: {type: property, id: *P}}
      - {code: price_split, status: missing, scope: {type: property, id: *P}}
      - {code: lease, status: missing, scope: {type: tenancy, id: *T1, unit_label: WE 1, tenancy_start: 2023-01-01}}
      - {code: lease, status: missing, scope: {type: tenancy, id: *T2, unit_label: WE 1, tenancy_start: 2023-02-01}}
      - {code: lease, status: missing, scope: {type: tenancy, id: *T3, unit_label: WE 1, tenancy_start: 2023-03-01}}
      - code: deposit_record
        status: present
        scope: {type: tenancy, id: *T1, unit_label: WE 1, tenancy_start: 2023-01-01}
        bank_lines:
          - {allocation_id: *A1, transaction_id: *X1, booking_date: 2024-05-03, amount: "1000.00"}
      - code: deposit_record
        status: missing
        scope: {type: tenancy, id: *T2, unit_label: WE 1, tenancy_start: 2023-02-01}
