  # --- Tenancies --------------------------------------------------------------------------

  - id: tenancy_items_by_start_date
    description: >
      T1 was taken over with the property (started before purchase_date): lease and deposit,
      no handover protocol. T2 started on purchase_date with no deposit: lease and handover.
      T3 started after: all three. A lease linked to the unit, not the tenancy, does not count.
      All leases first, then handovers, then deposits, each by start_date.
    tax_year: 2026
    today: 2026-11-06
    facts:
      <<: *efh
      units:
        - {id: *U2, label: Stellplatz 4}
        - {id: *U1, label: WE 1}
      tenancies:
        - {id: *T3, unit_id: *U1, start_date: 2026-05-01, deposit_form: bank_guarantee}
        - {id: *T2, unit_id: *U2, start_date: 2024-05-01, deposit_form: none}
        - {id: *T1, unit_id: *U1, start_date: 2019-08-01, end_date: 2026-03-31, deposit_form: cash_account}
      documents:
        - {id: *D1, type: contract, subtype: lease, received_at: 2026-11-01T09:00:00Z,
           links: [{target_type: tenancy, target_id: *T1}]}
        - {id: *D2, type: contract, subtype: lease, received_at: 2026-11-01T10:00:00Z,
           links: [{target_type: unit, target_id: *U1}]}
        - {id: *D3, type: other, subtype: handover_protocol, received_at: 2026-11-01T11:00:00Z,
           links: [{target_type: tenancy, target_id: *T3}]}
        - {id: *D4, type: statement, subtype: deposit_record, received_at: 2026-11-01T12:00:00Z,
           links: [{target_type: tenancy, target_id: *T1}]}
    expect:
      - {code: purchase_contract, status: missing, scope: {type: property, id: *P}}
      - {code: price_split, status: missing, scope: {type: property, id: *P}}
      - {code: grundsteuerbescheid, status: missing, scope: {type: property, id: *P}}
      - code: lease
        status: present
        scope: {type: tenancy, id: *T1, unit_label: WE 1, tenancy_start: 2019-08-01}
        documents: [*D1]
      - code: lease
        status: missing
        scope: {type: tenancy, id: *T2, unit_label: Stellplatz 4, tenancy_start: 2024-05-01}
      - code: lease
        status: missing
        scope: {type: tenancy, id: *T3, unit_label: WE 1, tenancy_start: 2026-05-01}
      - code: handover_protocol
        status: missing
        scope: {type: tenancy, id: *T2, unit_label: Stellplatz 4, tenancy_start: 2024-05-01}
      - code: handover_protocol
        status: present
        scope: {type: tenancy, id: *T3, unit_label: WE 1, tenancy_start: 2026-05-01}
        documents: [*D3]
      - code: deposit_record
        status: present
        scope: {type: tenancy, id: *T1, unit_label: WE 1, tenancy_start: 2019-08-01}
        documents: [*D4]
      - code: deposit_record
        status: missing
        scope: {type: tenancy, id: *T3, unit_label: WE 1, tenancy_start: 2026-05-01}

  - id: tenancies_outside_the_year_have_no_items
    description: >
      T1 ended on 31 Dec Y-1 and T2 starts on 1 Jan Y+1: no items. T3 ended on 1 Jan Y and T4
      starts on 31 Dec Y: both overlap Y.
    tax_year: 2026
    today: 2026-11-06
    facts:
      <<: *efh
      units:
        - {id: *U1, label: WE 1}
        - {id: *U2, label: Stellplatz 4}
      tenancies:
        - {id: *T1, unit_id: *U1, start_date: 2020-01-01, end_date: 2025-12-31, deposit_form: cash_account}
        - {id: *T2, unit_id: *U1, start_date: 2027-01-01, deposit_form: cash_account}
        - {id: *T3, unit_id: *U2, start_date: 2018-03-01, end_date: 2026-01-01, deposit_form: none}
        - {id: *T4, unit_id: *U2, start_date: 2026-12-31, deposit_form: none}
    expect:
      - {code: purchase_contract, status: missing, scope: {type: property, id: *P}}
      - {code: price_split, status: missing, scope: {type: property, id: *P}}
      - {code: grundsteuerbescheid, status: missing, scope: {type: property, id: *P}}
      - code: lease
        status: missing
        scope: {type: tenancy, id: *T3, unit_label: Stellplatz 4, tenancy_start: 2018-03-01}
      - code: lease
        status: missing
        scope: {type: tenancy, id: *T4, unit_label: Stellplatz 4, tenancy_start: 2026-12-31}
      - code: handover_protocol
        status: missing
        scope: {type: tenancy, id: *T4, unit_label: Stellplatz 4, tenancy_start: 2026-12-31}

  # --- WEG documents (ETW) ------------------------------------------------------------------

  - id: weg_documents_linked_to_the_property_or_a_unit_count
    description: >
      a Wirtschaftsplan linked to the unit counts; a Hausgeldabrechnung linked to the property
      counts; next year's Wirtschaftsplan does not
    tax_year: 2025
    today: 2026-11-06
    facts:
      <<: *etw
      units: [{id: *U1, label: WE 1}]
      documents:
        - {id: *D1, type: wirtschaftsplan, tax_year: 2025, received_at: 2025-01-10T09:00:00Z,
           links: [{target_type: unit, target_id: *U1}]}
        - {id: *D2, type: hausgeldabrechnung, tax_year: 2025, received_at: 2026-05-10T09:00:00Z,
           links: [{target_type: property, target_id: *P}]}
        - {id: *D3, type: wirtschaftsplan, tax_year: 2026, received_at: 2025-12-10T09:00:00Z,
           links: [{target_type: property, target_id: *P}]}
    expect:
      - {code: purchase_contract, status: missing, scope: {type: property, id: *P}}
      - {code: price_split, status: missing, scope: {type: property, id: *P}}
      - {code: grundsteuerbescheid, status: missing, scope: {type: property, id: *P}}
      - {code: wirtschaftsplan, status: present, due_on: 2025-01-01, scope: {type: property, id: *P}, documents: [*D1]}
      - {code: hausgeldabrechnung, status: present, due_on: 2026-06-30, scope: {type: property, id: *P}, documents: [*D2]}

  - id: weg_documents_without_tax_year_are_incomplete
    description: >
      both incomplete (the Hausgeldabrechnung before it is due); a Wirtschaftsplan linked to
      another property is ignored
    tax_year: 2026
    today: 2026-11-06
    facts:
      <<: *etw
      units: [{id: *U1, label: WE 1}]
      documents:
        - {id: *D1, type: wirtschaftsplan, received_at: 2026-01-10T09:00:00Z,
           links: [{target_type: property, target_id: *P}]}
        - {id: *D2, type: hausgeldabrechnung, received_at: 2026-05-10T09:00:00Z,
           links: [{target_type: unit, target_id: *U1}]}
        - {id: *D3, type: wirtschaftsplan, tax_year: 2026, received_at: 2026-01-11T09:00:00Z,
           links: [{target_type: property, target_id: *P_OTHER}]}
    expect:
      - {code: purchase_contract, status: missing, scope: {type: property, id: *P}}
      - {code: price_split, status: missing, scope: {type: property, id: *P}}
      - {code: grundsteuerbescheid, status: missing, scope: {type: property, id: *P}}
      - {code: wirtschaftsplan, status: incomplete, due_on: 2026-01-01, scope: {type: property, id: *P}, documents: [*D1]}
      - {code: hausgeldabrechnung, status: incomplete, due_on: 2027-06-30, scope: {type: property, id: *P}, documents: [*D2]}

