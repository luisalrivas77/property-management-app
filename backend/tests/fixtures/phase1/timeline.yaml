# Rule fixture: History timeline (hausbuch.rules.timeline.build_history)
#
# build_history(events, scope) -> list[TimelineEntry]
# 1. Scope: property scope = events with property_id = scope.property_id.
#    Unit scope = those with unit_id = scope.unit_id OR unit_id null (purchase, loans).
# 2. Milestones only: events with an effective_date. Everything else is audit trail.
# 3. Corrections: follow corrects_event_id chains A -> B -> C. Emit one entry per chain from
#    the latest event (C): its date and payload; corrected = true;
#    original_effective_date = A's date; root_event_id = A.
# 4. Order by (effective_date, root event seq). Using the root's seq keeps a corrected move-in
#    ahead of the rent row recorded right after it.
#
# Scenario (the phase 1 done criterion): an ETW with a flat and a parking space, bought in
# 2024, financed, let from July 2024; two dates corrected after the fact.

