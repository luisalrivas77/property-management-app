# Phase 9 D255, D256, §9.1: the word lists and tables of the explanation's validator.
# Versioned; the version is stored with every plan_explanation (validator_version). Read by
# rules/advice/validator.py (step 4). Every list is lower-case and compared after NFKC and
# lower-casing, except `short_upper_case`, which holds tokens as written.
#
# Step 0's readings, recorded in docs/phases/phase-9.md §15.1:
# - Check 1 runs on the text outside the slots; inside a slot the grammar of check 2 applies,
#   so the `_` and the digits of a slot key ({f:reserve_gap}, {k:k1}) are not check 1's.
# - Forms of a word are listed out, as German inflects; a separable verb is listed in its
#   joined forms (aufstocken, aufgestockt, aufzustocken), and its split form ("stockt … auf")
#   is caught by the stem ("stockt") in the same list.
#
# Amended 19 Nov 2026 (D255, D256 amended, the step 4a review; docs/phases/phase-9.md §9.1):
# checks 9 and 13 read the recommendation and the transaction words as one list; the closed
# `descriptive_words` of check 9; the `colour_words` and `future_phrases`; the reserve's, the
# trend's and the lights' contradiction rows hold in every paragraph (a row without `topic`).
version: advice-rules-2026-11-19

# Check 1: after NFKC, every character outside a slot is one of these. Anything else (another
# script, a format character, $ / @ & % # _ and digits) is a violation.
allowed_characters:
  letters: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZäöüÄÖÜß"
  other: " .,;:!?-–()„“\"'{}"

# Check 2: the slot grammar.
slot_pattern: "\\{([fkpca]):([a-z0-9_]+)\\}"
slots_by_mode:
  own_use: [f, k, p, c, a]
  generic: [f, c]

# Check 5: upper-case tokens of 2 to 6 letters allowed outside a slot; a run of three or more
# single letters is a name spelled with spaces.
short_upper_case: [ETF, EUR, KI]
single_letter_run: 3

# Check 6.
link_markers: [www, http, https]

# Check 7: an entry of this length or longer is searched in the text with spaces, hyphens and
# dots removed; a shorter one as a whole word, also with its hyphens removed (§9.2).
squash_min_length: 6

# Check 4: number and fraction words, so no amount is smuggled in words.
number_words: ["null", eins, zwei, drei, vier, fünf, sechs, sieben, acht, neun, zehn, elf, zwölf,
  dreizehn, vierzehn, fünfzehn, sechzehn, siebzehn, achtzehn, neunzehn, zwanzig, dreißig,
  vierzig, fünfzig, sechzig, siebzig, achtzig, neunzig, hundert, hunderte, tausend, tausende,
  million, millionen, milliarde, milliarden, dutzend, paar]
fraction_words: [hälfte, halb, halbe, halben, halber, drittel, viertel, fünftel, zehntel,
  hundertstel, doppelt, doppelte, doppelten, dreifach, dreifache, vierfach, zweimal, dreimal,
  prozent, prozentpunkte]

# Check 8b: product nouns. A compound containing one must be in `permitted_compounds`; a
# capitalised word directly before one, or hyphenated to it, must be a function word or a
# permitted compound.
product_nouns: [etf, etfs, fonds, aktie, aktien, anleihe, anleihen, zertifikat, zertifikate,
  sparplan, sparpläne, sparplans, depot, depots, coin, coins, token, tokens, kryptowährung,
  kryptowährungen, index, indexfonds]
permitted_compounds: [aktienfonds, indexfonds, rentenfonds, mischfonds, geldmarktfonds,
  immobilienfonds, wertpapierdepot, wertpapierdepots, fondssparplan, fondssparpläne,
  sparplan, sparpläne, sparplans, kryptowährung, kryptowährungen]
function_words: [der, die, das, den, dem, des, ein, eine, einen, einem, einer, eines, euer,
  eure, euren, eurem, eurer, eures, dein, deine, deinen, deinem, deiner, deines, kein, keine,
  keinen, keinem, keiner, jeder, jede, jeden, jedem, dieser, diese, diesen, diesem, im, in,
  ins, am, an, beim, vom, zum, zur, mit, ohne, für, auf, aus, bei, als, und, oder, ihr, ihre,
  ihren, ihrem, ihrer]

# Check 9 (D256): no recommendation word in a sentence with an {a:} slot, in both modes.
recommendation_words: [kaufen, kauft, kaufe, kaufst, kauf, kaufte, kauften, gekauft, zukaufen,
  verkaufen, verkauft, verkaufe, verkaufst, verkauf, verkaufte, verkauften,
  aufstocken, aufgestockt, aufzustocken, stockt, stockst, reduzieren, reduziert, reduziere,
  reduzierst, umschichten, umgeschichtet, umzuschichten, schichtet, halten, haltet, hältst,
  hält, gehalten, behalten, behaltet, behältst, behält, empfehlen, empfehle, empfiehlt,
  empfehlt, empfohlen, empfehlung, empfehlenswert, sollte, solltest, solltet, sollten, soll,
  sollst, lohnt, lohnen, lohnend, lohnenswert, ratsam,
  # 19 Nov 2026: the transaction words' forms, so both lists hold every form (checks 9, 13)
  nachkaufen, nachgekauft, nachzukaufen, abstoßen, abgestoßen, abzustoßen, stoßt, stößt,
  nachlegen, nachgelegt, nachzulegen, zulegen, zuzulegen, aufbauen, aufgebaut, aufzubauen,
  abbauen, abgebaut, abzubauen, umlegen, umgelegt, umzulegen, auflösen, aufgelöst, aufzulösen,
  erhöhen, erhöht, senken, gesenkt, besparen, bespart, investieren, investiert,
  investiere, investierst, ratschlag, tipp]

# D256 amended 16 Nov 2026: a transaction word may not stand in a sentence with a {c:} slot or
# with the slot of a marked figure (check 13), nor anywhere in a `projection` paragraph
# (check 12).
transaction_words: [kaufen, kauft, kaufe, kaufst, kauf, gekauft, verkaufen, verkauft, verkaufe,
  verkaufst, verkauf, aufstocken, aufgestockt, aufzustocken, stockt, reduzieren,
  reduziert, reduziere, umschichten, umgeschichtet, umzuschichten, schichtet, nachkaufen,
  nachgekauft, nachzukaufen, abstoßen, abgestoßen, abzustoßen, stoßt, stößt,
  # 19 Nov 2026: the recommendation words' forms of buying and selling (checks 9, 12, 13)
  kaufte, kauften, zukaufen, verkaufte, verkauften, stockst, reduzierst, abstoßt, nachlegen,
  nachgelegt, nachzulegen, umlegen, umgelegt, umzulegen, auflösen, aufgelöst, aufzulösen,
  investieren, investiert, investiere, investierst]

# Entries with a space are phrases, matched as consecutive words.
# Check 12 (added 16 Nov 2026): a `projection` paragraph holds a typed-rate slot and an
# assumption word, and none of the words below.
assumption_words: [annahme, annahmen, angenommen, angenommene, angenommenen, annehmt,
  annehmen, nehmt]
future_auxiliaries: [wird, wirst, werdet, werden]
forecast_words: [prognose, prognosen, prognostiziert, vorhersage, vorhersagen, voraussichtlich,
  wahrscheinlich, sicher, sicherlich, garantiert, garantie, erwarten, erwartet, erwartung,
  erwartbar, bestimmt, gewiss]
judging_words: [realistisch, unrealistisch, vorsichtig, konservativ, optimistisch,
  pessimistisch, üblich, üblichen, typisch, historisch, marktüblich, angemessen, plausibel,
  sinnvoll, vernünftig, "hoch gegriffen", "niedrig gegriffen", gewagt, "zu hoch", "zu niedrig",
  # 19 Nov 2026 (D255 amended): a plain judgement of the rate
  hoch, hohe, hohen, hoher, niedrig, niedrige, niedrigen, niedriger, gut, gute, guten, guter,
  solide, soliden, solider, genau, genaue, genauen, verlässlich, zuverlässig, stark, schwach]
# 19 Nov 2026 (D255 amended): a negated assumption in a `projection` paragraph (check 12).
negated_assumptions: [keine annahme, keine annahmen, ohne annahme, ohne annahmen, nicht angenommen]
# 19 Nov 2026 (D255 amended): outside a `projection` paragraph, check 12 rejects the future
# auxiliaries, the forecast words and these phrases of the future (code `projection`).
future_phrases: [in den nächsten jahren, in den kommenden jahren, in den nächsten monaten,
  in den kommenden monaten, künftig, künftige, künftigen, künftiger, zukünftig, zukünftige,
  zukünftigen, in zukunft, demnächst, langfristig, auf dauer]

# Check 9 (D256 amended 19 Nov 2026): a paragraph that holds an {a:} or {c:} slot, the slot of
# a marked figure whose light is green, amber or red, or that is of topic `projection`, uses
# only these words (exact lower-case forms, no compound splitting). The list describes: it
# holds no modal verb, no imperative, no recommendation or transaction word and no „gut“,
# „besser“ or „sinnvoll“. A word is added only when a must-accept case, the template or a
# mark's sentence needs it.
descriptive_words: [
  # articles, pronouns, function words
  der, die, das, den, dem, des, ein, eine, einen, einem, einer, eines, kein, keine, keinen,
  keinem, keiner, euer, eure, euren, eurem, eurer, eures, dein, deine, deinen, deinem, deiner,
  deines, ihr, ihre, ihren, ihrem, ihrer, ihres, euch, es, sie, diese, diesem, diesen, dieser,
  dieses, selbst, damit, davon,
  # prepositions, conjunctions, particles
  an, auf, aus, bei, bis, für, im, in, mit, nach, ohne, pro, unter, über, von, vom, zu, zum,
  zur, zwischen, als, und, oder, wie, so, noch, mal,
  # the verbs that describe
  ist, sind, liegt, liegen, gehört, machen, gehen, stammen, reicht, fehlen, hat, habt,
  gestiegen, gefallen, angenommen, läge, wäre, wären, käme, ausgegeben, eingenommen, gespart,
  gelegt, gesetzt, erreicht,
  # the nouns and adjectives of the plan
  annahme, annahmen, anteil, bank, bankguthaben, bereich, breit, eigenen, eigenes, einkommen,
  einkommens, einmalausgaben, ende, geschätzten, gestreute, grenze, grenzen, größten, hoch,
  jahr, jahreseinkommen, kredit, kredite, kredits, kreditkarte, mehr, monat, monaten, reserve, roten,
  schulden, sparquote, teil, tilgung, vermögen, vermögens, veränderung, werts, wohnung,
  zählen, zeitraum, ziel, zins]
# Check 13 (D255 amended 19 Nov 2026): a colour word needs, in its paragraph, the slot of a
# marked figure, and every marked figure slotted there must have one of the word's lights.
colour_words:
  - {lights: [green], words: [grün, grüne, grünen, grüner, grünes, grünem]}
  - {lights: [amber], words: [gelb, gelbe, gelben, gelber, gelbes, gelbem, orange]}
  - {lights: [red], words: [rot, rote, roten, roter, rotes, rotem]}
  - {lights: [amber, red], words: [kritisch, kritische, kritischen, kritischer, kritisches]}
  - {lights: [green, amber, red], words: [ampel, ampeln, ampelfarbe, ampelfarben]}

# Checks 10 and 13: phrases that may not appear under a state of the facts, matched as words on
# the lower-cased text. A row with a `topic` holds in that topic's paragraphs; since 19 Nov 2026
# (D255 amended) the reserve's, the trend's and the lights' rows have none and hold in every
# paragraph. A `light_*` row is check 13's: a paragraph that holds the slot of a marked figure
# is judged by that figure's light only, one that holds none by every confirmed light.
contradictions:
  - {state: reserve_state, value: below,
     phrases: [erreicht, geschafft, ist voll, schon voll, ausreichend, reicht aus, genug,
       über dem ziel, über eurem ziel, über deinem ziel, höher als euer ziel,
       höher als dein ziel, größer als euer ziel, größer als dein ziel, fehlt nichts,
       fehlt kein]}
  - {state: reserve_state, value: reached,
     phrases: [fehlt, fehlen, noch nicht erreicht, unter dem ziel, unter eurem ziel, zu wenig]}
  - {topic: surplus, state: investable_state, value: zero,
     phrases: [könnt ihr anlegen, kannst du anlegen, bleibt übrig, bleiben übrig]}
  - {topic: surplus, state: left_state, value: negative,
     phrases: [bleibt noch, bleiben noch, reicht für eure sparpläne]}
  - {state: trend_state, value: up,
     phrases: [gefallen, gesunken, verloren, weniger als im vormonat, schrumpft, sinkt]}
  - {state: trend_state, value: down,
     phrases: [gestiegen, gewachsen, zugelegt, mehr als im vormonat, wächst, wachsen, steigt,
       höher als]}
  - {topic: basis, state: basis_state, value: short,
     phrases: [ganzes jahr, ganzen jahr, ganzen jahres]}
  - {state: light_reserve, value: green, phrases: &bad [kritisch, bedenklich, gefährlich, alarmierend, rot, roten bereich]}
  - {state: light_reserve, value: amber, phrases: &good [im grünen bereich, unbedenklich, gesund, kein problem, alles gut, solide]}
  - {state: light_reserve, value: red, phrases: *good}
  - {state: light_savings_rate, value: green, phrases: *bad}
  - {state: light_savings_rate, value: amber, phrases: *good}
  - {state: light_savings_rate, value: red, phrases: *good}
  - {state: light_ltv, value: green, phrases: *bad}
  - {state: light_ltv, value: amber, phrases: *good}
  - {state: light_ltv, value: red, phrases: *good}
  - {state: light_debt_service_ratio, value: green, phrases: *bad}
  - {state: light_debt_service_ratio, value: amber, phrases: *good}
  - {state: light_debt_service_ratio, value: red, phrases: *good}
  - {state: light_debt_ratio, value: green, phrases: *bad}
  - {state: light_debt_ratio, value: amber, phrases: *good}
  - {state: light_debt_ratio, value: red, phrases: *good}
  - {state: light_debt_to_income, value: green, phrases: *bad}
  - {state: light_debt_to_income, value: amber, phrases: *good}
  - {state: light_debt_to_income, value: red, phrases: *good}

# Check 13: the slot of a marked figure, per light state. A transaction word may not stand in
# a sentence with one of these slots while its light is green, amber or red.
marked_figure_slots:
  light_reserve: [reserve, reserve_months, reserve_gap, band_reserve_red]
  light_savings_rate: [savings_rate, savings_rate_regular, band_savings_rate_green,
    band_savings_rate_red]
  light_ltv: [ltv, band_ltv_green, band_ltv_red]
  light_debt_service_ratio: [debt_service_ratio, band_debt_service_green,
    band_debt_service_red]
  light_debt_ratio: [debt_ratio, band_debt_ratio_green, band_debt_ratio_red]
  light_debt_to_income: [debt_to_income, band_debt_to_income_green, band_debt_to_income_red]

# Check 11.
shape:
  paragraphs_max: 4
  paragraph_max_characters: 500
  topic_once: true
