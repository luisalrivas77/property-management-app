# Field help for „Eure Angaben“ 2026 (phase 10 §7.8 (b), D294): per form and field, what it
# is, where to find it, an example (invented numbers only, no household data: public repo),
# whether it goes behind „Weitere Angaben“ (rare) and which document the „where“ is from.
#
# Line numbers: only those read from the official sample are given. Only lstb_2026 is marked
# official: the Anlage N and ESt sections were named from knowledge, not checked against the
# Anleitung (26 Nov 2026), so anleitung_n and anleitung_est are official: false. The Lohnsteuerbescheinigung
# lines (Nr. 1 to 27, the header box) were checked on 26 Nov 2026 against the BMF's sample for
# 2026 (source lstb_2026). The Anlage N and the other forms are named by their section only
# („siehe Anleitung …“), never by a Zeile: the 2026 forms are not published yet and the
# mapping in anlage_n/2026.yaml reuses 2025's, marked provisional. A payslip has no official
# sample, so its fields name the usual label only (source payslip, official: false).
#
# Forms: every return_input kind with a form (schemas/employment.py RETURN_INPUT_VALUES,
# except no_pay, a button with no field), the income input expected_gross_pay and the owner's
# church_tax and tax_state. tests/rules/test_field_help.py fails when a field has no entry.
# Read through registry.field_help(); a year without its own file reuses the latest earlier.

tax_year: 2026

sources:
  lstb_2026:
    official: true
    url: "https://www.bundesfinanzministerium.de/Content/DE/Downloads/BMF_Schreiben/Steuerarten/Lohnsteuer/2025-08-29-ausdruck-elektr-lstbesch-2026.pdf"
    de: "BMF, Muster für den Ausdruck der elektronischen Lohnsteuerbescheinigung für 2026 (Bekanntmachung vom 29. August 2025)"
    en: "German Federal Ministry of Finance (BMF), sample printout of the electronic wage tax certificate for 2026 (notice of 29 August 2025)"
  anleitung_n:
    official: false
    url: null
    de: "Die Unterlagen zur Arbeit (Arbeitsvertrag, Rechnungen, Bescheinigungen) und der Abschnitt der Anlage N, in den der Wert gehört; die Abschnittsnamen am 26.11.2026 mit der Anleitung zur Anlage N 2025 (Stand 25.09.2025, gelesen aus einer Drittkopie) abgeglichen; ohne Zeilennummer, da sich die Zeilen jedes Jahr verschieben und die Vordrucke 2026 noch nicht veröffentlicht sind"
    en: "The papers about the job (employment contract, invoices, certificates) and the section of the Anlage N the value belongs to; section names checked on 26 Nov 2026 against the Anleitung zur Anlage N 2025 (as of 25 Sep 2025, read from a third-party copy); no line number, since the lines move every year and the 2026 forms are not published yet"
  anleitung_est:
    official: false
    url: null
    de: "Die eigenen Belege (Rechnungen, Bescheide, Bescheinigungen, Kontoauszüge) und die Anlage der Einkommensteuererklärung, in die der Wert gehört (Anlage Kind, Haushaltsnahe Aufwendungen, Sonderausgaben, Vorsorgeaufwand); die Abschnittsnamen am 26.11.2026 mit den Anleitungen 2025 zu diesen Anlagen abgeglichen (Stand 25.09.2025, gelesen aus Drittkopien); ohne Zeilennummer, da sich die Zeilen jedes Jahr verschieben"
    en: "Your own papers (invoices, notices, certificates, bank statements) and the annex of the income tax return the value belongs to (Anlage Kind, Haushaltsnahe Aufwendungen, Sonderausgaben, Vorsorgeaufwand); section names checked on 26 Nov 2026 against the 2025 instructions for these annexes (as of 25 Sep 2025, read from third-party copies); no line number, since the lines move every year"
  payslip:
    official: false
    url: null
    de: "Gehaltsabrechnung des Arbeitgebers: kein amtliches Muster, die Bezeichnungen unterscheiden sich je Arbeitgeber"
    en: "The employer's payslip: there is no official sample, and the labels differ between employers"

forms:
  # --- Lohnsteuerbescheinigung (wage_certificate) --------------------------------------------
  wage_certificate:
    period_from:
      rare: false
      source: lstb_2026
      de: {what: "Der erste Tag, für den der Arbeitgeber Lohn bescheinigt.", where: "Lohnsteuerbescheinigung, Nr. 1 – Bescheinigungszeitraum, „vom“.", example: "01.01.2026"}
      en: {what: "The first day the employer certifies pay for.", where: "Lohnsteuerbescheinigung, line 1 – Bescheinigungszeitraum, „vom“.", example: "01.01.2026"}
    period_to:
      rare: false
      source: lstb_2026
      de: {what: "Der letzte Tag, für den der Arbeitgeber Lohn bescheinigt.", where: "Lohnsteuerbescheinigung, Nr. 1 – Bescheinigungszeitraum, „bis“.", example: "31.12.2026"}
      en: {what: "The last day the employer certifies pay for.", where: "Lohnsteuerbescheinigung, line 1 – Bescheinigungszeitraum, „bis“.", example: "31.12.2026"}
    employer:
      rare: false
      source: lstb_2026
      de: {what: "Der Name des Arbeitgebers, nur der Name.", where: "Lohnsteuerbescheinigung, Feld „Anschrift und Steuernummer des Arbeitgebers“.", example: "Muster Maschinenbau GmbH"}
      en: {what: "The employer's name, the name only.", where: "Lohnsteuerbescheinigung, box „Anschrift und Steuernummer des Arbeitgebers“.", example: "Muster Maschinenbau GmbH"}
    tax_class:
      rare: false
      source: lstb_2026
      de: {what: "Die Steuerklasse, mit der der Arbeitgeber zuletzt abgerechnet hat (1 bis 6).", where: "Lohnsteuerbescheinigung, Kopf links – „Steuerklasse/Faktor“.", example: "4"}
      en: {what: "The tax class the employer last applied (1 to 6).", where: "Lohnsteuerbescheinigung, header on the left – „Steuerklasse/Faktor“.", example: "4"}
    tax_class_factor:
      rare: true
      source: lstb_2026
      de: {what: "Ob neben Steuerklasse 4 ein Faktor steht (Faktorverfahren).", where: "Lohnsteuerbescheinigung, Kopf links – „Steuerklasse/Faktor“: eine Zahl wie 0,9 hinter der 4.", example: "4 / 0,912 → ja"}
      en: {what: "Whether a factor stands beside tax class 4 (the factor method).", where: "Lohnsteuerbescheinigung, header on the left – „Steuerklasse/Faktor“: a number such as 0.9 after the 4.", example: "4 / 0.912 → yes"}
    church_tax_marked:
      rare: false
      source: lstb_2026
      de: {what: "Ob ein Kirchensteuermerkmal (z. B. rk, ev) eingetragen ist.", where: "Lohnsteuerbescheinigung, Kopf links – „Kirchensteuermerkmale“.", example: "ev → ja; „--“ → nein"}
      en: {what: "Whether a church tax code (such as rk, ev) is shown.", where: "Lohnsteuerbescheinigung, header on the left – „Kirchensteuermerkmale“.", example: "ev → yes; „--“ → no"}
    child_allowance_count:
      rare: false
      source: lstb_2026
      de: {what: "Die Zahl der Kinderfreibeträge, die der Arbeitgeber berücksichtigt hat.", where: "Lohnsteuerbescheinigung, Kopf links – „Zahl der Kinderfreibeträge“.", example: "1,0"}
      en: {what: "The number of child allowances the employer applied.", where: "Lohnsteuerbescheinigung, header on the left – „Zahl der Kinderfreibeträge“.", example: "1.0"}
    gross:
      rare: false
      source: lstb_2026
      de: {what: "Der steuerpflichtige Arbeitslohn des Jahres bei diesem Arbeitgeber.", where: "Lohnsteuerbescheinigung, Nr. 3 – Bruttoarbeitslohn einschl. Sachbezüge.", example: "48.250,00 €"}
      en: {what: "The year's taxable pay from this employer.", where: "Lohnsteuerbescheinigung, line 3 – Bruttoarbeitslohn einschl. Sachbezüge.", example: "€48,250.00"}
    income_tax:
      rare: false
      source: lstb_2026
      de: {what: "Die einbehaltene Lohnsteuer.", where: "Lohnsteuerbescheinigung, Nr. 4 – Einbehaltene Lohnsteuer von 3.", example: "6.120,00 €"}
      en: {what: "The wage tax withheld.", where: "Lohnsteuerbescheinigung, line 4 – Einbehaltene Lohnsteuer von 3.", example: "€6,120.00"}
    soli:
      rare: false
      source: lstb_2026
      de: {what: "Der einbehaltene Solidaritätszuschlag; oft 0.", where: "Lohnsteuerbescheinigung, Nr. 5 – Einbehaltener Solidaritätszuschlag von 3.", example: "0,00 €"}
      en: {what: "The solidarity surcharge withheld; often 0.", where: "Lohnsteuerbescheinigung, line 5 – Einbehaltener Solidaritätszuschlag von 3.", example: "€0.00"}
    church_tax:
      rare: false
      source: lstb_2026
      de: {what: "Die einbehaltene Kirchensteuer der Person selbst.", where: "Lohnsteuerbescheinigung, Nr. 6 – Einbehaltene Kirchensteuer des Arbeitnehmers von 3.", example: "489,60 €"}
      en: {what: "The church tax withheld for the person.", where: "Lohnsteuerbescheinigung, line 6 – Einbehaltene Kirchensteuer des Arbeitnehmers von 3.", example: "€489.60"}
    church_tax_spouse:
      rare: true
      source: lstb_2026
      de: {what: "Kirchensteuer für den Ehepartner, nur wenn die Konfessionen verschieden sind.", where: "Lohnsteuerbescheinigung, Nr. 7 – Einbehaltene Kirchensteuer des Ehegatten/Lebenspartners von 3.", example: "0,00 €"}
      en: {what: "Church tax for the spouse, only when the two belong to different churches.", where: "Lohnsteuerbescheinigung, line 7 – Einbehaltene Kirchensteuer des Ehegatten/Lebenspartners von 3.", example: "€0.00"}
    replacement_benefits:
      rare: true
      source: lstb_2026
      de: {what: "Leistungen des Arbeitgebers, die den Steuersatz erhöhen, z. B. Kurzarbeitergeld oder der Zuschuss zum Mutterschaftsgeld.", where: "Lohnsteuerbescheinigung, Nr. 15 – Leistungen, die dem Progressionsvorbehalt unterliegen.", example: "1.340,00 €"}
      en: {what: "Employer benefits that raise the tax rate, such as short-time work pay or the top-up to maternity pay.", where: "Lohnsteuerbescheinigung, line 15 – Leistungen, die dem Progressionsvorbehalt unterliegen.", example: "€1,340.00"}
    short_time_allowance:
      rare: true
      source: lstb_2026
      de: {what: "Der Teil von Nr. 15, der Kurzarbeitergeld ist.", where: "Lohnsteuerbescheinigung, Nr. 15a – (Saison-)Kurzarbeitergeld in 15. enthalten.", example: "1.340,00 €"}
      en: {what: "The part of line 15 that is short-time work pay.", where: "Lohnsteuerbescheinigung, line 15a – (Saison-)Kurzarbeitergeld in 15. enthalten.", example: "€1,340.00"}
    employer_commute_tax_free:
      rare: true
      source: lstb_2026
      de: {what: "Steuerfreie Zuschüsse des Arbeitgebers zum Arbeitsweg, z. B. ein Jobticket; sie mindern die Entfernungspauschale.", where: "Lohnsteuerbescheinigung, Nr. 17 – Steuerfreie Arbeitgeberleistungen, die auf die Entfernungspauschale anzurechnen sind.", example: "588,00 €"}
      en: {what: "Tax-free employer contributions to the commute, such as a job ticket; they reduce the commuting allowance.", where: "Lohnsteuerbescheinigung, line 17 – Steuerfreie Arbeitgeberleistungen, die auf die Entfernungspauschale anzurechnen sind.", example: "€588.00"}
    employer_commute_flat_taxed:
      rare: true
      source: lstb_2026
      de: {what: "Fahrtkostenzuschüsse, die der Arbeitgeber pauschal versteuert hat; sie mindern die Entfernungspauschale.", where: "Lohnsteuerbescheinigung, Nr. 18 – Pauschal mit 15 % besteuerte Arbeitgeberleistungen für Fahrten zwischen Wohnung und erster Tätigkeitsstätte.", example: "600,00 €"}
      en: {what: "Travel allowances the employer taxed at a flat rate; they reduce the commuting allowance.", where: "Lohnsteuerbescheinigung, line 18 – Pauschal mit 15 % besteuerte Arbeitgeberleistungen für Fahrten zwischen Wohnung und erster Tätigkeitsstätte.", example: "€600.00"}
    pension_employer:
      rare: false
      source: lstb_2026
      de: {what: "Der Anteil des Arbeitgebers zur gesetzlichen Rentenversicherung.", where: "Lohnsteuerbescheinigung, Nr. 22 a) – Arbeitgeberanteil zur gesetzlichen Rentenversicherung.", example: "4.487,25 €"}
      en: {what: "The employer's share of the statutory pension insurance.", where: "Lohnsteuerbescheinigung, line 22 a) – Arbeitgeberanteil zur gesetzlichen Rentenversicherung.", example: "€4,487.25"}
    pension_employee:
      rare: false
      source: lstb_2026
      de: {what: "Der eigene Anteil zur gesetzlichen Rentenversicherung.", where: "Lohnsteuerbescheinigung, Nr. 23 a) – Arbeitnehmeranteil zur gesetzlichen Rentenversicherung.", example: "4.487,25 €"}
      en: {what: "The person's own share of the statutory pension insurance.", where: "Lohnsteuerbescheinigung, line 23 a) – Arbeitnehmeranteil zur gesetzlichen Rentenversicherung.", example: "€4,487.25"}
    pension_employee_professional:
      rare: true
      source: lstb_2026
      de: {what: "Der eigene Beitrag an ein berufsständisches Versorgungswerk (z. B. für Ärzte oder Architekten).", where: "Lohnsteuerbescheinigung, Nr. 23 b) – Arbeitnehmeranteil an berufsständische Versorgungseinrichtungen.", example: "0,00 €"}
      en: {what: "The person's own contribution to a professional pension fund (for doctors or architects, say).", where: "Lohnsteuerbescheinigung, line 23 b) – Arbeitnehmeranteil an berufsständische Versorgungseinrichtungen.", example: "€0.00"}
    subsidy_health:
      rare: true
      source: lstb_2026
      de: {what: "Steuerfreier Zuschuss des Arbeitgebers zur gesetzlichen Krankenversicherung, meist bei freiwillig Versicherten.", where: "Lohnsteuerbescheinigung, Nr. 24 a) – Steuerfreie Arbeitgeberzuschüsse zur gesetzlichen Krankenversicherung.", example: "0,00 €"}
      en: {what: "A tax-free employer subsidy to statutory health insurance, mostly for voluntary members.", where: "Lohnsteuerbescheinigung, line 24 a) – Steuerfreie Arbeitgeberzuschüsse zur gesetzlichen Krankenversicherung.", example: "€0.00"}
    subsidy_private_health:
      rare: true
      source: lstb_2026
      de: {what: "Steuerfreier Zuschuss des Arbeitgebers zur privaten Krankenversicherung.", where: "Lohnsteuerbescheinigung, Nr. 24 b) – Steuerfreie Arbeitgeberzuschüsse zur privaten Krankenversicherung.", example: "2.950,00 €"}
      en: {what: "A tax-free employer subsidy to private health insurance.", where: "Lohnsteuerbescheinigung, line 24 b) – Steuerfreie Arbeitgeberzuschüsse zur privaten Krankenversicherung.", example: "€2,950.00"}
    subsidy_care:
      rare: true
      source: lstb_2026
      de: {what: "Steuerfreier Zuschuss des Arbeitgebers zur Pflegeversicherung.", where: "Lohnsteuerbescheinigung, Nr. 24 c) – Steuerfreie Arbeitgeberzuschüsse zur gesetzlichen Pflegeversicherung.", example: "0,00 €"}
      en: {what: "A tax-free employer subsidy to long-term care insurance.", where: "Lohnsteuerbescheinigung, line 24 c) – Steuerfreie Arbeitgeberzuschüsse zur gesetzlichen Pflegeversicherung.", example: "€0.00"}
    health_employee:
      rare: false
      source: lstb_2026
      de: {what: "Die eigenen Beiträge zur gesetzlichen Krankenversicherung.", where: "Lohnsteuerbescheinigung, Nr. 25 – Arbeitnehmerbeiträge zur gesetzlichen Krankenversicherung.", example: "4.100,50 €"}
      en: {what: "The person's own statutory health insurance contributions.", where: "Lohnsteuerbescheinigung, line 25 – Arbeitnehmerbeiträge zur gesetzlichen Krankenversicherung.", example: "€4,100.50"}
    care_employee:
      rare: false
      source: lstb_2026
      de: {what: "Die eigenen Beiträge zur Pflegeversicherung.", where: "Lohnsteuerbescheinigung, Nr. 26 – Arbeitnehmerbeiträge zur sozialen Pflegeversicherung.", example: "868,40 €"}
      en: {what: "The person's own long-term care insurance contributions.", where: "Lohnsteuerbescheinigung, line 26 – Arbeitnehmerbeiträge zur sozialen Pflegeversicherung.", example: "€868.40"}
    unemployment_employee:
      rare: false
      source: lstb_2026
      de: {what: "Die eigenen Beiträge zur Arbeitslosenversicherung.", where: "Lohnsteuerbescheinigung, Nr. 27 – Arbeitnehmerbeiträge zur Arbeitslosenversicherung.", example: "627,25 €"}
      en: {what: "The person's own unemployment insurance contributions.", where: "Lohnsteuerbescheinigung, line 27 – Arbeitnehmerbeiträge zur Arbeitslosenversicherung.", example: "€627.25"}

  # --- Gehaltsabrechnung (payslip): no official sample ---------------------------------------
  payslip:
    period_month:
      rare: false
      source: payslip
      de: {what: "Der Monat, für den die Abrechnung gilt.", where: "Gehaltsabrechnung, Kopf – „Abrechnungsmonat“ oder „Zeitraum“.", example: "März 2026"}
      en: {what: "The month the payslip is for.", where: "Payslip, header – „Abrechnungsmonat“ or „Zeitraum“.", example: "March 2026"}
    employer:
      rare: false
      source: payslip
      de: {what: "Der Name des Arbeitgebers.", where: "Gehaltsabrechnung, Kopf – Absender.", example: "Muster Maschinenbau GmbH"}
      en: {what: "The employer's name.", where: "Payslip, header – the sender.", example: "Muster Maschinenbau GmbH"}
    tax_class:
      rare: false
      source: payslip
      de: {what: "Die Steuerklasse, mit der abgerechnet wurde.", where: "Gehaltsabrechnung, Kopf oder Steuerdaten – „StKl“.", example: "4"}
      en: {what: "The tax class the month was calculated with.", where: "Payslip, header or tax data – „StKl“.", example: "4"}
    tax_class_factor:
      rare: true
      source: payslip
      de: {what: "Ob neben Steuerklasse 4 ein Faktor steht.", where: "Gehaltsabrechnung, Steuerdaten – „Faktor“.", example: "0,912 → ja"}
      en: {what: "Whether a factor stands beside tax class 4.", where: "Payslip, tax data – „Faktor“.", example: "0.912 → yes"}
    months_remaining_paid:
      rare: false
      source: payslip
      de: {what: "Wie viele Monate nach diesem noch Lohn kommt; meist bis Dezember. Weniger, wenn die Stelle endet oder Elternzeit beginnt.", where: "Keine Zeile: die eigene Planung (z. B. Arbeitsvertrag, Elternzeitantrag).", example: "März abgerechnet, bis Dezember bezahlt → 9"}
      en: {what: "How many months after this one will still be paid; usually to December. Fewer when the job ends or parental leave starts.", where: "No line: your own plans (the employment contract, a parental leave request).", example: "March payslip, paid to December → 9"}
    gross:
      rare: false
      source: payslip
      de: {what: "Der steuerpflichtige Lohn des Monats und seit Januar (nicht das Gesamt-Brutto).", where: "Gehaltsabrechnung – „Steuer-Brutto“ (Monat und Jahressumme).", example: "4.020,00 € / 12.060,00 €"}
      en: {what: "The month's taxable pay and the total since January (not the overall gross).", where: "Payslip – „Steuer-Brutto“ (month and year-to-date).", example: "€4,020.00 / €12,060.00"}
    income_tax:
      rare: false
      source: payslip
      de: {what: "Die einbehaltene Lohnsteuer im Monat und seit Januar.", where: "Gehaltsabrechnung – „Lohnsteuer“.", example: "510,00 € / 1.530,00 €"}
      en: {what: "The wage tax withheld in the month and since January.", where: "Payslip – „Lohnsteuer“.", example: "€510.00 / €1,530.00"}
    soli:
      rare: false
      source: payslip
      de: {what: "Der Solidaritätszuschlag im Monat und seit Januar; oft 0.", where: "Gehaltsabrechnung – „Solidaritätszuschlag“ oder „SolZ“.", example: "0,00 €"}
      en: {what: "The solidarity surcharge in the month and since January; often 0.", where: "Payslip – „Solidaritätszuschlag“ or „SolZ“.", example: "€0.00"}
    church_tax:
      rare: false
      source: payslip
      de: {what: "Die Kirchensteuer im Monat und seit Januar.", where: "Gehaltsabrechnung – „Kirchensteuer“ oder „KiSt“.", example: "40,80 € / 122,40 €"}
      en: {what: "The church tax in the month and since January.", where: "Payslip – „Kirchensteuer“ or „KiSt“.", example: "€40.80 / €122.40"}
    pension_employee:
      rare: false
      source: payslip
      de: {what: "Der eigene Rentenversicherungsbeitrag im Monat und seit Januar.", where: "Gehaltsabrechnung, Sozialversicherung – „RV-Beitrag“ (Arbeitnehmeranteil).", example: "373,86 € / 1.121,58 €"}
      en: {what: "The person's own pension insurance contribution in the month and since January.", where: "Payslip, social insurance – „RV-Beitrag“ (employee share).", example: "€373.86 / €1,121.58"}
    health_employee:
      rare: false
      source: payslip
      de: {what: "Der eigene Krankenversicherungsbeitrag im Monat und seit Januar.", where: "Gehaltsabrechnung, Sozialversicherung – „KV-Beitrag“ (Arbeitnehmeranteil).", example: "341,70 € / 1.025,10 €"}
      en: {what: "The person's own health insurance contribution in the month and since January.", where: "Payslip, social insurance – „KV-Beitrag“ (employee share).", example: "€341.70 / €1,025.10"}
    care_employee:
      rare: false
      source: payslip
      de: {what: "Der eigene Pflegeversicherungsbeitrag im Monat und seit Januar.", where: "Gehaltsabrechnung, Sozialversicherung – „PV-Beitrag“ (Arbeitnehmeranteil).", example: "72,36 € / 217,08 €"}
      en: {what: "The person's own care insurance contribution in the month and since January.", where: "Payslip, social insurance – „PV-Beitrag“ (employee share).", example: "€72.36 / €217.08"}
    unemployment_employee:
      rare: false
      source: payslip
      de: {what: "Der eigene Arbeitslosenversicherungsbeitrag im Monat und seit Januar.", where: "Gehaltsabrechnung, Sozialversicherung – „AV-Beitrag“ (Arbeitnehmeranteil).", example: "52,26 € / 156,78 €"}
      en: {what: "The person's own unemployment insurance contribution in the month and since January.", where: "Payslip, social insurance – „AV-Beitrag“ (employee share).", example: "€52.26 / €156.78"}
    tax_free_benefits:
      rare: true
      source: payslip
      de: {what: "Steuerfreie Bezüge im Monat und seit Januar, z. B. ein Jobticket oder Zuschläge.", where: "Gehaltsabrechnung – Zeilen mit „steuerfrei“ oder „st.-frei“.", example: "49,00 € / 147,00 €"}
      en: {what: "Tax-free pay in the month and since January, such as a job ticket or allowances.", where: "Payslip – lines marked „steuerfrei“ or „st.-frei“.", example: "€49.00 / €147.00"}

  # --- Erwartetes Bruttogehalt (income_input expected_gross_pay) ----------------------------
  expected_gross_pay:
    amount:
      rare: false
      source: payslip
      de: {what: "Der steuerpflichtige Lohn, den die Person im ganzen Jahr erwartet, solange keine Lohnsteuerbescheinigung da ist.", where: "Aus der letzten Gehaltsabrechnung: „Steuer-Brutto“ des Monats mal die Monate, oder der Bruttolohn laut Arbeitsvertrag.", example: "4.000 € im Monat × 12 = 48.000,00 €"}
      en: {what: "The taxable pay the person expects for the whole year, until the wage tax certificate arrives.", where: "From the latest payslip: the month's „Steuer-Brutto“ times the months, or the gross pay in the employment contract.", example: "€4,000 a month × 12 = €48,000.00"}

  # --- Eigentümer: Kirchensteuer und Bundesland (owner) -------------------------------------
  owner:
    church_tax:
      rare: false
      source: lstb_2026
      de: {what: "Ob die Person Kirchensteuer zahlt, also Mitglied einer steuererhebenden Kirche ist.", where: "Lohnsteuerbescheinigung, Kopf links – „Kirchensteuermerkmale“ (z. B. rk, ev); „--“ heißt keine.", example: "ev → ja"}
      en: {what: "Whether the person pays church tax, as a member of a church that levies it.", where: "Lohnsteuerbescheinigung, header on the left – „Kirchensteuermerkmale“ (such as rk, ev); „--“ means none.", example: "ev → yes"}
    tax_state:
      rare: false
      source: anleitung_est
