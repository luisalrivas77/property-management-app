# Income tax tariff for tax year 2026 (docs/phases/phase-4.md §3, §4, D81).
#
# Read on 9 Nov 2026. A change to a figure here is a data PR against a newly read source,
# never a fix to make a test pass. A year without its own file reuses the latest earlier one
# (registry.tariff, D81), marked reused_from.
#
# Rates and decimals are quoted strings: the schema accepts decimal strings only.
#
# §32a Abs. 1 EStG "ab dem Veranlagungszeitraum 2026" (S. 2):
#   https://www.gesetze-im-internet.de/estg/__32a.html, cross-checked on lxgesetze.de/estg/32a
#   x = zvE floored to whole euros (S. 1); the tax is floored to whole euros (S. 6).
#   12,349–17,799: (914.51·y + 1,400)·y        y = (x − 12,348) / 10,000
#   17,800–69,878: (173.10·z + 2,397)·z + 1,034.87   z = (x − 17,799) / 10,000
#   69,879–277,825: 0.42·x − 11,135.63;  from 277,826: 0.45·x − 19,470.38
# Splitting (§32a Abs. 5): twice the tax on half the joint zvE. The half is floored to whole
# euros before the tariff, as the BMF Programmablaufplan does; PROVISIONAL until phase 4
# step 4 closes Q-O1 (the fixtures floor it too).

tax_year: 2026
version: "2026.1"
source_url: "https://www.gesetze-im-internet.de/estg/__32a.html"

zones:
  - {up_to: 12348, kind: zero}                                        # Grundfreibetrag
  - {up_to: 17799, kind: progressive, a: "914.51", b: "1400", offset: 12348}
  - {up_to: 69878, kind: progressive, a: "173.10", b: "2397", c: "1034.87", offset: 17799}
  - {up_to: 277825, kind: linear, rate: "0.42", c: "11135.63"}
  - {up_to: null, kind: linear, rate: "0.45", c: "19470.38"}

# Solidaritätszuschlag: §4 S. 1 SolZG 5.5 %; S. 2 at most 11.9 % of (base − Freigrenze);
# S. 3 fractions of a cent dropped. §3 Abs. 3 SolZG: Freigrenze 40,700 (splitting) / 20,350.
#   https://www.gesetze-im-internet.de/solzg_1995/__4.html
#   https://www.gesetze-im-internet.de/solzg_1995/__3.html
soli_rate: "0.055"
soli_mitigation_rate: "0.119"
soli_free_limit_joint: "40700.00"
soli_free_limit_single: "20350.00"

# Kirchensteuer on the Einkommensteuer (§51a Abs. 2 S. 1 EStG; Kinderfreibeträge not
# modelled, Q-O2): 8 % in Bayern (Art. 8 KirchStG caps it at 10 %; 8 % is the churches'
# Umlagesatz) and Baden-Württemberg, 9 % elsewhere. The per-state table is from consistent
# secondary sources (§3).
church_tax_rates:
  BW: "0.08"
  BY: "0.08"
  BE: "0.09"
  BB: "0.09"
  HB: "0.09"
  HH: "0.09"
  HE: "0.09"
  MV: "0.09"
  NI: "0.09"
  NW: "0.09"
  RP: "0.09"
  SL: "0.09"
  SN: "0.09"
  ST: "0.09"
  SH: "0.09"
  TH: "0.09"

employee_allowance: "1230.00"           # §9a S. 1 Nr. 1a EStG, Arbeitnehmer-Pauschbetrag
special_expenses_allowance: "36.00"     # §10c EStG, Sonderausgaben-Pauschbetrag per owner

# The employee's shares and the 2026 caps, for the default deductions (D84).
social_insurance:
  pension_rate: "0.093"                 # half of 18.6 % (§158 SGB VI)
  unemployment_rate: "0.013"            # half of 2.6 % (§341 SGB III); never deducted (D84)
  health_rate: "0.073"                  # half of 14.6 % (§241 SGB V)
  health_extra_rate: "0.0145"           # half the average Zusatzbeitrag 2.9 % (BAnz AT 10.11.2025 B7)
  # Half of 3.6 % Pflegeversicherung. §55 Abs. 1 S. 1 SGB XI still prints 3.4 %; the rate was
  # raised by Verordnung: Pflege-Beitragssatz-Anpassungsverordnung 2025 (PBAV 2025) vom
  # 20. Dezember 2024 (BGBl. 2024 I Nr. 446), §1 Abs. 1: 3.6 % from 1 January 2025.
  #   https://www.gesetze-im-internet.de/pbav_2025/__1.html
  # No childless surcharge, no Saxony split (D84).
  care_rate: "0.018"
  # Sozialversicherungsrechengrößen-Verordnung 2026 (Bundesrat 21 Nov 2025):
  #   https://www.bundesregierung.de/breg-de/aktuelles/beitragsbemessungsgrenzen-2386514
  bbg_pension: "101400.00"              # BBG RV, 8,450 a month
  bbg_health: "69750.00"                # BBG KV/PV, 5,812.50 a month
  health_deductible_share: "0.96"       # §10 Abs. 1 Nr. 3 S. 4 EStG (Krankengeld entitlement)
