# Anlage N rule set for tax year 2026 (docs/phases/phase-4b.md §4, D99). PROVISIONAL form
# mapping.
#
# The Anlage N 2026 was not published as of 10 Nov 2026, so the form mapping below is a copy of
# the 2025 form's (2025AnlN031NET – Oktober 2025): status provisional, form_year 2025, exactly
# as rulesets/2026.yaml does for the Anlage V (D53). When ELSTER publishes the 2026 form, a data
# PR updates the Zeilen and Kennzahlen and sets published / form_year 2026; line keys stay, so
# no fixture outcome changes (anlage_n.yaml asserts on keys and amounts, never on Zeilen).
#
# The Kennzahlen repeat across blocks (Kz 110–114 stand on the pay block and on the first
# commute route): line keys are the identity, there is no Kz-uniqueness check (D99). The
# Arbeitnehmer-Pauschbetrag (1,230), the child figures, the §35a caps and the filing threshold
# live in tariffs/2026.yaml and are read from there, never duplicated here.
#
# Rates and amounts are quoted strings: the schema accepts decimal strings only.

tax_year: 2026
version: "2026.1"
commute_rates:                      # §9 Abs. 1 S. 3 Nr. 4 EStG: 0.38 from the first km from 2026
  - {from_km: 1, rate: "0.38"}      # (2025: 0.30 to km 20, 0.38 from km 21)
commute_cap_non_car: "4500.00"      # §9 Abs. 1 S. 3 Nr. 4 S. 2: the cap, not for a car
home_office_day_rate: "6.00"        # §4 Abs. 5 S. 1 Nr. 6c EStG, per day
home_office_cap: "1260.00"          # 210 days
work_room_flat: "1260.00"           # §4 Abs. 5 S. 1 Nr. 6b S. 4: the Jahrespauschale (D106)
gwg_limit_net: "800.00"             # §6 Abs. 2 S. 1 EStG, net
default_vat_rate: "0.19"            # net estimate when an item has no net amount
useful_lives:                       # months; Q-O21
  - {item_class: computer, months: null, full_in_year: true}       # BMF 22 Feb 2022: one year
  - {item_class: software, months: null, full_in_year: true}
  - {item_class: phone, months: 60, full_in_year: false}           # AfA-Tabelle AV: 5 years
  - {item_class: furniture, months: 156, full_in_year: false}      # AfA-Tabelle AV: 13 years
  - {item_class: tools, months: 60, full_in_year: false}
  - {item_class: subscription, months: null, full_in_year: true}   # a running cost
  - {item_class: other, months: null, full_in_year: false}         # must be typed
telecom_share: "0.20"               # R 9.1 Abs. 5 S. 4 LStR without proof (D112, Q-O27)
telecom_cap_monthly: "20.00"
account_fee_flat: "16.00"           # Kontoführung, H 9.1 LStH (practice)
union_dues_beside_allowance: true   # §9a S. 3 EStG from VZ 2026 (Q-O26)
other_vorsorge_cap_employee: "1900.00"     # §10 Abs. 4 S. 2 EStG
other_vorsorge_cap_self_paying: "2800.00"  # §10 Abs. 4 S. 1 EStG
pension_max_contribution: "30826.00"       # §10 Abs. 3 S. 1, 2026 (Q-O12)
weekdays_in_year: 261               # Mon–Fri in 2026; the plausibility check of D100 (2)

form:
  form_year: 2025
  status: provisional
  version_stamp: "2025AnlN031NET – Oktober 2025"
  source_url: "https://www.formulare-bfinv.de/"

