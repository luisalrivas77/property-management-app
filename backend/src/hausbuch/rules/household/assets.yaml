# The asset registry (docs/phases/phase-6.md D167 (3), D174 (2)): how an asset is priced.
#
# coins: a symbol (as an exchange export names it) -> the CoinGecko id and the Kraken pair of
#   its daily EUR price. Public market data: the larger coins by market value, nothing here is
#   the household's. Every id and pair was checked live on 13 Nov 2026 (CoinGecko
#   /simple/price, Kraken /0/public/AssetPairs, every pair online); a coin Kraken does not
#   trade against EUR has kraken_pair null.
# funds: an ISIN -> the issuer adapter (services/prices/issuer_nav/<issuer>.py) and the fund's
#   reference on the issuer's site; nav_currency is what the issuer's file stated on
#   13 Nov 2026 (the adapter reads the currency from the file each time, so a change there is
#   followed). fund_ref null = no adapter: the fund is priced from the depot's documents
#   („Kurs aus dem letzten Bericht“, D174 (4)).
#
# Which funds: every fund of quirion's public investment universe
# (quirion.de/en/investment-concept/investment-universe, read 13 Nov 2026) whose issuer
# publishes a NAV history file the app can read, every share class the public name allows
# (both Acc and Dist when the name says neither), plus IE00B4L5YC18 from the spec's §3. The
# page names funds without ISINs; each ISIN was read from the issuer's own file for that
# fund_ref on 13 Nov 2026. Which of them the household holds is not recorded here.
#
# Issuer files (read 13 Nov 2026):
# - spdr: https://www.ssga.com/library-content/products/fund-data/etfs/emea/
#   navhist-emea-en-<fund_ref>.xlsx, one NAV column in the currency the file names
#   („NAV Currency:“), four to six decimals.
# - ishares: https://www.blackrock.com/varnish-api/uk-retail01-product-data/product-data/api/
#   v1/get-fund-document?...&portfolioId=<fund_ref>&component=fundDownloadV2 (the „Download“
#   on the fund's ishares.com page), a SpreadsheetML file whose „Historical NAVs“ sheet gives
#   the NAV to two decimals.
#
# The universe's other issuers (Amundi, Xtrackers, Invesco, UBS, HSBC, BNP Paribas, Assenagon)
# publish no NAV history file the app can read (pages drawn by script, monthly PDFs only), so
# their funds are not listed: a fund missing here is priced from the reports exactly like a
# listed one with fund_ref null.

