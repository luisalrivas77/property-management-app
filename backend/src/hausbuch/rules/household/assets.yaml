# The asset registry (docs/phases/phase-6.md D167 (3), D174 (2)): how an asset is priced.
#
# coins: a symbol (as an exchange export names it) -> the CoinGecko id and the Kraken pair of
#   its daily EUR price. Public market data: the larger coins by market value, nothing here is
#   the household's. Every id and pair was checked live on 13 Nov 2026 (CoinGecko
#   /simple/price, Kraken /0/public/AssetPairs, every pair online); a coin Kraken does not
#   trade against EUR has kraken_pair null.
# funds: an ISIN -> the issuer adapter (services/prices/issuer_nav/<issuer>.py) and the fund's
#   reference on the issuer's site; nav_currency is what the issuer's file stated on
#   13 Nov 2026 (the adapter reads the currency from the file each time, so a change there is
#   followed). fund_ref null = no adapter: the fund is priced from the depot's documents
#   („Kurs aus dem letzten Bericht“, D174 (4)).
#
# Which funds: every fund of quirion's public investment universe
# (quirion.de/en/investment-concept/investment-universe, read 13 Nov 2026) whose issuer
# publishes a NAV history file the app can read, every share class the public name allows
# (both Acc and Dist when the name says neither), plus IE00B4L5YC18 from the spec's §3. The
# page names funds without ISINs; each ISIN was read from the issuer's own file for that
# fund_ref on 13 Nov 2026. Which of them the household holds is not recorded here.
#
# Issuer files (read 13 Nov 2026):
# - spdr: https://www.ssga.com/library-content/products/fund-data/etfs/emea/
#   navhist-emea-en-<fund_ref>.xlsx, one NAV column in the currency the file names
#   („NAV Currency:“), four to six decimals.
# - ishares: https://www.blackrock.com/varnish-api/uk-retail01-product-data/product-data/api/
#   v1/get-fund-document?...&portfolioId=<fund_ref>&component=fundDownloadV2 (the „Download“
#   on the fund's ishares.com page), a SpreadsheetML file whose „Historical NAVs“ sheet gives
#   the NAV to two decimals.
#
# The universe's other issuers (Amundi, Xtrackers, Invesco, UBS, HSBC, BNP Paribas, Assenagon)
# publish no NAV history file the app can read (pages drawn by script, monthly PDFs only), so
# their funds are not listed: a fund missing here is priced from the reports exactly like a
# listed one with fund_ref null, unless its issuer has an adapter with a catalogue.
#
# This list is a seed, not the whole coverage (D174 amended 16 Nov 2026): a held fund missing
# here whose name carries an adapter's brand (iShares, SPDR) is looked up by its ISIN in that
# issuer's own list of funds (each adapter's catalogue_url) when it has no price yet; the
# reference found is checked against the ISIN the NAV file states and stored with the price
# (price.raw: issuer, fund_ref), so the next run asks no catalogue. A row here always wins.
#
# tokens (phase 7 D180 (4), added 15 Nov 2026): a token on one chain, identified by its
#   contract (EVM, written lower-case, D180 amended 15 Nov 2026) or its mint (Solana, as
#   written: base58 is case-sensitive), never by its symbol, which a
#   spam token can copy (D187). A row is priced as the coin of `wraps` when set (the wrapped
#   native coins, D184 (3)), else as the coin of its own symbol: the token's asset points
#   there through `asset.priced_as_asset_id`, so the daily price is fetched once per symbol
#   (D180 (3)). coingecko_id, where set, is that coin's id (the loader checks it). A token not
#   listed is spam until a person promotes it into the workspace's assets, never into this
#   file. Every contract, its decimals and its symbol were read from the chain on
#   15 Nov 2026 (eth_call symbol() and decimals() against a public RPC node of each EVM
#   chain; the Solana mints by getAccountInfo, jsonParsed), and every EVM contract's EIP-55
#   checksum was recomputed before it was lower-cased. Arbitrum's USDT contract reads its symbol as „USD₮0“ on the
#   chain (the USDT0 migration of that contract); it is the same contract, listed as USDT,
#   the symbol its price follows. Arbitrum's USDC is the native (Circle-issued) contract,
#   not the bridged USDC.e, which is not listed. Wrapped SOL is written WSOL (AssetSymbol
#   allows upper case only; the chain's own name is „wSOL“). The token's symbol is a display
#   label (TokenSymbol, D180 (2) amended 15 Nov 2026); this file still lists one per chain.
#   Added 16 Nov 2026: Wormhole's „Ether (Portal)“ on Solana (ETH bridged from Ethereum by
#   the Portal token bridge, which locks WETH there), read from the Solana token list
#   (raw.githubusercontent.com/solana-labs/token-list/main/src/tokens/solana.tokenlist.json:
#   symbol ETH, name „Ether (Portal)“, 8 decimals, tags wrapped and wormhole, coingeckoId
#   ethereum). Priced as ETH by its symbol and coingecko_id, not by `wraps`, which names a
#   chain's own wrapped native coin (D184 (3)'s wrap links).

