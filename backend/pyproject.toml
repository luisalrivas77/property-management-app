[project]
name = "hausbuch"
version = "0.1.0"
description = "Hausbuch: landlord ledger, document vault and Anlage V drafts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary,pool]>=3.2,<4",
    # Phase 1 step 3 (docs/phases/phase-1-step-3.md): all added in the spec PR at once, so the
    # parallel chunks never conflict on uv.lock.
    "fastapi>=0.162.0,<0.163",
    "python-multipart>=0.0.33,<0.1",  # multipart uploads (POST /documents)
    "uvicorn>=0.54.0,<0.55",
    "webauthn>=3.0.1,<4",  # py_webauthn: passkey ceremonies
    "boto3>=1.43.124,<2",  # S3BlobStore
    # Phase 2 (docs/phases/phase-2.md §4.5): all added in the spec PR at once, as step 3 did.
    # Procrastinate is pinned to one minor version: migration 0005 applies its schema.sql.
    "procrastinate>=3.10.0,<3.11",  # job queue (psycopg connector) on the same Postgres (§5.1)
    "anthropic>=2.6.0,<3",  # Claude API client (§5.3)
    "pypdf>=7.0.0,<8",  # page count and splitting (§5.2); the card statement's text (D176)
    "lxml>=6.1.3,<7",  # camt.052 / camt.053 XML (§7.1)
    # Phase 3 (docs/phases/phase-3.md §4, §12): added in the spec PR, as phase 2 did.
    "pyyaml>=6.0,<7",  # the per-year rule sets in rules/tax/rulesets/ (was dev-only)
    "reportlab>=4.2,<5",  # the ELSTER field sheet PDF (BSD, pure Python; Q12)
    # Phase 5 (docs/phases/phase-5.md §3, D115, D119): added in the spec PR, as phases 2-3 did.
    "fints>=5.0.1,<6",  # python-fints, LGPL-3.0-or-later: FinTS read-only sync (HKCAZ, HKSAL)
]

[project.scripts]
hausbuch = "hausbuch.cli:main"  # bootstrap | invite | openapi (phase 1 step 3, chunk 2)

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "httpx2>=2.16.0,<3",  # FastAPI/Starlette TestClient (httpx is deprecated there)
    # The software authenticator in tests/auth/ (both are also py_webauthn dependencies).
    "cbor2>=6.2.0,<7",
    "cryptography>=50.0.2,<51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hausbuch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "db: needs a Postgres database (HAUSBUCH_TEST_DATABASE_URL)",
    "rule: rule fixture test; skipped until the rule module is implemented",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
